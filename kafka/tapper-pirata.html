      : 'UPDATE RECHAZADO / EL MATERIAL NO EXISTE', x + 10, y + 131, '#ff827a');
    else if(statusLine) text(statusLine, x + 10, y + 131, PAL.cyan);
    else if(last) text(`SIGUIENTE OFFSET: ${S.comandas[last.part].committed}`, x + 10, y + 131, KAFKA.label);
  }

  function drawMaterialTraffic(){
    const {flight, phase, elapsed} = S.materialDemo;
    if(!flight) return;
    const {part, order, offset} = flight;
    const k = smooth(elapsed / MATERIAL_PHASES[phase]);
    const row = rowOf(S, part), cook = S.cooks.find(c => c.partitions.includes(part));
    const consumer = consumerSpot(cook.id);
    if(phase === 'send'){
      const start = {x:PRODUCER_BOX.x + 16, y:PRODUCER_BOX.y + 55};
      const at = alongPath([start, ...flightPath(flight)], k);
      drawMiniRecord(at.x - 5, at.y - 6, order);
    } else if(phase === 'fetch'){
      const x = slotX(part, view.ends[part], offset), y = ticketTop(row) + 6;
      drawMiniRecord(lerp(x, consumer.x + 62, k) - 5, lerp(y, consumer.y + 25, k) - 6, order);
    } else if(phase === 'apply'){
      const x = MATERIAL_BOX.x + MATERIAL_BOX.w - 14, y = MATERIAL_BOX.y + 117;
      drawMiniRecord(lerp(consumer.x + 62, x, k) - 5, lerp(consumer.y + 25, y, k) - 6, order);
    } else if(phase === 'commit'){
      const x = slotX(part, view.ends[part], offset + 1), y = wireY(row) - 9;
      drawPointer(lerp(consumer.x + CONSUMER_W / 2, x, k), lerp(consumer.y, y, k), KAFKA.ink);
    }
  }

  // The broker's ack is a message too: it goes back along the arrow to the producer, which only then
  // counts the order as sent. While the waiter is still a waiter, it goes back to him.
  function drawAck(){
    const b = S.boss, k = (S.time - b.saidAt) / ACK_S;
    if(!b.lastAck || k < 0 || k >= 1) return;
    const part = b.lastAck.partition, row = rowOf(S, part), lane = logLaneY(part) + 6, out = batchLaneY(part) + 6, waiter = S.barWaiters[0];
    const points = mixOf(STAGE.partitioner) < 0.5 ? [{x:barStart(row) - 4, y:lane}, {x:waiter.x, y:waiter.y - 44}]
      : [{x:barStart(row) - 4, y:lane}, {x:ROUTE_X, y:lane}, {x:ROUTE_X, y:out}, {x:BATCH_X + 48, y:out}];
    const at = alongPath(points, k);
    kafkaTab(Math.round(at.x - 11), Math.round(at.y - 5), 'ACK', KAFKA.ink);
  }

  // ---- Kinds of actor, each in its current look ----
  // Back to front. The tutorial draws these again to light one of them up.

  function drawProducers(){
    morphDraw(mixOf(STAGE.producers), () => {
      drawDiners();
      drawTables();
      drawTableFood();
    }, drawProducerBox);
  }

  // The hourglasses tied under the orders hang in front of the counter, so they go after it.
  // Each blinks as its last grains fall.
  function drawHangingHourglasses(){
    if(S.features.retain) return;
    morphDraw(mixOf(STAGE.topic), () => S.comandas.forEach((p, part) => {
      const row = rowOf(S, part), dy = Math.round(moveDy(part));
      p.log.forEach(entry => {
        if(entry.lockFrom === undefined || entry.taken) return;
        const x = orderX(part, entry), left = entry.lockUntil - S.time;
        if(x < barStart(row) + 10 || (left < 1.5 && Math.floor(S.time * 8) % 2 === 1)) return;
        drawHourglass(x, ticketTop(row) + 27 + dy, (S.time - entry.lockFrom) / (entry.lockUntil - entry.lockFrom), 4, COOK_APRONS[entry.lockedBy]);
      });
      // One being tied: it comes up from the cook's hands, in front of the cook and so behind it
      // from here, peeks out over its head, and is tied to the bottom of the paper with a wiggle.
      S.cooks.forEach(c => {
        if(!c.job || c.job.phase !== 'hang' || c.job.part !== part) return;
        const k = clamp01(c.job.timer / HANG_S), rise = clamp01(k / 0.55), ease = rise * rise * (3 - 2 * rise);
        const tie = clamp01((k - 0.55) / 0.45), hangY = ticketTop(row) + 27 + dy;
        const x = orderX(part, c.job.entry), handsY = barTop(c.pos) + COOK_FEET - 30;
        const wiggle = tie > 0 && tie < 1 ? (Math.floor(c.job.timer * 16) % 2 ? 1 : -1) : 0;
        drawHourglass(x + wiggle, lerp(handsY, hangY, ease), 0, Math.round(4 * tie), COOK_APRONS[c.id]);
      });
    }), () => {});
  }

  function drawTopic(){
    morphDraw(mixOf(STAGE.topic), () => {
      for(let part = 0; part < S.comandas.length; part++){
        g.save();
        g.translate(0, Math.round(moveDy(part)));
        g.drawImage(wireLayers[rowOf(S, part)], 0, 0);
        drawOrdersWire(part);
        g.restore();
      }
      drawWireBuild();
      drawBoss();
    }, drawTopicBoxes);
  }

  // Not Kafka: in the Kafka view the counter and the waiter with the tray are simply gone.
  // The bin the orders go into while they are thrown away after cooking: by the counter, or in the
  // arms of the head of the dining room taking it out.
  // On the floor in front of the end of the counter, at the feet of the cook of the middle row.
  const BIN_TOP = barTop(PLATES_ROW) + COOK_FEET - 20;
  function drawBin(){
    const bin = S.bin;
    if(!bin) return;
    if(bin.kicked !== undefined){
      // Kicked: off to the right and a little up, tumbling, out of the restaurant.
      const k = clamp01(bin.kicked / BIN_FLY_S);

      g.translate(Math.round(bin.x + 90 * k), Math.round(BIN_TOP + 10 - 26 * k - 4 * 10 * k * (1 - k)));
      g.rotate(k * Math.PI * 2.5);
      g.drawImage(furniture.barrel, -12, -13, 24, 26);
      g.restore();
      return;
    }
    const x = Math.round(bin.x), top = BIN_TOP;
    contactShadow(x, top + 21, 21);
    g.drawImage(furniture.barrel, x - 12, top - 4, 24, 26);
    // Scraps of orders sticking out, more the fuller it gets.
    const colors = Object.values(COLORS.customers);
    for(let i = 0; i < Math.min(4, bin.thrown || 0); i++) R(x - 6 + i * 3, top - 4 - (i % 2) * 2, 4, 4, colors[i % colors.length]);
  }

  // An order that slipped off the wire on its way: it tumbles to the floor and is gone.
  function drawFallen(kafka){
    S.fallen.forEach(f => {
      const k = f.t / FALL_S, row = rowOf(S, f.part);
      const y0 = kafka ? logLaneY(f.part) + 6 : ticketTop(row) + 10;
      const y = lerp(y0, barTop(row) + 34, k * k), x = f.x - k * 10;
      const before = g.globalAlpha;
      g.globalAlpha = before * (k < 0.75 ? 1 : (1 - k) / 0.25);

        R(pegX - 2, pegY - 2, 4, 3, '#c98a3c');
        R(pegX - 4, pegY + 1, 2, 6, '#c98a3c');
        R(pegX + 2, pegY + 1, 2, 6, '#c98a3c');

          R(pegX - 8, pegY - 4, 3, 1, PAL.white);
          R(pegX + 5, pegY - 4, 3, 1, PAL.white);
        }
        const w = Math.floor(f.t * 12) % 2 ? 6 : 16;
        R(x - w / 2 - 1, y - 9, w + 2, 18, PAL.black);
        R(x - w / 2, y - 8, w, 16, '#f6efd8');

  // The chalkboard on the back wall: TAPAS, rubbed out by the waiter's cloth and rewritten in chalk,
  // letter by letter, as the set menu. The restaurant's name is on a brass plate above it.
  function drawSign(){
    const build = S.build, phase = build && build.phase;
    const WOOD = '#795441', BOARD = '#172a33', CHALK = '#eeeee2', SMUDGE = '#33503f';
    const bx = SIGN_X - SIGN_HALF, bw = SIGN_HALF * 2;
    R(bx - 1, SIGN_TOP - 1, bw + 2, SIGN_H + 2, PAL.black);
    R(bx, SIGN_TOP, bw, SIGN_H, WOOD);
    R(bx + 3, SIGN_TOP + 3, bw - 6, SIGN_H - 6, BOARD);
    R(bx + 6, SIGN_TOP + SIGN_H - 6, bw - 12, 1, '#5d7566');
    R(SIGN_X - 36, 1, 72, 10, '#251c27');
    R(SIGN_X - 35, 2, 70, 8, '#bf9058');
    text('SCUMM BAR', SIGN_X, 2, '#31212d', 'center');
    const write = (str, chars) => text(str.slice(0, chars), signTextLeft(str), SIGN_TEXT_Y, CHALK, 'left', SIGN_SCALE);
    const smudges = right => { for(let x = signTextLeft(SIGN_TAPAS) - 4; x < right; x += 7) R(x, SIGN_TEXT_Y + 2 + (x * 7) % 10, 5, 1, SMUDGE); };
    if(phase === 'signWipe'){
      // Whatever the cloth has gone over is gone, leaving a smudge.
      write(SIGN_TAPAS, SIGN_TAPAS.length);
      const hand = signHand(build), left = signTextLeft(SIGN_TAPAS) - 4;
      R(left, SIGN_TEXT_Y - 4, hand.x - left, 20, BOARD);
      smudges(hand.x);
    } else if(phase === 'signStep'){
      smudges(signTextRight(SIGN_TAPAS) + 4);
    } else if(phase === 'signWrite'){
      // Whole letters so far, and the one under the chalk as far as the chalk has got.
      const at = clamp01(build.t / SIGN_WRITE_S) * SIGN_MENU.length, done = Math.floor(at);
      smudges(signTextRight(SIGN_TAPAS) + 4);
      write(SIGN_MENU, done);
      if(done < SIGN_MENU.length){
        const x0 = signTextLeft(SIGN_MENU) + done * 6 * SIGN_SCALE;
        g.save();
        g.beginPath();
        g.rect(x0, SIGN_TEXT_Y - 6, (at - done) * 6 * SIGN_SCALE, 22);
        g.clip();
        write(SIGN_MENU, done + 1);
        g.restore();
      }
    } else {
      const str = S.features.menus ? SIGN_MENU : SIGN_TAPAS;
      write(str, str.length);
    }
  }

  // Experiment: during a step, what the step is about stays fully lit and the rest of the scene
  // fades into the dark with a soft gradient, to draw the eye there. Render-only state.
  const focus = {x:W / 2, y:H / 2, r:60, sy:1, a:0}, FOCUS_FALL_S = 1.2;
  // Moments of the story that are only lit the first time they happen: the first hourglass tied
  // under an order, the first one whose cook dropped it running out, and that order taken up again.
  const story = {S:null, seen:new Set(), hang:null, lapse:null, retake:null};
  function storyTarget(){
    if(story.S !== S) Object.assign(story, {S, seen:new Set(), hang:null, lapse:null, retake:null, firstStray:null});
    if(S.features.retain || !S.features.peekLock) return null;
    const around = (part, entry, cook, r) => ({x:cook ? (cook.x + orderX(part, entry)) / 2 : orderX(part, entry), y:ticketTop(rowOf(S, part)) + 24, r});
    if(!story.seen.has('hang')){
      if(!story.hang){
        const c = S.cooks.find(k => k.job && k.job.phase === 'hang');
        if(c) story.hang = {part:c.job.part, entry:c.job.entry, cook:c};
      }
      if(story.hang){
        const {part, entry, cook} = story.hang;
        if(entry.lockFrom === undefined || S.time < entry.lockFrom + 1.6) return around(part, entry, cook, 58);
        story.seen.add('hang');
      }
    }
    if(!story.seen.has('lapse')){
      if(!story.lapse) S.comandas.forEach((p, part) => p.log.forEach(entry => {
        const orphan = entry.lockUntil !== undefined && !S.cooks.some(k => k.job && k.job.entry === entry);
        if(!story.lapse && orphan && entry.lockUntil - S.time < 2.5) story.lapse = {part, entry, at:entry.lockUntil};
      }));
      if(story.lapse){
        if(S.time < story.lapse.at + 1) return around(story.lapse.part, story.lapse.entry, null, 46);
        story.seen.add('lapse');
        story.retake = story.lapse;
      }
    }
    if(story.retake && !story.seen.has('retake')){
      const {part, entry} = story.retake, c = S.cooks.find(k => k.job && k.job.entry === entry);
      if(c && entry.lockFrom !== undefined && S.time >= entry.lockFrom + 1.2) story.seen.add('retake');
      else if(c) return around(part, entry, c, 60);
    }
    return null;
  }

  function focusTarget(){
    const told = storyTarget();
    if(!S.build) return told;
    const phase = S.build.phase;
    const cookFeet = c => barTop(c.pos) + COOK_FEET;
    // Telling the cooks: the whole band on the right, so him and both cooks are lit.
    if(phase === 'tell' || phase === 'heard' || phase === 'markSay' || phase === 'peekSay') return {x:690, y:(barTop(0) + barTop(2)) / 2 + 28, r:70, sy:3.9};
    if(phase === 'search') return null;
    if(phase === 'waiterReplies') return {x:S.barWaiters[0].x, y:S.barWaiters[0].y - 38, r:60};
    if((phase === 'ackShown' || phase === 'firstAcks') && bossTalking()) return {x:S.boss.x, y:S.boss.y - 26, r:58};
    if(['look', 'stare', 'windup', 'kicked', 'markBoss', 'peekBoss'].includes(phase)) return {x:S.boss.x, y:S.boss.y - 26, r:58};
    // Each event only until it has been seen: then the light moves on to the next one, or goes out.
    const arriving = S.cooks.find(c => c.arriving);
    if(arriving) return {x:arriving.x + 16, y:cookFeet(arriving) - 22, r:62};
    // The fumes and the fall; once it is on the floor, that is all there was to see.
    const out = S.cooks.find(c => c.faint && (c.faint.phase === 'fumes' || (c.faint.phase === 'fainted' && c.faint.t < FOCUS_FALL_S)));
    if(out) return {x:out.x + (out.faint.phase === 'fainted' ? 12 : 0), y:cookFeet(out) - 24, r:52};
    const delayedComplaint = S.customers.find(c => c.say?.dishComplaint);
    if(delayedComplaint) return {x:TABLE_X + 25, y:tableTop(delayedComplaint.table) - 43, r:84};
    if(told) return told;
    if(phase && phase.startsWith('sign')) return {x:SIGN_X, y:SIGN_TOP + 34, r:105};
    // Plates nobody asked for: only the first one is pointed at, the rest are the same joke.
    const strayLit = say => !say.stray || (story.firstStray ??= say) === say;
    const upset = S.customers.find(c => c.state === 'complain' || c.puzzled > 0 || (c.say && strayLit(c.say)));
    if(upset) return {x:TABLE_X, y:tableTop(upset.table) - 22, r:56};
    const talking = S.cooks.find(c => c.say);
    if(talking) return {x:talking.x, y:cookFeet(talking) - 30, r:56};
    if(S.fallen.length) return {x:S.fallen[0].x, y:ticketTop(rowOf(S, S.fallen[0].part)) + 20, r:50};
    if(S.boss.say) return {x:S.boss.x, y:S.boss.y - 26, r:58};
    return null;
  }
  function drawFocus(){
    const target = focusTarget(), tick = frameTick;
    if(target){
      // Fades in slowly where it is wanted; once lit, it glides gently from one subject to the next.
      const k = focus.a < 0.05 ? 1 : Math.min(1, tick * 1.6);
      focus.x += (target.x - focus.x) * k;
      focus.y += (target.y - focus.y) * k;
      focus.r += (target.r - focus.r) * k;
      focus.sy += ((target.sy || 1) - focus.sy) * k;
      focus.a = Math.min(1, focus.a + tick * 1.1);
    } else {
      focus.a = Math.max(0, focus.a - tick * 0.7);
    }
    if(focus.a <= 0) return;
    // Stretched vertically when it has to take in a whole band.
    g.save();
    g.translate(focus.x, focus.y);
    g.scale(1, focus.sy);
    const glow = g.createRadialGradient(0, 0, focus.r * 0.55, 0, 0, focus.r * 2.6);
    glow.addColorStop(0, 'rgba(0,0,12,0)');
    glow.addColorStop(0.35, `rgba(0,0,12,${(0.3 * focus.a).toFixed(3)})`);
    glow.addColorStop(1, `rgba(0,0,12,${(0.68 * focus.a).toFixed(3)})`);
    g.fillStyle = glow;
    g.fillRect(-focus.x, -focus.y / focus.sy, W, H / focus.sy);
    g.restore();
  }

  // Keep dialogue above the actors and the lighting, and hide it with its actor in Kafka view.
  function drawSceneBubbles(){
    const hide = () => {};
    morphDraw(mixOf(STAGE.producers), drawDinerBubbles, hide);
    morphDraw(mixOf(STAGE.partitioner), () => {

      });
    }, hide);
    morphDraw(mixOf(STAGE.consumers), () => {
      S.cooks.forEach(drawWakeBubble);
      // What a cook says when it comes back: whether it knows which order it was on.
      S.cooks.forEach(c => { if(c.say) drawSpeech(c.say.lines, c.x, barTop(c.pos) + COOK_FEET - 68, '#f4d8ca', c.x + 8); });
      // What a cook only thinks: a cloud with little puffs down to its head.
      S.cooks.forEach(c => { if(c.think && c.think.t >= 0) drawThought(c.think.lines, c.x - 6, barTop(c.pos) + COOK_FEET - 56); });
    }, hide);
    morphDraw(mixOf(STAGE.topic), drawBossCall, hide);
  }

  const NESTING_LONG = '#ffd23f', NESTING_SHORT = '#74dae5';
  const NESTING_TIME = value => `${Number(value.toFixed(2)).toString().replace('.', ',')} S`;

  function drawNestingJob(job, x, y, dim = false){
    const color = job.kind === 'long' ? NESTING_LONG : NESTING_SHORT;
    const before = g.globalAlpha;
    if(dim) g.globalAlpha = before * 0.45;
    kafkaBox(x, y, 32, 29, color, KAFKA.log);
    text(`J${job.id}`, x + 16, y + 5, color, 'center');
    text(NESTING_TIME(job.duration).replace(' S', ''), x + 16, y + 17, PAL.white, 'center');
    g.globalAlpha = before;
  }

  function drawNestingDemo(demo){
    const producer = PRODUCER_BOX, group = GROUP_BOX;
    const laneX = barStart() - 2, laneH = 54;
    const bus = demo.mode === 'bus';
    const merge = bus ? smooth(demo.introElapsed / 0.8) : 0;
    const merged = merge >= 1;
    const broker = merged ? NESTING_SHORT : KAFKA.topic;
    // Make room for the receivers before the two lanes reach their row.
    const fit = smooth(Math.min(1, merge * 5));
    const laneRight = Math.round(lerp(barEnd() + 4, group.x - 16, fit));
    const laneW = laneRight - laneX, centerY = group.y + group.h / 2;
    const laneY = part => Math.round(lerp(ticketTop(rowOf(S, part)) - 20, centerY - laneH / 2, merge));
    R(0, 0, W, H, KAFKA.log);

    diagramPanel(producer, merged ? 'SENDER' : 'PRODUCER', PAL.white);
    text('8 TRABAJOS', producer.x + 8, producer.y + 25, PAL.white);
    text('4 LARGOS', producer.x + 8, producer.y + 55, NESTING_LONG);
    text(NESTING_TIME(NESTING_DURATIONS.long), producer.x + producer.w - 8, producer.y + 55, NESTING_LONG, 'right');
    text('4 CORTOS', producer.x + 8, producer.y + 75, NESTING_SHORT);
    text(NESTING_TIME(NESTING_DURATIONS.short), producer.x + producer.w - 8, producer.y + 75, NESTING_SHORT, 'right');

    const rows = merged ? [demo.jobs.filter(job => job.status !== 'done')]
      : [0, 1].map(part => demo.jobs.filter(job => job.part === part));
    const bands = rows.map((_, part) => [laneY(part) - 4, laneY(part) + 58]);
    drawTopicFrame(bands, merged ? 'QUEUE: ANIDADO' : 'TOPIC: ANIDADO', broker, laneRight + 4);
    rows.forEach((jobs, part) => {
      const y = laneY(part), out = Math.round(lerp(batchLaneY(part) + 6, centerY, merge)), lane = y + Math.round(lerp(11, laneH / 2, merge));
      R(producer.x + producer.w, out, ROUTE_X - producer.x - producer.w, 1, PAL.white);
      R(ROUTE_X, Math.min(out, lane), 1, Math.abs(out - lane) + 1, PAL.white);
      R(ROUTE_X, lane, laneX - ROUTE_X - 1, 1, PAL.white);
      R(laneX - 4, lane - 1, 1, 3, PAL.white);
      kafkaBox(laneX, y, laneW, laneH, KAFKA.partition, KAFKA.log);
      if(merged || merge < 0.85){
        text(merged ? 'COLA / PEEK-LOCK' : `PARTITION ${part}`, laneX + 6, y + 39, KAFKA.label);
        text(`DISPONIBLES: ${jobs.filter(job => job.status === 'waiting').length}`, laneX + 6, y + 12, broker);
      }
    });
    // Draw the tickets above both lanes as the two sets interleave in dispatch order.
    rows.forEach((jobs, part) => {
      const y = laneY(part);
      jobs.forEach((job, i) => {
        const from = laneRight - 10 - (jobs.length - i) * 42;
        const slotsToEnd = merged ? jobs.length - i : demo.jobs.length - job.id + 1;
        const x = Math.round(lerp(from, laneRight - 6 - slotsToEnd * 35, fit));
        drawNestingJob(job, x, y + 6, job.status !== 'waiting');
        if(job.status !== 'waiting') text(job.status === 'done' ? 'OK' : merged ? 'LOCK' : 'LEÍDO', x + 16, y + 39, PAL.white, 'center');
      });
    });
    if(merged){
      const junction = group.x - 7;
      const top = consumerSpot(0).y + CONSUMER_H / 2, bottom = consumerSpot(1).y + CONSUMER_H / 2;
      R(laneRight + 4, centerY, junction - laneRight - 3, 1, broker);
      R(junction, top, 1, bottom - top + 1, broker);
      for(const y of [top, bottom]) R(junction, y, group.x - junction, 1, broker);
    }

    diagramPanel(group, merged ? 'RECEIVERS' : 'CONSUMER GROUP', COLORS.cook);
    text('ID=ANIDADO', group.x + group.w / 2, group.y + group.h / 2 - 3, COLORS.cook, 'center');
    for(const worker of demo.workers){
      const {x, y} = consumerSpot(worker.id), job = worker.job;
      const idle = !job && demo.phase === 'running', color = idle ? '#ff9187' : COLORS.cook;
      diagramPanel({x, y, w:CONSUMER_W, h:CONSUMER_H}, `${merged ? 'RECEIVER' : 'CONSUMER'} C${worker.id + 1}`, color);
      text(job ? `CALCULA J${job.id}` : idle ? 'OCIOSO' : demo.phase === 'done' ? 'TERMINADO' : 'LISTO', x + 5, y + 15, idle ? color : PAL.cyan);
      text(merged ? 'COLA' : `P${worker.id}`, x + 5, y + 27, KAFKA.label);
      if(job){
        const age = demo.elapsed - job.startedAt, ink = job.kind === 'long' ? NESTING_LONG : NESTING_SHORT;
        R(x + 3, y + CONSUMER_H - 4, CONSUMER_W - 6, 2, KAFKA.partition);
        R(x + 3, y + CONSUMER_H - 4, Math.round((CONSUMER_W - 6) * clamp01(age / job.duration)), 2, ink);
        if(age < 0.32){
          const k = smooth(age / 0.32);
          const px = lerp(laneX + laneW - 26, x + 38, k), py = lerp(laneY(merged ? 0 : worker.id) + 14, y + 25, k);
          text(`J${job.id}`, px, py, ink, 'center');
        }
      } else if(idle || demo.phase === 'done'){
        text(`OCIO ${NESTING_TIME(Math.max(0, demo.elapsed - worker.busy))}`, x + CONSUMER_W - 5, y + 27, color, 'right');
      }
    }

  }

  function draw(){
    if(nestingDemo){
      drawNestingDemo(nestingDemo);

      return;
    }
    if(S.materialDemo) R(0, 0, W, H, KAFKA.log);

  // ---- On the wall: the speed, left of the chalkboard, and the step button, right of it ----

  const $ = id => document.getElementById(id);
  const barLabel = $('scene').getAttribute('aria-label');
  let sceneLabel = barLabel;

  function describeScene(label){
    if(sceneLabel === label) return;
    sceneLabel = label;
    $('scene').setAttribute('aria-label', label);
  }

  // The same button advances the tutorial, the story, and then the technical view.
  const STORY_STEP_COUNT = UPGRADES.length + 1;
  const TECHNICAL_STEP_COUNT = STORY_STEP_COUNT + KAFKA_STAGES.length;
  const NESTING_STEP = TECHNICAL_STEP_COUNT + 2;
  const STEP_COUNT = NESTING_STEP + 2;
  // Two short lines: ▶ what is going on, or ✓ what was just seen; › what the next click brings.
  const capital = text => text[0].toUpperCase() + text.slice(1);
  const stepLabel = j => `${j + 2}/${STEP_COUNT} ${UPGRADES[j].kind}: ${UPGRADES[j].name}`;
  function refreshUpgrade(){
    const button = $('upgrade');
    let now, next = null;
    button.setAttribute('aria-pressed', String(pendingStep));
    if(!tutorialDone){
      button.disabled = false;
      button.setAttribute('aria-pressed', String(tutorialStep > 0));
      if(!tutorialStep){
        now = 'Abre la taberna: de momento, una cola';
        next = `1/${STEP_COUNT} Tutorial: quién es quién`;
      } else {
        now = `▶ Tutorial ${tutorialStep}/${TUTORIAL_STEPS.length}: ${TUTORIAL_STEPS[tutorialStep - 1]}`;
        next = tutorialStep < TUTORIAL_STEPS.length ? TUTORIAL_STEPS[tutorialStep] : 'la escena entera';
      }
    } else if(nestingDemo){
      const bus = nestingDemo.mode === 'bus', done = nestingDemo.phase === 'done';
      describeScene(bus
        ? 'Azure Service Bus, demo de anidado. Dos receptores compiten por ocho trabajos independientes en una cola común.'
        : 'Kafka, demo de anidado. P0 contiene los cuatro trabajos largos y P1 los cuatro cortos. Un consumer por partición.');
      button.disabled = !done;
      now = bus ? (done ? `✓ ${NESTING_STEP + 1}/${STEP_COUNT} Service Bus: ${NESTING_TIME(nestingDemo.elapsed)} / Kafka: ${NESTING_TIME(nestingDemo.kafkaResult)}` : `▶ ${NESTING_STEP + 1}/${STEP_COUNT} Anidado en Service Bus`)
        : done ? `✓ ${NESTING_STEP}/${STEP_COUNT} Kafka: ${NESTING_TIME(nestingDemo.elapsed)}, C2 ocioso` : `▶ ${NESTING_STEP}/${STEP_COUNT} Anidado en Kafka`;
      if(done) next = bus ? `${STEP_COUNT}/${STEP_COUNT} Cierre` : `${NESTING_STEP + 1}/${STEP_COUNT} El mismo lote en Service Bus`;
    } else if(S.materialDemo){
      const demo = S.materialDemo, event = MATERIAL_EVENTS[demo.index], ready = demo.phase === 'ready';
      const routing = demo.split ? 'Misma clave en dos particiones.' : 'Topic materiales.';
      describeScene(`${routing} Material ${MATERIAL_KEY}: ${materialState(demo).label.toLowerCase()}.`);
      button.disabled = !ready;
      if(demo.split){
        now = ready ? `✓ ${TECHNICAL_STEP_COUNT + 1}/${STEP_COUNT} UPDATE antes que CREATE` : `▶ ${TECHNICAL_STEP_COUNT + 1}/${STEP_COUNT} Misma clave, dos particiones`;
        if(ready) next = `${TECHNICAL_STEP_COUNT + 2}/${STEP_COUNT} Anidado en Kafka`;
      } else if(!event){
        now = `✓ ${MATERIAL_KEY}: 4 eventos, siguen en el log`;
        next = `${TECHNICAL_STEP_COUNT + 1}/${STEP_COUNT} Misma clave, dos particiones`;
      } else {
        now = ready ? `✓ ${MATERIAL_KEY}: ${demo.index}/${MATERIAL_EVENTS.length} eventos aplicados` : `▶ ${MATERIAL_KEY} · ${event.op}`;
        if(ready) next = `Enviar ${event.op}`;
      }
    } else if(!S.build && S.upgrades === UPGRADES.length){
      // The story is over: the same button turns each kind of actor into its Kafka piece.
      if(kafkaStep) describeScene(`Transformación del bar a Kafka: ${KAFKA_STAGES.slice(0, kafkaStep).join(', ')}.`);
      else describeScene(barLabel);
      const stage = KAFKA_STAGES[kafkaStep];
      button.disabled = !stage && kafkaMix.some(mix => mix < 1);
      now = !stage ? 'Kafka real · topic comandas'
        : kafkaStep ? `✓ ${STORY_STEP_COUNT + kafkaStep}/${STEP_COUNT} Kafka real: ${KAFKA_STAGES[kafkaStep - 1]}`
        : `✓ ${STORY_STEP_COUNT}/${STEP_COUNT} Ya es Kafka`;
      next = stage ? `${STORY_STEP_COUNT + kafkaStep + 1}/${STEP_COUNT} Kafka real: ${stage}` : 'Abrir ejemplo de materiales';
    } else {
      // The story: what is happening, or what was just seen, and the step a click asks for. A
      // click during an animation queues it.
      const running = S.build ? S.upgrades : null, done = S.upgrades - 1;
      const ask = S.build ? S.upgrades + 1 : S.upgrades;
      button.disabled = false;
      now = running !== null ? `▶ ${running + 2}/${STEP_COUNT} ${capital(UPGRADES[running].doing)}…`
        : done >= 0 ? `✓ ${done + 2}/${STEP_COUNT} ${capital(UPGRADES[done].name)}`
        : `✓ 1/${STEP_COUNT} Tutorial`;
      // Queued, it drops the kind to make room for saying so.
      next = pendingStep
        ? `${ask + 2}/${STEP_COUNT} ${UPGRADES[ask] ? capital(UPGRADES[ask].name) : KAFKA_STAGES[0]} · en espera`
        : UPGRADES[ask] ? stepLabel(ask) : `${STORY_STEP_COUNT + 1}/${STEP_COUNT} Kafka real: ${KAFKA_STAGES[0]}`;
    }
    button.replaceChildren();
    const line = (cls, text) => { const span = document.createElement('span'); span.className = cls; span.textContent = text; button.append(span); };
    line('now', now);
    if(next) line('next', `› ${next}`);
    // The full text as a tooltip, in case a line is cut short.
    button.title = next ? `${now}\n› ${next}` : now;
  }

  function refreshPanel(){
    refreshUpgrade();
  }

  function setSpeed(value){
    speed = value;
    document.querySelectorAll('[data-speed]').forEach(button => {
      button.setAttribute('aria-pressed', String(Number(button.dataset.speed) === speed));
    });
  }

  document.querySelector('.speed').addEventListener('click', e => {
    const b = e.target.closest('button');
    if(b) setSpeed(Number(b.dataset.speed));
  });

  // Escape leaves the tutorial.
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape') setTutorialStep(0);
  });

  function nextStep(){
    if(!tutorialDone) return setTutorialStep((tutorialStep + 1) % (TUTORIAL_STEPS.length + 1));
    if(nestingDemo){
      if(nestingDemo.phase !== 'done') return;
      if(nestingDemo.mode === 'kafka'){
        nestingDemo = createNestingDemo('bus', nestingDemo.elapsed);
        refreshPanel();
      } else if($('ending').hidden){
        document.querySelector('.stage').hidden = true;
        $('ending').hidden = false;
        $('ending').focus();
      }
      return;
    }
    if(S.materialDemo){
      const demo = S.materialDemo;
      if(demo.phase === 'ready'){
        if(demo.split){
          beginExampleTransition();
          nestingDemo = createNestingDemo('kafka');
          setSpeed(1);
        } else if(demo.index < MATERIAL_EVENTS.length) sendMaterialEvent(S);
        else {
          beginExampleTransition();
          S = createMaterialDemo(true);
          view.ends.fill(0);
        }
      }
      refreshPanel();
      return;
    }
    if(kafkaStep === KAFKA_STAGES.length){
      if(kafkaMix.every(mix => mix === 1)) openMaterialDemo();
      return;
    }
    if(pendingStep) return;
    pendingStep = true;
    startPendingStep();
    refreshPanel();
  }

  function startPendingStep(){
    if(!pendingStep || S.build) return;
    const next = UPGRADES[S.upgrades];
    if(next){
      if(!next.start(S)) return;
    } else {
      kafkaStep++;
    }
    pendingStep = false;
    refreshPanel();
  }
  $('upgrade').addEventListener('click', nextStep);
  // The space bar is the step button too, wherever the focus is (a focused button would otherwise
  // take the press as its own click); held-down repeats are ignored so one press is one step.
  document.addEventListener('keydown', e => {
    const onCover = !$('cover').hidden;
    if((e.key !== ' ' && !(onCover && e.key === 'Enter')) || e.ctrlKey || e.metaKey || e.altKey) return;
    if(e.target.closest('input:not([type=range]), textarea, select, [contenteditable]')) return;
    e.preventDefault();
    if(!e.repeat){
      if(onCover) enterBar();
      else nextStep();
    }
  });

  // Each click lights the next kind of actor; after the last one, back to the whole scene.
  // Leaving the tutorial, by its last click or by Escape, counts as having done the first step.
  function setTutorialStep(step){
    if(tutorialStep && !step) tutorialDone = true;
    tutorialStep = step;
    refreshUpgrade();
  }

  // ---- Loop: fixed simulation step, independent of the frame rate ----

  const STEP = 1 / 60;
  // The x1 of the speed buttons: everything runs at this fraction of the model's timings.
  const BASE_SPEED = 0.6;
  let last = performance.now(), accumulator = 0, sincePanel = 0;
  function beginExampleTransition(){
    if(!reducedMotion?.matches){
      const image = document.createElement('canvas');
      image.width = W;
      image.height = H;
      image.getContext('2d').drawImage(low, 0, 0);
      exampleTransition = {image, opacity:1};
    }
  }

  function openMaterialDemo(){
    beginExampleTransition();
    S = createMaterialDemo();
    view.ends = S.comandas.map(() => 0);
    setSpeed(1);
    refreshPanel();
  }

  function frame(now){
    if(!$('ending').hidden) return;
    const real = Math.min(0.1, (now - last) / 1000);
    last = now;
    accumulator += real * speed * BASE_SPEED;
    while(accumulator >= STEP){
      if(nestingDemo) stepNestingDemo(nestingDemo, STEP);
      else if(S.materialDemo) stepMaterialDemo(S, STEP);
      else stepSim(S, STEP);
      accumulator -= STEP;
    }
    startPendingStep();
    updateView(real);
    draw();
    sincePanel += real;
    if(sincePanel > 0.2){ sincePanel = 0; refreshPanel(); }
    requestAnimationFrame(frame);
  }
  function enterBar(){
    const cover = $('cover');
    if(cover.hidden) return;
    cover.hidden = true;
    document.querySelector('.stage').hidden = false;
    refreshPanel();
    $('upgrade').focus();
    last = performance.now();
    requestAnimationFrame(frame);
  }
  $('cover').addEventListener('click', enterBar);
})();
</script>
</body>
</html>
