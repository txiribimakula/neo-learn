    // Against the tail, down by the rope: it pushes along the wire, it does not lift.
    const tip = {x:(chicken?.x ?? bodyX - CRUTCH_STAND_DX) - PULLEY_X, y:wireY(row) - 2};
    // Held at the grip, on the line from the tip to the shoulder.
    const dx = under.shoulderX - tip.x, dy = under.shoulderY - tip.y, d = Math.hypot(dx, dy);
    const hand = {x:tip.x + dx / d * 27, y:tip.y + dy / d * 27};
    let raised = Math.atan2(dx / d, -dy / d);
    // The tip goes out to its side and up, never across its face, so the angle only grows.
    if(raised < under.angle) raised += Math.PI * 2;
    const k = t < CRUTCH_RAISE ? smooth(t / CRUTCH_RAISE) : 1 - smooth((t - CRUTCH_LOWER) / (CRUTCH_COMMIT_S - CRUTCH_LOWER));
    const angle = lerp(under.angle, raised, k);
    const handX = lerp(under.handX, hand.x, k), handY = lerp(under.handY, hand.y, k);
    const x = handX - Math.sin(angle) * 27, y = handY + Math.cos(angle) * 27;
    drawCrutch(x, y, angle);
    return {...under, x, y, angle, handX, handY};
  }
  // Let go when it faints: both lean on the front of the stove, just behind where it stood.
  const leanCrutch = (c, feet, side) => ({x:c.x + (side < 0 ? 10 : 5), y:feet, angle:side < 0 ? 0.12 : 0.2});
  // From under its arms (facing the stove) to against the stove, as it falls.
  function drawDroppedCrutches(c, feet, k){
    for(const side of [-1, 1]){
      const from = crutchPose(c.x, feet, side, false, 0, 1), to = leanCrutch(c, feet, side), e = smooth(k);
      drawCrutch(lerp(from.x, to.x, e), lerp(from.y, to.y, e), lerp(from.angle, to.angle, e));
    }
  }
  const CRUTCH_ARM = {edge:'#665044', sleeve:'#c9b28b', light:'#e7ce9f', skin:'#b87956', skinLight:'#dca379', skinEdge:'#744b38', rolled:true};
  const crutchArmLayer = document.createElement('canvas');
  crutchArmLayer.width = 80; crutchArmLayer.height = 68;
  function drawCrutchGrip(c, bodyX, feet, side, p){
    // Paint in the sprite's own coordinates, then apply exactly its burn treatment.
    const target = g, ctx = crutchArmLayer.getContext('2d');
    ctx.clearRect(0, 0, 80, 68);
    g = ctx;
    const shoulderX = p.shoulderX - bodyX + 40, shoulderY = p.shoulderY - feet + 68;
    const handX = p.handX - bodyX + 40, handY = p.handY - feet + 68;
    const dx = handX - shoulderX, dy = handY - shoulderY;
    const distance = Math.max(0.001, Math.hypot(dx, dy)), reach = Math.min(23, distance);
    const hx = shoulderX + dx / distance * reach, hy = shoulderY + dy / distance * reach;
    const bend = Math.sqrt(144 - reach * reach / 4);
    // Both elbows bend outwards from their own flank, never across the chest.
    const arm = {handX:hx, handY:hy,
      elbowX:(shoulderX + hx) / 2 + p.screenSide * dy / distance * bend,
      elbowY:(shoulderY + hy) / 2 - p.screenSide * dx / distance * bend};
    drawCharacterArm(shoulderX, shoulderY, arm, CRUTCH_ARM);
    if(c.charred) charFrame(ctx, 80, 68, 0);
    g = target;
    g.drawImage(crutchArmLayer, Math.round(bodyX - 40), Math.round(feet - 68));
  }

  // ---- The three-headed monkey riding the oil drum ----

  // It rolls in behind the top stove, then turns out towards the cook.
  const MONKEY_FEET = barTop(0) + COOK_FEET + 11;
  const MONKEY_BACK_FEET = stoveTop(0) + 8;
  // The drum stops in front of the stove. Each cel is aligned by its supporting foot or feet.
  const MONKEY_STOP_X = stoveX(0) - 7;
  const MONKEY_STEPS = [0, 1, 4, 2, 3, 4];
  function monkeyPose(age){
    if(age < 0 || age > MONKEY_EXIT_S) return null;
    let x = MONKEY_STOP_X, cel;
    if(age < MONKEY_ARRIVE_S || age >= MONKEY_LEAVE_S){
      const travel = age < MONKEY_ARRIVE_S ? 1 - age / MONKEY_ARRIVE_S
        : (age - MONKEY_LEAVE_S) / (MONKEY_EXIT_S - MONKEY_LEAVE_S);
      x = Math.round(lerp(MONKEY_STOP_X, W + 36, smooth(travel)));
      cel = MONKEY_STEPS[Math.floor((x - MONKEY_STOP_X) / 5) % MONKEY_STEPS.length];
    } else if(age < MONKEY_THROW_S){
      const frame = Math.floor((age - MONKEY_ARRIVE_S) / MONKEY_CEL_S);
      cel = MONKEY_SNACK[Math.min(frame, MONKEY_SNACK.length - 1)];
    } else {
      cel = 17; // extended, empty throwing hand
    }
    const feet = age < MONKEY_ARRIVE_S
      ? Math.round(lerp(MONKEY_BACK_FEET, MONKEY_FEET, smooth(age / MONKEY_ARRIVE_S)))
      : MONKEY_FEET;
    // With feet apart, both soles sit a few pixels below the crown of the drum.
    const sole = feet - 2 * OIL_RADIUS + (cel >= 5 ? 3 : 0);
    return {x, feet, sole, cel, angle:(x - MONKEY_STOP_X) / OIL_RADIUS};
  }
  function drawMonkeyRun(pose){
    drawRollingCask(pose.x, pose.feet, pose.angle);
    g.drawImage(document.getElementById('monkey'), pose.cel * 72, 0, 72, 48, pose.x - 36, pose.sole - 48, 72, 48);
  }

  function drawMonkeyAtDepth(behindStove){
    if(!S.monkeyRun) return;
    const pose = monkeyPose(S.time - S.monkeyRun.at);
    if(pose && (pose.feet < stoveTop(0) + 39) === behindStove) drawMonkeyRun(pose);
  }

  // The last tile is the loose peel from the release cel.
  function drawBananaPeel(x, y, spin){
    g.save();
    g.translate(Math.round(x), Math.round(y));
    g.rotate(Math.round(spin / (Math.PI / 4)) * Math.PI / 4);
    g.drawImage(document.getElementById('monkey'), 18 * 72, 0, 10, 6, -5, -6, 10, 6);
    g.restore();
  }
  function peelFlight(p){
    const k = clamp01((S.time - p.at) / PEEL_LAND_S);
    const release = monkeyPose(MONKEY_THROW_S);
    // Up to a row further back the arc goes higher, so the peel drops onto that floor from above.
    const from = release.sole - 11, to = barTop(p.row) + COOK_FEET + 1;
    return {x:lerp(release.x - 26, PEEL_X, k),
      y:lerp(from, to, k) - (30 + 0.45 * Math.max(0, from - to)) * Math.sin(Math.PI * k),
      spin:-k * 2 * Math.PI};
  }
  function drawPeel(flying){
    const p = S.peel;
    if(!p) return;
    const a = S.time - p.at, feet = barTop(p.row) + COOK_FEET;
    if(a < PEEL_LAND_S){
      if(!flying) return;
      const {x, y, spin} = peelFlight(p);
      drawBananaPeel(x, y, spin);
      return;
    }
    if(flying) return;
    const since = p.stepAt === null ? -1 : S.time - p.stepAt;
    const fade = clamp01(1 - (since - 12) / 2);
    if(fade <= 0) return;
    const slide = 1 - (1 - clamp01(since / 0.35)) ** 2;
    g.globalAlpha = fade;
    drawBananaPeel(PEEL_X - 22 * slide, feet + 1, since > 0 ? slide * Math.PI : 0);
    g.globalAlpha = 1;
  }

  // Fumes, a fall flat on the floor, coming round with a question, and back on its feet.
  // The first time it is a blast instead: rattling, then thrown back onto the floor, smoking.
  function drawFaintingCook(c, top){
    const f = c.faint, feet = top + COOK_FEET - (f.up || 0);
    if(f.phase === 'crutches'){
      // Going up to the wall, seen from behind.
      if(!f.lean && f.t >= CRUTCH_SIDE_S && f.t < CRUTCH_STEP_S){
        c.phase = (c.phase || 0) + frameTick;
        drawSprite(cookSprite(c.id, 'back', Math.floor(c.phase * 10) % 2 === 1), c.x, feet, false);
        return;
      }
      // Off the wall, or from against the stove where they fell.
      const reach = clamp01((f.t - (f.lean ? 0 : CRUTCH_STEP_S)) / CRUTCH_REACH_S);
      const grasp = 0.35, transfer = smooth(clamp01((reach - grasp) / (1 - grasp)));
      const wall = crutchWall(), poses = [-1, 1].map(side => {
        // The far hand, on the right, takes the right-hand one on the wall; the near hand the other.
        const parked = f.lean ? leanCrutch(c, feet, side) : {x:wall.x + (side < 0 ? 0 : -5), y:wall.feet, angle:side < 0 ? 0.1 : 0.06};
        const target = crutchPose(c.x, feet, side, c.walking && reach >= 1, S.time, 1);
        const angle = Math.round(lerp(parked.angle, target.angle, transfer) / (Math.PI / 48)) * Math.PI / 48;
        const x = lerp(parked.x, target.x, transfer), y = lerp(parked.y, target.y, transfer) - 8 * Math.sin(Math.PI * transfer);
        return {...target, x, y, angle, handX:x + Math.sin(angle) * 27, handY:y - Math.cos(angle) * 27};
      });
      const drawSide = i => {
        const p = poses[i], k = smooth(clamp01(reach / grasp));
        if(reach >= grasp || f.lean) drawCrutch(p.x, p.y, p.angle);
        drawCrutchGrip(c, c.x, feet, i ? 1 : -1, {...p,
          handX:lerp(p.shoulderX + p.screenSide * 2, p.handX, k), handY:lerp(feet - 28, p.handY, k)});
      };
      drawSide(0);
      drawSprite(crewFrame('cook-idle-' + c.id, c.walking ? 'walk' : 'stand', false, 'both', cookScars(c.id)), c.x, feet, true);
      drawSide(1);
      return;
    }
    if(f.phase === 'slip'){
      // Feet out from under it towards the stove, a moment in the air, then flat on its back.
      const u = clamp01(f.t / SLIP_FALL_S), angle = -Math.PI / 2 * Math.min(1, u * 1.3);
      const lying = Math.abs(Math.sin(angle)), lift = 16 * Math.sin(Math.PI * u);
      const spr = crewFrame('cook-idle-' + c.id, 'kick', false, false, cookScars(c.id));
      g.save();
      g.translate(Math.round(c.x + 22 * lying), Math.round(feet - 17 * lying - lift));
      g.rotate(angle);
      g.scale(-1, 1);
      g.drawImage(spr, -Math.round(spr.width / 2), -spr.height);
      g.restore();
      return;
    }
    if(f.phase === 'blast'){
      if(!f.boomed){
        const k = f.t / BLAST_BOOM_S, sway = Math.round(Math.sin(S.time * 40) * 1.5 * k);
        drawSprite(cookSprite(c.id, 'down', false, false), c.x + sway - Math.round(k * 3), feet, true);
        return;
      }
      const u = clamp01((f.t - BLAST_BOOM_S) / BLAST_FLY_S), e = 1 - (1 - u) ** 2;
      const angle = -Math.PI / 2 * e, lying = Math.abs(Math.sin(angle));
      const x = lerp(COOK_X, COOK_X - BLAST_KNOCK, e), lift = 34 * 4 * u * (1 - u);
      const spr = cookSprite(c.id, 'down', false, true);
      g.save();
      g.translate(Math.round(x + 22 * lying), Math.round(feet - 17 * lying - lift));
      g.rotate(angle);
      g.drawImage(spr, -Math.round(spr.width / 2), -spr.height);
      g.restore();
      return;
    }
    if(f.phase === 'fumes'){
      const sway = Math.round(Math.sin(S.time * 9) * 1.5 * Math.min(1, f.t / 0.5));
      if(c.crutches) drawOnCrutches(c, c.x + sway, feet, true, false, false, f.t > FUMES_S * 0.6);
      else drawSprite(cookSprite(c.id, 'down', false, f.t > FUMES_S * 0.6), c.x + sway, feet, true);
      drawFumes(c, top);
      return;
    }
    // On crutches, they fall against the stove as it goes down, and wait there.
    if(c.crutches) drawDroppedCrutches(c, feet, f.phase === 'fainted' && !f.flat ? clamp01(f.t / 0.25) : 1);
    // Angle of the body: falling flat, then straight back on its feet to ask its question.
    const angle = f.phase === 'fainted'
      ? -Math.PI / 2 * (f.flat ? 1 : clamp01(f.t / 0.25))
      : lerp(-Math.PI / 2, 0, clamp01(f.t / GET_UP_S));
    const lying = Math.abs(Math.sin(angle));
    const spr = cookSprite(c.id, 'down', false, f.phase === 'fainted');
    const pivotX = c.x + 22 * lying, pivotY = feet - 17 * lying;
    g.save();
    g.translate(Math.round(pivotX), Math.round(pivotY));
    g.rotate(angle);
    if(f.faceRight) g.scale(-1, 1);
    g.drawImage(spr, -Math.round(spr.width / 2), -spr.height);
    g.restore();
    // Follow the head as the sprite rotates around its feet.
    const headX = pivotX + Math.sin(angle) * 60, headY = pivotY - Math.cos(angle) * 60;
    if(f.phase === 'fainted') drawDizzyStars(headX, headY - 8);
    if(c.charred && f.phase === 'fainted') drawSootWisps(pivotX - 20, pivotY - 4, c.id);
  }

  function drawWakeBubble(c){
    const f = c.faint;
    if(f?.phase === 'blast' && !f.boomed && f.t > 0.25) return drawSpeech(['!'], c.x - 4, barTop(c.pos) + COOK_FEET - 68);
    if(f?.phase !== 'waking' || f.t < GET_UP_S) return;
    const headY = barTop(c.pos) + COOK_FEET - 68;
    if(f.waking){
      if(f.waking.length) drawSpeech(f.waking, c.x, headY);
    } else {
      drawSpeech(['Am I already at', 'Monkey Island™?'], c.x, headY);
    }
  }

  // A new cook drags its stove in, facing it and walking backwards, then sets it up and lights it.
  function drawArrivingCook(c, top){
    const row = c.row, feet = top + COOK_FEET, installing = c.arriving.phase === 'install';
    const x = installing ? stoveX(row) : c.x + 32, base = stoveTop(row) + 40;
    if(!installing){
      // Scrape marks on the floor behind it, and dust where it grinds along.
      R(Math.round(x + 18), base - 1, W - Math.round(x + 18), 1, '#3a3a3a');
      if(c.walking) for(const [dx, dy] of [[20, -3], [25, -6], [22, -9]]) R(x + dx + (Math.floor(S.time * 12) % 2) * 2, base + dy, 2, 2, '#9a9a9a');
    }
    drawStove(x, stoveTop(row));
    if(installing) drawFlames(x, stoveTop(row), c.arriving.t > INSTALL_S / 2);
    c.phase = (c.phase || 0) + frameTick;
    const walk = c.walking && Math.floor(c.phase * 10) % 2 === 1;
    // Leaning back on each heave.
    const lean = !installing && c.walking ? 2 : 0;
    drawSprite(cookSprite(c.id, 'reach', walk, false), c.x - lean, feet, true);
  }


  // How a cook stands while it moves the kitchen about: holding a post, pushing its stove up from
  // below with its back to us, or tugging a new post out of the floor. Null for ordinary poses.
  function buildingPose(c){
    if(!c.building) return null;
    const b = S.build, w = S.wire;
    if(c.id === 0 && b && b.phase === 'lift') return {pose:'reach', flip:true};
    if(c.id === 1 && w && ['raise', 'raise2', 'carry', 'plant'].includes(w.phase)){
      return {pose:'reach', flip:true, tug:w.phase === 'raise' || w.phase === 'raise2' ? (Math.floor(w.t * 6) % 2) * 3 : 0};
    }
    return null;
  }

  // The second post in the new cook's hands, with the wire running back to the first one, and the
  // thump when it goes into the floor. Drawn over the cook, who holds it.
  function drawCarriedPost(){
    const build = S.wire;
    if(!build || build.secondX === null || S.comandas.length > 1) return;
    const wire = wireY(NEW_ROW), x0 = Math.round(build.secondX + 2), x1 = RIGHT_POST_X;
    R(x0, wire - 1 - Math.round(build.lift / 2), x1 - x0, 3, PAL.black);
    R(x0, wire - Math.round(build.lift / 2), x1 - x0, 1, '#dbb378');
    drawPost(Math.round(build.secondX), build.second, Math.round(build.lift));
    if(build.phase === 'plant' && build.lift < 2){
      const ground = barTop(NEW_ROW) + 37;
      for(const dx of [-9, 12]) R(build.secondX + dx, ground - 2, 2, 2, '#9a9a9a');
    }
  }


  // Into the bin with a back heel: the cook, back to the bin, tosses the order up, lets it drop
  // behind and heels it in, in the air.
  // A back-heel flick, as in football: the order is dropped by the feet, and the heel flicks it
  // up and backwards, low over the floor, into the bin behind.
  const KICK_AT = 0.5;
  const heelUp = k => k > KICK_AT - 0.1 && k < KICK_AT + 0.14;

  function binTossAt(c, feet, job){
    const k = job.timer / BIN_S;
    // Its back to the bin: the heel is on the side it is not facing.
    const back = c.faceLeft ? 1 : -1;
    const hand = {x:c.x - back * 8, y:feet - 34}, floor = {x:c.x + back * 7, y:feet - 4};
    const bin = S.bin ? {x:S.bin.x, y:BIN_TOP - 2} : {x:c.x + back * 40, y:feet};
    // Let go: it drops to the floor right behind its heel, and lies there a moment.
    if(k < 0.3){
      const t = (k / 0.3) ** 2;
      return {x:lerp(hand.x, floor.x, t), y:lerp(hand.y, floor.y, t)};
    }
    if(k < KICK_AT) return floor;
    // The flick: a parabola up and back, from the floor wherever it is to the mouth of the bin,
    // higher the further it has to go.
    const t = clamp01((job.timer - KICK_AT * BIN_S) / (binDuration(job) - KICK_AT * BIN_S));
    const arc = 20 + Math.abs(bin.x - floor.x) * 0.12 + Math.max(0, floor.y - bin.y) * 0.3;
    const hop = (a, b, u, h) => ({x:lerp(a.x, b.x, u), y:lerp(a.y, b.y, u) - 4 * h * u * (1 - u)});
    if(!job.rimShot) return hop(floor, bin, t, arc);
    // On the rim: it hits the near edge, hops to the far one, hops back, and drops in.
    const side = Math.sign(bin.x - floor.x) || 1;
    const near = {x:bin.x - side * 8, y:bin.y - 3}, far = {x:bin.x + side * 8, y:bin.y - 3};
    const settle = {x:bin.x - side * 3, y:bin.y - 3}, inside = {x:bin.x, y:bin.y + 6};
    const [a, b, c2] = RIM_SPLITS;
    if(t < a) return hop(floor, near, t / a, arc);
    if(t < b) return hop(near, far, (t - a) / (b - a), 12);
    if(t < c2) return hop(far, settle, (t - b) / (c2 - b), 6);
    return hop(settle, inside, (t - c2) / (1 - c2), 0);
  }
  // Where the flight of a rim shot hits the rim, and where it drops in.
  const RIM_SPLITS = [0.43, 0.68, 0.86];

  function drawBinToss(c, feet, job){
    const k = clamp01(job.timer / BIN_S);
    const at = binTossAt(c, feet, job);
    // The order tumbles: seen face on, edge on, face on.
    const w = Math.floor(job.timer * 14) % 2 ? 4 : 10;
    drawLooseSlip(job.order, at.x, at.y, w, 12);
    if(k > KICK_AT && k < KICK_AT + 0.08){
      // The smack of the heel.
      const back = c.faceLeft ? 1 : -1;
      for(const [dx, dy] of [[-6, -6], [-8, -1], [-3, -9], [2, -7]]) R(c.x + back * (7 - dx), feet - 4 + dy, 2, 2, PAL.white);
    }
    if(job.rimShot && S.bin){
      // A clank on the rim at each bounce.
      const t = clamp01((job.timer - KICK_AT * BIN_S) / (binDuration(job) - KICK_AT * BIN_S));
      const clank = RIM_SPLITS.slice(0, 2).some(at => t > at && t < at + 0.05);
      if(clank) for(const [dx, dy] of [[-4, -5], [0, -7], [4, -5]]) R(at.x + dx, at.y + dy, 2, 2, PAL.white);
    }
  }

  const REST_HIPS = 54, SEAT_DROP = 2, DOZE_IN_S = 1.4;
  const REST_BEER = [1, .65, .31, 0];
  const BEER_HANDLE = {x:8, y:-4};
  const BEER_RIM = {x:4, y:-12};

  function drawRestingCook(c){
    const r = c.rest, top = tableTop(r.table);
    const walking = r.phase === 'walk', sitting = r.phase === 'sitdown', dozing = r.phase === 'doze';
    const sit = walking ? 0 : sitting ? smooth(clamp01(r.t / REST_SIT_S)) : 1;
    const feet = walking ? r.feet : lerp(restWalkFeet(r.table), restSeatFeet(r.table), sit);
    const lean = dozing ? smooth(clamp01(r.t / DOZE_IN_S)) : 0;
    const angle = -lean * .99;
    c.phase = (c.phase || 0) + frameTick;
    const stride = c.walking && Math.floor(c.phase * 10) % 2 === 1;
    const blink = dozing ? 'asleep' : isBlinking(c.id + 7);
    const body = feet + SEAT_DROP * sit;

    if(walking){
      drawBehindTables(c.x, feet, () => {
        contactShadow(c.x, feet - 1, 18);
        drawSprite(cookSprite(c.id, 'down', stride, blink), c.x, feet, !c.faceLeft);
      }, 56);
      return;
    }

    const sprite = seatedCookFrame(c.id, Math.round(2 * sit), blink);
    const width = sprite.width, legs = sprite.height - REST_HIPS;
    const center = Math.round(c.x), pivotY = Math.round(feet) - legs, drop = SEAT_DROP * sit;
    const cosine = Math.cos(angle), sine = Math.sin(angle);
    // Arm, head and torso share the same seated pivot, before the sprite is mirrored.
    const torsoPoint = (x, y) => ({
      x:center + x * cosine - (y + drop) * sine,
      y:pivotY + x * sine + (y + drop) * cosine
    });
    const shoulder = torsoPoint(-9, -30);
    const grip = {x:center - 22 + BEER_HANDLE.x, y:top - 5 + BEER_HANDLE.y};
    const loose = r.phase === 'wait' || dozing;
    const takeOut = smooth(clamp01((sit - .25) / .75));
    let hand = {x:lerp(center + 3, grip.x, takeOut),
      y:lerp(body - 22, grip.y, takeOut) - 5 * Math.sin(Math.PI * takeOut)};
    let tilt = 0, level = REST_BEER[r.sips];
    if(r.sip !== null){
      const sip = clamp01(r.sip / BEER_SIP_S);
      const raised = smooth(clamp01(sip / .26)) * smooth(clamp01((1 - sip) / .28));
      const drink = smooth(clamp01((sip - .26) / .46));
      // Positive rotation brings the rim toward the face in the arm's unmirrored coordinates.
      tilt = lerp(.48, 1.04, drink) * raised;
      // The rim follows the lips while the hand pivots on the handle.
      const rimX = BEER_RIM.x - BEER_HANDLE.x, rimY = BEER_RIM.y - BEER_HANDLE.y;
      const lipX = rimX * Math.cos(tilt) - rimY * Math.sin(tilt);
      const lipY = rimX * Math.sin(tilt) + rimY * Math.cos(tilt);
      hand = {
        x:lerp(grip.x, center - 7 - lipX, raised) - 3 * Math.sin(Math.PI * raised),
        y:lerp(grip.y, body - 49 - lipY, raised)
      };
      level = lerp(level, REST_BEER[r.sips + 1], drink);
    } else if(r.phase === 'check'){
      const k = clamp01(r.t / REST_CHECK_S);
      const raised = smooth(clamp01(k / .25)) * smooth(clamp01((1 - k) / .25));
      hand = {x:lerp(grip.x, center - 19, raised), y:lerp(grip.y, body - 46, raised)};
      tilt = -.32 * raised;
    } else if(loose){
      const release = dozing ? 1 : smooth(clamp01(r.t / .35));
      const forearm = {x:c.x - lerp(9, 39, lean), y:lerp(body - 24, top - 6, lean)};
      hand = {x:lerp(grip.x, forearm.x, release), y:lerp(grip.y, forearm.y, release)};
    }

    const arm = cookArmPose(shoulder.x, shoulder.y, hand.x, hand.y, -1);
    if(lean > .92){
      const x = 2 * center - torsoPoint(-5, -32).x;
      R(x - 5, top - 4, 11, 2, 'rgba(48,27,43,.43)');
    }
    drawBehindTables(center, feet, () => {
      g.save();
      g.translate(center, pivotY);
      g.scale(-1, 1);
      g.drawImage(sprite, 0, REST_HIPS, width, legs, -width / 2, 0, width, legs);
      // The far arm and the held mug are occluded by the apron and face in every pose.
      g.save();
      g.translate(-center, -pivotY);
      drawCookArm(shoulder.x, shoulder.y, arm);
      drawCookHand(arm.handX, arm.handY);
      if(!loose) drawBeerGlass(arm.handX, arm.handY, tilt, level);
      g.restore();
      g.rotate(angle);
      g.drawImage(sprite, 0, 0, width, REST_HIPS, -width / 2, -REST_HIPS + drop, width, REST_HIPS);
      g.restore();
    }, 56, dozing ? top - 2 : top);

    if(loose){
      g.save();
      g.translate(2 * center, 0);
      g.scale(-1, 1);
      drawBeerGlass(grip.x, grip.y, 0, 0);
      g.restore();
    }
    if(dozing && r.t >= DOZE_IN_S){
      const crown = torsoPoint(1, -52);
      drawSnore(2 * center - crown.x, crown.y - 9, r.t - DOZE_IN_S);
    }
  }

  // The handle sits on the far side of the glass and is the pivot for the drink.
  function drawBeerGlass(x, y, tilt, level){
    g.save();
    g.translate(Math.round(x), Math.round(y));
    g.rotate(tilt);
    g.translate(-BEER_HANDLE.x, -BEER_HANDLE.y);
    R(5, -9, 5, 2, '#8caaa9');
    R(9, -8, 2, 7, '#8caaa9');
    R(5, -2, 5, 2, '#6c8d98');
    R(6, -9, 3, 1, '#cbe1de');
    R(10, -7, 1, 4, '#dcece2');
    R(-5, -11, 11, 13, 'rgba(163,206,216,.26)');
    R(-4, -12, 9, 1, '#e3eee8');
    R(-5, -11, 1, 2, '#a2c3c6');
    R(5, -11, 1, 2, '#a2c3c6');
    R(-3, -10, 7, 1, 'rgba(212,237,236,.44)');
    R(-4, 1, 9, 4, 'rgba(195,223,223,.55)');
    const fill = Math.round(level * 11);
    if(fill > 0){
      R(-4, 2 - fill, 9, fill, '#b86c22');
      R(-3, 2 - fill, 6, fill, '#e9a742');
      R(-4, 1 - fill, 9, Math.min(2, fill), '#f6e1b3');
    }
    // The pressed glass has two rows of small facets and a reinforced base.
    for(const x of [-3, 0, 3]){
      for(const y of [-7, -3]){
        R(x, y, 2, 3, 'rgba(67,88,103,.29)');
        R(x, y, 1, 2, 'rgba(229,247,243,.47)');
      }
    }
    R(-5, -9, 1, 11, 'rgba(220,242,242,.8)');
    R(5, -10, 1, 12, 'rgba(172,200,213,.68)');
    R(-4, 2, 9, 1, 'rgba(90,119,136,.55)');
    R(-3, 3, 7, 1, '#d6e0d9');
    g.restore();
  }

  const seatedCookFrames = new Map();
  function seatedCookFrame(id, sit, blink){
    const base = cookSprite(id, 'downFree', false, blink), key = [id, sit, blink, cookScars(id)].join('/');
    if(seatedCookFrames.has(key)) return seatedCookFrames.get(key);
    const frame = document.createElement('canvas');
    frame.width = base.width; frame.height = base.height;
    const ctx = frame.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const hips = REST_HIPS, forward = 4 * sit;
    ctx.drawImage(base, 0, hips, frame.width, frame.height - hips, -forward, hips, frame.width, frame.height - hips);
    if(sit){
      ctx.fillStyle = '#070406';
      ctx.fillRect(30 - forward, hips, 20 + forward, 6);
      ctx.fillStyle = '#27181d';
      ctx.fillRect(31 - forward, hips, 18 + forward, 4);
    }
    ctx.drawImage(base, 0, 0, frame.width, hips, 0, 0, frame.width, hips);
    seatedCookFrames.set(key, frame);
    return frame;
  }

  // Each Z starts above the crown before it drifts upward and fades.
  function drawSnore(x, y, t){
    g.save();
    for(let i = 0; i < 3; i++){
      const age = t - i * .65;
      if(age < 0) continue;
      const rise = (age % 1.95) / 1.95;
      g.globalAlpha = .84 * Math.min(1, rise * 8) * (1 - rise);
      const zx = x + 4 * rise + Math.sin(age * 4) * rise, zy = y - 22 * rise;
      text('Z', zx + 1, zy + 1, '#313043', 'center');
      text('Z', zx, zy, '#f4f6fb', 'center');
    }
    g.restore();
  }

  const cookLayer = layerContext();
  function drawCookBehindWires(c, paint){
    const feet = barTop(c.pos) + COOK_FEET;
    const foreground = S.rows.map((row, part) => {
      const dy = Math.round(moveDy(part));
      // The post bases mark the point on the floor where the cook passes in front.
      return feet >= wireY(row) + dy - 4 && feet < wirePostFoot(row) + dy ? orderWireLayers[part].c : null;
    }).filter(Boolean);
    const mix = mixOf(STAGE.topic);
    if(c.rest || mix === 1 || !foreground.length) return paint();

    const target = g, ctx = cookLayer.ctx;
    ctx.clearRect(0, 0, W, H);
    g = ctx;
    ctx.save();
    try {
      paint();
      ctx.globalCompositeOperation = 'destination-out';
      morphDraw(mix, () => foreground.forEach(wire => g.drawImage(wire, 0, 0)), () => {});
    } finally {
      ctx.restore();
      g = target;
    }
    target.drawImage(cookLayer.c, 0, 0);
  }

  function drawCooks(occludeByWires){
    stoveRows().forEach(row => {
      const cooking = S.cooks.some(c => c.job && (c.job.cookRow ?? rowOf(S, c.job.part)) === row && c.job.phase === 'cook');
      drawFlames(stoveX(row), stoveTop(row), cooking);
    });
    const paint = c => {
      const top = barTop(c.pos);
      if(c.arriving){
        drawArrivingCook(c, top);
        return;
      }
      if(c.rest){
        drawRestingCook(c);
        return;
      }
      const special = buildingPose(c);
      if(special){
        c.phase = (c.phase || 0) + frameTick;
        const walk = c.walking && Math.floor(c.phase * 10) % 2 === 1;
        drawSprite(cookSprite(c.id, special.pose, walk, isBlinking(c.id + 7)), c.x, top + COOK_FEET, special.flip, special.tug || 0);
        return;
      }
      if(c.faint && c.faint.phase !== 'waiting'){
        drawFaintingCook(c, top);
        return;
      }
      const job = c.job;
      c.phase = (c.phase || 0) + frameTick;
      const walk = c.walking && Math.floor(c.phase * 10) % 2 === 1;
      const side = c.faceLeft ? -1 : 1;
      if(!c.active) g.globalAlpha = 0.55;
      // Near the counter the plate in hand comes to the height of its top, like the waiter's tray.
      const bodyX = c.x;
      const counterTrip = job && ['toCounter', 'drop'].includes(job.phase);
      const nearCounter = counterTrip ? clamp01(1 - Math.abs(c.pos - PLATES_ROW)) : 0;
      // Up to the counter's height and back down gently, even when the phase changes on the spot.
      const lift = (COOK_FEET - COUNTER_HEIGHT) * nearCounter;
      c.lift = c.lift === undefined || (!c.leavingCounter && Math.abs(c.pos - Math.round(c.pos)) > 0.01) ? lift
        : c.lift + Math.sign(lift - c.lift) * Math.min(Math.abs(lift - c.lift), COUNTER_LIFT_SPEED * frameTick);
      // Tying the padlock, it goes up on tiptoe to reach the bottom of the paper.
      const tiptoe = job && job.phase === 'hang' ? Math.round(3 * Math.sin(Math.PI * clamp01(job.timer / HANG_S))) : 0;
      const pushing = job && job.phase === 'commit' && !c.crutches;
      const feet = top + COOK_FEET - c.lift - tiptoe - (pushing ? commitJump(job.timer) : 0);
      const reading = job && (job.phase === 'read' || job.phase === 'hang' || job.phase === 'take' || job.phase === 'commit');
      const platedBin = job && job.phase === 'bin' && job.pocketed && !job.binned;
      const carrying = job && (['toStove', 'cook', 'plate', 'toCounter', 'drop'].includes(job.phase) || platedBin);
      const beer = c.beer === null ? null : c.beer / BEER_SIP_S;
      const pose = reading ? (pushing && commitArmUp(job.timer) ? 'backFree' : 'back') : carrying ? 'reach' : beer !== null ? 'downFree' : 'down';
      const standing = !job && !c.walking && beer === null;
      const heel = job && job.phase === 'bin' && heelUp(job.timer / BIN_S);
      const body = cookSprite(c.id, heel && !platedBin ? 'downFree' : pose, walk, isBlinking(c.id + 7), heel);
      // On crutches it commits facing the chicken, towards where it will carry it.
      const crutchPush = job && job.phase === 'commit' && c.crutches ? job : null;
      const faceRight = crutchPush || (!reading && beer === null && !c.faceLeft);
      if(c.crutches) drawOnCrutches(c, bodyX, feet, !!faceRight, c.walking, walk, isBlinking(c.id + 7), crutchPush);
      else drawSprite(body, bodyX, feet, standing && isGlancing(c.id + 7) ? !faceRight : faceRight, standing ? breathLift(c.id + 7) : 0);
      if(c.charred) drawSootWisps(bodyX + (faceRight ? 1 : -1), feet - 62, c.id);
      if(beer !== null && !c.crutches) drawBeerPose(c, feet, beer, body, faceRight);
      if(pushing) drawCommitPush(c, job, bodyX, feet);
      g.globalAlpha = 1;
      // On the cook's own body, so it never covers the orders while walking past them.
      if(!job) return;
      const row = job.cookRow ?? rowOf(S, job.part), oven = barEnd(row) + 42, st = stoveTop(row);
      // Read, the order goes in the cook's head: nothing is carried to the stove.
      // The padlock it ties goes up in front of it, so behind its body: see drawHangingPadlocks.
      if(job.phase === 'bin'){
        drawBinToss(c, feet, job);
        if(platedBin) drawPlate(c.x + side * 24, feet - 45, job.order);
      } else if(job.phase === 'cook'){
        drawDish(job.order.items[0], oven - 6, st - 16, 15);
        R(oven - 17, st - 12, 22, 3, PAL.black);
        R(oven - 15, st - 34, 30, 5, PAL.black);
        R(oven - 14, st - 33, 28 * Math.min(1, job.timer / job.dur), 3, '#6dff6d');
      } else if(job.phase === 'plate'){
        drawPlate(oven - 6, st - 10, job.order);
      } else if(job.phase === 'toCounter'){
        drawPlate(c.x + side * 24, feet - 45, job.order);
      } else if(job.phase === 'drop'){
        const k = job.timer / PLATE_DROP_S;
        drawPlate(lerp(c.x - 24, COUNTER_END - 8, k), feet - lerp(45, 39, k), job.order);
      }
    };
    S.cooks.forEach(c => {
      if(occludeByWires) drawCookBehindWires(c, () => paint(c));
      else paint(c);
    });
    drawCarriedPost();

  }



  function drawFlights(part){
    S.tickets.forEach(ticket => {
      if(ticket.part !== part) return;
      drawTicketBar(flightX(ticket), ticketTop(rowOf(S, part)), ticket.order);
    });
  }

  const flightX = (ticket, progress = ticket.t) => lerp(ticket.x0, barEnd() - 34, progress);

  // ---- Kafka view: each kind of actor turns into the box it stands for ----

  // Draws one picture, the other, or a soft cross-fade between them, k being how far it has gone:
  // the tavern side fades out on the pixel canvas while its Kafka piece fades in on the clean one.
  // Morphs nest: a ticket carried by a cook fades on its own inside the cook's fade.
  function morphDraw(k, drawFrom, drawTo){
    if(k < 1){
      g.save();
      g.globalAlpha *= 1 - Math.max(0, k);
      try { drawFrom(); } finally { g.restore(); }
    }
    if(k > 0){
      const target = g, alpha = target.globalAlpha * Math.min(1, k);
      g = hg;
      g.save();
      g.globalAlpha = alpha;
      try { drawTo(); } finally { g.restore(); g = target; }
    }
  }

  const mixOf = stage => kafkaMix[stage];

  // Tickets and plates also travel inside other actors, so each one changes look with its own stage.
  function drawTicket(cx, top, order, opts = {}){
    morphDraw(mixOf(STAGE.topic), () => drawTicketBar(cx, top, order, opts), () => drawRecord(cx, top, order, opts));
  }

  function drawPlate(cx, cy, order, dim, left = 1){
    morphDraw(mixOf(STAGE.outside), () => drawPlateBar(cx, cy, order, dim, left), () => drawResult(cx, cy, order, dim, left));
  }

  function kafkaBox(x, y, w, h, border, fill = KAFKA.fill){
    if(clean()){
      cleanRound(x, y, w, h, 5);
      g.fillStyle = C(fill);
      g.fill();
      g.strokeStyle = C(border);
      g.lineWidth = 1.2;
      g.stroke();
      return;
    }
    R(x - 1, y - 1, w + 2, h + 2, PAL.black);
    R(x, y, w, h, border);
    R(x + 2, y + 2, w - 4, h - 4, fill);
  }

  function diagramPanel({x, y, w, h}, title, color){
    if(clean()){
      // A white card with its outline and title in the role's colour, as in the slides.
      kafkaBox(x, y, w, h, color, KAFKA.log);
      R(x + 6, y + 12, w - 12, 1, CLEAN.hairline);
      text(title, x + w / 2, y + 3, color, 'center');
      return;
    }
    kafkaBox(x, y, w, h, color, KAFKA.log);
    R(x + 2, y + 2, w - 4, 9, color);
    text(title, x + w / 2, y + 3, PAL.black, 'center');
  }

  // A name tab sitting on top of a box.
  function kafkaTab(x, y, label, color){
    if(clean()){
      // A pill, like the slides' messages: the colour behind, white letters.
      g.save();
      g.font = `600 ${CLEAN_TEXT_PX}px system-ui, -apple-system, "Segoe UI", sans-serif`;
      const pill = g.measureText(label).width + 9;
      cleanRound(x, y, pill, 10, 5);
      g.fillStyle = C(color);
      g.fill();
      g.restore();
      text(label, x + pill / 2, y + 1.5, PAL.black, 'center');
      return;
    }
    const w = label.length * 6 + 5;
    R(x - 1, y - 1, w + 2, 11, PAL.black);
    R(x, y, w, 10, color);
    text(label, x + 3, y + 2, PAL.black);
  }

  // In Kafka a message carries no dish, only data: three lines whose lengths tell one message from another.
  const PAYLOAD_INK = '#7a80a0';
  function drawPayload(x, y, order, longest, thick, pitch){
    for(let i = 0; i < 3; i++) R(x, y + i * pitch, longest - (order.id * (i + 2) + i * 3) % Math.ceil(longest / 2), thick, PAYLOAD_INK);
  }

  // A record: the key is the color of its header, the value is plain data, and the offset is only
  // written once the broker has appended it to the partition.
  function drawRecord(cx, top, order, opts = {}){
    const x = Math.round(cx - 10), y = Math.round(top);
    if(clean()){
      const marked = opts.outline || opts.fresh;
      g.save();
      cleanRound(x, y, 20, 22, 3);
      g.fillStyle = CLEAN.card;
      g.fill();
      g.clip();
      g.fillStyle = order.key === null ? NO_KEY_COLOR : COLORS.customers[order.letter];
      g.fillRect(x, y, 20, 9);
      g.restore();
      cleanRound(x, y, 20, 22, 3);
      g.strokeStyle = opts.outline ? C(opts.outline) : marked ? CLEAN.ink : '#cfc8bf';
      g.lineWidth = marked ? 1.4 : 0.8;
      g.stroke();
      if(opts.offset !== undefined) text(String(opts.offset), x + 10, y + 1, PAL.black, 'center');
      if(order.materialOp) text(order.materialOp[0], x + 10, y + 12, CLEAN.ink, 'center');
      else drawPayload(x + 3, y + 12, order, 14, 2, 3);
      return;
    }
    R(x - 1, y - 1, 22, 24, PAL.black);
    R(x, y, 20, 22, PAL.white);
    // A record sent without a key has no key colour.
    R(x, y, 20, 9, order.key === null ? NO_KEY_COLOR : COLORS.customers[order.letter]);
    if(opts.offset !== undefined) text(String(opts.offset), x + 10, y + 1, PAL.black, 'center');
    if(order.materialOp) text(order.materialOp[0], x + 10, y + 12, PAL.black, 'center');
    else drawPayload(x + 3, y + 12, order, 14, 2, 3);
    if(opts.fresh || opts.outline){
      const color = opts.outline || PAL.white;
      R(x - 1, y - 1, 22, 1, color); R(x - 1, y + 22, 22, 1, color);
      R(x - 1, y - 1, 1, 24, color); R(x + 20, y - 1, 1, 24, color);
    }
  }

  // A message too small to carry its offset: waiting in the producer, in flight or in a consumer's hands.
  function drawMiniRecord(x, y, order, alpha = 1){
    const before = g.globalAlpha;
    g.globalAlpha = before * alpha;
    if(clean()){
      g.save();
      cleanRound(x, y, 10, 13, 2);
      g.fillStyle = CLEAN.card;
      g.fill();
      g.clip();
      g.fillStyle = COLORS.customers[order.letter];
      g.fillRect(x, y, 10, 3.5);
      g.restore();
      cleanRound(x, y, 10, 13, 2);
      g.strokeStyle = '#bdb5aa';
      g.lineWidth = 0.8;
      g.stroke();
      if(order.materialOp) text(order.materialOp[0], x + 5, y + 4.5, CLEAN.ink, 'center');
      else drawPayload(x + 1.5, y + 5.5, order, 7, 1, 3);
      g.globalAlpha = before;
      return;
    }
    R(x - 1, y - 1, 12, 15, PAL.black);
    R(x, y, 10, 13, PAL.white);
    R(x, y, 10, 3, COLORS.customers[order.letter]);
    if(order.materialOp) text(order.materialOp[0], x + 5, y + 5, PAL.black, 'center');
    else drawPayload(x + 1, y + 5, order, 8, 1, 3);
    g.globalAlpha = before;
  }

  // What a consumer made of a message: no longer Kafka, just a done result in the color of its key.
  const CHECK_MARK = [[7, 1], [6, 2], [7, 2], [0, 3], [5, 3], [6, 3], [0, 4], [1, 4], [4, 4], [5, 4], [1, 5], [2, 5], [3, 5], [4, 5], [2, 6], [3, 6]];
  function drawResult(cx, cy, order, dim, left = 1){
    const x = Math.round(cx), y = Math.round(cy), before = g.globalAlpha;
    g.globalAlpha = before * (dim ? 0.55 : 1);
    if(clean()){
      cleanRound(x - 11, y - 4, 22, 14, 4);
      g.fillStyle = COLORS.customers[order.letter];
      g.fill();
      // A white tick; being used up, only its lower part is left, as on a half-eaten plate.
      g.save();
      g.beginPath();
      g.rect(x - 7, y - 3 + 10 * (1 - clamp01(left)), 14, 12);
      g.clip();
      g.beginPath();
      g.moveTo(x - 4, y + 3); g.lineTo(x - 1, y + 6); g.lineTo(x + 4.5, y - 0.5);
      g.strokeStyle = '#ffffff';
      g.lineWidth = 1.8;
      g.lineCap = 'round';
      g.lineJoin = 'round';
      g.stroke();
      g.restore();
      g.globalAlpha = before;
      return;
    }
    R(x - 12, y - 5, 24, 16, PAL.black);
    R(x - 11, y - 4, 22, 14, COLORS.customers[order.letter]);
    R(x - 5, y - 2, 10, 10, PAL.white);
    // Being used up: only the bottom rows of the mark remain, as on a half-eaten plate.
    const rows = Math.max(1, Math.ceil(8 * left));
    CHECK_MARK.forEach(([col, row]) => { if(row >= 8 - rows) R(x - 4 + col, y - 1 + row, 1, 1, CHECK_INK); });
    g.globalAlpha = before;
  }


  // ---- Layout of the Kafka view: a diagram where the processes stay put and only messages move ----

  // One producer on the left with its partitioner inside, the topic in the middle, and on the right,
  // between the two partitions, the group holding both consumers.
  const PRODUCER_BOX = {x:22, y:132, w:152, h:148};
  const PARTITIONER_BOX = {x:26, y:204, w:144, h:70};
  // Both sides share a baseline, with the group clear of the lower partition.
  const GROUP_BOX = {x:600, y:132, w:114, h:148};
  const MATERIAL_BOX = {x:210, y:132, w:374, h:104};
  const REFERENCE_BOX = {x:210, y:242, w:374, h:38};
  const MATERIAL_GROUP_COLORS = [COLORS.cook, '#d6a9e8'];
  const materialGroupBox = id => ({x:600, y:132 + 77 * id, w:114, h:71});
  const CONSUMER_W = 76, CONSUMER_H = 42;
  // A diner's messages are in the producer from the moment it orders until the partitioner takes them.
  const UNSENT = ['enter', 'sit', 'waitingWaiter', 'asking'];
  // Each partition has its batch in the partitioner, and a line out of the producer into the partition.
  const batchLaneY = part => PARTITIONER_BOX.y + 16 + part * 20;
  const BATCH_X = PARTITIONER_BOX.x + 48, ROUTE_X = 180;
  // Inside each partition, over its records, the lane new messages run along to the end of the log.
  const recordTop = row => row === 0 ? 64 : ticketTop(row);
  const logLaneY = part => {
    const row = rowOf(S, part);
    return lerp(ticketTop(row), recordTop(row), mixOf(STAGE.topic)) - 15;
  };
  const consumerSpot = id => {
    const box = S.materialDemo ? materialGroupBox(id) : GROUP_BOX;
    return {x:box.x + (box.w - CONSUMER_W) / 2, y:S.materialDemo || id === 0 ? box.y + 21 : box.y + box.h - 6 - CONSUMER_H};
  };
  const smooth = k => { const t = clamp01(k); return t * t * (3 - 2 * t); };

  // A point along a path of straight segments, t being the fraction of its length already covered.
  function alongPath(points, t){
    const lengths = points.slice(1).map((p, i) => Math.hypot(p.x - points[i].x, p.y - points[i].y));
    let left = clamp01(t) * lengths.reduce((sum, len) => sum + len, 0), i = 0;
    while(i < lengths.length - 1 && left > lengths[i]){ left -= lengths[i]; i++; }
    const k = lengths[i] ? Math.min(1, left / lengths[i]) : 1;
    return {x:lerp(points[i].x, points[i + 1].x, k), y:lerp(points[i].y, points[i + 1].y, k)};
  }

  // Out of the partitioner's batch, along the arrow into the partition and on to the end of the log.
  // While the waiter is still a waiter, the order starts where it hangs it: at the start of the partition.
  function flightPath(ticket){
    const part = ticket.part, end = barEnd() - 34, lane = logLaneY(part) + 6, out = batchLaneY(part) + 6;
    const start = mixOf(STAGE.partitioner) < 0.5 ? [{x:ticket.x0, y:lane}]
      : [{x:BATCH_X + 5, y:out}, {x:ROUTE_X, y:out}, {x:ROUTE_X, y:lane}];
    return [...start, {x:end, y:lane}, {x:end, y:recordTop(rowOf(S, part)) + 6}];
  }

  // A single producer sends every order: what the diners ask for waits in send(), in the order it
  // came, until the partitioner takes it.
  function drawProducerBox(){
    const {x, y, w, h} = PRODUCER_BOX;
    diagramPanel(PRODUCER_BOX, 'PRODUCER', PAL.white);
    text('SEND()', x + 6, y + 16, PAL.white);
    if(S.materialDemo){
      const {flight, phase} = S.materialDemo;
      if(S.materialDemo.split) text('KEY: NULL', x + 6, y + 30, '#ff9187');
      else text(`KEY: ${MATERIAL_KEY}`, x + 6, y + 30, KAFKA.label);
      if(flight && phase === 'send') text(flight.order.materialOp, x + 6, y + 46, PAL.cyan);
      return;
    }
    S.customers.filter(c => UNSENT.includes(c.state)).flatMap(c => c.messages)
      .forEach((m, i) => drawMiniRecord(x + 6 + (i % 12) * 12, y + 28 + Math.floor(i / 12) * 15, m));
  }

  // The waiter with the notepad is the producer's partitioner. The key picks the partition, always the
  // same one for each color, and the messages of the diner being served wait in the batch of that
  // partition until they leave along its arrow, one by one.
  function drawPartitionerBox(){
    const {x, y, w, h} = PARTITIONER_BOX;
    kafkaBox(x, y, w, h, KAFKA.label);
    R(x + 2, y + 2, w - 4, 9, KAFKA.label);
    text('PARTITIONER', x + w / 2, y + 3, PAL.black, 'center');
    const batching = S.barWaiters.filter(waiter => waiter.state === 'toBar' || waiter.state === 'order');
    for(let part = 0; part < S.comandas.length; part++){
      const row = rowOf(S, part), top = batchLaneY(part), cy = top + 6, lane = logLaneY(part) + 6, tip = barStart(row) - 4;
      // Up to three keys a line: with one partition they all share it.
      // Without a key there is no colour to route by.
      [...LETTERS].filter(letter => !S.materialDemo?.split && (!S.materialDemo || letter === LETTERS[0]) && partitionFor(S, letter) === part).forEach((letter, i, all) => {
        const sx = x + 5 + (i % 3) * 7, sy = all.length > 3 ? cy - 6 + Math.floor(i / 3) * 6 : cy - 3;
        R(sx, sy, 7, 7, PAL.black);
        R(sx + 1, sy + 1, 5, 5, COLORS.customers[letter]);
      });
      text(`>P${part}`, x + 28, cy - 3, PAL.white);
      R(BATCH_X + 48, cy, ROUTE_X - BATCH_X - 48, 1, PAL.white);
      R(ROUTE_X, Math.min(cy, lane), 1, Math.abs(lane - cy) + 1, PAL.white);
      R(ROUTE_X, lane, tip - ROUTE_X, 1, PAL.white);
      R(tip - 2, lane - 2, 1, 5, PAL.white);
      R(tip - 1, lane - 1, 1, 3, PAL.white);
      R(tip, lane, 1, 1, PAL.white);
      batching.filter(waiter => waiter.row === row).flatMap(waiter => waiter.toSend)
        .forEach((m, i) => drawMiniRecord(BATCH_X + i * 12, top, m));
    }
    text(S.materialDemo?.split ? 'NO KEY: ANYWHERE' : `HASH(KEY) % ${S.comandas.length}`, x + w / 2, y + h - 13, KAFKA.label, 'center');
  }

  // The two wires are the partitions of one topic. Its outline wraps both of them and their spine
  // on the left, and leaves out the middle of the room, which is not the topic.
  function drawTopicFrame(bands, title, border, right = barEnd() + 8){
    const left = barStart() - 12, spine = left + 6;
    const top0 = bands[0][0], bottom1 = bands[bands.length - 1][1];
    const shape = (inset, color) => {
      bands.forEach(([top, bottom]) => R(left + inset, top + inset, right - left - inset * 2, bottom - top - inset * 2, color));
      if(bands.length > 1) R(left + inset, top0 + inset, spine - left - inset * 2, bottom1 - top0 - inset * 2, color);
    };
    if(clean()){
      // The same union of bands and spine, rounded, as a thin outline round a light wash.
      const round = (inset, color) => {
        g.fillStyle = C(color);
        bands.forEach(([top, bottom]) => { cleanRound(left + inset, top + inset, right - left - inset * 2, bottom - top - inset * 2, 7 - inset); g.fill(); });
        if(bands.length > 1) g.fillRect(left + inset, top0 + 7, spine - left - inset * 2, bottom1 - top0 - 14);
      };
      round(-0.6, border);
      round(0.6, KAFKA.fill);
      kafkaTab(left, top0 - 11, title, border);
      return;
    }
    shape(-1, PAL.black);
    shape(0, border);
    shape(2, KAFKA.fill);
    kafkaTab(left, top0 - 11, title, border);
  }

  function drawTopicBoxes(){
    const bands = S.rows.map((row, part) => {
      const dy = Math.round(moveDy(part, recordTop));
      return [recordTop(row) - 24 + dy, recordTop(row) + 38 + dy];
    }).sort((a, b) => a[0] - b[0]);
    drawTopicFrame(bands, S.materialDemo ? 'TOPIC: MATERIALS' : 'TOPIC: ORDERS', KAFKA.topic);
    for(let part = 0; part < S.comandas.length; part++){
      const row = rowOf(S, part), p = S.comandas[part], end = view.ends[part];
      const x0 = barStart(row) - 2, x1 = barEnd(row) + 4, y0 = recordTop(row) - 20, y1 = recordTop(row) + 34;
      g.save();
      g.translate(0, Math.round(moveDy(part, recordTop)));
      kafkaBox(x0, y0, x1 - x0, y1 - y0, KAFKA.partition, KAFKA.log);
      text(`PARTITION ${part}`, x0 + 4, y1 - 10, KAFKA.label);
      const owner = p.owner == null ? PAL.grey : COLORS.cook;
      // The group's committed offset is separate from the records in the log.
      const kept = S.features.retain;
      p.log.forEach(entry => {
        if(entry.taken) return;
        const x = orderX(part, entry);
        if(x < barStart(row) + 10) return;
        const committed = S.features.commit && entry.offset < p.committed;
        const inProgress = !S.materialDemo && (kept ? !committed && entry.offset < p.position : locked(entry));
        drawRecord(x, recordTop(row), entry.order, {offset:kept ? entry.offset : undefined, fresh:S.time - entry.at < 0.3, outline:inProgress ? owner : null});
      });
      if(S.materialDemo){
        [p.committed, S.materialDemo.reference.offsets[part]].forEach((offset, id) => {
          const x = Math.max(barStart(row) + 10, slotX(part, end, offset));
          const y = recordTop(row) - 17 + id * 8, color = MATERIAL_GROUP_COLORS[id];
          drawPointer(x, y, color);
          text(id === 0 ? 'V' : 'R', x + 6, y - 1, color);
        });
      } else if(S.features.commit){
        drawPointer(Math.max(barStart(row) + 10, slotX(part, end, Math.max(p.committed, p.earliest))), recordTop(row) - 15, owner);
      }
      const cash = S.cashCount?.[part];
      if(cash?.marked){
        const x = Math.max(barStart(row) + 10, slotX(part, end, cash.offset));
        drawPointer(x, recordTop(row) - 8, '#d9a260');
        text('CASH', x + 7, recordTop(row) - 9, '#d9a260');
      }
      g.restore();
    }
  }

  // The cooks are the group cocina, which flashes during a rebalance, while nobody reads.
  function drawGroupBox(){
    if(S.materialDemo){
      ['GROUP VIEW', 'GROUP REFERENCE'].forEach((title, id) => {
        diagramPanel(materialGroupBox(id), title, MATERIAL_GROUP_COLORS[id]);
      });
      return;
    }
    const {x, y, w, h} = GROUP_BOX;
    const color = S.rebalance && Math.floor(S.time * 4) % 2 ? PAL.white : COLORS.cook;
    diagramPanel({x,y,w,h}, 'CONSUMER GROUP', color);
    text(S.rebalance ? 'REBALANCE' : 'ID=KITCHEN', x + w / 2, y + h / 2 - 3, color, 'center');
  }

  // A cook is a consumer of the group, fixed in its place: the box says what it is doing in Kafka's own
  // words, which partitions are assigned to it and what it is working on.
  function drawConsumerBox(c){
    const job = c.job, {x, y} = consumerSpot(c.id), down = c.faint && c.faint.phase !== 'waiting';
    const demo = S.materialDemo;
    if(demo){
      diagramPanel({x, y, w:CONSUMER_W, h:CONSUMER_H}, `CONSUMER C${c.id + 1}`, MATERIAL_GROUP_COLORS[c.id]);
      const event = demo.reader === c.id && demo.flight;
      const action = event && {fetch:`FETCH ${event.offset}`, apply:event.order.materialOp, commit:`COMMIT ${event.offset + 1}`}[demo.phase];
      text(action || 'READY', x + 5, y + 15, PAL.cyan);
      const offsets = c.id === 0 ? S.comandas.map(p => p.committed) : demo.reference.offsets;
      text(offsets.map((offset, part) => `P${part}:${offset}`).join('  '), x + 5, y + 28, KAFKA.label);
      return;
    }
    const before = g.globalAlpha;
    if(!c.active && !down) g.globalAlpha = before * 0.55;
    const alarm = down && (c.faint.phase === 'fainted' || Math.floor(S.time * 4) % 2 === 0);
    const color = alarm ? PAL.red : COLORS.cook;
    diagramPanel({x, y, w:CONSUMER_W, h:CONSUMER_H}, `CONSUMER ${c.name}`, color);
    text(consumerAction(S, c), x + 5, y + 15, PAL.cyan);
    c.partitions.forEach((part, i) => {
      R(x + 5 + i * 17, y + 27, 15, 9, KAFKA.partition);
      text(`P${part}`, x + 7 + i * 17, y + 28, PAL.black);
    });
    if(job){
      if(job.phase === 'toStove' || job.phase === 'cook') drawMiniRecord(x + 58, y + 24, job.order);
      if(job.phase === 'cook') R(x + 3, y + CONSUMER_H - 4, Math.round((CONSUMER_W - 6) * Math.min(1, job.timer / job.dur)), 2, '#6dff6d');
      if(job.phase === 'plate' || job.phase === 'toCounter') drawPlate(x + 62, y + 24, job.order);
    }
    g.globalAlpha = before;
  }

  // Reading copies the record out to the consumer and leaves it in the log. The commit carries the
  // next offset back to the partition, and the group's pointer moves there once it lands.
  function drawConsumerTraffic(c){
    const job = c.job;
    if(!job || !c.active) return;
    const row = rowOf(S, job.part), {x, y} = consumerSpot(c.id);
    const slot = offset => Math.max(barStart(row) + 10, S.features.retain ? slotX(job.part, view.ends[job.part], offset) : entryX(S, job.part, offset));
    if(job.phase === 'read'){
      const k = smooth(job.timer / READ_S);
      drawMiniRecord(lerp(slot(job.offset) - 5, x + 58, k), lerp(recordTop(row) + 5, y + 24, k), job.order);
    } else if(job.phase === 'bin' && S.bin){
      // Completing a queue message deletes it.
      const k = smooth(job.timer / binDuration(job));
      drawMiniRecord(lerp(x + 58, S.bin.x - 5, k), lerp(y + 24, BIN_TOP - 8, k), job.order);
    } else if(job.phase === 'commit'){
      const k = smooth(job.timer / commitDuration(c)), pointerY = recordTop(row) - 15;
      drawPointer(lerp(x + CONSUMER_W / 2, slot(job.offset + 1), k), lerp(pointerY > y ? y + CONSUMER_H : y - 7, pointerY, k), KAFKA.ink);
    } else if(job.phase === 'drop'){
      const k = job.timer / PLATE_DROP_S;
      // While there is a counter the result lands on it; once it is gone, the result just leaves Kafka.
      if(mixOf(STAGE.outside) < 1){
        drawPlate(lerp(x + 62, COUNTER_END - 8, k), lerp(y + 24, barTop(PLATES_ROW) - 9, k), job.order);
      } else {
        const before = g.globalAlpha;
        g.globalAlpha = before * (1 - k);
        drawPlate(x + 62, y + 24 - k * 8, job.order);
        g.globalAlpha = before;
      }
    }
  }

  const MATERIAL_STATES = {
    EMPTY:{label:'NOT CREATED', color:KAFKA.label},
    CREATE:{label:'CREATED', color:KAFKA.ink},
    UPDATE:{label:'UPDATED', color:PAL.cyan},
    DELETE:{label:'DELETED', color:'#ff9187'}
  };
  const materialState = demo => MATERIAL_STATES[demo.last?.order.materialOp || 'EMPTY'];

  function drawMaterialProjection(){
    const demo = S.materialDemo, {flight, last, phase} = demo;
    const {x, y, w, h} = MATERIAL_BOX;
    const {label, color} = materialState(demo);
    kafkaBox(x, y, w, h, color, KAFKA.log);
    R(x + 2, y + 2, w - 4, 13, color);
    text('FULL VIEW', x + 9, y + 5, PAL.black);
    text(MATERIAL_KEY, x + w - 9, y + 5, PAL.black, 'right');
    text(label, x + 10, y + 22, color);
    if(demo.current){
      const fields = [['REFERENCE', 'referencia'], ['DENSITY', 'densidad'], ['FINISH', 'acabado']];
      fields.forEach(([name, field], i) => {
        const row = y + 36 + i * 14;
        const changed = last.order.materialOp === 'UPDATE' && field in last.order.patch;
        if(changed){
          R(x + 6, row - 3, w - 12, 12, '#10384b');
          R(x + 6, row - 3, 2, 12, color);
        }
        text(name, x + 13, row, KAFKA.label);
        const value = demo.current[field] + (field === 'densidad' ? ' G/CM3' : '');
        if(changed){
          const before = String(demo.previous[field]);
          text(before, x + 130, row, KAFKA.label);
          text('->', x + 136 + before.length * 6, row, color);
          text(value, x + 154 + before.length * 6, row, color);
        } else text(value, x + 130, row, PAL.white);
      });
    } else {
      // An empty outline before CREATE, a crossed-out record after DELETE.
      const left = x + 14, top = y + 35;
      g.save();
      g.strokeStyle = clean() ? C(color) : color;
      g.lineWidth = clean() ? 1.4 : 2;
      if(!last) g.setLineDash([3, 3]);
      g.strokeRect(left, top, 25, 31);
      if(last){
        g.beginPath();
        g.moveTo(left + 5, top + 7); g.lineTo(left + 20, top + 24);
        g.moveTo(left + 20, top + 7); g.lineTo(left + 5, top + 24);
        g.stroke();
      }
      g.restore();
      text(last ? 'THE EVENTS STAY IN THE LOG' : 'WAITING FOR CREATE TO BE APPLIED', x + 52, y + 47, PAL.white);
    }
    R(x + 10, y + 74, w - 20, 1, KAFKA.partition);
    const applied = last ? `APPLIED: ${last.order.materialOp} · OFFSET ${last.offset}` : `RECORDS IN THE TOPIC: ${S.comandas.reduce((sum, p) => sum + p.log.length, 0)}`;
    const waiting = demo.deferredCreate ? 'CREATE PUBLISHED TO P0 / NOT READ YET' : applied.replace(' · ', ' / ');
    text(waiting, x + 10, y + 79, PAL.white);
    const statusLine = flight && demo.reader === 0 && {
      send:'PRODUCER SENDS THE EVENT',
      fetch:`CONSUMER READS P${flight.part} / OFFSET ${flight.offset}`,
      apply:`CONSUMER APPLIES ${flight.order.materialOp}`,
      commit:`COMMIT OFFSET ${flight.offset + 1}`
    }[phase];
    if(demo.updateRejected) text(demo.current ? 'UPDATE LOST / DENSITY NOT FIXED'
      : 'UPDATE REJECTED / NO SUCH MATERIAL', x + 10, y + 91, '#ff827a');
    else if(statusLine) text(statusLine, x + 10, y + 91, PAL.cyan);

    // The reference view is coloured by its own state, like the full view: the line to it keeps the
    // colour of the group that builds it.
    const ref = REFERENCE_BOX, refColor = MATERIAL_GROUP_COLORS[1];
    const {value, last:read} = demo.reference;
    const refState = MATERIAL_STATES[value === null ? (read?.order.materialOp === 'DELETE' ? 'DELETE' : 'EMPTY') : read.order.materialOp];
    R(x + w, y + 42, materialGroupBox(0).x - x - w, 1, MATERIAL_GROUP_COLORS[0]);
    R(ref.x + ref.w, ref.y + 17, materialGroupBox(1).x - ref.x - ref.w, 1, refColor);
    kafkaBox(ref.x, ref.y, ref.w, ref.h, refState.color, KAFKA.log);
    R(ref.x + 2, ref.y + 2, ref.w - 4, 13, refState.color);
    text('REFERENCE VIEW', ref.x + 9, ref.y + 5, PAL.black);
    text(MATERIAL_KEY, ref.x + ref.w - 9, ref.y + 5, PAL.black, 'right');
    if(value === null) text(refState.label, ref.x + 10, ref.y + 22, refState.color);
    else text(`REFERENCE  ${value}`, ref.x + 10, ref.y + 22, PAL.white);
    if(read) text(`READ P${read.part} / OFFSET ${read.offset}`, ref.x + ref.w - 10, ref.y + 22, refColor, 'right');
  }

  function drawMaterialTraffic(){
    const {flight, phase, elapsed, reader} = S.materialDemo;
    if(!flight) return;
    const {part, order, offset} = flight;
    const k = smooth(elapsed / MATERIAL_PHASES[phase]);
    const row = rowOf(S, part), consumer = consumerSpot(reader);
    if(phase === 'send'){
      const start = {x:PRODUCER_BOX.x + 16, y:PRODUCER_BOX.y + 55};
      const at = alongPath([start, ...flightPath(flight)], k);
      drawMiniRecord(at.x - 5, at.y - 6, order);
    } else if(phase === 'fetch'){
      const x = slotX(part, view.ends[part], offset), y = recordTop(row) + 6;
      drawMiniRecord(lerp(x, consumer.x + 62, k) - 5, lerp(y, consumer.y + 25, k) - 6, order);
    } else if(phase === 'apply'){
      const box = reader === 0 ? MATERIAL_BOX : REFERENCE_BOX;
      const x = box.x + box.w - 14, y = box.y + box.h / 2;
      drawMiniRecord(lerp(consumer.x + 62, x, k) - 5, lerp(consumer.y + 25, y, k) - 6, order);
    } else if(phase === 'commit'){
      const x = slotX(part, view.ends[part], offset + 1), y = recordTop(row) - 17 + reader * 8;
      drawPointer(lerp(consumer.x + CONSUMER_W / 2, x, k), lerp(consumer.y, y, k), MATERIAL_GROUP_COLORS[reader]);
    }
  }

  // The broker's ack is a message too: it goes back along the arrow to the producer, which only then
  // counts the order as sent. While the waiter is still a waiter, it goes back to him.
  function drawAck(){
    const b = S.boss, k = (S.time - b.saidAt) / ACK_S;
    if(!b.lastAck || k < 0 || k >= 1) return;
    const part = b.lastAck.partition, row = rowOf(S, part), lane = logLaneY(part) + 6, out = batchLaneY(part) + 6, waiter = S.barWaiters[0];
    const points = mixOf(STAGE.partitioner) < 0.5 ? [{x:barStart(row) - 4, y:lane}, {x:waiter.x, y:waiter.y - 44}]
      : [{x:barStart(row) - 4, y:lane}, {x:ROUTE_X, y:lane}, {x:ROUTE_X, y:out}, {x:BATCH_X + 48, y:out}];
    const at = alongPath(points, k);
    kafkaTab(Math.round(at.x - 11), Math.round(at.y - 5), 'ACK', KAFKA.ink);
  }

  // ---- Kinds of actor, each in its current look ----
  // Back to front. The tutorial draws these again to light one of them up.

  function drawProducers(){
    morphDraw(mixOf(STAGE.producers), () => {
      drawStools();
      drawDiners();
      drawTables();
      drawTableFood();
    }, drawProducerBox);
  }

  // The padlocks tied under the orders hang in front of the counter, so they go after it.
  // A short rattle announces expiry; the open lock then drops away.
  function drawHangingPadlocks(){
    if(S.features.retain) return;
    morphDraw(mixOf(STAGE.topic), () => S.comandas.forEach((p, part) => {
      const row = rowOf(S, part), dy = Math.round(moveDy(part));
      p.log.forEach(entry => {
        if(entry.lockFrom === undefined || entry.taken) return;
        const x = orderX(part, entry), left = entry.lockUntil - S.time;
        if(x < barStart(row) + 10) return;
        const rattle = left < 1.5 ? Math.round(Math.sin(S.time * 32)) : 0;
        drawPadlock(x + rattle, ticketTop(row) + LOCK_HOOK_Y + dy);
      });
      S.lockDrops.filter(drop => drop.part === part).forEach(drop => {
        const k = clamp01((S.time - drop.at) / LOCK_DROP_S);
        g.save();
        g.globalAlpha *= 1 - k;
        drawPadlock(drop.x + Math.round(k * 5), ticketTop(row) + LOCK_HOOK_Y + dy + Math.round(32 * k * k), true);
        g.restore();
      });
      // One being tied: it comes up from the cook's hands, in front of the cook and so behind it
      // from here, peeks out over its head, and is tied to the bottom of the paper with a wiggle.
      S.cooks.forEach(c => {
        if(!c.job || c.job.phase !== 'hang' || c.job.part !== part) return;
        const k = clamp01(c.job.timer / HANG_S), rise = clamp01(k / 0.55), ease = rise * rise * (3 - 2 * rise);
        const tie = clamp01((k - 0.55) / 0.45), hangY = ticketTop(row) + LOCK_HOOK_Y + dy;
        const x = orderX(part, c.job.entry), handsY = barTop(c.pos) + COOK_FEET - 30;
        const wiggle = tie > 0 && tie < 1 ? (Math.floor(c.job.timer * 16) % 2 ? 1 : -1) : 0;
        drawPadlock(x + wiggle, lerp(handsY, hangY, ease));
      });
    }), () => {});
  }

  const orderWireLayers = Array.from({length:PARTITIONS}, () => layerContext());
  function drawTopic(){
    morphDraw(mixOf(STAGE.topic), () => {
      for(let part = 0; part < S.comandas.length; part++){
        const target = g, layer = orderWireLayers[part];
        g = layer.ctx;
        g.clearRect(0, 0, W, H);
        g.save();
        try {
          g.translate(0, Math.round(moveDy(part)));
          g.drawImage(wireLayers[rowOf(S, part)], 0, 0);
          drawOrdersWire(part);
        } finally {
          g.restore();
          g = target;
        }
        target.drawImage(layer.c, 0, 0);
      }
      drawWireBuild();
    }, drawTopicBoxes);
  }

  // Not Kafka: in the Kafka view the counter and the waiter with the tray are simply gone.
  // The bin the orders go into while they are thrown away after cooking: by the counter, or in the
  // arms of the head of the dining room taking it out.
  // On the floor in front of the end of the counter, at the feet of the cook of the middle row.
  const BIN_TOP = barTop(PLATES_ROW) + COOK_FEET - 20;
  function drawBin(){
    const bin = S.bin;
    if(!bin) return;
    if(bin.kicked !== undefined){
      // Kicked: off to the right and a little up, tumbling, out of the restaurant.
      const k = clamp01(bin.kicked / BIN_FLY_S);
      g.save();
      g.translate(Math.round(bin.x + 90 * k), Math.round(BIN_TOP + 10 - 26 * k - 4 * 10 * k * (1 - k)));
      g.rotate(k * Math.PI * 2.5);
      g.drawImage(furniture.barrel, -12, -13, 24, 26);
      g.restore();
      return;
    }
    const x = Math.round(bin.x), top = BIN_TOP;
    contactShadow(x, top + 21, 21);
    g.drawImage(furniture.barrel, x - 12, top - 4, 24, 26);
    // Scraps of orders sticking out, more the fuller it gets.
    const colors = Object.values(COLORS.customers);
    for(let i = 0; i < Math.min(4, bin.thrown || 0); i++) R(x - 6 + i * 3, top - 4 - (i % 2) * 2, 4, 4, colors[i % colors.length]);
  }

  function drawCounterRow(){
    morphDraw(mixOf(STAGE.outside), () => {
      drawServiceCounter();
      drawCounter();
    }, () => {});
  }

  function drawKitchen(occludeByWires = true){

      drawMonkeyAtDepth(true);
      drawPeel(false);

        drawStove(stoveX(row) + dx, stoveTop(row) - (rattle && Math.floor(S.time * 30) % 3 === 0 ? 1 : 0));
        if(S.blast?.row === row) drawStoveSoot(row);

      });
      drawCooks(occludeByWires);
      drawBlast();

  // Mask the far-side waiter with the actual table and plates, including during the tutorial.
  const waiterLayer = layerContext();
  function drawTableWaiter(w, feetOffset, paint){
    const feet = w.y + feetOffset;
    const behind = w.x < TABLE_AISLE_X && (feet === serviceFeet(1) || feet === serviceFeet(2));

    drawBehindTables(w.x, feet, () => paint(w));

  // Someone standing or sitting behind a table: what the table and its plates cover is cut away.
  function drawBehindTables(x, feet, paint, margin = 46, hideBelow = 0){
    if(mixOf(STAGE.producers) === 1) return paint();
    const target = g, left = Math.floor(x) - margin, top = Math.floor(feet) - 80, width = margin * 2;
    g = waiterLayer.ctx;
    try {
      g.imageSmoothingEnabled = false;
      g.clearRect(left, top, width, 86);
      paint();
      g.save();
      try {
        // A body above the tabletop occludes its far edge, but stays behind the apron and legs.
        g.beginPath();
        g.rect(left, hideBelow, width, H - hideBelow);
        g.clip();
        g.globalCompositeOperation = 'destination-out';
        morphDraw(mixOf(STAGE.producers), () => { drawTables(); drawTableFood(); }, () => {});
      } finally {
        g.restore();
      }
    } finally {
      g = target;
    }
    g.drawImage(waiterLayer.c, left, top, width, 86, left, top, width, 86);
  }

  // Both paths meet at the top of the slip, where the cat closes its jaws.

      return {x:at.x, y:at.y - 5};

  // The tavern cat, a ginger tabby painted on a 2px grid like the harbour art behind it. It is
  // about a third of a person's height, and dozes on the top of the chalkboard, right of the
  // nameplate and under the hanging net, with its tail down the side of the board. Every pose
  // faces left and is placed by its mouth, so what it carries hangs from the same point.
  const CAT_COLORS = {'#':'#352b37', o:'#d27a36', l:'#eea456', d:'#9a4a2a', w:'#f2dfbd', e:'#c8e65a', p:'#e3867c'};
  const CAT_LOAF = {mouth:{x:3, y:5}, pixels:[

    '#p#.#p#####..',
    '#ooooo#oooo#.',

    '#owpwooooooo#',
    '.#www#odoodo#',
    '#ww#woooooo#.',
    '.##.#######..'
  ]};
  const CAT_CROUCH = {mouth:{x:3, y:6}, pixels:[
    '........####..',
    '.#...#.#oooo#.',
    '#p#.#p#doodoo#',
    '#oooooooooooo#',
    '#lelel#oooooo#',
    '#owpwooooooo#.',
    '.#www##w##oo#.',
    '.###.###.###..'
  ]};
  const CAT_LEAP = {mouth:{x:1, y:5}, pixels:[
    '..#.#.................',
    '.#p#p#................',
    '#ooooo#####...........',
    '#leloooddoodd##.....##',
    '#pwooooooooooood##.#o#',
    '.#wwooooooooooooooo#o#',
    '..#wwoooooooooooooo##.',
    '.#ww#####wwo####oo#...',
    '#ww#.....###....#oo#..',
    '.##..............#ww#.',
    '..................##..'
  ]};
  // The tail hangs down the side of the board and swings now and then, left or right.
  const CAT_TAILS = [
    {x:12, pixels:['#o#', '#o#', '#d#', '#o#', '#d#', '.#']},
    {x:12, pixels:['#o#', '#o#', '#d#', '.#o#', '.#d#', '..#']},
    {x:11, pixels:['.#o#', '.#o#', '.#d#', '#o#', '#d#', '.#']}
  ];
  const CAT_BOARD = {left:492, top:49};
  // Where its mouth is while it dozes, and where it is when it lands crouched, facing back.
  const CAT_HOME = {x:CAT_BOARD.left + CAT_LOAF.mouth.x * 2, y:CAT_BOARD.top - (CAT_LOAF.pixels.length - CAT_LOAF.mouth.y) * 2};
  const CAT_CROUCHED = {x:CAT_HOME.x, y:CAT_BOARD.top - (CAT_CROUCH.pixels.length - CAT_CROUCH.mouth.y) * 2};
  const CAT_LANDED = {x:CAT_BOARD.left + 21, y:CAT_CROUCHED.y};
  // Shares of the pounce and of the way back: the wiggle before it, the bite on the wire, the landing.

  function drawCatCel(pixels, left, top, swap = {}){
    pixels.forEach((row, dy) => {
      for(let dx = 0; dx < row.length; dx++){
        const color = CAT_COLORS[swap[row[dx]] || row[dx]];
