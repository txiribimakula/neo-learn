      }
      case 'done':
        if(!S.wire && S.comandas.length > 1) done();
        break;
      // ---- fumes and rereading before commits
      case 'incident': {
        // The top cook again, as always, once it has served a few orders from its wire, so that
        // reading it again from the start repeats something.
        const victim = unluckyCook(S);
        if(!victim.partitions.some(part => S.comandas[part].position - S.comandas[part].earliest >= REREAD_MIN)) break;
        build.who = victim.id;
        S.monkeyRun = {at:S.time};
        logEvent(S, 'Por detrás de la cocina entra un mono de tres cabezas haciendo equilibrios sobre un bidón de aceite.', 'warn');
        next('monkeyRide');
        break;
      }
      case 'monkeyRide':
        if(S.time - S.monkeyRun.at < MONKEY_THROW_S) break;
        S.peel = {at:S.monkeyRun.at + MONKEY_THROW_S, row:S.cooks[build.who].row, stepAt:null};
        logEvent(S, `El mono se come el plátano y tira la cáscara junto al fogón de ${S.cooks[build.who].name}.`, 'warn');
        next('peelWait');
        break;
      case 'peelWait': {
        const victim = S.cooks[build.who], peel = S.peel;
        if(S.time - peel.at < PEEL_LAND_S || victim.pos !== peel.row || !victim.active || victim.faint) break;
        const footX = victim.x;
        if(Math.abs(footX - PEEL_X) > PEEL_CONTACT_X) break;
        victim.x = footX;
        victim.faint = {phase:'slip', t:0, stay:true, faceRight:true, waking:['Is this', 'real life?'], crutches:true};
        victim.beer = null;
        peel.stepAt = S.time;
        next('offDuty');
        break;
      }
      case 'offDuty': {
        const who = S.cooks[build.who];
        if(who.faint || !who.active) break;
        logEvent(S, `${who.name} vuelve y nadie sabe por cuál iba: el hilo se vuelve a leer desde la primera comanda.`, 'warn');
        S.stats.rereads++;
        build.until = S.comandas.map(p => p.end);
        build.replayedOrders = new Set(who.partitions.flatMap(part => S.comandas[part].log.map(entry => entry.order)));
        next('reread');
        break;
      }
      case 'reread': {
        // Let the replay reach the tables. Once the last plate lands, its reaction can
        // stay on screen during the boss's entrance.
        const who = S.cooks[build.who];
        if(who.partitions.some(part => S.comandas[part].position < build.until[part])) break;
        const fromReplay = order => build.replayedOrders.has(order);
        if(who.job && fromReplay(who.job.order)) break;
        if(S.plates.some(p => fromReplay(p.order)) || S.counter.some(p => fromReplay(p.order))
          || S.trayWaiters.some(w => fromReplay(w.plate))) break;
        done();
        break;
      }
      case 'markBoss':
        // Give the instruction on arrival. The cooks can finish their current plates while listening.
        if(!pace({x:BOSS_SPOT.x, y:VISIT_Y})) break;
        b.faceLeft = true;
        say(b, ['¡Chavales!', 'COMMIT where', 'you are!']);
        next('markSay');
        break;
      case 'markSay':
        if(build.t < SAY_S) break;
        next('markHold');
        break;
      case 'markHold':
        if(S.cooks.some(k => k.job)) break;
        S.features.commit = true;
        // The marks start where each wire has got to; the boss throws them up there.
        for(const p of S.comandas) Object.assign(p, {committed:Math.max(p.earliest, p.position), chickenIn:false});
        next('markThrow');
        break;
      case 'markThrow':
        S.comandas.forEach((p, part) => {
          if(p.chickenIn || build.t < part * THROW_EACH_S + THROW_WIND_S + THROW_FLIGHT_S) return;
          p.chickenIn = true;
          if(part === S.comandas.length - 1) logEvent(S, 'El jefe lanza un pollo de goma con polea a cada hilo: marca la próxima comanda (commit). Si cambia el cocinero, quien lo releve continúa desde ese punto.', 'key');
        });
        if(build.t < S.comandas.length * THROW_EACH_S + THROW_AFTER_S) break;
        next('markCatch');
        break;
      case 'markCatch': {
        // Meanwhile he goes back where he came from.
        if(b.entering){
          b.faceLeft = false;
          if(pace({x:W + 30, y:VISIT_Y})) b.entering = false;
        }
        if(b.entering || build.t < 1.5) break;
        done();
        break;
      }
      case 'recountWalk':
        if(!pace(build.path[0], RECOUNT_SPEED)) break;
        build.path.shift();
        if(build.path.length) break;
        if(build.part < S.comandas.length) next('recountToTicket');
        else {
          Object.assign(b, {entering:false, x:BOSS_SPOT.x, y:BOSS_SPOT.y, faceLeft:true});
          done();
        }
        break;
      case 'recountToTicket': {
        const part = build.part, cash = S.cashCount[part];
        cash.offset = Math.max(cash.offset, S.comandas[part].earliest);
        const spot = {x:markX(S, part, cash.offset) + 28, y:recountFeet(S, part)};
        if(!pace(spot, RECOUNT_SPEED)) break;
        b.faceLeft = true;
        next('recountRead');
        break;
      }
      case 'recountRead': {
        const part = build.part, cash = S.cashCount[part], p = S.comandas[part];
        // The kitchen carries on, so new orders push the old ones along the wire: he keeps up with his.
        pace({x:markX(S, part, cash.offset) + 28, y:recountFeet(S, part)}, RECOUNT_SPEED);
        b.faceLeft = true;
        if(build.t < RECOUNT_READ_S) break;
        if(cash.offset < p.earliest){
          cash.offset = p.earliest;
          next('recountToTicket');
          break;
        }
        const entry = p.log[cash.offset - p.earliest];
        cash.total += entry.order.items.length;
        cash.offset = entry.offset + 1;
        cash.marked = true;
        if(--build.remaining > 0){
          next('recountToTicket');
          break;
        }
        build.part++;
        if(build.part < S.comandas.length){
          build.remaining = RECOUNT_LIMITS[build.part];
          build.path = [{x:RECOUNT_AISLE_X, y:b.y}, {x:RECOUNT_AISLE_X, y:recountFeet(S, build.part)}];
          next('recountWalk');
          break;
        }
        next('recountAside');
        break;
      }
      case 'recountAside': {
        const part = build.part - 1;
        const x = markX(S, part, S.cashCount[part].offset) + 36;
        if(!pace({x, y:b.y}, RECOUNT_SPEED)) break;
        b.faceLeft = true;
        say(b, ['Luego sigo.', 'Na razie.']);
        logEvent(S, 'Caja lee las comandas desde el principio de cada hilo y guarda su propio commit en los dos.', 'key');
        next('recountPause');
        break;
      }
      case 'recountPause':
        if(build.t < SAY_S) break;
        build.path = [{x:RECOUNT_AISLE_X, y:b.y}, {x:RECOUNT_AISLE_X, y:RECOUNT_AISLE_Y}, {x:W + 30, y:RECOUNT_AISLE_Y}];
        next('recountWalk');
        break;
      // ---- fewer diners: a cook is sent for a rest, and a rebalance gives the other both wires
      case 'restEmpty':
        // Once the last diner at that table has gone out of the door.
        if(S.customers.some(c => c.table === S.closedTable)) break;
        logEvent(S, 'La mesa se queda vacía: hay menos comandas que cocinar.', 'key');
        next('restSeen');
        break;
      case 'restSeen':
        if(build.t < EMPTY_SEEN_S) break;
        Object.assign(b, {entering:true, x:W + 30, y:VISIT_Y, faceLeft:true});
        next('restBoss');
        break;
      case 'restBoss':
        if(!pace({x:BOSS_SPOT.x, y:VISIT_Y})) break;
        b.faceLeft = true;
        say(b, ['Hay poca gente,', 'take a rest!']);
        next('restHeard');
        break;
      case 'restHeard': {
        if(b.say) break;
        const k = S.cooks[build.who];
        say(k, ['¡Sí, jefe!'], {brief:true});
        k.leaving = true;
        logEvent(S, `El jefe manda a ${k.name} a descansar. Antes de irse termina la comanda que tiene y mueve el pollo (commit), y no coge ninguna más.`, 'key');
        next('restFinish');
        break;
      }
      case 'restFinish': {
        const k = S.cooks[build.who];
        if(k.job || !inKitchen(k) || k.say) break;
        // It leaves the group (LeaveGroup). Nobody takes anything new until the wires are shared out.
        build.parts = [...k.partitions];
        build.mark = S.comandas.map(p => p.committed);
        k.leaving = false;
        k.rest = {phase:'walk', t:0, table:S.closedTable, feet:barTop(k.pos) + COOK_FEET, path:restPath(S.closedTable), sips:0, sip:null, wait:REST_FIRST_SIP_S};
        setCookActive(S, k.id, false);
        S.rebalance.held = true;
        say(b, ['¡REBALANCE!']);
        logEvent(S, `${k.name} sale del grupo y se va a la mesa vacía. El jefe, que hace de coordinador del grupo (en Kafka, un broker), anuncia un rebalance: quien tenga algo en la mano lo termina y nadie empieza nada nuevo.`, 'warn');
        next('restShare');
        break;
      }
      case 'restShare': {
        // Once everyone has finished what it had and is back at its stove. Who computes the new
        // assignment is not shown: in the classic protocol it is a consumer (the group leader),
        // not the coordinator.
        if(b.say || !rebalanceReady(S) || S.cooks.some(k => k.active && !inKitchen(k))) break;
        completeRebalance(S);
        const k = S.cooks[build.who], other = S.cooks.find(o => o.active);
        logEvent(S, `${other?.name ?? 'Nadie'} lleva los dos hilos. En el de ${k.name} empieza por la comanda siguiente al pollo: nada se repite ni se salta.`, 'key');
        next('restAway');
        break;
      }
      case 'restAway':
        b.faceLeft = false;
        if(pace({x:W + 30, y:VISIT_Y})){ b.entering = false; next('restCover'); }
        break;
      case 'restCover': {
        // The step is over once the other cook has committed one from the resting cook's wire.
        const covered = build.parts.every(part => S.comandas[part].committed > build.mark[part]);
        if(covered) done();
        break;
      }
      // ---- cashing up, the first time
      case 'search': {
        const part = build.searchPart, row = rowOf(S, part);
        if(!build.there){
          if(!build.searchRoute){
            // Look where the latest missing order would still hang if the wire retained it.
            const p = S.comandas[part];
            const hanging = new Set(p.log.filter(e => !e.taken).map(e => e.offset));
            let offset = p.end - 1;
            while(offset >= 0 && hanging.has(offset)) offset--;
            const x = Math.max(barStart() + 10, slotX(part, p.end, Math.max(0, offset)));
            const y = barTop(row) + COOK_FEET;
            // Enter past the right end, then cross between wires past the left end.
            const aisleX = part === 0 ? COUNTER_END + 26 : COUNTER_START - 26;
            build.searchRoute = [{x:aisleX, y:b.y}, {x:aisleX, y}, {x, y}];
          }
          if(pace(build.searchRoute[0])){
            build.searchRoute.shift();
            if(!build.searchRoute.length){
              build.there = true;
              build.t = 0;
            }
          }
          break;
        }
        b.nervous = true;
        b.faceLeft = build.t < SEARCH_S / 2;
        if(build.t < SEARCH_S) break;
        b.nervous = false;
        if(part + 1 < S.comandas.length){
          build.searchPart++;
          build.searchRoute = null;
          build.there = false;
          break;
        }
        b.faceLeft = true;
        // Not said aloud: what he feels, in italics and trailing off, with his mouth shut.
        say(b, ['Disappointed...'], {felt:true});
        logEvent(S, 'El jefe de sala quiere hacer caja con las comandas servidas, pero no puede: la cola las borra al completarlas.', 'warn');
        next('look');
        break;
      }
      case 'look':
        // Reach the bin via the aisle at the right end of the counter.
        if(build.t < SAY_S * 0.8) break;
        if(!build.atBinAisle){
          build.atBinAisle = pace({x:COUNTER_END + 26, y:b.y});
          break;
        }
        if(pace({x:S.bin.x - 34, y:VISIT_Y})){ b.faceLeft = false; next('windup'); }
        break;
      case 'windup':
        b.leg = build.t > 0.15 ? 'windup' : null;
        if(build.t < 0.45) break;
        // A kick that sends it flying out of the restaurant.
        b.leg = 'kick';
        S.bin.kicked = 0;
        next('kicked');
        break;
      case 'kicked':
        S.bin.kicked = build.t;
        if(build.t > 0.25) b.leg = null;
        if(build.t < BIN_FLY_S) break;
        S.bin = null;
        next('tell');
        break;
      case 'tell':
        // Everyone at their stove, with nothing in hand, to hear it.
        if(build.t < 0.6 || S.cooks.some(k => k.job || k.pos !== k.row || k.x !== COOK_X)) break;
        b.faceLeft = true;
        keepOrders(S);
        say(b, ['Keep the log!']);
        next('heard');
        break;
      case 'heard':
        if(build.t > 1.6 && !build.answered){
          build.answered = true;
          S.cooks.forEach(k => say(k, ['¡Sí, jefe!'], {brief:true}));
        }
        if(build.t < SAY_S + 0.6) break;
        build.hold = false;
        b.faceLeft = false;
        if(pace({x:W + 30, y:VISIT_Y})){ b.entering = false; done(); }
        break;
      // ---- an order lost on its way, first without and then with the call
      case 'lossWatch':
        // Without an acknowledgement, the diner eventually gives up.
        if(S.stats.lost > build.lostBefore && !S.loseNext && !S.customers.some(k => k.messages.some(m => m.lost && !m.served))) done();
        break;
      case 'bossIn':
        if(pace(BOSS_SPOT)){
          b.faceLeft = true;
          build.waiterState = w.state;
          w.state = 'listening';
          w.faceLeft = false;
          say(b, ['A bit of order,', 'figura!']);
          next('bossGreets');
        }
        break;
      case 'bossGreets':
        if(b.say) break;
        say(w, ['Sí, jefe']);
        next('waiterReplies');
        break;
      case 'waiterReplies':
        if(build.t < SAY_S) break;
        w.say = null;
        w.state = build.waiterState;
        Object.assign(b, {entering:false, present:true});
        logEvent(S, 'El jefe de sala se queda en el pase: cuando llega una comanda, la confirma con «¡Oído cocina!» (ack).', 'key');
        next('firstAcks');
        break;
      case 'firstAcks':
        if(b.lastAck && b.lastAck.seq === b.lastAck.total) next('ackShown');
        break;
      case 'retryWatch':
        if(b.lastAck?.resent) next('ackShown');
        break;
      case 'ackShown':
        if(Number.isFinite(b.saidAt) && S.time - b.saidAt >= OIDO_SHOW_S) done();
        break;
    }
  }

  // The new cook builds its wire: it pulls one post up out of the floor, then a second one from the
  // same spot with the wire tied to both, and walks it backwards along its row to plant it at the
  // other end. Only then is there a partition to send to.
  function stepWire(S, dt){
    const wire = S.wire, c = S.cooks[1];
    if(!wire) return;
    const next = phase => { wire.phase = phase; wire.t = 0; };
    wire.t += dt;
    switch(wire.phase){
      case 'toRight':
        c.walking = !walkTo(c, BUILD_SPOTS.right, CARRY_SPEED, dt);
        if(!c.walking){ c.faceLeft = false; next('raise'); }
        break;
      case 'raise':
        wire.rightPost = Math.min(1, wire.t / RAISE_S);
        if(wire.t >= RAISE_S){ wire.secondX = c.x + HOLD_AT; next('raise2'); }
        break;
      case 'raise2':
        wire.second = Math.min(1, wire.t / RAISE2_S);
        wire.lift = CARRY_LIFT * wire.second;
        if(wire.t >= RAISE2_S) next('carry');
        break;
      case 'carry':
        c.walking = !walkTo(c, BUILD_SPOTS.left, CARRY_SPEED, dt);
        c.faceLeft = false;
        wire.secondX = c.x + HOLD_AT;
        if(!c.walking) next('plant');
        break;
      case 'plant':
        wire.lift = CARRY_LIFT * Math.max(0, 1 - wire.t / PLANT_S);
        if(wire.t >= PLANT_S){ wire.lift = 0; addPartition(S); next('back'); }
        break;
      case 'back':
        c.walking = !walkTo(c, COOK_X, COOK_WALK_SPEED, dt);
        if(!c.walking){
          c.building = false;
          c.faceLeft = true;
          S.wire = null;
        }
        break;
    }
  }

  function stepSim(S, dt){
    S.time += dt;
    if(S.rate > 0 && !(S.build && S.build.quiet)){
      S.spawnIn -= dt;
      if(S.spawnIn <= 0){
        // With every letter inside, nobody new can come in until someone leaves.
        S.spawnIn = addCustomer(S) ? 60 / S.rate * (0.6 + random(S.random) * 0.8) : 0.5;
      }
    }
    stepCustomers(S, dt);
    stepBarWaiters(S, dt);
    stepFlights(S, dt);
    expireLocks(S);
    stepRebalance(S, dt);
    S.cooks.forEach(c => stepCook(S, c, dt));
    stepTrayWaiters(S, dt);
    stepBuild(S, dt);
    stepWire(S, dt);
  }

  // An isolated topic and consumer projection for the final example. Same key, same partition;
  // its second part sends the same events without a key.
  const NO_KEY_COLOR = '#8a8494';
  const MATERIAL_KEY = 'MAT-104';
  const MATERIAL_EVENTS = [
    {op:'CREATE', patch:{referencia:'AL-104', densidad:'2.68', acabado:'RAW'}},
    {op:'UPDATE', patch:{densidad:'2.70'}},
    {op:'UPDATE', patch:{acabado:'ANODIZED'}},
    {op:'DELETE', patch:null}
  ];
  const MATERIAL_PHASES = {intro:1.1, send:1.15, fetch:0.9, apply:0.75, commit:0.85, crossWait:0.65, crossError:1.5};

  function createMaterialDemo(split = false){
    const S = createSim();
    S.upgrades = UPGRADES.length;
    S.rate = 0;
    S.materialDemo = {
      split, index:0, current:null, last:null, flight:null, phase:'intro', elapsed:0, reader:0,
      reference:{value:null, last:null, offsets:S.comandas.map(() => 0)}
    };
    return S;
  }

  function sendMaterialEvent(S){
    const demo = S.materialDemo, event = MATERIAL_EVENTS[demo.index];
    if(!event || demo.flight || (demo.split && demo.index > 1)) return;
    const letter = LETTERS[0];
    // Sent without a key, an event may land on any partition: here the CREATE goes to P0 and
    // the UPDATE of the same material to P1, so nothing keeps them in order.
    const part = demo.split ? demo.index : partitionFor(S, letter);
    const order = {id:demo.index + 1, letter, key:demo.split ? null : MATERIAL_KEY, materialOp:event.op, patch:event.patch};
    demo.flight = {part, order, x0:barStart() + 4};
    demo.reader = 0;
    demo.phase = 'send';
    demo.elapsed = 0;
  }

  function stepMaterialDemo(S, dt){
    const demo = S.materialDemo;
    if(demo.phase === 'ready') return;
    S.time += dt;
    demo.elapsed += dt;
    if(demo.elapsed < MATERIAL_PHASES[demo.phase]) return;
    demo.elapsed = 0;
    if(demo.phase === 'intro' || demo.phase === 'crossWait'){
      sendMaterialEvent(S);
      return;
    }
    if(demo.phase === 'crossError'){
      demo.flight = demo.deferredCreate;
      demo.deferredCreate = null;
      demo.lateCreate = true;
      demo.reader = 0;
      demo.phase = 'fetch';
      return;
    }
    const message = demo.flight, partition = S.comandas[message.part], order = message.order;
    if(demo.phase === 'send'){
      message.offset = appendToLog(S, partition, order);
      if(demo.split && order.materialOp === 'CREATE'){
        // By chance the reference group polls P0 straight away and gets the CREATE first; the
        // full view's consumer will only reach P0 after the UPDATE has come in on P1.
        demo.deferredCreate = message;
        demo.index++;
        demo.luckyCreate = true;
        demo.reader = 1;
        demo.phase = 'fetch';
      } else {
        demo.phase = 'fetch';
      }
    } else if(demo.phase === 'fetch'){
      if(demo.reader === 0) partition.position = message.offset + 1;
      demo.phase = 'apply';
    } else if(demo.phase === 'apply'){
      if(demo.reader === 1){
        if(order.materialOp === 'DELETE') demo.reference.value = null;
        else if(order.materialOp === 'CREATE' || demo.reference.value !== null){
          demo.reference.value = order.patch.referencia ?? demo.reference.value;
        }
        demo.reference.last = message;
      } else if(order.materialOp === 'UPDATE' && !demo.current){
        demo.updateRejected = true;
      } else {
        demo.previous = demo.current;
        demo.current = order.materialOp === 'DELETE' ? null : {...demo.current, ...order.patch};
        demo.last = message;
      }
      demo.phase = 'commit';
    } else if(demo.reader === 0){
      partition.committed = message.offset + 1;
      // The late CREATE: the reference group already had it, so the example is over.
      if(demo.lateCreate){
        demo.lateCreate = false;
        demo.flight = null;
        demo.phase = 'ready';
      } else {
        demo.reader = 1;
        demo.phase = 'fetch';
      }
    } else {
      demo.reference.offsets[message.part] = message.offset + 1;
      demo.flight = null;
      if(demo.luckyCreate){
        // Then the UPDATE is sent, and this time the full view reads first.
        demo.luckyCreate = false;
        demo.phase = 'crossWait';
      } else {
        demo.index++;
        demo.phase = demo.deferredCreate ? 'crossError' : 'ready';
      }
    }
  }

  // The same independent nesting jobs run under both dispatch policies.
  const NESTING_DURATIONS = {long:3, short:0.75};

  // In Kafka the producer sends the jobs one by one before anyone computes: the partition is
  // fixed at send time, when nobody knows yet how long a job will take.
  const NESTING_SEND_START_S = 0.4, NESTING_SEND_GAP_S = 0.35, NESTING_FLY_S = 0.55, NESTING_SETTLE_S = 0.3;
  const nestingSentAt = job => NESTING_SEND_START_S + (job.id - 1) * NESTING_SEND_GAP_S;
  const nestingLanded = (demo, job) => demo.mode === 'bus' || demo.introElapsed >= nestingSentAt(job) + NESTING_FLY_S;

  function createNestingDemo(mode, kafkaResult = null){
    // Plain round-robin over two partitions. The jobs alternate long and short, so every long
    // one lands on P0 and every short one on P1: no special key, just an ordinary split.
    const jobs = Array.from({length:8}, (_, i) => {
      const kind = i % 2 === 0 ? 'long' : 'short';
      return {id:i + 1, kind, duration:NESTING_DURATIONS[kind], part:i % 2,
        status:'waiting', startedAt:null};
    });
    return {
      mode, kafkaResult, jobs,
      workers:[0, 1].map(id => ({id, job:null, finishAt:0, busy:0})),
      phase:mode === 'kafka' ? 'intro' : 'merge', elapsed:0, introElapsed:0, completed:0
    };
  }

  // Each free consumer takes the next job it may: in Kafka only from its own partition.
  function nestingDispatch(demo){
    for(const worker of demo.workers){
      if(worker.job) continue;
      const job = demo.jobs.find(item => item.status === 'waiting' && (demo.mode === 'bus' || item.part === worker.id));
      if(!job) continue;
      job.status = 'running';
      job.startedAt = demo.elapsed;
      worker.job = job;
      worker.finishAt = demo.elapsed + job.duration;
      worker.busy += job.duration;
    }
  }

  // Once the jobs are spread out it waits ('spread') for the next click, so the split can be
  // explained before anyone computes.
  function startNestingRun(demo){
    if(demo.phase !== 'spread') return;
    demo.phase = 'running';
    nestingDispatch(demo);
  }

  function stepNestingDemo(demo, dt){
    if(demo.phase === 'done' || demo.phase === 'spread') return;
    const dispatch = () => nestingDispatch(demo);
    if(demo.phase !== 'running'){
      demo.introElapsed += dt;
      const ready = demo.mode === 'kafka'
        ? nestingSentAt(demo.jobs[demo.jobs.length - 1]) + NESTING_FLY_S + NESTING_SETTLE_S : 1.25;
      if(demo.introElapsed < ready) return;
      demo.phase = 'spread';
      return;
    }
    const until = demo.elapsed + dt;
    // Finish simultaneous jobs together before either consumer asks for another one.
    while(demo.phase === 'running'){
      const next = Math.min(...demo.workers.filter(worker => worker.job).map(worker => worker.finishAt));
      if(next > until + 1e-9){
        demo.elapsed = until;
        return;
      }
      demo.elapsed = next;
      for(const worker of demo.workers){
        if(!worker.job || worker.finishAt !== next) continue;
        worker.job.status = 'done';
        worker.job = null;
        demo.completed++;
      }
      if(demo.completed === demo.jobs.length){
        demo.phase = 'done';
        return;
      }
      dispatch();
    }
  }

  // initial
  // ---- Rendering: scene drawn at 730x420, blitted without smoothing ----

  const EATEN_ALPHA = 0.15;
  // Below the hanging orders, so a cook walking past them does not hide them.

  const inWindow = (i, j) => j >= 25 && j <= 50 && ((i >= 196 && i <= 222) || (i >= 258 && i <= 288));

  function leadedGlass(night, w){
    const {x0, x1, y0, y1, seeds} = LEADED_WINDOW, glass = new Set(), stack = seeds.map(seed => [...seed]);

      const target = i < kafkaStep ? 1 : 0;
      kafkaMix[i] = target > mix ? Math.min(target, mix + step) : Math.max(target, mix - step);
    });
  }

  // Locked for the cook that has it: nobody else can take it until it is done, or the lock lapses.
  // A brass padlock hooked straight through the bottom of the paper; its shackle opens when the
  // lease expires.
  function drawPadlock(cx, top, open = false){
    const x = Math.round(cx), y = Math.round(top), lift = open ? 3 : 0;
    // Steel shackle, with a clear gap at the right when unlocked.
    R(x - 4, y - lift, 8, 2, PAL.black);
    R(x - 5, y + 2 - lift, 3, 6 + lift, PAL.black);
    R(x + 2, y + 2 - lift, 3, open ? 3 : 6, PAL.black);
    R(x - 3, y + 1 - lift, 6, 1, '#e2dfcb');
    R(x - 4, y + 2 - lift, 1, 5 + lift, '#9ca8aa');
    R(x + 3, y + 2 - lift, 1, open ? 2 : 5, '#9ca8aa');
    // Rounded brass case, bevel and keyhole, readable at the scene's native resolution.
    R(x - 5, y + 6, 11, 10, PAL.black);
    R(x - 6, y + 7, 13, 8, PAL.black);
    R(x - 5, y + 7, 11, 7, '#a06a2c');
    R(x - 4, y + 7, 9, 6, '#d4ac53');
    R(x - 4, y + 7, 8, 1, '#f4d88a');
    R(x - 4, y + 8, 1, 4, '#e7c774');
    R(x - 1, y + 9, 3, 2, '#3b2e26');
    R(x, y + 11, 1, 2, '#3b2e26');
  }


  // Where an order is drawn. In a log, by its offset; in a queue, by its place in line, sliding
  // along when the ones before it are taken.
  function orderX(part, entry){
    if(S.features.retain) return slotX(part, view.ends[part], entry.offset);
    const target = entryX(S, part, entry.offset);
    entry.vx = entry.vx === undefined ? target : entry.vx + (target - entry.vx) * Math.min(1, frameTick * 10);
    return entry.vx;
  }

  function drawOrdersWire(part){
    const p = S.comandas[part], row = rowOf(S, part);
    p.log.forEach(entry => {
      // A queue's order leaves the wire with the cook that takes it.
      if(entry.taken) return;
      const x = orderX(part, entry);
      if(x < barStart(row) + 10) return;
      // No outline for an order in progress, ever (Pablo's call): the padlock and the offset marker say it.
      drawTicketBar(x, ticketTop(row), entry.order, {fresh:S.time - entry.at < 0.3});
    });
    const cash = S.cashCount?.[part];
    if(cash?.marked){
      const slide = S.build?.phase === 'recountRead' && S.build.part === part
        ? smooth((S.build.t - RECOUNT_READ_S + RECOUNT_MARK_S) / RECOUNT_MARK_S) : 0;
      const x = Math.max(barStart(row) + 10, slotX(part, view.ends[part], cash.offset + slide));
      const y = ticketTop(row) + 22;
      R(x - 1, y - 1, 3, 5, '#8e6137');
      R(x - 6, y + 3, 12, 14, '#392c33');
      R(x - 5, y + 3, 10, 12, '#f3ddb6');
      R(x + 3, y + 4, 2, 11, '#cfaa7b');
      R(x - 3, y + 6, 6, 1, '#816754');
      R(x - 3, y + 9, 5, 1, '#a5896b');
      R(x - 3, y + 12, 6, 1, '#a5896b');
      for(const dx of [-5, -1, 3]) R(x + dx, y + 15, 2, 1, '#e7cca1');
    }
    // Until the boss's throw lands it, the wire has no chicken yet.
    if(S.features.commit && p.chickenIn !== false){
      const chicken = view.chickens[part];
      const x = Math.max(barStart(row) + 10, slotX(part, view.ends[part], chicken ? chicken.at : p.committed));
      if(chicken){
        // The pulley turns with the distance it covers along the wire, whichever moved.
        if(chicken.x !== undefined) chicken.roll += (x - chicken.x) / PULLEY.r;
        chicken.x = x;
      }
      drawRubberChicken(x, wireY(row), chicken ? chicken.roll : 0);
    }
  }

  function drawCounter(){
    const top = barTop(PLATES_ROW), y = top - 9;
    S.counter.forEach(entry => {
      if(entry.x <= COUNTER_END - 10) drawPlateBar(entry.x, y, entry.order);
    });
    S.plates.forEach(plate => drawPlateBar(plate.x, y, plate.order));
  }

  // Small slate menus in a brass-bound frame. Each course keeps its place as the meal advances.
  function drawMenuBoard(cx, y, count, letter){
    const w = count * 19 + 8, x = Math.max(1, Math.min(W - w - 2, Math.round(cx - w / 2)));
    R(x + 2, y + 2, w, 21, '#211829');
    R(x, y + 1, w, 20, '#4c3440');
    R(x + 1, y, w - 2, 20, '#ad815a');
    R(x + 2, y + 2, w - 4, 16, '#182637');
    R(x + 3, y + 3, w - 6, 1, '#374350');
    R(x + 2, y + 18, w - 4, 1, '#d2a875');
    for(const pin of [x + 1, x + w - 3]) R(pin, y + 1, 2, 2, '#f5d393');
    if(letter){
      R(x + 4, y + 17, 6, 7, '#443140');
      R(x + 5, y + 17, 4, 6, COLORS.customers[letter]);
      R(x + 6, y + 22, 2, 2, '#392d3d');
    }
    for(let i = 1; i < count; i++) R(x + 3 + i * 19, y + 5, 1, 11, '#53606a');
    return x + 13;
  }

  function drawBubble(items, cx, top, letter){
    if(!items.length) return;
    const y = Math.round(top - 58), first = drawMenuBoard(cx, y, items.length, letter);
    items.forEach((item, i) => drawDish(item, first + i * 19, y + 10));
  }

  function drawMenu(c, top){
    const y = Math.round(top - 60), first = drawMenuBoard(STOOL_X, y, c.messages.length, c.letter);
    c.messages.forEach((message, i) => {
      const x = first + i * 19;
      g.save();
      if(message.finished) g.globalAlpha *= EATEN_ALPHA;
      else if(c.eating === message) g.globalAlpha *= EATEN_ALPHA + (1 - EATEN_ALPHA) * c.timer / EAT_S;
      drawDish(message.items[0], x, y + 10);
      g.restore();
      if(message.lost && !message.served){
        R(x - 8, y + 3, 16, 1, '#ff8876');
        R(x - 8, y + 16, 16, 1, '#ff8876');
        for(let k = 0; k < 5; k++){
          R(x + 2 + k, y + 10 + k, 2, 2, '#ff8876');
          R(x + 6 - k, y + 10 + k, 2, 2, '#ff8876');
        }
      } else if(message.finished){
        R(x + 1, y + 12, 2, 2, '#a9c59a'); R(x + 3, y + 14, 2, 2, '#a9c59a');
        R(x + 5, y + 12, 2, 2, '#a9c59a'); R(x + 7, y + 10, 2, 2, '#a9c59a');
      }
    });
  }

  function drawNotepad(letter, cx, cy){
    const x = Math.round(cx), y = Math.round(cy);
    R(x - 1, y - 1, 12, 15, '#352936');
    R(x, y, 10, 12, '#e8ca92');
    R(x + 1, y, 8, 3, letter ? COLORS.customers[letter] : '#9c7650');
    R(x + 1, y - 1, 2, 2, '#d9c2a1'); R(x + 7, y - 1, 2, 2, '#d9c2a1');
    R(x + 2, y + 5, 6, 1, '#81644e'); R(x + 2, y + 8, 4, 1, '#81644e');
    R(x + 1, y + 12, 8, 1, '#b18e64');
  }

  function drawTray(cx, cy){
    const x = Math.round(cx), y = Math.round(cy);
    // The lip rises behind the food. The curved foot rests on the waiter's palm.
    R(x - 14, y - 5, 28, 8, '#292736');
    R(x - 17, y - 3, 34, 4, '#302c3c');
    R(x - 13, y - 5, 26, 1, '#efdfb9');
    R(x - 15, y - 4, 30, 2, '#a7a7aa');
    R(x - 13, y - 2, 26, 2, '#7b7d8d');
    R(x - 11, y - 3, 20, 1, '#c6b9a6');
    R(x - 16, y, 32, 2, '#d4cbb9');
    R(x - 12, y + 2, 24, 1, '#928796');
    R(x - 7, y + 3, 14, 2, '#574b60');
  }

  function drawDiners(){
    S.customers.forEach(c => {
      const top = tableTop(c.table);
      const walking = c.state === 'enter' || c.state === 'leave';
      c.walkPhase += frameTick;
      const angry = isImpatient(c);
      // Bounces in the seat on each thump.
      const chewing = c.eating && Math.floor(S.time * 5) % 2;
      const movingOnStool = c.state === 'sit' || c.state === 'rise';
      const bob = walking ? Math.floor(c.walkPhase * 12) % 2 : movingOnStool ? 0
        : angry && poundLift(S.time) < 0.2 ? 2 : chewing ? 1 : breathLift(c.visit);
      drawPirateDiner(c, top, walking, bob);
    });
  }

  // 0 when the fist is on the table, 1 at the top of the swing: a slow rise and a sudden drop.
  function poundLift(time){
    const k = (time % POUND_S) / POUND_S;
    return k < 0.75 ? k / 0.75 : 1 - (k - 0.75) / 0.25;
  }

  function drawPoundingFist(c, top){
    const lift = poundLift(S.time), seatBounce = lift < 0.2 ? 2 : 0;
    const rig = DINER_ARMS[c.letter];
    const shoulderX = c.x - 40 + rig.x, shoulderY = top - 65 + rig.y - seatBounce;
    // The elbow rests on the tabletop; the forearm pivots without changing length.
    const elbowX = c.x + 2, elbowY = top - 3;
    const angle = lift * 1.25, forearm = 12;
    const fistX = elbowX + Math.cos(angle) * forearm, fistY = elbowY - Math.sin(angle) * forearm;
    drawCharacterArm(shoulderX, shoulderY, {elbowX, elbowY, handX:fistX, handY:fistY}, rig);
    if(lift < 0.2){
      for(const [dx, dy] of [[-7, 0], [-5, -4], [6, 0], [5, -4]]) R(fistX + dx, top - 1 + dy, 2, 2, '#e8cd9d');
    }
  }

  function drawTableFood(){
    S.customers.forEach(c => {
      const top = tableTop(c.table);
      if(isImpatient(c)) drawPoundingFist(c, top);
      if(c.eating) drawPlate(TABLE_X - 11, top - 6, c.eating, false, c.timer / EAT_S);
      c.plates.forEach((message, i) => drawPlate(TABLE_X + 7 + i % 2 * 15, top - 6 + Math.floor(i / 2) * 3, message));
    });
    // Plates nobody asked for, left on the table a moment, at a slant.
    S.strays.forEach(p => drawPlate(TABLE_X + 10, tableTop(p.table) - 6 + (Math.floor(p.t * 6) % 2), p.order));
  }


  // The menus over the diners and the board of the waiter taking an order belong to the scene:
  // the tutorial and the spotlight darken them like everything else unless they are lit.
  function drawDinerMenus(){
    S.customers.forEach(c => {
      if(c.state === 'asking' || c.state === 'seated' || c.state === 'complain') drawMenu(c, tableTop(c.table) - 6);
    });
  }
  function drawWaiterOrders(){
    S.barWaiters.forEach(w => {
      if(!w.say && w.state === 'order') drawBubble(w.toSend.flatMap(m => m.items), w.x, w.y - 30, w.letter);
    });
  }
  function drawSceneMenus(){
    morphDraw(mixOf(STAGE.producers), drawDinerMenus, () => {});
    morphDraw(mixOf(STAGE.partitioner), drawWaiterOrders, () => {});
  }

  function drawDinerBubbles(){
    S.customers.forEach(c => {
      const top = tableTop(c.table);
      if(c.state === 'complain'){
        const lines = c.timer > COMPLAIN_S ? ['Kurwa!'] : c.complaintLines;
        drawSpeech(lines, STOOL_X, top - 69, DINERS[c.letter].voice);
      } else if(c.say){
        const lines = c.say.dishComplaint && c.say.t < KURWA_S ? ['Kurwa!'] : c.say.lines;
        drawSpeech(lines, STOOL_X, top - 69, DINERS[c.letter].voice);
      }
      if(c.puzzled > 0){
        // A course came before the one it follows.
        const bx = STOOL_X + 22, by = top - 43;
        R(bx - 1, by - 1, 17, 13, PAL.black);
        R(bx, by, 15, 11, PAL.white);
        text('?!', bx + 2, by + 2, PAL.red);
      }
    });
  }

  const stride = e => { e.walkPhase += frameTick; return Math.floor(e.walkPhase * 10) % 2 === 1; };
  // The notepad is blank while it walks to a table or back home, and in the key's color otherwise.
  const waiterKey = w => (w.state === 'back' || w.state === 'toTable' ? null : w.letter);

  function drawOrderWaiter(w){
    const phase = S.build && S.build.phase;
    if(w === S.barWaiters[0] && phase === 'lift'){
      drawSprite(crewFrame('waiter-board', stride(w) ? 'walk' : 'stand', false, true), w.x, w.y, false);
      const shoulderX = w.x + 8, shoulderY = w.y - 48;
      const arm = cookArmPose(shoulderX, shoulderY, LEFT_POST_X - 2, w.y - 40);
      drawCharacterArm(shoulderX, shoulderY, arm, WAITER_ARM);
      return;
    }
    const moving = w.state === 'toTable' || w.state === 'toBar' || w.state === 'back' || (w.state === 'moving' && w.walking);
    const side = w.faceLeft ? -1 : 1, lift = moving ? 0 : breathLift(w.home.x);
    drawSprite(crewFrame('waiter-note', moving && stride(w) ? 'walk' : 'stand', isBlinking(w.home.y)), w.x, w.y, !w.faceLeft, lift);
    drawNotepad(waiterKey(w), w.x + side * 22 - 4, w.y - 49 - lift);
  }

  // The chalk touches exactly the stroke shown on the slate; the fingers grip it below the tip.
  // The elbow stays clear of the body as the hand follows the chalk.
  function drawBossAtBoard(b, writing){
    contactShadow(b.x, b.y, 20);
    const stepping = b.walking && Math.floor(S.build.t * 8) % 2 === 1;
    drawSprite(crewFrame('boss-idle', stepping ? 'walk' : 'stand', false, 'bossBoard'), b.x, b.y, false);
    const tip = signHand(S.build);
    const shoulderX = b.x + 10, shoulderY = b.y - 47;
    const gripX = tip.x + (writing ? -2 : 1), gripY = tip.y + (writing ? 5 : 4);
    const arm = cookArmPose(shoulderX, shoulderY, gripX, gripY, 1, 14);
    drawCharacterArm(shoulderX, shoulderY, arm, BOSS_BOARD_ARM, false);
    if(!writing){
      const {x, y} = signEraserBox(tip);
      R(x, y, SIGN_ERASER_W, SIGN_ERASER_H, '#554349');
      R(x + 1, y + 1, 10, 8, '#ac9277');
      R(x + 2, y + 1, 8, 2, '#d1b694');
      R(x + 1, y + 8, 10, 2, '#8f7867');
      R(x + 2, y + 10, 7, 1, '#958b79');
    }
    drawCharacterHand(arm.handX, arm.handY, BOSS_BOARD_ARM);
    if(writing){
      R(tip.x, tip.y, 2, 2, CHALK_WHITE);
      R(tip.x - 1, tip.y + 2, 2, 2, CHALK_WHITE);
    }
  }

  function drawTrayWaiter(w){
    const moving = w.state === 'toPlate' || w.state === 'deliver' || w.state === 'return';
    const side = w.faceLeft ? -1 : 1;
    // The tray only moves with the breath when it is empty: the plate has to line up with the counter.
    const lift = moving || w.plate ? 0 : breathLift(w.home.y);
    const trayX = w.x + side * TRAY_REACH, trayY = w.y - TRAY_HEIGHT - lift;
    // Place the upturned palm under the tray, including when it meets the counter.
    const bodyX = trayX - side * 24, feet = w.y + TRAY_FEET_OFFSET;
    drawSprite(crewFrame('waiter-tray', moving && stride(w) ? 'walk' : 'stand', isBlinking(w.home.x)), bodyX, feet, !w.faceLeft, lift);
    drawTray(trayX, trayY);
    if(w.plate) drawPlateBar(trayX, trayY - 9, w.plate);
  }

  // He faces the dining room, and now and then glances back at the kitchen, but not while an order
  // goes up. When each ticket arrives he calls «¡Oído cocina!» towards the waiter: the bubble
  // stays up a little longer than the waiter waits.
  const bossTalking = () => S.time - S.boss.saidAt < OIDO_SHOW_S;
  // A post of the new wire: k of its height out of the floor, and lift off the floor while carried.
  function drawPost(px, k, lift = 0){
    const wire = wireY(NEW_ROW), top = barTop(NEW_ROW) - lift, full = top + 38 - wire + 4 + lift;
    if(k <= 0) return;
    const h = Math.max(2, Math.round(full * k));
    R(px - 5, top + 36, 14, 4, PAL.black);
    R(px - 1, top + 38 - h, 6, h, PAL.black);
    R(px, top + 39 - h, 4, h - 2, '#79513c');
    R(px, top + 39 - h, 1, h - 2, '#c89454');
    R(px - 2, top + 39 - h, 8, 2, '#d5a15e');
  }

  // The first post, pulled up out of the floor in tugs, with dust at its foot while it comes out.
  function drawWireBuild(){
    const build = S.wire;
    if(!build || S.comandas.length > 1) return;
    drawPost(RIGHT_POST_X - 2, build.rightPost);
    if(build.phase === 'raise' || build.phase === 'raise2'){
      const ground = barTop(NEW_ROW) + 37;
      const px = build.phase === 'raise' ? RIGHT_POST_X - 2 : build.secondX;
      for(const dx of [-8, 11]) R(px + dx, ground - (Math.floor(build.t * 10) % 2) * 2, 2, 2, '#9a9a9a');
    }
  }


  function drawBoss(){
    const b = S.boss, talking = bossTalking();
    if(!b.present && !b.entering) return;
    if(b.entering){
      const phase = S.build?.phase;
      if(phase === 'signWipe' || phase === 'signWrite') return drawBossAtBoard(b, phase === 'signWrite');
      if(phase === 'markThrow') return drawBossThrow(b);
      const step = b.walking && Math.floor(b.walkPhase * 5) % 2 === 1;
      const speaking = !!b.say && !b.say.felt && !phase?.startsWith('recount');
      drawSprite(bossSprite(speaking, isBlinking(11), b.leg || (step ? 'walk' : 'stand')), b.x, b.y, !b.faceLeft);
      if(phase === 'recountRead'){
        const x = b.x - 14, y = b.y - 43;
        drawNotepad(null, x, y);
        const tick = 2 + Math.floor(5 * clamp01(S.build.t / (RECOUNT_READ_S - RECOUNT_MARK_S)));
        R(x + tick, y + 8, 2, 5, '#674736');
      }
      if(b.nervous){
        const drop = S.build.t / SEARCH_S;
        R(b.x + 8, b.y - 60 + Math.round(drop * 10), 2, 3, '#7fd4ff');
      }
      return;
    }
    if(talking){
      const up = rowOf(S, b.lastAck.partition) < PLATES_ROW;
      drawBossAckArm(b, up, S.time - b.saidAt);
      drawSprite(crewFrame('boss-command', 'stand', false, 'bossAck'), b.x, b.y, false);
      return;
    }
    drawSprite(bossSprite(false, isBlinking(11)), b.x, b.y, isGlancing(11), breathLift(11));
  }

  function drawBossAckArm(b, up, age){
    const shoulderX = b.x - 6, shoulderY = b.y - 47;
    const reach = smooth(age / .34) * smooth((OIDO_SHOW_S - age) / .34);
    // Flex the elbow before extending upwards, while the shoulder is still behind the shirt.
    const upper = lerp(-41, up ? 98 : 48, reach) * Math.PI / 180;
    const flex = lerp(30, up ? 48 : 25, reach) + (up ? 65 * Math.sin(Math.PI * reach) ** 2 : 0);
    const forearm = upper + flex * Math.PI / 180;
    const elbowX = shoulderX - 12 * Math.sin(upper), elbowY = shoulderY + 12 * Math.cos(upper);
    const handX = elbowX - 12 * Math.sin(forearm), handY = elbowY + 12 * Math.cos(forearm);
    drawCharacterArm(shoulderX, shoulderY, {elbowX, elbowY, handX, handY}, BOSS_ACK_ARM, false);
    drawCharacterHand(handX, handY, BOSS_ACK_ARM);
    const finger = Math.round(5 * smooth((reach - .55) / .45)), slope = up ? -.7 : .65;
    for(let i = 1; i <= finger; i++){
      R(handX - 2 - i, handY - 2 + slope * i, 3, 3, BOSS_ACK_ARM.skinEdge);
    }
    for(let i = 1; i <= finger; i++){
      R(handX - 2 - i, handY - 2 + slope * i, 2, 2, BOSS_ACK_ARM.skinLight);
    }
  }

  // Rotate both joints through the overarm throw, keeping the shoulder planted.
  const THROW_RELEASE = 0.25;
  const THROW_REST = [36, -18], THROW_BACK = [220, 192], THROW_FORWARD = [125, 147];
  function bossThrowArm(shoulderX, shoulderY, at){
    const {wind, flight} = at ?? {wind:0, flight:0};
    const [from, to, progress] = flight === 0 ? [THROW_REST, THROW_BACK, wind]
      : flight < THROW_RELEASE ? [THROW_BACK, THROW_FORWARD, flight / THROW_RELEASE]
      : [THROW_FORWARD, THROW_REST, (flight - THROW_RELEASE) / (1 - THROW_RELEASE)];
    const k = smooth(progress);
    const upper = lerp(from[0], to[0], k) * Math.PI / 180;
    const forearm = lerp(from[1], to[1], k) * Math.PI / 180;
    const elbowX = shoulderX - 12 * Math.sin(upper), elbowY = shoulderY + 12 * Math.cos(upper);
    const handX = elbowX - 12 * Math.sin(forearm), handY = elbowY + 12 * Math.cos(forearm);
    return {elbowX, elbowY, handX, handY};
  }

  function drawBossThrow(b){
    const shoulderX = b.x - 11, shoulderY = b.y - 46;
    const throwing = S.comandas.map((_, part) => ({part, at:chickenThrow(S, part)})).find(t => t.at);
    const arm = bossThrowArm(shoulderX, shoulderY, throwing?.at);
    const sprite = crewFrame('boss-command', 'stand', false, 'bossPoint');
    const body = () => drawSprite(sprite, b.x, b.y, false);
    const limb = () => {
      drawCharacterArm(shoulderX, shoulderY, arm, BOSS_POINT_ARM);
      // The arm passes behind his head on the backswing, with the sleeve in front of his shirt.
      if(arm.handY < shoulderY || arm.elbowY < shoulderY){
        const headHeight = 24;
        g.drawImage(sprite, 0, 0, sprite.width, headHeight,
          Math.round(b.x - sprite.width / 2), Math.round(b.y - sprite.height), sprite.width, headHeight);
      }
    };
    if(!throwing){ body(); limb(); return; }
    const {part, at} = throwing, row = rowOf(S, part);
    const land = {x:Math.max(barStart(row) + 10, slotX(part, view.ends[part], S.comandas[part].committed)), y:wireY(row)};
    // Held by the tail until the swing lets it go at the release point, then it flies.
    const held = at.flight < THROW_RELEASE, fly = clamp01((at.flight - THROW_RELEASE) / (1 - THROW_RELEASE));
    const release = held ? arm : bossThrowArm(shoulderX, shoulderY, {flight:THROW_RELEASE});
    const x = lerp(release.handX + PULLEY_X - 2, land.x, fly);
    const y = lerp(release.handY + 4, land.y, fly) - 34 * 4 * fly * (1 - fly);
    const chicken = () => drawRubberChicken(x, Math.round(y), fly * 9, false);
    if(held && arm.handX >= shoulderX && arm.handY < shoulderY){ chicken(); body(); limb(); }
    else if(held){ body(); chicken(); limb(); }
    else { body(); limb(); chicken(); }
  }

  const GROG_GLOW = [150, 255, 84];
  const GROG_STREAM = [118, 222, 70];

  function drawCaskLeak(x, y, length){
    const bend = Math.ceil(length / 2);
    const glow = `rgb(${GROG_GLOW})`, stream = `rgb(${GROG_STREAM})`;
    R(x - 1, y - 1, 5, 3, 'rgba(47,73,29,.72)');
    R(x, y, 2, 2, glow);
    R(x + 1, y + 2, 1, bend - 2, stream);
    R(x + 1, y + bend, 2, 1, glow);
    R(x + 2, y + bend + 1, 1, length - bend - 1, stream);
    R(x + 1, y + length - 1, 3, 3, `rgba(${GROG_STREAM},.27)`);
    R(x + 2, y + length, 1, 2, glow);
  }

  function drawShelfGrog(){
    // A bright seam above each trail, with a drip and a shallow puddle on the floor.
    drawCaskLeak(333, 21, 7);
    drawCaskLeak(572, 25, 6);
    drawCaskLeak(666, 113, 12);
    if(!reducedMotion?.matches){
      const drip = (S.time * .7) % 1;
      if(drip < .6) R(668, 127 + Math.floor(7 * (drip / .6) ** 2), 1, 2, `rgb(${GROG_GLOW})`);
    }
    R(665, 136, 8, 1, `rgba(${GROG_STREAM},.41)`);

  function drawRollingCask(x, feet, angle){
    contactShadow(x, feet - 1, 18);
    g.save();
    g.translate(Math.round(x), feet - OIL_RADIUS);

  function drawPaymentNote(x, y, color, flagged){
    R(x, y + 5, 4, 3, '#242137');
    R(x + 3, y, 2, 7, '#242137');
    R(x, y + 5, 3, 2, color);
    R(x + 3, y, 1, 6, color);
    if(flagged) R(x + 4, y + 1, 2, 1, color);
  }

  function drawBizum(){
    const age = view.paymentAge, pulse = 1 - age / BIZUM_PULSE_S;
    const shake = pulse > 0 && !reducedMotion?.matches ? Math.round(3 * pulse * Math.sin(age * 54)) : 0;
    const x = SIGN_X - SIGN_HALF - 40, y = 82;
    R(x + 2, y + 3, 23, 24, '#302136');
    R(x, y, 23, 24, '#463041');
    R(x + 1, y + 1, 21, 22, '#805545');
    R(x + 2, y + 2, 19, 20, pulse > 0 ? '#304c56' : '#303246');
    g.drawImage($('bizum-mark'), x + 5 + shake, y + 4, 13, 16);

    if(pulse <= 0) return;
    g.save();
    const alpha = g.globalAlpha;
    for(const [dx, delay, direction, color] of [[6, 0, -1, '#acf7ee'], [16, .065, 1, '#e1caff']]){
      if(age < delay) continue;
      const progress = (age - delay) / (BIZUM_PULSE_S - delay);
      const rise = reducedMotion?.matches ? 0 : Math.round(progress * 12);
      g.globalAlpha = alpha * Math.min(1, (1 - progress) * 2.6);
      drawPaymentNote(x + dx + direction * Math.round(rise / 4), y - 10 - rise, color, direction > 0);
    }
    g.restore();
  }

  function drawBossCall(){
    // The bubble opens towards the room, clear of the right edge.
    const b = S.boss;
    if(b.say) drawSpeech(b.say.lines, b.x, b.y - bossSprite(false).height, '#ffe999', b.x > 600 ? b.x + 8 : W - 6, b.say.felt);
    else if(b.present && bossTalking()) drawSpeech(['¡Oído cocina!'], S.boss.x, S.boss.y - bossSprite(false).height, '#ffe999', S.boss.x + 8);
  }

  const CHECK_INK = '#149a3a';
  // The rubber chicken with a pulley in the middle, traced from the Monkey Island inventory icon
  // and drawn at the size of the props on the wire (one canvas pixel per pixel), so it stays in
  // proportion with the crew. The map keeps the icon's orientation (on its back, feet up, head to
  // the left) and is drawn mirrored, head to the right. The pulley is the one change: it faces us,
  // in line with the rope, which runs through its groove. One per partition, at the next offset.
  const CHICKEN_MAP = [
    '.rrf......f..f.......f....',
    'rrsqyyy...f.f.........f.f.',
    'rkssyy....sf..f.....fsf.f.',
    'bkks.ry....fsf........fs..',
    '.bbks.r...ff..........f.s.',
    '...bks...f.s..........f..f',
    '....bks....f.........s....',
    '.p..bbkksss..........f....',
    'nbpp.bbkssssk........f....',
    'bnbpp.bsssskkb......nnbb..',
    'bbnbbpppkkkkbd......ddbnb.',
    'bnb.bbnbdbbndd......ddddd.',
    '.bb..bbd.dddddd......ddd..',
    '.bbb.....ddddd........dd..',
    '..b...................d...'
  ];
  const CHICKEN_INK = {
    r:'#cc2a14', q:'#170d12', y:'#f0e030', s:'#f2c46a', k:'#ee9648', b:'#6e3a12', n:'#4e2c10',
    p:'#c07466', d:'#46100c', f:'#f4f0a4'
  };
  const CHICKEN_OUTLINE = '#170d12';
  // The pulley in map pixels. Its bottom hangs two pixels below the rope, so the groove takes
  // the rope; the body rests on the rope.
  const PULLEY = {x:17, y:11.3, r:4.7};
  const PULLEY_BOTTOM = Math.round(PULLEY.y + PULLEY.r), CHICKEN_ROWS = PULLEY_BOTTOM + 1;
  const CHICKEN_COLS = CHICKEN_MAP[0].length, PULLEY_X = CHICKEN_COLS - 1 - PULLEY.x;
  const CHICKEN_SPOKES = 3, CHICKEN_FRAMES = 12;
  let chickenBody = null;
  const pulleyFrames = [];

  // Thin toes and leg strokes stay without outline, like the feet in the icon.
  const chickenToe = (x, y) => CHICKEN_MAP[y]?.[x] === 'f' || (CHICKEN_MAP[y]?.[x] === 's' && y < 7 && (x > 8 && x < 14 || x > 19));
  function rubberChickenBody(){
    if(chickenBody) return chickenBody;
    const c = document.createElement('canvas');
    c.width = CHICKEN_COLS; c.height = CHICKEN_ROWS;
    const ctx = c.getContext('2d');
    const filled = (x, y) => (CHICKEN_MAP[y]?.[x] ?? '.') !== '.';
    for(let y = 0; y < CHICKEN_ROWS; y++) for(let x = 0; x < CHICKEN_COLS; x++){
      const solid = (a, b) => filled(a, b) && !chickenToe(a, b);
      const color = filled(x, y) ? CHICKEN_INK[CHICKEN_MAP[y][x]]
        : solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1) ? CHICKEN_OUTLINE : null;
      if(!color) continue;
      ctx.fillStyle = color;
      ctx.fillRect(CHICKEN_COLS - 1 - x, y, 1, 1);
    }
    return chickenBody = c;
  }

  // Drawn already mirrored: lit from the upper left, with three spokes turned by `frame`.
  function pulleySprite(frame){
    if(pulleyFrames[frame]) return pulleyFrames[frame];
    const c = document.createElement('canvas');
    c.width = CHICKEN_COLS; c.height = CHICKEN_ROWS;
    const ctx = c.getContext('2d');
    const step = Math.PI * 2 / CHICKEN_SPOKES, spin = frame / CHICKEN_FRAMES * step;
    for(let y = 0; y < CHICKEN_ROWS; y++) for(let x = 0; x < CHICKEN_COLS; x++){
      const dx = x - PULLEY_X, dy = y - PULLEY.y, d = Math.hypot(dx, dy);
      if(d > PULLEY.r + 0.5) continue;
      let color;
      if(d > PULLEY.r - 0.5) color = CHICKEN_OUTLINE;
      else if(d > PULLEY.r - 1.5){
        const light = -dx - dy * 1.2;
        color = light > 1.2 ? '#f0dc80' : light < -2.4 ? '#884a14' : '#e0a040';
      } else if(d < 0.7) color = '#46100c';
      else {
        // Screen y grows downwards, so a growing angle turns clockwise: rolling to the right.
        const angle = Math.atan2(dy, dx) - spin;
        const off = Math.abs(((angle % step) + step * 1.5) % step - step / 2);
        color = off < 0.42 ? '#884a14' : '#c8761a';
      }
      ctx.fillStyle = color;
      ctx.fillRect(x, y, 1, 1);
    }
    return pulleyFrames[frame] = c;
  }

  // x is the pulley's centre, y the wire. The rope is drawn again over the body and under the
  // pulley: the body rests on it and the pulley's near side hides it inside the groove.
  function drawRubberChicken(x, y, roll, onRope = true){
    const turns = roll / (Math.PI * 2 / CHICKEN_SPOKES);
    const frame = ((Math.round(turns * CHICKEN_FRAMES) % CHICKEN_FRAMES) + CHICKEN_FRAMES) % CHICKEN_FRAMES;
    const left = Math.round(x - PULLEY_X), top = y + 2 - PULLEY_BOTTOM;
    g.drawImage(rubberChickenBody(), left, top);
    const x0 = Math.max(left, barStart() + 2), x1 = Math.min(left + CHICKEN_COLS, barEnd() - 6), dashFrom = barStart() + 3;
    if(onRope && x1 > x0){
      R(x0, y - 1, x1 - x0, 1, PAL.black);
      R(x0, y, x1 - x0, 2, '#ab865b');
      for(let px = Math.max(x0, dashFrom); px < x1; px++) if((px - dashFrom) % 5 < 2) R(px, y, 1, 1, '#e8bd82');
    }
    g.drawImage(pulleySprite(frame), left, top);
  }

  // Two segments of fixed length with an elbow: the hand can only reach as far as the arm does.
  function cookArmPose(shoulderX, shoulderY, targetX, targetY, bend = targetX < shoulderX ? -1 : 1, segment = 12){
    const dx = targetX - shoulderX, dy = targetY - shoulderY;
    const dist = Math.hypot(dx, dy), reach = Math.min(dist, segment * 2 - 1);
    const ux = dist ? dx / dist : 1, uy = dist ? dy / dist : 0;
    const handX = shoulderX + ux * reach, handY = shoulderY + uy * reach;
    const lift = Math.sqrt(segment * segment - reach * reach / 4);
    return {
      handX, handY,
      elbowX:(shoulderX + handX) / 2 - uy * lift * bend,
      elbowY:(shoulderY + handY) / 2 + ux * lift * bend
    };
  }
  // The same arm, with the elbow on whichever side of the shoulder-hand line is nearer the hint.
  function armPoseNear(shoulderX, shoulderY, targetX, targetY, hintX, hintY){
    const arm = cookArmPose(shoulderX, shoulderY, targetX, targetY);
    const other = {...arm, elbowX:shoulderX + arm.handX - arm.elbowX, elbowY:shoulderY + arm.handY - arm.elbowY};
    const far = a => Math.hypot(a.elbowX - hintX, a.elbowY - hintY);
    return far(other) < far(arm) ? other : arm;
  }

  // Draw on the same two-pixel grid as the crew sprites, with the actor's own cloth and skin.
  function drawCharacterArm(shoulderX, shoulderY, arm, style, hand = true){
    g.save();
    g.translate(Math.round(shoulderX), Math.round(shoulderY));
    g.scale(2, 2);
    const elbow = {x:(arm.elbowX - shoulderX) / 2, y:(arm.elbowY - shoulderY) / 2};
    const wrist = {x:(arm.handX - shoulderX) / 2, y:(arm.handY - shoulderY) / 2};
    const line = (a, b, width, color, offset = 0) => {
      const steps = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y)));
      for(let i = 0; i <= steps; i++) R(lerp(a.x, b.x, i / steps) - width / 2 + offset,
        lerp(a.y, b.y, i / steps) - width / 2 + offset, width, width, color);
    };
    const origin = {x:0, y:0};
    const cuff = style.short ? {x:elbow.x * 0.35, y:elbow.y * 0.35} : elbow;
    line(origin, elbow, 3, style.bare || style.short ? style.skinEdge : style.edge);
    line(elbow, wrist, 3, style.bare || style.short || style.rolled ? style.skinEdge : style.edge);
    line(origin, elbow, 2, style.bare || style.short ? style.skin : style.sleeve);
    line(elbow, wrist, 2, style.bare || style.short || style.rolled ? style.skin : style.sleeve);
    line(origin, elbow, 1, style.bare || style.short ? style.skinLight : style.light, -0.5);
    line(elbow, wrist, 1, style.bare || style.short || style.rolled ? style.skinLight : style.light, -0.5);
    if(style.short){
      line(origin, cuff, 3, style.edge);
      line(origin, cuff, 2, style.sleeve);
      line(origin, cuff, 1, style.light, -0.5);
    }
    if(style.cuff){
      const length = Math.hypot(elbow.x, elbow.y) || 1;
      const nx = -elbow.y / length, ny = elbow.x / length;
      line({x:elbow.x + nx, y:elbow.y + ny}, {x:elbow.x - nx, y:elbow.y - ny}, 1, style.cuff);
      const hem = {x:elbow.x * .82, y:elbow.y * .82};
      line({x:hem.x + nx, y:hem.y + ny}, {x:hem.x - nx, y:hem.y - ny}, 1, style.light);
    }
    g.restore();
    if(hand) drawCharacterHand(arm.handX, arm.handY, style);
  }

  function drawCharacterHand(x, y, style){
    const hx = Math.round(x) - 3, hy = Math.round(y) - 3;
    R(hx, hy, 6, 6, style.skinEdge);
    R(hx, hy, 4, 4, style.skin);
    R(hx, hy, 4, 2, style.skinLight);
  }

  function drawCookArm(shoulderX, shoulderY, arm){
    drawCharacterArm(shoulderX, shoulderY, arm, COOK_ARM, false);
  }

  const CHALK_WHITE = '#eeeee2';
  function drawCookHand(x, y){
    R(x - 2, y - 2, 5, 5, COOK_ARM.skinEdge);
    R(x - 2, y - 2, 4, 3, COOK_ARM.skin);
    R(x - 2, y - 2, 3, 1, COOK_ARM.skinLight);
  }

  // The commit jump: a short crouch, up to the chicken, a small give on landing.
  function commitJump(t){
    if(t < COMMIT_TAKEOFF) return -Math.round(2 * Math.sin(Math.PI * t / COMMIT_TAKEOFF));
    if(t < COMMIT_LAND){
      const u = (t - COMMIT_TAKEOFF) / (COMMIT_LAND - COMMIT_TAKEOFF);
      return Math.round(COMMIT_JUMP_H * 4 * u * (1 - u));
    }
    return t < COMMIT_LAND + 0.1 ? -1 : 0;
  }

  // With its back to us, one arm goes up as it jumps and the hand meets the chicken's tail, behind
  // the pulley, pushing it to the right; it lets go and comes down while the chicken rolls on.
  const commitArmUp = t => t >= COMMIT_TAKEOFF * 0.5 && t <= COMMIT_LAND;
  function drawCommitPush(c, job, bodyX, feet){
    const t = job.timer;
    if(!commitArmUp(t)) return;
    const chicken = view.chickens[job.part], row = rowOf(S, job.part);
    const tail = {x:(chicken?.x ?? bodyX - MARK_STAND_DX) - PULLEY_X + 1, y:wireY(row) - 3};
    // The right shoulder of the cook seen from behind.
    const shoulderX = bodyX + 9, shoulderY = feet - 44;
    // Reaching while going up, on the tail at the top, and dropping away after the push.
    const reach = t < COMMIT_HIT ? smooth(clamp01((t - COMMIT_TAKEOFF * 0.5) / (COMMIT_HIT - COMMIT_TAKEOFF * 0.5)))
      : 1 - smooth(clamp01((t - COMMIT_HIT - 0.06) / (COMMIT_LAND - COMMIT_HIT - 0.06)));
    const rest = {x:shoulderX + 3, y:shoulderY + 16};
    const target = {x:lerp(rest.x, tail.x, reach), y:lerp(rest.y, tail.y, reach)};
    // The elbow stays out to the side, never across its back.
    const arm = armPoseNear(shoulderX, shoulderY, target.x, target.y, shoulderX + 12, shoulderY - 6);
    drawCookArm(shoulderX, shoulderY, arm);
    drawCookHand(arm.handX, arm.handY);
  }

  // Facing the room: lifts the glass mug of the rest scene to the lips, drinks it down, lowers it and
  // wipes the moustache. The arm is the far one, the one the sprite leaves free: like the seated
  // cook's, it and the mug pass behind the torso, so only the hand, the mug's front and its rim show
  // at the mouth. It starts and ends where that arm hangs, joining the plain sprite without a jump.
  function drawBeerPose(c, feet, progress, sprite, flip){
    const shoulderX = c.x - 9, shoulderY = feet - 44;
    const rest = {x:c.x - 13, y:feet - 22}, mouthX = c.x - 7, mouthY = feet - 49;
    const rimX = BEER_RIM.x - BEER_HANDLE.x, rimY = BEER_RIM.y - BEER_HANDLE.y;
    // The hand pivots on the handle so that the rim stays on the lips.
    const atLips = tilt => ({
      x:mouthX - (rimX * Math.cos(tilt) - rimY * Math.sin(tilt)),
      y:mouthY - (rimX * Math.sin(tilt) + rimY * Math.cos(tilt))
    });
    // The wrist sweeps out in front of the apron on the way to and from the mouth.
    const swing = (raised, k) => ({
      x:lerp(rest.x, raised.x, k) - 3 * Math.sin(Math.PI * k),
      y:lerp(rest.y, raised.y, k)
    });
    const lipTilt = .48, emptyTilt = 1.04;
    let hand = rest, tilt = 0, level = 1, holdingMug = true;
    if(progress !== null){
      if(progress < 0.18){
        const k = smooth(progress / 0.18);
        tilt = lipTilt * k;
        hand = swing(atLips(tilt), k);
      } else if(progress < 0.68){
        const k = (progress - 0.18) / 0.5;
        tilt = lerp(lipTilt, emptyTilt, k);
        level = 1 - smooth(clamp01(k * 1.1));
        hand = atLips(tilt);
      } else if(progress < 0.8){
        const k = 1 - smooth((progress - 0.68) / 0.12);
        tilt = emptyTilt * k;
        level = 0;
        hand = swing(atLips(tilt), k);
      } else {
        holdingMug = false;
        const k = smooth(clamp01((progress - .8) / .05)) * smooth(clamp01((1 - progress) / .05));
        const swipe = Math.sin(clamp01((progress - .85) / .1) * Math.PI * 2) * 3;
        hand = swing({x:c.x - 10 + swipe, y:feet - 48}, k);
      }
    }
    const arm = cookArmPose(shoulderX, shoulderY, hand.x, hand.y, -1);
    drawCookArm(shoulderX, shoulderY, arm);
    drawCookHand(arm.handX, arm.handY);
    if(holdingMug) drawBeerGlass(arm.handX, arm.handY, tilt, level);
    // The torso again on top, down to the hips, as in the rest scene.
    g.save();
    g.beginPath();
    g.rect(c.x - sprite.width, 0, sprite.width * 2, Math.round(feet - sprite.height) + REST_HIPS);
    g.clip();
    drawSprite(sprite, c.x, feet, flip);
    g.restore();
    // Wiping the moustache, the back of the hand comes in front of the face, and only up there.
    if(!holdingMug && arm.handY < feet - 38) drawCookHand(arm.handX, arm.handY);
  }

  // Green fumes curling up from the burner towards the cook's face.
  function drawFumes(c, top){
    const row = Math.round(c.pos), burnerX = barEnd(row) + 36, burnerY = stoveTop(row) - 4;
    for(let i = 0; i < 7; i++){
      const k = (S.time * 0.9 + i / 7) % 1;
      const x = burnerX - k * 30 + Math.sin(k * 9 + i) * 3, y = burnerY - k * 26;
      const size = Math.round(3 + k * 6);
      g.globalAlpha = 0.75 * (1 - k);
      R(x - size / 2, y - size / 2, size, size, '#7fd85a');
      R(x - size / 2 + 1, y - size / 2 + 1, Math.max(1, size - 3), Math.max(1, size - 3), '#c4f59a');
    }
    g.globalAlpha = 1;
  }

  // Cartoon stars going round the head of a knocked-out cook.
  function drawDizzyStars(x, y){
    for(let i = 0; i < 3; i++){
      const angle = S.time * 5 + i * Math.PI * 2 / 3;
      const sx = Math.round(x + Math.cos(angle) * 10), sy = Math.round(y + Math.sin(angle) * 4);
      R(sx - 2, sy, 5, 1, '#ffd23f');
      R(sx, sy - 2, 1, 5, '#ffd23f');
    }
  }

  // Beside the head rather than over it, so it stays clear of the wall and of the step button.
  function drawThought(lines, headX, headY){
    // Said to itself, in the same SCUMM lettering as the rest, but off to the side of the head.
    drawSpeech(lines, headX - 40, headY, '#f4d8ca', headX - 10);
  }

  // 12 rather than the font's native 16 (Pablo found 16 too big); it still reads as pixel lettering.
  const SPEECH_PX = 12, ASIDE_PX = 8;
  // Italic lines are what the speaker feels rather than says.
  // An aside (`small`) is lettered smaller than the rest of the dialogue.
  function drawSpeech(lines, headX, headY, color = '#ffe999', rightEdge = W - 6, italic = false, small = false){
    // SCUMM dialogue floats above the speaker. A one-pixel shadow keeps it legible on wood and sky.
    g.save();
    const size = small ? ASIDE_PX : SPEECH_PX, leading = size + 1;
    g.font = `${italic ? 'italic ' : ''}${size}px MonkeyDialogue, monospace`;
    g.textBaseline = 'top';
    const width = Math.max(...lines.map(line => g.measureText(line).width));
    const x = Math.round(Math.max(3, Math.min(rightEdge - width, headX - width / 2)));
    const y = Math.max(2, Math.round(headY - lines.length * leading - 5));
    g.textAlign = 'center';
    lines.forEach((line, i) => {
      const cx = Math.round(x + width / 2), cy = y + i * leading;
      g.fillStyle = '#100e1c';
      for(const [dx, dy] of [[-1,0],[1,0],[0,-1],[0,1],[1,1]]) g.fillText(line, cx + dx, cy + dy);
      g.fillStyle = color;
      g.fillText(line, cx, cy);
    });
    g.restore();
  }

  // ---- The stove that blew up: the bang itself, and what it leaves behind for the rest of the night ----

  const blastHash = i => Math.abs(Math.sin(i * 127.1 + 311.7) * 43758.5453) % 1;
  const BLAST_DEBRIS = ['#2f2c33', '#55525c', '#8b8f98', '#7a3b22', '#a8562e', '#c9ccd2'];

  // A pixel-chunky disc with a ragged edge, row by row.
  function blastBlob(cx, cy, r, color, seed = 0){
    if(r < 1) return;
    for(let dy = -r; dy <= r; dy += 2){
      const half = Math.sqrt(Math.max(0, r * r - dy * dy)) + (blastHash(seed + dy * 0.7) - 0.5) * 3;
      if(half > 0.5) R(Math.round(cx - half), Math.round(cy + dy), Math.round(half * 2), 2, color);
    }
  }

  // Soot and scorch on the cook whose stove blew up: the top of the cap burnt away, leaving a
  // ragged, smouldering rim and a few singed tufts; what is left of it charred, and face and clothes
  // streaked with soot. The black outline is kept, so it is still clearly the same cook.
  function charFrame(ctx, width, height, crouch){
    const image = ctx.getImageData(0, 0, width, height), d = image.data;
    // Where the cap starts in each column, and how deep the burn bites into it there (2 to 4 rows).
    const capTop = new Map();
    for(let y = 0; y < height; y++) for(let x = 0; x < width; x++){
      const sx = x >> 1, sy = (y >> 1) - crouch;
      if(sy <= 4 && d[(y * width + x) * 4 + 3] >= 128 && !capTop.has(sx)) capTop.set(sx, sy);
    }
    const bite = sx => 2 + Math.floor(blastHash(sx * 5 + 2) * 2.99);
    for(let y = 0; y < height; y++) for(let x = 0; x < width; x++){
      const p = (y * width + x) * 4;
      if(d[p + 3] < 128) continue;
      const sx = x >> 1, sy = (y >> 1) - crouch, n = blastHash(sx * 31 + sy * 7);
      if(sy <= 4 && capTop.has(sx)){
        const edge = Math.min(4, capTop.get(sx) + bite(sx));
        if(sy < edge){
          // Burnt away, but for a singed tuft of hair poking up here and there.
          if(sy === edge - 1 && n < 0.3) [d[p], d[p + 1], d[p + 2]] = [22, 16, 14];
          else d[p + 3] = 0;
          continue;
        }
        if(sy === edge){
          // The ragged rim: charcoal, with a dull glow here and there.
          [d[p], d[p + 1], d[p + 2]] = n < 0.3 ? [222, 104, 38] : n < 0.62 ? [122, 48, 24] : [64, 54, 50];
          continue;
        }
      }
      const lum = 0.3 * d[p] + 0.59 * d[p + 1] + 0.11 * d[p + 2];
      if(lum < 34) continue;
      if(sy <= 4){
        const tone = n < 0.16 ? [96, 44, 26] : lum > 175 ? [74, 64, 58] : lum > 125 ? [50, 43, 39] : [30, 25, 23];
        [d[p], d[p + 1], d[p + 2]] = tone;
        continue;
      }
      const k = sy <= 8 ? (n < 0.4 ? 0.6 : 0.28) : (n < 0.45 ? 0.7 : 0.36);
      d[p] = lerp(d[p], 40, k); d[p + 1] = lerp(d[p + 1], 33, k); d[p + 2] = lerp(d[p + 2], 34, k);
    }
    ctx.putImageData(image, 0, 0);
  }

  // What the fumes left on the charred cook: glowing green eyes (when they are open), a green
  // dribble running from the mouth off the chin, and green splashes on the apron. Seen from behind
  // only the splashes that reach round the sides show.
  function grogFrame(ctx, width, height, crouch, name, blink){
    const image = ctx.getImageData(0, 0, width, height), d = image.data;
    const paint = (sx, sy, rgb, alpha = 255, onlyInk = false) => {
      for(let y = (sy + crouch) * 2; y < (sy + crouch) * 2 + 2; y++) for(let x = sx * 2; x < sx * 2 + 2; x++){
        if(x < 0 || y < 0 || x >= width || y >= height) continue;
        const p = (y * width + x) * 4;
        if(onlyInk && d[p + 3] < 128) continue;
        [d[p], d[p + 1], d[p + 2]] = rgb; d[p + 3] = alpha;
      }
    };
    const front = !name.includes('back');
    if(front){
      if(!blink) paint(17, 7, GROG_GLOW);
      // The dribble: from the corner of the mouth, under the moustache, down off the chin.
      paint(16, 9, [92, 196, 58], 255, true);
      paint(16, 10, GROG_STREAM);
      paint(16, 11, [168, 246, 110], 150);
    }
    // Splashes on the apron: small irregular blotches, darker at the edges.
    const splashes = front ? [[16, 19, 1.6], [21, 21, 1.3], [18, 24, 1.5], [23, 25, 1]] : [[14, 21, 1.1], [25, 23, 1]];
    for(const [cx, cy, r] of splashes){
      for(let sy = Math.floor(cy - r - 1); sy <= cy + r + 1; sy++) for(let sx = Math.floor(cx - r - 1); sx <= cx + r + 1; sx++){
        const dist = Math.hypot(sx - cx, sy - cy) + (blastHash(sx * 13 + sy * 29) - 0.5) * 0.9;
        if(dist > r) continue;
        const p = (((sy + crouch) * 2) * width + sx * 2) * 4;
        if(p < 0 || p >= d.length || d[p + 3] < 128 || 0.3 * d[p] + 0.59 * d[p + 1] + 0.11 * d[p + 2] < 40) continue;
        paint(sx, sy, dist > r - 0.6 ? [64, 140, 44] : [104, 206, 64], 255, true);
      }
    }
    ctx.putImageData(image, 0, 0);
  }

  // A charred cook still smokes a little from the cap now and then.
  function drawSootWisps(x, y, seed){
    for(let i = 0; i < 2; i++){
      const cycle = (S.time * 0.8 + seed * 0.37 + i * 0.5) % 2.6;
      if(cycle > 1.5) continue;
      const k = cycle / 1.5, size = Math.round(2 + k * 3);
      g.globalAlpha = 0.7 * (1 - k);
      R(Math.round(x + Math.sin(k * 6 + i) * 3 - size / 2), Math.round(y - k * 16), size, size, '#6a646d');
    }
    g.globalAlpha = 1;
  }

  // Before the bang: the stove rattles, its flames shoot up and steam spurts out.
  function blastWarning(row){
    const c = S.cooks.find(k => k.row === row && k.faint?.phase === 'blast' && !k.faint.boomed);
    return c ? clamp01(c.faint.t / BLAST_BOOM_S) : 0;
  }
  function drawStoveRattle(row, k){
    const cx = stoveX(row), top = stoveTop(row), tick = Math.floor(S.time * 24);
    for(let i = 0; i < 5; i++){
      const h = Math.round(6 + k * 16 + ((tick + i * 2) % 3) * 3), x = cx - 16 + i * 7;
      R(x, top + 6 - h, 4, h, '#d8461e');
      R(x + 1, top + 8 - h, 2, Math.max(1, h - 4), '#ffc65a');
    }
    for(let i = 0; i < 3; i++){
      const u = (S.time * 2.4 + i / 3) % 1, size = Math.round(3 + u * 5);
      g.globalAlpha = 0.8 * (1 - u) * k;
      R(Math.round(cx + 18 + u * 10), Math.round(top - 8 - u * 18 - i * 3), size, size, '#e8e4ea');
    }
    g.globalAlpha = 1;
  }

  // Soot on the wall and the floor around the stove, and black blotches on the stove itself.
  function drawScorch(row){
    const cx = stoveX(row), top = stoveTop(row), floor = top + 39;
    g.globalAlpha = 0.5;
    for(let dy = -44; dy <= 8; dy += 2){
      const half = (dy < 0 ? 18 + (dy + 44) * 0.55 : 42 - dy * 2.5) + (blastHash(dy + 9) - 0.5) * 8;
      if(half > 0) R(Math.round(cx - half), floor + dy, Math.round(half * 2), 2, '#120c0e');
    }
    g.globalAlpha = 1;
  }
  function drawStoveSoot(row){
    const cx = stoveX(row), top = stoveTop(row);
    g.globalAlpha = 0.7;
    for(let i = 0; i < 16; i++){
      const x = cx - 21 + Math.floor(blastHash(i * 3) * 40), y = top - 20 + Math.floor(blastHash(i * 5 + 1) * 54);
      R(x, y, 2 + Math.floor(blastHash(i * 7) * 4), 2, '#17110f');
    }
    g.globalAlpha = 1;
  }

  // The bang, from the stove of the cook it caught, over a few seconds.
  function drawBlast(){
    const b = S.blast;
    if(!b) return;
    const a = S.time - b.at;
    if(a < 0 || a > 4.5) return;
    // Centred a little in front of the stove, which sits against the right edge of the scene.
    const cx = stoveX(b.row) - 14, cy = stoveTop(b.row) + 2, floor = stoveTop(b.row) + 39;
    const feet = barTop(b.row) + COOK_FEET;
    // Smoke: thick dark puffs that billow up and drift towards the room.
    for(let i = 0; i < 14; i++){
      const age = a - 0.08 - i * 0.05;
      if(age < 0 || age > 3.4) continue;
      const u = age / 3.4, spread = (blastHash(i) - 0.5) * 56;
      const x = cx + spread * (0.4 + u) - age * 7, y = cy - 6 - age * (16 + blastHash(i + 3) * 14);
      const r = Math.round(5 + age * 7 * (0.7 + blastHash(i + 5) * 0.6));
      g.globalAlpha = 0.9 * (1 - u) ** 1.2;
      blastBlob(x, y, r, '#3d3843', i);
      blastBlob(x - 1, y - 2, Math.round(r * 0.62), '#67616e', i + 40);
      blastBlob(x - 2, y - 3, Math.round(r * 0.3), '#8a8492', i + 80);
    }
    g.globalAlpha = 1;
    // The fireball: white-hot at the core, then orange, then dark red as it cools and lifts.
    if(a < 0.9){
      const grow = 1 - (1 - clamp01(a / 0.18)) ** 3, r = Math.round(44 * grow * (1 + a * 0.25));
      const lift = Math.round(a * 14);
      g.globalAlpha = a < 0.35 ? 1 : 1 - (a - 0.35) / 0.55;
      blastBlob(cx, cy - lift, r, '#a52a14', 1);
      blastBlob(cx, cy - lift - 2, Math.round(r * 0.8), '#f0641e', 2);
      blastBlob(cx, cy - lift - 4, Math.round(r * 0.58), '#ffb43c', 3);
      if(a < 0.32) blastBlob(cx, cy - lift - 4, Math.round(r * 0.36 * (1 - a / 0.32)), '#fff6d2', 4);
      g.globalAlpha = 1;
    }
    // The shockwave: a thin bright ring racing out.
    if(a < 0.42){
      const rr = 14 + a / 0.42 * 120;
      g.globalAlpha = 1 - a / 0.42;
      for(let i = 0; i < 48; i++){
        const t = i / 48 * Math.PI * 2;
        R(Math.round(cx + Math.cos(t) * rr), Math.round(cy + Math.sin(t) * rr * 0.55), 2, 2, '#fff1c2');
      }
      g.globalAlpha = 1;
    }
    // Bits of stove and pans thrown out, landing and lying there a moment.
    for(let i = 0; i < 12; i++){
      const vx = (blastHash(i * 3) - 0.55) * 340, vy = -110 - blastHash(i * 7) * 230;
      const rest = floor - 2 + Math.floor(blastHash(i * 11) * 14);
      let x = cx + vx * a, y = cy + vy * a + 430 * a * a;
      const landed = y >= rest;
      if(landed){
        const t = (-vy + Math.sqrt(vy * vy + 4 * 430 * (rest - cy))) / (2 * 430);
        x = cx + vx * Math.max(0, t);
        y = rest;
      }
      const fade = clamp01((2.6 - a) / 0.8), size = 3 + Math.floor(blastHash(i * 13) * 4);
      const turn = !landed && Math.floor(a * 14 + i) % 2;
      g.globalAlpha = fade;
      R(Math.round(x), Math.round(y), turn ? 2 : size, turn ? size : 2, BLAST_DEBRIS[i % BLAST_DEBRIS.length]);
    }
    g.globalAlpha = 1;
    // Sparks.
    for(let i = 0; i < 26; i++){
      const life = 0.45 + blastHash(i * 17) * 0.55;
      if(a > life) continue;
      const t = blastHash(i * 19) * Math.PI * 2, speed = 90 + blastHash(i * 23) * 230;
      const x = cx + Math.cos(t) * speed * a, y = cy + Math.sin(t) * speed * a * 0.8 + 170 * a * a;
      g.globalAlpha = 1 - a / life;
      R(Math.round(x), Math.round(y), i % 3 ? 1 : 2, i % 3 ? 1 : 2, i % 2 ? '#ffe27a' : '#ff8a2a');
    }
    g.globalAlpha = 1;
    // The slip that was in the cook's pocket: blown up and burnt to ash before it comes down.
    if(b.order){
      const x0 = COOK_X - 6, y0 = feet - 30;
      if(a < 0.95){
        const x = x0 - 60 * a + Math.sin(a * 11) * 4, y = y0 - 150 * a + 150 * a * a;
        const burnt = clamp01(a / 0.95), w = Math.floor(a * 10) % 2 ? 5 : 11, h = 12;
        drawLooseSlip(b.order, x, y, w, h);
        // Burning down from the top: charred, with a ragged glowing edge.
        const edge = Math.round(y - h / 2 + burnt * h);
        R(Math.round(x - w / 2), Math.round(y - h / 2), w, Math.max(0, edge - Math.round(y - h / 2)), '#1b1412');
        for(let i = 0; i < w; i++){
          const flicker = Math.floor(S.time * 20 + i) % 3;
          R(Math.round(x - w / 2) + i, edge - 1 - flicker, 1, 2 + flicker, flicker ? '#ff8a2a' : '#ffd45a');
        }
      } else if(a < 2.6){
        // Ash: a few flakes that see-saw down and vanish.
        const u = (a - 0.95) / 1.65;
        g.globalAlpha = 1 - u;
        for(let i = 0; i < 5; i++){
          const x = x0 - 57 + (i - 2) * 5 + Math.sin(a * 5 + i * 2) * 5, y = y0 - 50 + u * 40 + i * 3;
          R(Math.round(x), Math.round(y), 2, 1, i % 2 ? '#3a3333' : '#6d6466');
        }
        g.globalAlpha = 1;
      }
    }
    // Dust where the cook lands on its back.
    const landed = a - BLAST_FLY_S;
    if(landed > 0 && landed < 0.5){
      const u = landed / 0.5;
      g.globalAlpha = 0.7 * (1 - u);
      for(let i = 0; i < 4; i++) blastBlob(COOK_X - BLAST_KNOCK + 4 + (i - 1.5) * 12 * (1 + u), feet - 3 - u * 4, Math.round(2 + u * 4), '#8e8780', i);
      g.globalAlpha = 1;
    }
  }

  // Over the whole scene for the bang: a white flash, and the screen shaking for a moment.
  function blastAge(){ return S.blast ? S.time - S.blast.at : Infinity; }
  function drawBlastFlash(){
    const a = blastAge();
    if(a < 0 || a > 0.16) return;
    g.fillStyle = `rgba(255,248,226,${(0.88 * (1 - a / 0.16)).toFixed(3)})`;
    g.fillRect(0, 0, W, H);
  }
  function blastShake(){
    const a = blastAge();
    if(a < 0 || a > 0.75 || reducedMotion?.matches) return {x:0, y:0};
    const amp = 5 * (1 - a / 0.75) ** 2;
    return {x:Math.round(Math.sin(S.time * 93) * amp), y:Math.round(Math.cos(S.time * 71) * amp)};
  }

  // ---- Crutches: leaning on the back wall of the top row all along, then under a cook's arms ----

  const CRUTCH_L = 44;
  // Against the wall between the barrel and the chimney, their tips just behind the top stove.
  const crutchWall = () => ({x:694, feet:barTop(0) + COOK_FEET - 61});
  // A classic wooden underarm crutch, its rubber tip at the origin: one shaft that forks into two
  // rails, a hand grip across them and a padded rest on top. Black outline, like the crew.
  const CRUTCH_PARTS = [
    [-1, -4, 3, 4, '#2b2a2e'],
    [-1, -17, 3, 13, '#b98049'],
    [-4, -18, 9, 2, '#b98049'],
    [-4, -CRUTCH_L + 3, 2, CRUTCH_L - 20, '#c98d52'], [3, -CRUTCH_L + 3, 2, CRUTCH_L - 20, '#a06c3c'],
    [-3, -28, 7, 2, '#5a3a24'],
    [-6, -CRUTCH_L, 13, 4, '#6e5a4e']
  ];
  function drawCrutch(x, feet, angle){
    g.save();
    g.translate(Math.round(x), Math.round(feet));
    g.rotate(Math.round(angle / (Math.PI / 48)) * Math.PI / 48);
    for(const [px, py, w, h] of CRUTCH_PARTS) R(px - 1, py - 1, w + 2, h + 2, PAL.black);
    for(const [px, py, w, h, color] of CRUTCH_PARTS) R(px, py, w, h, color);
    g.restore();
  }
  // The pair, leaning on the back wall: drawn before the stove, which is in front of them.
  function drawWallCrutches(){
    if(S.cooks.some(c => c.crutches || (c.faint?.phase === 'crutches' && c.faint.t >= CRUTCH_STEP_S + CRUTCH_REACH_S * 0.35))) return;
    const {x, feet} = crutchWall();
    drawCrutch(x - 5, feet, 0.06);
    drawCrutch(x, feet, 0.1);
  }
  // Under the arms: the tips out to the sides, the rests in the armpits, swinging as it walks.
  // Side is anatomical depth: -1 is far, +1 is near. Facing maps it to screen space.
  // The sprite is turned three-quarters towards us, so the far arm is on the side it faces and the
  // near one on the side of its back: facing right, the body hides the crutch on the right.
  function crutchPose(bodyX, feet, side, walking, phase, facing = 1){
    // Pivot at the armpit, never at the floor: the rest stays attached through the stride.
    const swing = walking ? Math.sin(phase * 8) * 0.16 : 0;
    const screenSide = -side * facing;
    const angle = Math.round((-screenSide * 0.16 + facing * swing) / (Math.PI / 48)) * Math.PI / 48;
    const restX = bodyX + screenSide * 8, restY = feet - 43;
    const x = restX - Math.sin(angle) * CRUTCH_L, y = restY + Math.cos(angle) * CRUTCH_L;
    return {x, y, angle, screenSide, shoulderX:bodyX + screenSide * 8, shoulderY:feet - 46, handX:x + Math.sin(angle) * 27, handY:y - Math.cos(angle) * 27};
  }
  function drawCrutchUnderArm(bodyX, feet, side, walking, phase, facing = 1){
    const p = crutchPose(bodyX, feet, side, walking, phase, facing);
    drawCrutch(p.x, p.y, p.angle);
    return p;
  }
  function drawOnCrutches(c, bodyX, feet, faceRight, moving, walk, blink, push = null){
    const facing = faceRight ? 1 : -1;
    const far = drawCrutchUnderArm(bodyX, feet, -1, moving, c.phase, facing);
    const supported = crewFrame('cook-idle-' + c.id, moving && walk ? 'walk' : 'stand', blink, 'both', cookScars(c.id));
    drawCrutchGrip(c, bodyX, feet, -1, far);
    drawSprite(supported, bodyX, feet, faceRight);
    const near = push ? drawRaisedCrutch(c, bodyX, feet, push) : drawCrutchUnderArm(bodyX, feet, 1, moving, c.phase, facing);
    drawCrutchGrip(c, bodyX, feet, 1, near);
  }
  // The commit on crutches. Leaning on the far one, it takes the near crutch out from under its
  // arm and swings it out to its side and up, holding it by the grip with the rubber tip on top. The tip
  // goes against the chicken's tail and drags it along the rope; then the crutch comes back
  // down under the arm. The crutch passes in front of the body, left of the face.
  function drawRaisedCrutch(c, bodyX, feet, job){
    const t = job.timer, under = crutchPose(bodyX, feet, 1, false, c.phase, 1);
    const chicken = view.chickens[job.part], row = rowOf(S, job.part);
