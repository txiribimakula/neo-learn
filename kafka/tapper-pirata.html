  // 0 when the fist is on the table, 1 at the top of the swing: a slow rise and a sudden drop.
  function poundLift(time){
    const k = (time % POUND_S) / POUND_S;
    return k < 0.75 ? k / 0.75 : 1 - (k - 0.75) / 0.25;
  }

  function drawPoundingFist(c, top){
    const lift = poundLift(S.time);
    const seatBounce = lift < 0.2 ? 2 : 0;
    const shoulderX = c.x + 9, shoulderY = top - 11 - seatBounce;
    const elbowX = c.x + 15, elbowY = top - 1;
    const angle = lift * 1.25, forearm = 13;
    const fistX = elbowX + Math.cos(angle) * forearm, fistY = elbowY - Math.sin(angle) * forearm - 1;
    const stroke = (x0, y0, x1, y1, size, color) => {
      const steps = Math.ceil(Math.hypot(x1 - x0, y1 - y0)) || 1;
      for(let i = 0; i <= steps; i++) R(lerp(x0, x1, i / steps) - size / 2, lerp(y0, y1, i / steps) - size / 2, size, size, color);
    };
    const shirt = DINERS[c.letter].sleeve;
    stroke(shoulderX, shoulderY, elbowX, elbowY, 7, PAL.black);
    stroke(elbowX, elbowY, fistX, fistY, 7, PAL.black);
    stroke(shoulderX, shoulderY, elbowX, elbowY, 5, shirt);
    stroke(elbowX, elbowY, fistX, fistY, 5, shirt);
    R(fistX - 4, fistY - 4, 8, 8, PAL.black);
    R(fistX - 3, fistY - 3, 6, 6, DINERS[c.letter].skin);
    if(lift < 0.2){
      // Little impact lines on the table.
      for(const [dx, dy] of [[-9, 0], [-7, -4], [8, 0], [6, -4]]) R(fistX + dx, top - 1 + dy, 2, 2, PAL.white);
    }
  }

  function drawTableFood(){
    S.customers.forEach(c => {
      const top = tableTop(c.table);
      if(isImpatient(c)) drawPoundingFist(c, top);
      if(c.eating) drawPlate(TABLE_X - 24, top - 6, c.eating, false, c.timer / EAT_S);
      c.plates.forEach((message, i) => drawPlate(TABLE_X - 2 + i * 16, top - 6, message));
    });
    // Plates nobody asked for, left on the table a moment, at a slant.
    S.strays.forEach(p => drawPlate(TABLE_X + 22, tableTop(p.table) - 6 + (Math.floor(p.t * 6) % 2), p.order));
  }


  function drawDinerBubbles(){
    S.customers.forEach(c => {
      const top = tableTop(c.table);
      if(c.state === 'asking' || c.state === 'seated' || c.state === 'complain') drawMenu(c, top - 15);
      // Clear of the tab on the left edge of the scene.
      if(c.state === 'complain'){
        const lines = c.timer > COMPLAIN_S ? ['Kurwa!'] : c.complaintLines;
        drawSpeech(lines, c.x, top - 78, DINERS[c.letter].voice);
      } else if(c.say){
        const lines = c.say.dishComplaint && c.say.t < KURWA_S ? ['Kurwa!'] : c.say.lines;
        drawSpeech(lines, c.x, top - 78, DINERS[c.letter].voice);
      }
      if(c.puzzled > 0){
        // A course came before the one it follows.
        const bx = TABLE_X + 31, by = top - 54;
        R(bx - 1, by - 1, 17, 13, PAL.black);
        R(bx, by, 15, 11, PAL.white);
        text('?!', bx + 2, by + 2, PAL.red);
      }
    });
  }

  const stride = e => { e.walkPhase += frameTick; return Math.floor(e.walkPhase * 10) % 2 === 1; };
  // The notepad is blank while it walks to a table or back home, and in the key's color otherwise.
  const waiterKey = w => (w.state === 'back' || w.state === 'toTable' ? null : w.letter);

  function drawOrderWaiter(w){
    const phase = S.build && S.build.phase;
    if(w === S.barWaiters[0] && (phase === 'signWipe' || phase === 'signWrite')){
      drawWaiterAtBoard(w, phase);
      return;
    }
    const moving = w.state === 'toTable' || w.state === 'toBar' || w.state === 'back' || (w.state === 'moving' && w.walking);
    const side = w.faceLeft ? -1 : 1, lift = moving ? 0 : breathLift(w.home.x);
    drawSprite(crewFrame('waiter-note', moving && stride(w) ? 'walk' : 'stand', isBlinking(w.home.y)), w.x, w.y, !w.faceLeft, lift);
    drawNotepad(waiterKey(w), w.x + side * 22 - 4, w.y - 49 - lift);
  }

  // At the board, facing it: one arm up with the cloth or the chalk, the notepad in its pocket.
  function drawWaiterAtBoard(w, phase){
    drawSprite(crewFrame('waiter-board', 'stand', false, true), w.x, w.y, false);
    const hand = signHand(S.build), shoulderX = w.x + 5, shoulderY = w.y - 46;
    const arm = cookArmPose(shoulderX, shoulderY, hand.x, hand.y);
    drawCookArm(shoulderX, shoulderY, arm);
    if(phase === 'signWipe'){
      R(arm.handX - 4, arm.handY - 3, 9, 7, PAL.black);
      R(arm.handX - 3, arm.handY - 2, 7, 5, '#c8c0b0');
    } else {
      R(arm.handX, arm.handY - 5, 2, 4, CHALK_WHITE);
    }
    drawCookHand(arm.handX, arm.handY);
  }

  function drawTrayWaiter(w){
    const moving = w.state === 'toPlate' || w.state === 'deliver' || w.state === 'return';
    const side = w.faceLeft ? -1 : 1;
    // The tray only moves with the breath when it is empty: the plate has to line up with the counter.
    const lift = moving || w.plate ? 0 : breathLift(w.home.y);
    const trayX = w.x + side * TRAY_REACH, trayY = w.y - TRAY_HEIGHT - lift;
    // Place the upturned palm under the tray, including when it meets the counter.
    const bodyX = trayX - side * 24, feet = trayY + 46 + lift;
    drawSprite(crewFrame('waiter-tray', moving && stride(w) ? 'walk' : 'stand', isBlinking(w.home.x)), bodyX, feet, !w.faceLeft, lift);
    drawTray(trayX, trayY);
    if(w.plate) drawPlateBar(trayX, trayY - 9, w.plate);
  }

  // He faces the dining room, and now and then glances back at the kitchen, but not while an order
  // goes up. When each ticket arrives he calls «¡Oído cocina!» towards the waiter: the bubble
  // stays up a little longer than the waiter waits.
  const bossTalking = () => S.time - S.boss.saidAt < OIDO_SHOW_S;
  // A post of the new wire: k of its height out of the floor, and lift off the floor while carried.
  function drawPost(px, k, lift = 0){
    const wire = wireY(NEW_ROW), top = barTop(NEW_ROW) - lift, full = top + 38 - wire + 4 + lift;
    if(k <= 0) return;
    const h = Math.max(2, Math.round(full * k));
    R(px - 5, top + 36, 14, 4, PAL.black);
    R(px - 1, top + 38 - h, 6, h, PAL.black);
    R(px, top + 39 - h, 4, h - 2, '#79513c');
    R(px, top + 39 - h, 1, h - 2, '#c89454');
    R(px - 2, top + 39 - h, 8, 2, '#d5a15e');
  }

  // The first post, pulled up out of the floor in tugs, with dust at its foot while it comes out.
  function drawWireBuild(){
    const build = S.wire;
    if(!build || S.comandas.length > 1) return;
    drawPost(RIGHT_POST_X - 2, build.rightPost);
    if(build.phase === 'raise' || build.phase === 'raise2'){
      const ground = barTop(NEW_ROW) + 37;
      const px = build.phase === 'raise' ? RIGHT_POST_X - 2 : build.secondX;
      for(const dx of [-8, 11]) R(px + dx, ground - (Math.floor(build.t * 10) % 2) * 2, 2, 2, '#9a9a9a');
    }
  }


  function drawBoss(overScene = false){
    const b = S.boss, talking = bossTalking();
    if(!b.present && !b.entering) return;
    if(b.entering !== overScene) return;
    if(b.entering){
      const step = b.walking && Math.floor(b.walkPhase * 8) % 2 === 1;
      const speaking = !!b.say;
      drawSprite(bossSprite(speaking, isBlinking(11), b.leg || (step ? 'walk' : 'stand')), b.x, b.y, !b.faceLeft);
      if(b.nervous){
        const drop = S.build.t / SEARCH_S;
        R(b.x + 8, b.y - 60 + Math.round(drop * 10), 2, 3, '#7fd4ff');
      }
      return;
    }
    const orderGoingUp = talking || S.barWaiters.some(w => w.state === 'toBar' || w.state === 'order' || w.state === 'awaitAck');
    const oil = bossOilPose(b);
    drawSprite(bossSprite(talking, isBlinking(11), oil ? oil.leg : 'stand'), b.x, b.y,
      oil ? oil.facing : !orderGoingUp && isGlancing(11), oil || talking ? 0 : breathLift(11));
    if(oil && oil.visible) drawOilDrum(oil, b.y);
    if(oil && oil.visible && b.monkey) drawThreeHeadedMonkey(oil, b.y);
    if(oil && oil.impact){
      R(b.x + 13, b.y - 16, 3, 2, PAL.white);
      R(b.x + 17, b.y - 20, 2, 3, PAL.white);
      R(b.x + 14, b.y - 3, 3, 2, PAL.white);
    }
  }

  // On top of the rolling drum, a three-headed monkey keeps its balance: arms out, feet treading
  // the other way, swaying; more so after the kick.
  function drawThreeHeadedMonkey(oil, feet){
    const top = feet - OIL_RADIUS * 2 - 1;
    const moving = oil.impact || oil.angle > 0;
    const rock = Math.sin(S.time * 9);
    const image = document.getElementById('monkey');
    g.save();
    g.translate(Math.round(oil.x + rock * (moving ? 2 : 1)), Math.round(top - (moving && rock > 0 ? 2 : 0)));
    g.rotate(Math.round(rock * (moving ? 3 : 1)) * Math.PI / 48);
    g.drawImage(image, -21, -44, 42, 44);
    g.restore();
  }

  function drawOilDrum(oil, feet){
    // A dark steel drum on its side: concentric metal rims, a bung and an OIL stencil.
    R(oil.x - 9, feet, 18, 2, PAL.black);
    g.save();
    g.translate(Math.round(oil.x), feet - OIL_RADIUS);
    g.rotate(Math.round(oil.angle / (Math.PI / 8)) * Math.PI / 8);
    // Stepped circles keep the silhouette consistent with the arcade's pixel grid.
    const disk = (radius, color) => {
      for(let y = -radius; y < radius; y++){
        const half = Math.floor(Math.sqrt(radius * radius - (y + 0.5) * (y + 0.5)));
        R(-half, y, half * 2, 1, color);
      }
    };
    disk(11, PAL.black);
    disk(10, '#89939a');
    disk(8, '#26313b');
    R(-5, -8, 6, 2, '#c3cbd0');
    R(3, -6, 3, 3, PAL.black);
    R(4, -6, 1, 1, '#89939a');
    R(-9, -3, 18, 9, '#d9aa42');
    text('OIL', 0, -2, PAL.black, 'center');
    R(-3, 8, 5, 1, '#596775');
    g.restore();
  }

  function drawBossCall(){
    // The bubble opens towards the room, clear of the tab on the right edge.
    const b = S.boss;
    if(b.say) drawSpeech(b.say.lines, b.x, b.y - bossSprite(false).height, '#ffe999', b.x > 600 ? b.x + 8 : W - 6);
    else if(b.present && bossTalking()) drawSpeech(['¡OÍDO COCINA!'], S.boss.x, S.boss.y - bossSprite(false).height, '#ffe999', S.boss.x + 8);
  }

  const STAMP_INK = '#149a3a';
  const lerp = (a, b, k) => a + (b - a) * k;
  const clamp01 = k => Math.min(1, Math.max(0, k));

  // The ink a stamp leaves on an order: a small box with a tick.
  function drawStampMark(cx, ticketY){
    const x = Math.round(cx), y = Math.round(ticketY) + 10;
    R(x - 7, y, 14, 1, STAMP_INK);
    R(x - 7, y + 10, 14, 1, STAMP_INK);
    R(x - 7, y, 1, 11, STAMP_INK);
    R(x + 6, y, 1, 11, STAMP_INK);
    [[-4, 5], [-3, 6], [-2, 7], [-1, 6], [0, 5], [1, 4], [2, 3], [3, 2]].forEach(([dx, dy]) => R(x + dx, y + dy, 2, 2, STAMP_INK));
  }

  // Two segments of fixed length with an elbow: the hand can only reach as far as the arm does.
  function cookArmPose(shoulderX, shoulderY, targetX, targetY){
    const segment = 12;
    const dx = targetX - shoulderX, dy = targetY - shoulderY;
    const dist = Math.max(1, Math.hypot(dx, dy)), reach = Math.min(dist, segment * 2 - 1);
    const handX = shoulderX + dx / dist * reach, handY = shoulderY + dy / dist * reach;
    const lift = Math.sqrt(segment * segment - reach * reach / 4);
    return {
      handX, handY,
      elbowX:(shoulderX + handX) / 2 + Math.abs(dy / dist) * lift,
      elbowY:(shoulderY + handY) / 2 + Math.abs(dx / dist) * lift
    };
  }

  function drawCookArm(shoulderX, shoulderY, arm){
    const stroke = (x0, y0, x1, y1, size, color) => {
      const steps = Math.ceil(Math.hypot(x1 - x0, y1 - y0));
      for(let i = 0; i <= steps; i++) R(lerp(x0, x1, i / steps) - size / 2, lerp(y0, y1, i / steps) - size / 2, size, size, color);
    };
    stroke(shoulderX, shoulderY, arm.elbowX, arm.elbowY, 5, '#573d42');
    stroke(arm.elbowX, arm.elbowY, arm.handX, arm.handY, 5, '#56373a');
    stroke(shoulderX, shoulderY, arm.elbowX, arm.elbowY, 4, '#d5b89b');
    stroke(arm.elbowX, arm.elbowY, arm.handX, arm.handY, 3, '#b47b5d');
  }

  const CHALK_WHITE = '#eeeee2';
  function drawCookHand(x, y){
    R(x - 2, y - 2, 5, 5, '#684040');
    R(x - 2, y - 2, 4, 3, '#d89b70');
  }

  // Seen from behind, between the cook and the order: the further from the order, the bigger.
  function drawStampTool(x, y, size){
    const half = Math.round(7 * size), knob = Math.round(3 * size);
    const bx = Math.round(x), by = Math.round(y);
    R(bx - half - 1, by - half - 1, half * 2 + 2, half * 2 + 2, PAL.black);
    R(bx - half, by - half, half * 2, half * 2, PAL.greyDark);
    R(bx - half, by + half - 2, half * 2, 2, STAMP_INK);
    R(bx - knob - 1, by - knob - 1, knob * 2 + 2, knob * 2 + 2, PAL.black);
    R(bx - knob, by - knob, knob * 2, knob * 2, '#b8732a');
  }

  // What the arcade's bartender leaves behind: thin pale streaks and a couple of curls of air.
  function drawWisp(wisp){
    const fade = wisp.life / WISP_S, x = wisp.x, y = wisp.feet - 30 - (1 - fade) * 5;
    const before = g.globalAlpha;
    g.globalAlpha = 0.85 * Math.min(1, fade * 1.6);
    const line = points => points.forEach(([dx, dy], i) => {
      if(i === 0) return;
      const [px, py] = points[i - 1];
      const steps = Math.ceil(Math.hypot(dx - px, dy - py));
      for(let n = 0; n <= steps; n++) R(x + lerp(px, dx, n / steps), y + lerp(py, dy, n / steps), 2, 2, '#d8f5d0');
    });
    // Streaks trailing away to one side.
    line([[-24, 4], [-12, 1], [-2, 2]]);
    line([[-20, 10], [-8, 7], [2, 9]]);
    // Big curl above, small one beside it.
    line([[-2, 2], [3, -3], [5, -10], [2, -16], [-3, -15], [-4, -10], [0, -8]]);
    line([[8, 9], [12, 4], [12, -2], [9, -5], [6, -3]]);
    g.globalAlpha = before;
  }

  // The little jump of a commit: just high enough for the arm to reach the order at the top.
  const jumpHeight = progress => (progress < 0.35 || progress > 0.65 ? 0 : COOK_JUMP * Math.sin((progress - 0.35) / 0.3 * Math.PI));

  // Committing: from behind, under the order, lifts the stamp and jumps to press it at the top.
  // Drawn before the cook: from where we look, the order, the stamp, the arm and then the body.
  function drawCommitPose(c, ticketX, ticketY, feet, progress){
    const shoulderX = c.x + 6, shoulderY = feet - 46;
    const out = clamp01(progress / 0.2) * clamp01((1 - progress) / 0.15);
    const press = clamp01((progress - 0.4) / 0.1) * clamp01((0.6 - progress) / 0.1);
    // Pressed off-center, on the arm's side, so the head hides only part of it.
    const pressX = ticketX + 6, pressY = ticketY + 15;
    const raisedX = c.x + 8, raisedY = feet - 48;
    if(progress >= 0.5) drawStampMark(ticketX, ticketY);
    const arm = cookArmPose(shoulderX, shoulderY,
      lerp(c.x + 10, lerp(raisedX, pressX, press), out),
      lerp(feet - 16, lerp(raisedY, pressY, press), out));
    if(out > 0.1) drawStampTool(arm.handX, arm.handY, lerp(1.15, 1, press));
    drawCookHand(arm.handX, arm.handY);
    drawCookArm(shoulderX, shoulderY, arm);
  }

  // What is in that oven: a door that rattles, a look inside, tentacles, and the door shut again.
  // Timeline over the whole gag: rattle, reach for the door, open, tentacles, close, a last rattle.
  const ovenOpenAmount = t => clamp01((t - OVEN_OPEN_AT) / OVEN_DOOR_S) * clamp01((OVEN_SHUT_AT - t) / OVEN_DOOR_S);
  const ovenRattling = t => t < 0.45 || (t > OVEN_SHUT_AT + 0.1 && t < OVEN_SHUT_AT + 0.3);
  const tentaclesOut = t => clamp01((t - OVEN_OUT_AT + 0.16) / 0.16) * clamp01((OVEN_IN_AT + 0.16 - t) / 0.16);

  // The free end of the door, hinged at the bottom of the stove and falling towards the cook.
  function ovenDoorEnd(row, open){
    const hingeX = barEnd(row) + 26, hingeY = stoveTop(row) + 35;
    const angle = open * Math.PI / 2 * 0.9;
    return {x:hingeX - Math.sin(angle) * 30, y:hingeY - Math.cos(angle) * 30};
  }

  // Where the cook stands during the gag, relative to its spot. Opening: holding the door, it goes
  // back with it and takes a few more steps. Closing is the same backwards: it walks up to the
  // open door first, takes it, and comes forward with it as it shuts.
  function ovenBodyOffset(row, t){
    const armLength = 14;
    const holding = barEnd(row) + 26 - 30 * Math.sin(Math.PI / 2 * 0.9) - armLength - COOK_X;
    if(t < OVEN_OPEN_AT || t >= OVEN_SHUT_AT) return 0;
    const followDoor = () => Math.min(0, ovenDoorEnd(row, ovenOpenAmount(t)).x - armLength - COOK_X);
    if(t < OVEN_OPEN_AT + OVEN_DOOR_S || t > OVEN_SHUT_AT - OVEN_DOOR_S) return followDoor();
    const away = lerp(holding, -OVEN_RETREAT_X, clamp01((t - OVEN_OPEN_AT - OVEN_DOOR_S) / OVEN_STEP_S));
    const closingAt = OVEN_SHUT_AT - OVEN_DOOR_S - OVEN_STEP_S;
    return t < closingAt ? away : lerp(-OVEN_RETREAT_X, holding, (t - closingAt) / OVEN_STEP_S);
  }

  // The hand is on the door from just before it opens until it is down, and again when closing.
  const ovenHandOnDoor = t => (t > 0.45 && t < OVEN_OPEN_AT + OVEN_DOOR_S) || (t > OVEN_SHUT_AT - OVEN_DOOR_S && t < OVEN_SHUT_AT + 0.08);

  function drawTentacle(startX, startY, length, phase, wave){
    const steps = Math.max(1, Math.round(length));
    const point = i => {
      const t = i / steps;
      return [startX - t * length, startY - t * t * length * 0.45 + Math.sin(t * 7 + phase) * wave * t];
    };
    for(let i = steps; i >= 0; i--){
      const [x, y] = point(i), size = Math.max(2, Math.round(6 - 4 * i / steps));
      R(x - size / 2 - 1, y - size / 2 - 1, size + 2, size + 2, PAL.black);
    }
    for(let i = steps; i >= 0; i--){
      const [x, y] = point(i), size = Math.max(2, Math.round(6 - 4 * i / steps));
      R(x - size / 2, y - size / 2, size, size, '#a03cc8');
    }
    for(let i = 3; i < steps - 2; i += 5){
      const [x, y] = point(i);
      R(x - 1, y, 2, 2, '#ffb0e8');
    }
  }

  // A cat's paw swiping out of the oven: out of reach of the cook, but not for lack of trying.
  // From the bottom of the swing: up is the first swipe, down the second, up again the third.
  function drawCatPaw(startX, startY, reach, time){
    const strokes = clamp01((time - OVEN_OUT_AT) / (PAW_SWIPES * PAW_SWIPE_S)) * PAW_SWIPES;
    const swipe = Math.cos(strokes * Math.PI) * 0.6;
    const endX = startX - Math.cos(swipe) * reach, endY = startY + Math.sin(swipe) * reach;
    const steps = Math.max(1, Math.round(reach));
    for(let i = 0; i <= steps; i++) R(lerp(startX, endX, i / steps) - 4, lerp(startY, endY, i / steps) - 4, 8, 8, PAL.black);
    for(let i = 0; i <= steps; i++){
      const striped = i % 6 < 2;
      R(lerp(startX, endX, i / steps) - 3, lerp(startY, endY, i / steps) - 3, 6, 6, striped ? '#b8732a' : '#f2a33a');
    }
    const px = Math.round(endX), py = Math.round(endY);
    R(px - 6, py - 5, 11, 11, PAL.black);
    R(px - 5, py - 4, 9, 9, '#f2a33a');
    R(px - 4, py - 1, 4, 3, '#ffb0c8');
    // Claws out.
    for(const dy of [-5, -1, 3]){
      R(px - 10, py + dy, 5, 2, PAL.black);
      R(px - 9, py + dy, 4, 1, PAL.white);
    }
  }

  function drawOvenGag(top, oven, time, kind){
    const x = oven - 16, y = top - 2;
    const open = ovenOpenAmount(time);
    const rattle = ovenRattling(time) && Math.floor(S.time * 22) % 2 ? 1 : 0;
    if(open <= 0){
      // Closed door, rattling on its hinge.
      R(x - 1 + rattle, y + 5, 7, 33, '#292032');
      R(x + rattle, y + 6, 4, 31, '#68535a');
      R(x - 5 + rattle, y + 17, 5, 16, '#292032');
      R(x - 4 + rattle, y + 18, 3, 14, '#c18c53');
      return;
    }
    // The way in, then the door falling open towards the cook, hinged at the bottom.
    R(x - 1, y + 5, 7, 33, '#292032');
    R(x, y + 6, 4, 31, '#3a1408');
    const grown = tentaclesOut(time);
    if(grown > 0 && kind === 'cat'){
      drawCatPaw(x + 2, y + 18, 20 * grown, time);
    } else if(grown > 0){
      const time = S.time * 5;
      drawTentacle(x + 2, y + 10, 16 * grown, time, 3);
      drawTentacle(x + 2, y + 19, 22 * grown, time + 2, 3);
      drawTentacle(x + 2, y + 28, 14 * grown, time + 4, 2);
    }
    const hingeX = x, hingeY = y + 37, row = [0, 1, 2].reduce((best, r) => (Math.abs(stoveTop(r) - top) < Math.abs(stoveTop(best) - top) ? r : best), 0);
    const {x:endX, y:endY} = ovenDoorEnd(row, open);
    const steps = 30;
    for(let i = 0; i <= steps; i++) R(lerp(hingeX, endX, i / steps) - 3, lerp(hingeY, endY, i / steps) - 3, 6, 6, '#292032');
    for(let i = 0; i <= steps; i++) R(lerp(hingeX, endX, i / steps) - 2, lerp(hingeY, endY, i / steps) - 2, 4, 4, '#68535a');
    R(endX - 3, endY - 3, 6, 6, '#c18c53');
  }

  // A rigid mug: drawn once and rotated around the handle, so tilting never changes its shape.
  const mugCache = {};
  function mugSprite(level){
    if(mugCache[level]) return mugCache[level];
    const c = document.createElement('canvas');
    c.width = 18; c.height = 15;
    const ctx = c.getContext('2d');
    const rect = (x, y, w, h, color) => { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); };
    rect(0, 0, 12, 15, PAL.black);
    rect(12, 3, 6, 9, PAL.black);
    rect(13, 5, 3, 5, '#e8a33d');
    rect(14, 6, 1, 3, PAL.black);
    rect(1, 1, 10, 13, '#fff4d6');
    rect(1, 1 + level, 10, 13 - level, '#e8a33d');
    rect(1, 1 + level, 10, 3, PAL.white);
    rect(3, 5 + level, 1, Math.max(1, 7 - level), '#ffd98a');
    return mugCache[level] = c;
  }

  // Angle in small steps, like frames of a sprite. The hand holds the mug by the handle.
  function drawMug(handX, handY, angle, level){
    const spr = mugSprite(level), step = Math.round(angle / 0.2) * 0.2;
    g.save();
    g.translate(Math.round(handX), Math.round(handY));
    g.rotate(step);
    g.drawImage(spr, -15, -8);
    g.restore();
  }

  // Facing the room: lifts the mug, takes a long sip, puts it away and wipes the moustache.
  function drawBeerPose(c, feet, progress){
    const shoulderX = c.x - 5, shoulderY = feet - 46;
    const hipX = c.x - 8, hipY = feet - 18, mouthX = c.x - 8, mouthY = feet - 49;
    let targetX = hipX, targetY = hipY, tilt = 0, level = 0, holdingMug = true;
    if(progress < 0.2){
      targetX = lerp(hipX, mouthX, progress / 0.2);
      targetY = lerp(hipY, mouthY, progress / 0.2);
    } else if(progress < 0.7){
      targetX = mouthX;
      targetY = mouthY;
      tilt = 0.8 * clamp01((progress - 0.2) / 0.15);
      // The beer goes down as he drinks.
      level = Math.floor(clamp01((progress - 0.3) / 0.4) * 6);
    } else if(progress < 0.85){
      targetX = lerp(mouthX, hipX, (progress - 0.7) / 0.15);
      targetY = lerp(mouthY, hipY, (progress - 0.7) / 0.15);
      tilt = 0.8 * (1 - clamp01((progress - 0.7) / 0.08));
      level = 6;
    } else {
      // Mug away: the back of the hand over the moustache.
      holdingMug = false;
      targetX = c.x - 12 + 4 * Math.sin((progress - 0.85) / 0.15 * Math.PI * 2);
      targetY = feet - 49;
    }
    const arm = cookArmPose(shoulderX, shoulderY, targetX, targetY);
    if(holdingMug) drawMug(arm.handX, arm.handY, tilt, level);
    drawCookArm(shoulderX, shoulderY, arm);
    drawCookHand(arm.handX, arm.handY);
  }

  // Green fumes curling up from the burner towards the cook's face.
  function drawFumes(c, top){
    const row = Math.round(c.pos), burnerX = barEnd(row) + 36, burnerY = stoveTop(row) - 4;
    for(let i = 0; i < 7; i++){
      const k = (S.time * 0.9 + i / 7) % 1;
      const x = burnerX - k * 30 + Math.sin(k * 9 + i) * 3, y = burnerY - k * 26;
      const size = Math.round(3 + k * 6);
      g.globalAlpha = 0.75 * (1 - k);
      R(x - size / 2, y - size / 2, size, size, '#7fd85a');
      R(x - size / 2 + 1, y - size / 2 + 1, Math.max(1, size - 3), Math.max(1, size - 3), '#c4f59a');
    }
    g.globalAlpha = 1;
  }

  // Cartoon stars going round the head of a knocked-out cook.
  function drawDizzyStars(x, y){
    for(let i = 0; i < 3; i++){
      const angle = S.time * 5 + i * Math.PI * 2 / 3;
      const sx = Math.round(x + Math.cos(angle) * 10), sy = Math.round(y + Math.sin(angle) * 4);
      R(sx - 2, sy, 5, 1, '#ffd23f');
      R(sx, sy - 2, 1, 5, '#ffd23f');
    }
  }

  // A tiny trademark sign, set as a superscript.
  // Beside the head rather than over it, so it stays clear of the wall and of the step button.
  function drawThought(lines, headX, headY){
    const width = Math.max(...lines.map(line => line.length)) * 6 + 12, height = lines.length * 10 + 6;
    const x = Math.max(4, Math.round(headX - width - 22)), y = Math.max(FLOOR_TOP + 2, Math.round(headY - height / 2 - 6));
    // Rounded corners, so it reads as a cloud and not as speech.
    R(x, y - 1, width, height + 2, PAL.black); R(x - 1, y, width + 2, height, PAL.black);
    R(x + 1, y, width - 2, height, PAL.white); R(x, y + 1, width, height - 2, PAL.white);
    // Puffs, smaller and smaller, towards the head.
    const midY = y + height / 2;
    [[x + width + 5, midY + 2, 3], [x + width + 12, midY + 4, 2], [headX - 7, midY + 5, 1]].forEach(([px, py, r]) => {
      R(Math.round(px) - r - 1, Math.round(py) - r - 1, r * 2 + 2, r * 2 + 2, PAL.black);
      R(Math.round(px) - r, Math.round(py) - r, r * 2, r * 2, PAL.white);
    });
    lines.forEach((line, k) => text(line, x + 6, y + 4 + k * 10, PAL.black));
  }

  function drawSpeech(lines, headX, headY, color = '#ffe999', rightEdge = W - 6){
    // SCUMM dialogue floats above the speaker. A one-pixel shadow keeps it legible on wood and sky.
    g.save();
    g.font = '16px MonkeyDialogue, monospace';
    g.textBaseline = 'top';
    const width = Math.max(...lines.map(line => g.measureText(line).width));
    const x = Math.round(Math.max(3, Math.min(rightEdge - width, headX - width / 2)));
    const y = Math.max(2, Math.round(headY - lines.length * 17 - 5));
    g.textAlign = 'center';
    lines.forEach((line, i) => {
      const cx = Math.round(x + width / 2), cy = y + i * 17;
      g.fillStyle = '#100e1c';
      for(const [dx, dy] of [[-1,0],[1,0],[0,-1],[0,1],[1,1]]) g.fillText(line, cx + dx, cy + dy);
      g.fillStyle = color;
      g.fillText(line, cx, cy);
    });
    g.restore();
  }

  // Fumes, a fall flat on the floor, coming round with a question, and back on its feet.
  function drawFaintingCook(c, top){
    const f = c.faint, feet = top + COOK_FEET;
    if(f.phase === 'fumes'){
      const sway = Math.round(Math.sin(S.time * 9) * 1.5 * Math.min(1, f.t / 0.5));
      drawSprite(cookSprite(c.id, 'down', false, f.t > FUMES_S * 0.6), c.x + sway, feet, true);
      drawFumes(c, top);
      return;
    }
    // Angle of the body: falling flat, then straight back on its feet to ask its question.
    const angle = f.phase === 'fainted'
      ? -Math.PI / 2 * clamp01(f.t / 0.25)
      : lerp(-Math.PI / 2, 0, clamp01(f.t / GET_UP_S));
    const lying = Math.abs(Math.sin(angle));
    const spr = cookSprite(c.id, 'down', false, f.phase === 'fainted');
    const pivotX = c.x + 22 * lying, pivotY = feet - 17 * lying;
    g.save();
    g.translate(Math.round(pivotX), Math.round(pivotY));
    g.rotate(angle);
    g.drawImage(spr, -Math.round(spr.width / 2), -spr.height);
    g.restore();
    // Follow the head as the sprite rotates around its feet.
    const headX = pivotX + Math.sin(angle) * 60, headY = pivotY - Math.cos(angle) * 60;
    if(f.phase === 'fainted') drawDizzyStars(headX, headY - 8);
  }

  function drawWakeBubble(c){
    const f = c.faint;
    if(f?.phase !== 'waking' || f.t < GET_UP_S) return;
    const headY = barTop(c.pos) + COOK_FEET - 68;
    if(f.waking){
      if(f.waking.length) drawSpeech(f.waking, c.x, headY);
    } else {
      drawSpeech(['Am I already at', 'Monkey Island™?'], c.x, headY);
    }
  }

  // A new cook drags its stove in, facing it and walking backwards, then sets it up and lights it.
  function drawArrivingCook(c, top){
    const row = c.row, feet = top + COOK_FEET, installing = c.arriving.phase === 'install';
    const x = installing ? stoveX(row) : c.x + 32, base = stoveTop(row) + 40;
    if(!installing){
      // Scrape marks on the floor behind it, and dust where it grinds along.
      R(Math.round(x + 18), base - 1, W - Math.round(x + 18), 1, '#3a3a3a');
      if(c.walking) for(const [dx, dy] of [[20, -3], [25, -6], [22, -9]]) R(x + dx + (Math.floor(S.time * 12) % 2) * 2, base + dy, 2, 2, '#9a9a9a');
    }
    drawStove(x, stoveTop(row));
    if(installing) drawFlames(x, stoveTop(row), c.arriving.t > INSTALL_S / 2);
    c.phase = (c.phase || 0) + frameTick;
    const walk = c.walking && Math.floor(c.phase * 10) % 2 === 1;
    // Leaning back on each heave.
    const lean = !installing && c.walking ? 2 : 0;
    drawSprite(cookSprite(c.id, 'reach', walk, false), c.x - lean, feet, true);
  }


  // How a cook stands while it moves the kitchen about: holding a post, pushing its stove up from
  // below with its back to us, or tugging a new post out of the floor. Null for ordinary poses.
  function buildingPose(c){
    if(!c.building) return null;
    const b = S.build, w = S.wire;
    if(c.id === 0 && b && b.phase === 'lift') return {pose:'reach', flip:true};
    if(c.id === 1 && w && ['raise', 'raise2', 'carry', 'plant'].includes(w.phase)){
      return {pose:'reach', flip:true, tug:w.phase === 'raise' || w.phase === 'raise2' ? (Math.floor(w.t * 6) % 2) * 3 : 0};
    }
    return null;
  }

  // The second post in the new cook's hands, with the wire running back to the first one, and the
  // thump when it goes into the floor. Drawn over the cook, who holds it.
  function drawCarriedPost(){
    const build = S.wire;
    if(!build || build.secondX === null || S.comandas.length > 1) return;
    const wire = wireY(NEW_ROW), x0 = Math.round(build.secondX + 2), x1 = RIGHT_POST_X;
    R(x0, wire - 1 - Math.round(build.lift / 2), x1 - x0, 3, PAL.black);
    R(x0, wire - Math.round(build.lift / 2), x1 - x0, 1, '#dbb378');
    drawPost(Math.round(build.secondX), build.second, Math.round(build.lift));
    if(build.phase === 'plant' && build.lift < 2){
      const ground = barTop(NEW_ROW) + 37;
      for(const dx of [-9, 12]) R(build.secondX + dx, ground - 2, 2, 2, '#9a9a9a');
    }
  }


  // Into the bin with a back heel: the cook, back to the bin, tosses the order up, lets it drop
  // behind and heels it in, in the air.
  // A back-heel flick, as in football: the order is dropped by the feet, and the heel flicks it
  // up and backwards, low over the floor, into the bin behind.
  const KICK_AT = 0.5;
  const heelUp = k => k > KICK_AT - 0.1 && k < KICK_AT + 0.14;

  function binTossAt(c, feet, job){
    const k = job.timer / BIN_S;
    // Its back to the bin: the heel is on the side it is not facing.
    const back = c.faceLeft ? 1 : -1;
    const hand = {x:c.x - back * 8, y:feet - 34}, floor = {x:c.x + back * 7, y:feet - 4};
    const bin = S.bin ? {x:S.bin.x, y:BIN_TOP - 2} : {x:c.x + back * 40, y:feet};
    // Let go: it drops to the floor right behind its heel, and lies there a moment.
    if(k < 0.3){
      const t = (k / 0.3) ** 2;
      return {x:lerp(hand.x, floor.x, t), y:lerp(hand.y, floor.y, t)};
    }
    if(k < KICK_AT) return floor;
    // The flick: a parabola up and back, from the floor wherever it is to the mouth of the bin,
    // higher the further it has to go.
    const t = clamp01((job.timer - KICK_AT * BIN_S) / (binDuration(job) - KICK_AT * BIN_S));
    const arc = 20 + Math.abs(bin.x - floor.x) * 0.12 + Math.max(0, floor.y - bin.y) * 0.3;
    const hop = (a, b, u, h) => ({x:lerp(a.x, b.x, u), y:lerp(a.y, b.y, u) - 4 * h * u * (1 - u)});
    if(!job.rimShot) return hop(floor, bin, t, arc);
    // On the rim: it hits the near edge, hops to the far one, hops back, and drops in.
    const side = Math.sign(bin.x - floor.x) || 1;
    const near = {x:bin.x - side * 8, y:bin.y - 3}, far = {x:bin.x + side * 8, y:bin.y - 3};
    const settle = {x:bin.x - side * 3, y:bin.y - 3}, inside = {x:bin.x, y:bin.y + 6};
    const [a, b, c2] = RIM_SPLITS;
    if(t < a) return hop(floor, near, t / a, arc);
    if(t < b) return hop(near, far, (t - a) / (b - a), 12);
    if(t < c2) return hop(far, settle, (t - b) / (c2 - b), 6);
    return hop(settle, inside, (t - c2) / (1 - c2), 0);
  }
  // Where the flight of a rim shot hits the rim, and where it drops in.
  const RIM_SPLITS = [0.43, 0.68, 0.86];

  function drawBinToss(c, feet, job){
    const k = clamp01(job.timer / BIN_S);
    const at = binTossAt(c, feet, job);
    // The order tumbles: seen face on, edge on, face on.
    const w = Math.floor(job.timer * 14) % 2 ? 4 : 10;
    drawLooseSlip(job.order, at.x, at.y, w, 12);
    if(k > KICK_AT && k < KICK_AT + 0.08){
      // The smack of the heel.
      const back = c.faceLeft ? 1 : -1;
      for(const [dx, dy] of [[-6, -6], [-8, -1], [-3, -9], [2, -7]]) R(c.x + back * (7 - dx), feet - 4 + dy, 2, 2, PAL.white);
    }
    if(job.rimShot && S.bin){
      // A clank on the rim at each bounce.
      const t = clamp01((job.timer - KICK_AT * BIN_S) / (binDuration(job) - KICK_AT * BIN_S));
      const clank = RIM_SPLITS.slice(0, 2).some(at => t > at && t < at + 0.05);
      if(clank) for(const [dx, dy] of [[-4, -5], [0, -7], [4, -5]]) R(at.x + dx, at.y + dy, 2, 2, PAL.white);
    }
  }

  function drawCooks(){
    stoveRows().forEach(row => {
      const cooking = S.cooks.some(c => c.job && (c.job.cookRow ?? rowOf(S, c.job.part)) === row && c.job.phase === 'cook');
      drawFlames(stoveX(row), stoveTop(row), cooking);
    });
    S.cooks.forEach(c => {
      const top = barTop(c.pos);
      if(c.arriving){
        drawArrivingCook(c, top);
        return;
      }
      const special = buildingPose(c);
      if(special){
        c.phase = (c.phase || 0) + frameTick;
        const walk = c.walking && Math.floor(c.phase * 10) % 2 === 1;
        drawSprite(cookSprite(c.id, special.pose, walk, isBlinking(c.id + 7)), c.x, top + COOK_FEET, special.flip, special.tug || 0);
        return;
      }
      if(c.faint && c.faint.phase !== 'waiting'){
        drawFaintingCook(c, top);
        return;
      }
      const job = c.job;
      c.phase = (c.phase || 0) + frameTick;
      const walk = c.walking && Math.floor(c.phase * 10) % 2 === 1;
      const side = c.faceLeft ? -1 : 1;
      if(!c.active) g.globalAlpha = 0.55;
      const stamping = job && job.phase === 'commit';
      const progress = stamping ? job.timer / commitDuration(job) : 0;
      const jump = stamping ? jumpHeight(progress) : 0;
      // Near the counter the plate in hand comes to the height of its top, like the waiter's tray.
      const gag = c.oven;
      // Backs away from the open door and gives a start when what is inside comes out.
      const gagRow = Math.round(c.pos);
      const gagOffset = gag === null ? 0 : ovenBodyOffset(gagRow, gag);
      // Steps whenever it is moving: with the door, or on its own a little further.
      const backingOff = gag !== null && gagOffset !== 0 && ((gag > OVEN_OPEN_AT && gag < OVEN_OPEN_AT + OVEN_DOOR_S + OVEN_STEP_S) || (gag > OVEN_SHUT_AT - OVEN_DOOR_S - OVEN_STEP_S && gag < OVEN_SHUT_AT));
      const startle = gag !== null && gag > OVEN_OUT_AT - 0.16 && gag < OVEN_OUT_AT + 0.1 ? 6 * Math.sin((gag - OVEN_OUT_AT + 0.16) / 0.26 * Math.PI) : 0;
      const bodyX = c.x + gagOffset;
      const counterTrip = job && ['toCounter', 'drop'].includes(job.phase);
      const nearCounter = counterTrip ? clamp01(1 - Math.abs(c.pos - PLATES_ROW)) : 0;
      // Up to the counter's height and back down gently, even when the phase changes on the spot.
      const lift = (COOK_FEET - COUNTER_HEIGHT) * nearCounter;
      c.lift = c.lift === undefined || Math.abs(c.pos - Math.round(c.pos)) > 0.01 ? lift
        : c.lift + Math.sign(lift - c.lift) * Math.min(Math.abs(lift - c.lift), COUNTER_LIFT_SPEED * frameTick);
      // Tying the hourglass, it goes up on tiptoe to reach the bottom of the paper.
      const tiptoe = job && job.phase === 'hang' ? Math.round(3 * Math.sin(Math.PI * clamp01(job.timer / HANG_S))) : 0;
      const feet = top + COOK_FEET - jump - startle - c.lift - tiptoe;
      const reading = job && (job.phase === 'read' || job.phase === 'hang' || job.phase === 'take');
      if(jump > 0){
        // Shadow left on the floor, so the jump reads as a jump.
        R(c.x - 9, top + COOK_FEET - 2, 18, 3, '#2c2c2c');
      }
      const carrying = job && ['toStove', 'cook', 'plate', 'toCounter', 'drop'].includes(job.phase);
      if(stamping){
        const row = rowOf(S, job.part);
        const ticketX = Math.max(barStart(row) + 10, slotX(job.part, view.ends[job.part], job.offset));
        drawCommitPose(c, ticketX, ticketTop(row), feet, progress);
      }
      const beer = c.beer === null ? null : c.beer / BEER_SIP_S;
      const pose = reading ? 'back' : stamping ? 'backFree' : carrying ? 'reach' : beer !== null ? 'downFree' : 'down';
      const dashing = c.windup >= DASH_WINDUP_S;
      const winding = c.windup > 0 && !dashing;
      // Wisps of air stay where the cook was, for a moment after it has gone.
      c.wisps = (c.wisps || []).map(wisp => ({...wisp, life:wisp.life - frameTick})).filter(wisp => wisp.life > 0);
      if(dashing && !c.wasDashing && frameTick) c.wisps.push({x:c.x, feet, life:WISP_S});
      c.wasDashing = dashing;
      c.wisps.forEach(drawWisp);
      const standing = !job && !c.walking && beer === null && gag === null && !winding && !dashing;
      const handOnDoor = gag !== null && ovenHandOnDoor(gag);
      const stepping = backingOff && Math.floor(S.time * 10) % 2 === 1;
      const heel = job && job.phase === 'bin' && heelUp(job.timer / BIN_S);
      const body = cookSprite(c.id, winding ? 'windup' : handOnDoor ? 'downFree' : heel ? 'downFree' : pose, dashing || walk || stepping, isBlinking(c.id + 7), heel);
      const faceRight = gag !== null || (!reading && !stamping && beer === null && !c.faceLeft);
      drawSprite(body, bodyX, feet, standing && isGlancing(c.id + 7) ? !faceRight : faceRight, standing ? breathLift(c.id + 7) : 0);
      if(gag !== null) drawOvenGag(stoveTop(gagRow), barEnd(gagRow) + 42, gag, c.ovenKind);
      if(handOnDoor){
        const door = ovenDoorEnd(gagRow, ovenOpenAmount(gag));
        const shoulderX = bodyX + 5, shoulderY = feet - 46;
        const arm = cookArmPose(shoulderX, shoulderY, door.x, door.y);
        drawCookArm(shoulderX, shoulderY, arm);
        drawCookHand(arm.handX, arm.handY);
      }
      if(beer !== null) drawBeerPose(c, feet, beer);
      g.globalAlpha = 1;
      // On the cook's own body, so it never covers the orders while walking past them.
      if(!job) return;
      const row = job.cookRow ?? rowOf(S, job.part), oven = barEnd(row) + 42, st = stoveTop(row);
      // Read, the order goes in the cook's head: nothing is carried to the stove.
      // The hourglass it ties goes up in front of it, so behind its body: see drawHangingHourglasses.
      if(job.phase === 'bin'){
        drawBinToss(c, feet, job);
      } else if(job.phase === 'cook'){
        drawDish(job.order.items[0], oven - 6, st - 16, 15);
        R(oven - 17, st - 12, 22, 3, PAL.black);
        R(oven - 15, st - 34, 30, 5, PAL.black);
        R(oven - 14, st - 33, 28 * Math.min(1, job.timer / job.dur), 3, c.slow ? PAL.red : '#6dff6d');
      } else if(job.phase === 'plate'){
        drawPlate(oven - 6, st - 10, job.order);
      } else if(job.phase === 'toCounter'){
        drawPlate(c.x + side * 24, feet - 45, job.order);
      } else if(job.phase === 'drop'){
        const k = job.timer / PLATE_DROP_S;
        drawPlate(lerp(c.x - 24, COUNTER_END - 8, k), feet - lerp(45, 39, k), job.order);
      }
    });
    drawCarriedPost();

  }



  function drawFlights(part){
    S.tickets.forEach(ticket => {
      if(ticket.part !== part) return;
      const tilt = ticket.lost ? Math.floor(ticket.t * 24) % 2 * 2 : 0;
      drawTicketBar(flightX(ticket), ticketTop(rowOf(S, part)) + tilt, ticket.order, {loosePeg:ticket.lost});
    });
  }

  const flightX = ticket => ticket.x0 + (barEnd() - 34 - ticket.x0) * ticket.t;

  // ---- Kafka view: each kind of actor turns into the box it stands for ----

  // Ordered dither in 2px blocks: at level n of 16 the incoming picture takes exactly the blocks
  // the outgoing one leaves, so a morph never shows holes nor both pictures on the same pixel.
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const ditherTiles = [false, true].map(incoming => Array.from({length:17}, (_, level) => {
    const c = document.createElement('canvas');
    c.width = 8; c.height = 8;
    const ctx = c.getContext('2d');
    ctx.fillStyle = PAL.black;
    BAYER.forEach((rank, i) => { if((rank < level) === incoming) ctx.fillRect(i % 4 * 2, Math.floor(i / 4) * 2, 2, 2); });
    return c;
  }));
  const morphLayers = [];
  let morphDepth = 0;

  function morphLayer(i){
    if(!morphLayers[i]){
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      morphLayers[i] = {c, ctx, patterns:{}};
    }
    return morphLayers[i];
  }

  // Draws one picture, the other, or a pixel dissolve between them, k being how far it has gone.
  // Morphs nest: a ticket carried by a cook dissolves on its own inside the cook's dissolve.
  function morphDraw(k, drawFrom, drawTo, area = null){
    if(k <= 0) return drawFrom();
    if(k >= 1) return drawTo();
    const level = Math.min(15, Math.max(1, Math.round(k * 16)));
    const x = area ? Math.max(0, Math.floor(area.x)) : 0, y = area ? Math.max(0, Math.floor(area.y)) : 0;
    const w = (area ? Math.min(W, Math.ceil(area.x + area.w)) : W) - x;
    const h = (area ? Math.min(H, Math.ceil(area.y + area.h)) : H) - y;
    if(w <= 0 || h <= 0) return;
    const target = g, depth = morphDepth++;
    try {
      [drawFrom, drawTo].forEach((paint, incoming) => {
        const layer = morphLayer(depth * 2 + incoming), ctx = layer.ctx;
        ctx.clearRect(x, y, w, h);
        g = ctx;
        paint();
        g = target;
        const key = incoming * 17 + level;
        if(!layer.patterns[key]) layer.patterns[key] = ctx.createPattern(ditherTiles[incoming][level], 'repeat');
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'destination-in';
        ctx.fillStyle = layer.patterns[key];
        ctx.fillRect(x, y, w, h);
        ctx.globalCompositeOperation = 'source-over';
        target.drawImage(layer.c, x, y, w, h, x, y, w, h);
      });
    } finally {
      g = target;
      morphDepth--;
    }
  }

  const mixOf = stage => kafkaMix[stage];

  // Tickets and plates also travel inside other actors, so each one changes look with its own stage.
  function drawTicket(cx, top, order, opts = {}){
    morphDraw(mixOf(STAGE.topic), () => drawTicketBar(cx, top, order, opts), () => drawRecord(cx, top, order, opts),
      {x:cx - 13, y:top - 9, w:27, h:35});
  }

  function drawPlate(cx, cy, order, dim, left = 1){
    morphDraw(mixOf(STAGE.outside), () => drawPlateBar(cx, cy, order, dim, left), () => drawResult(cx, cy, order, dim, left),
      {x:cx - 13, y:cy - 6, w:27, h:18});
  }

  function kafkaBox(x, y, w, h, border, fill = KAFKA.fill){
    R(x - 1, y - 1, w + 2, h + 2, PAL.black);
    R(x, y, w, h, border);
    R(x + 2, y + 2, w - 4, h - 4, fill);
  }

  function diagramPanel({x, y, w, h}, title, color){
    kafkaBox(x, y, w, h, color, KAFKA.log);
    R(x + 2, y + 2, w - 4, 9, color);
    text(title, x + w / 2, y + 3, PAL.black, 'center');
  }

  // A name tab sitting on top of a box.
  function kafkaTab(x, y, label, color){
    const w = label.length * 6 + 5;
    R(x - 1, y - 1, w + 2, 11, PAL.black);
    R(x, y, w, 10, color);
    text(label, x + 3, y + 2, PAL.black);
  }

  // In Kafka a message carries no dish, only data: three lines whose lengths tell one message from another.
  const PAYLOAD_INK = '#7a80a0';
  function drawPayload(x, y, order, longest, thick, pitch){
    for(let i = 0; i < 3; i++) R(x, y + i * pitch, longest - (order.id * (i + 2) + i * 3) % Math.ceil(longest / 2), thick, PAYLOAD_INK);
  }

  // A record: the key is the color of its header, the value is plain data, and the offset is only
  // written once the broker has appended it to the partition.
  function drawRecord(cx, top, order, opts = {}){
    const x = Math.round(cx - 10), y = Math.round(top), before = g.globalAlpha;
    g.globalAlpha = before * (opts.dim ? 0.45 : 1);
    R(x - 1, y - 1, 22, 24, PAL.black);
    R(x, y, 20, 22, PAL.white);
    R(x, y, 20, 9, COLORS.customers[order.letter]);
    if(opts.offset !== undefined) text(String(opts.offset), x + 10, y + 1, PAL.black, 'center');
    if(order.materialOp) text(order.materialOp[0], x + 10, y + 12, PAL.black, 'center');
    else drawPayload(x + 3, y + 12, order, 14, 2, 3);
    g.globalAlpha = before;
    if(opts.fresh || opts.outline){
      const color = opts.outline || PAL.white;
      R(x - 1, y - 1, 22, 1, color); R(x - 1, y + 22, 22, 1, color);
      R(x - 1, y - 1, 1, 24, color); R(x + 20, y - 1, 1, 24, color);
    }
  }

  // A message too small to carry its offset: waiting in the producer, in flight or in a consumer's hands.
  function drawMiniRecord(x, y, order, alpha = 1){
    const before = g.globalAlpha;
    g.globalAlpha = before * alpha;
    R(x - 1, y - 1, 12, 15, PAL.black);
    R(x, y, 10, 13, PAL.white);
    R(x, y, 10, 3, COLORS.customers[order.letter]);
    if(order.materialOp) text(order.materialOp[0], x + 5, y + 5, PAL.black, 'center');
    else drawPayload(x + 1, y + 5, order, 8, 1, 3);
    g.globalAlpha = before;
  }

  // What a consumer made of a message: no longer Kafka, just a done result in the color of its key.
  const CHECK_MARK = [[7, 1], [6, 2], [7, 2], [0, 3], [5, 3], [6, 3], [0, 4], [1, 4], [4, 4], [5, 4], [1, 5], [2, 5], [3, 5], [4, 5], [2, 6], [3, 6]];
  function drawResult(cx, cy, order, dim, left = 1){
    const x = Math.round(cx), y = Math.round(cy), before = g.globalAlpha;
    g.globalAlpha = before * (dim ? 0.55 : 1);
    R(x - 12, y - 5, 24, 16, PAL.black);
    R(x - 11, y - 4, 22, 14, COLORS.customers[order.letter]);
    R(x - 5, y - 2, 10, 10, PAL.white);
    // Being used up: only the bottom rows of the mark remain, as on a half-eaten plate.
    const rows = Math.max(1, Math.ceil(8 * left));
    CHECK_MARK.forEach(([col, row]) => { if(row >= 8 - rows) R(x - 4 + col, y - 1 + row, 1, 1, STAMP_INK); });
    g.globalAlpha = before;
  }


  // ---- Layout of the Kafka view: a diagram where the processes stay put and only messages move ----

  // One producer on the left with its partitioner inside, the topic in the middle, and on the right,
  // between the two partitions, the group holding both consumers.
  const PRODUCER_BOX = {x:22, y:132, w:152, h:148};
  const PARTITIONER_BOX = {x:26, y:204, w:144, h:70};
  // Both sides share a baseline, with the group clear of the lower partition.
  const GROUP_BOX = {x:600, y:132, w:114, h:148};
  const MATERIAL_BOX = {x:210, y:132, w:374, h:148};
  // While the only wire hangs in the middle, the group sits under it instead.
  const GROUP_UNDER = {x:626, y:262, w:90, h:150};
  const groupBox = () => {
    const under = S.rows.includes(PLATES_ROW);
    if(!S.move) return under ? GROUP_UNDER : GROUP_BOX;
    // While the wire is carried up, the group slides to its place with it.
    const k = S.move.k, mix = key => Math.round(lerp(GROUP_UNDER[key], GROUP_BOX[key], k));
    return {x:mix('x'), y:mix('y'), w:mix('w'), h:mix('h')};
  };
  const CONSUMER_W = 76, CONSUMER_H = 42;
  // A diner's messages are in the producer from the moment it orders until the partitioner takes them.
  const UNSENT = ['enter', 'waitingWaiter', 'asking'];
  // Each partition has its batch in the partitioner, and a line out of the producer into the partition.
  const batchLaneY = part => PARTITIONER_BOX.y + 16 + part * 20;
  const BATCH_X = PARTITIONER_BOX.x + 48, ROUTE_X = 180;
  // Inside each partition, over its records, the lane new messages run along to the end of the log.
  const logLaneY = part => ticketTop(rowOf(S, part)) - 15;
  const consumerSpot = id => { const box = groupBox(); return {x:box.x + (box.w - CONSUMER_W) / 2, y:id === 0 ? box.y + 21 : box.y + box.h - 6 - CONSUMER_H}; };
  const smooth = k => { const t = clamp01(k); return t * t * (3 - 2 * t); };

  // A point along a path of straight segments, t being the fraction of its length already covered.
  function alongPath(points, t){
    const lengths = points.slice(1).map((p, i) => Math.hypot(p.x - points[i].x, p.y - points[i].y));
    let left = clamp01(t) * lengths.reduce((sum, len) => sum + len, 0), i = 0;
    while(i < lengths.length - 1 && left > lengths[i]){ left -= lengths[i]; i++; }
    const k = lengths[i] ? Math.min(1, left / lengths[i]) : 1;
    return {x:lerp(points[i].x, points[i + 1].x, k), y:lerp(points[i].y, points[i + 1].y, k)};
  }

  // Out of the partitioner's batch, along the arrow into the partition and on to the end of the log.
  // While the waiter is still a waiter, the order starts where it hangs it: at the start of the partition.
  function flightPath(ticket){
    const part = ticket.part, end = barEnd() - 34, lane = logLaneY(part) + 6, out = batchLaneY(part) + 6;
    const start = mixOf(STAGE.partitioner) < 0.5 ? [{x:ticket.x0, y:lane}]
      : [{x:BATCH_X + 5, y:out}, {x:ROUTE_X, y:out}, {x:ROUTE_X, y:lane}];
    return [...start, {x:end, y:lane}, {x:end, y:ticketTop(rowOf(S, part)) + 6}];
  }

  // A single producer sends every order: what the diners ask for waits in send(), in the order it
  // came, until the partitioner takes it.
  function drawProducerBox(){
    const {x, y, w, h} = PRODUCER_BOX;
    diagramPanel(PRODUCER_BOX, 'PRODUCER', PAL.white);
    text('SEND()', x + 6, y + 16, PAL.white);
    if(S.materialDemo){
      const {flight, phase} = S.materialDemo;
      text(`KEY: ${MATERIAL_KEY}`, x + 6, y + 30, KAFKA.label);
      if(flight && phase === 'send') text(flight.order.materialOp, x + 6, y + 46, PAL.cyan);
      return;
    }
    S.customers.filter(c => UNSENT.includes(c.state)).flatMap(c => c.messages)
      .forEach((m, i) => drawMiniRecord(x + 6 + (i % 12) * 12, y + 28 + Math.floor(i / 12) * 15, m));
  }

  // The waiter with the notepad is the producer's partitioner. The key picks the partition, always the
  // same one for each color, and the messages of the diner being served wait in the batch of that
  // partition until they leave along its arrow, one by one.
  function drawPartitionerBox(){
    const {x, y, w, h} = PARTITIONER_BOX;
    kafkaBox(x, y, w, h, KAFKA.label);
    R(x + 2, y + 2, w - 4, 9, KAFKA.label);
    text('PARTITIONER', x + w / 2, y + 3, PAL.black, 'center');
    const batching = S.barWaiters.filter(waiter => waiter.state === 'toBar' || waiter.state === 'order');
    for(let part = 0; part < S.comandas.length; part++){
      const row = rowOf(S, part), top = batchLaneY(part), cy = top + 6, lane = logLaneY(part) + 6, tip = barStart(row) - 4;
      // Up to three keys a line: with one partition they all share it.
      [...LETTERS].filter(letter => S.materialDemo?.split ? letter === LETTERS[0] : (!S.materialDemo || letter === LETTERS[0]) && partitionFor(S, letter) === part).forEach((letter, i, all) => {
        const sx = x + 5 + (i % 3) * 7, sy = all.length > 3 ? cy - 6 + Math.floor(i / 3) * 6 : cy - 3;
        R(sx, sy, 7, 7, PAL.black);
        R(sx + 1, sy + 1, 5, 5, COLORS.customers[letter]);
      });
      text(`>P${part}`, x + 28, cy - 3, PAL.white);
      R(BATCH_X + 48, cy, ROUTE_X - BATCH_X - 48, 1, PAL.white);
      R(ROUTE_X, Math.min(cy, lane), 1, Math.abs(lane - cy) + 1, PAL.white);
      R(ROUTE_X, lane, tip - ROUTE_X, 1, PAL.white);
      R(tip - 2, lane - 2, 1, 5, PAL.white);
      R(tip - 1, lane - 1, 1, 3, PAL.white);
      R(tip, lane, 1, 1, PAL.white);
      batching.filter(waiter => waiter.row === row).flatMap(waiter => waiter.toSend)
        .forEach((m, i) => drawMiniRecord(BATCH_X + i * 12, top, m));
    }
    text(S.materialDemo?.split ? 'ENVÍO A P0 Y P1' : S.features.keys ? `HASH(KEY) % ${S.comandas.length}` : 'TODO A LA COLA', x + w / 2, y + h - 13, KAFKA.label, 'center');
  }

  // The two wires are the partitions of one topic. Its outline wraps both of them and their spine
  // on the left, and leaves out the middle of the room, which is not the topic.
  function drawTopicFrame(bands, title, border, right = barEnd() + 8){
    const left = barStart() - 12, spine = left + 6;
    const top0 = bands[0][0], bottom1 = bands[bands.length - 1][1];
    const shape = (inset, color) => {
      bands.forEach(([top, bottom]) => R(left + inset, top + inset, right - left - inset * 2, bottom - top - inset * 2, color));
      if(bands.length > 1) R(left + inset, top0 + inset, spine - left - inset * 2, bottom1 - top0 - inset * 2, color);
    };
    shape(-1, PAL.black);
    shape(0, border);
    shape(2, KAFKA.fill);
    kafkaTab(left, top0 - 11, title, border);
  }

  function drawTopicBoxes(){
    const bands = S.rows.map((row, part) => {
      const dy = Math.round(moveDy(part));
      return [ticketTop(row) - 24 + dy, ticketTop(row) + 38 + dy];
    }).sort((a, b) => a[0] - b[0]);
    drawTopicFrame(bands, S.materialDemo ? 'TOPIC: MATERIALES' : S.features.retain ? 'TOPIC: COMANDAS' : 'QUEUE: COMANDAS', KAFKA.topic);
    for(let part = 0; part < S.comandas.length; part++){
      const row = rowOf(S, part), p = S.comandas[part], end = view.ends[part];
      const x0 = barStart(row) - 2, x1 = barEnd(row) + 4, y0 = ticketTop(row) - 20, y1 = ticketTop(row) + 34;
      g.save();
      g.translate(0, Math.round(moveDy(part)));
      kafkaBox(x0, y0, x1 - x0, y1 - y0, KAFKA.partition, KAFKA.log);
      text(S.features.keys ? `PARTITION ${part}` : 'UNA COLA, SIN CLAVES', x0 + 4, y1 - 10, KAFKA.label);
      const owner = p.owner == null ? PAL.grey : COLORS.cook;
      // Nothing marks a record as read: the group's committed offset is kept apart, so read ones only fade.
      const kept = S.features.retain;
      p.log.forEach(entry => {
        if(entry.taken) return;
        const x = orderX(part, entry);
        if(x < barStart(row) + 10) return;
        const committed = S.features.commit && entry.offset < p.committed, inProgress = kept ? !committed && entry.offset < p.position : locked(entry);
        drawRecord(x, ticketTop(row), entry.order, {offset:kept ? entry.offset : undefined, dim:committed, fresh:S.time - entry.at < 0.3, outline:inProgress ? owner : null});
      });
      if(S.features.commit) drawPointer(Math.max(barStart(row) + 10, slotX(part, end, Math.max(p.committed, p.earliest))), wireY(row) - 9, owner);
      g.restore();
    }
  }

  // The cooks are the group cocina, which flashes during a rebalance, while nobody reads.
  function drawGroupBox(){
    const {x, y, w, h} = groupBox();
    const color = S.rebalance && Math.floor(S.time * 4) % 2 ? PAL.white : COLORS.cook;
    diagramPanel({x,y,w,h}, S.features.keys ? 'CONSUMER GROUP' : 'RECEIVERS', color);
    text(S.rebalance ? 'REBALANCE' : S.materialDemo ? 'ID=MATERIALES' : 'ID=COCINA', x + w / 2, y + h / 2 - 3, color, 'center');
  }

  // A cook is a consumer of the group, fixed in its place: the box says what it is doing in Kafka's own
  // words, which partitions are assigned to it and what it is working on.
  function drawConsumerBox(c){
    const job = c.job, {x, y} = consumerSpot(c.id), down = c.faint && c.faint.phase !== 'waiting';
    const before = g.globalAlpha;
    if(!c.active && !down) g.globalAlpha = before * 0.55;
    const alarm = down && (c.faint.phase === 'fainted' || Math.floor(S.time * 4) % 2 === 0);
    const color = alarm ? PAL.red : COLORS.cook;
    diagramPanel({x, y, w:CONSUMER_W, h:CONSUMER_H}, `${S.features.keys ? 'CONSUMER' : 'RECEIVER'} ${c.name}`, color);
    const demo = S.materialDemo, event = demo?.flight;
    const action = event && c.partitions.includes(event.part) ? {
      fetch:`FETCH ${event.offset}`, apply:event.order.materialOp, commit:`COMMIT ${event.offset + 1}`
    }[demo.phase] : null;
    const waiting = demo?.deferredCreate && c.partitions.includes(demo.deferredCreate.part);
    text(action ?? (waiting ? 'ESPERANDO' : consumerAction(S, c)), x + 5, y + 15, PAL.cyan);
    c.partitions.forEach((part, i) => {
      R(x + 5 + i * 17, y + 27, 15, 9, KAFKA.partition);
      text(`P${part}`, x + 7 + i * 17, y + 28, PAL.black);
    });
    if(job){
      if(job.phase === 'toStove' || job.phase === 'cook') drawMiniRecord(x + 58, y + 24, job.order);
      if(job.phase === 'cook') R(x + 3, y + CONSUMER_H - 4, Math.round((CONSUMER_W - 6) * Math.min(1, job.timer / job.dur)), 2, c.slow ? PAL.red : '#6dff6d');
      if(job.phase === 'plate' || job.phase === 'toCounter') drawPlate(x + 62, y + 24, job.order);
    }
    g.globalAlpha = before;
  }

  // Reading copies the record out to the consumer and leaves it in the log. The commit carries the
  // next offset back to the partition, and the group's pointer moves there once it lands.
  function drawConsumerTraffic(c){
    const job = c.job;
    if(!job || !c.active) return;
    const row = rowOf(S, job.part), {x, y} = consumerSpot(c.id);
    const slot = offset => Math.max(barStart(row) + 10, S.features.retain ? slotX(job.part, view.ends[job.part], offset) : entryX(S, job.part, offset));
    if(job.phase === 'read'){
      const k = smooth(job.timer / READ_S);
      drawMiniRecord(lerp(slot(job.offset) - 5, x + 58, k), lerp(ticketTop(row) + 5, y + 24, k), job.order);
    } else if(job.phase === 'bin' && S.bin){
      // Completing a queue message deletes it.
      const k = smooth(job.timer / binDuration(job));
      drawMiniRecord(lerp(x + 58, S.bin.x - 5, k), lerp(y + 24, BIN_TOP - 8, k), job.order);
    } else if(job.phase === 'commit'){
      const k = smooth(job.timer / commitDuration(job)), pointerY = wireY(row) - 9;
      drawPointer(lerp(x + CONSUMER_W / 2, slot(job.offset + 1), k), lerp(pointerY > y ? y + CONSUMER_H : y - 7, pointerY, k), KAFKA.ink);
    } else if(job.phase === 'drop'){
      const k = job.timer / PLATE_DROP_S;
      // While there is a counter the result lands on it; once it is gone, the result just leaves Kafka.
      if(mixOf(STAGE.outside) < 1){
        drawPlate(lerp(x + 62, COUNTER_END - 8, k), lerp(y + 24, barTop(PLATES_ROW) - 9, k), job.order);
      } else {
        const before = g.globalAlpha;
        g.globalAlpha = before * (1 - k);
        drawPlate(x + 62, y + 24 - k * 8, job.order);
        g.globalAlpha = before;
      }
    }
  }

  const MATERIAL_STATES = {
    EMPTY:{label:'SIN CREAR', color:KAFKA.label},
    CREATE:{label:'CREADO', color:KAFKA.ink},
    UPDATE:{label:'ACTUALIZADO', color:PAL.cyan},
    DELETE:{label:'BORRADO', color:'#ff9187'}
  };
  const materialState = demo => MATERIAL_STATES[demo.last?.order.materialOp || 'EMPTY'];

  function drawMaterialProjection(){
    const demo = S.materialDemo, {flight, last, phase} = demo;
    const {x, y, w, h} = MATERIAL_BOX;
    const {label, color} = materialState(demo);
    kafkaBox(x, y, w, h, color, KAFKA.log);
    R(x + 2, y + 2, w - 4, 13, color);
    text(demo.split ? 'MISMA CLAVE EN DOS PARTICIONES' : 'FICHA DEL MATERIAL', x + 9, y + 5, PAL.black);
    text(MATERIAL_KEY, x + w - 9, y + 5, PAL.black, 'right');
    text(label, x + 10, y + 23, color, 'left', 2);
    if(demo.current){
      const fields = [['REFERENCIA', 'referencia'], ['DENSIDAD', 'densidad'], ['ACABADO', 'acabado']];
      fields.forEach(([name, field], i) => {
        const row = y + 48 + i * 18;
        const changed = last.order.materialOp === 'UPDATE' && field in last.order.patch;
        if(changed){
          R(x + 6, row - 4, w - 12, 15, '#10384b');
          R(x + 6, row - 4, 2, 15, color);
        }
        text(name, x + 13, row, KAFKA.label);
        const value = demo.current[field] + (field === 'densidad' ? ' G/CM3' : '');
        if(changed){
          const before = String(demo.previous[field]);
          text(before, x + 130, row, KAFKA.label);
          text('->', x + 136 + before.length * 6, row, color);
          text(value, x + 154 + before.length * 6, row, color);
        } else text(value, x + 130, row, PAL.white);
      });
    } else {
      // An empty outline before CREATE, a crossed-out record after DELETE.
      const left = x + 14, top = y + 52;
      g.save();
      g.strokeStyle = color;
      g.lineWidth = 2;
      if(!last) g.setLineDash([3, 3]);
      g.strokeRect(left, top, 25, 31);
      if(last){
        g.beginPath();
        g.moveTo(left + 5, top + 7); g.lineTo(left + 20, top + 24);
        g.moveTo(left + 20, top + 7); g.lineTo(left + 5, top + 24);
        g.stroke();
      }
      g.restore();
      text(last ? 'LOS EVENTOS SIGUEN EN EL LOG' : 'ESPERANDO A QUE SE APLIQUE CREATE', x + 52, y + 64, PAL.white);
    }
    R(x + 10, y + 105, w - 20, 1, KAFKA.partition);
    const applied = last ? `APLICADO: ${last.order.materialOp} · OFFSET ${last.offset}` : `REGISTROS EN EL TOPIC: ${S.comandas.reduce((sum, p) => sum + p.log.length, 0)}`;
    const waiting = demo.deferredCreate ? 'CREATE PUBLICADO EN P0 / AÚN SIN LEER' : applied.replace(' · ', ' / ');
    text(waiting, x + 10, y + 114, PAL.white);
    const statusLine = flight && {
      send:'PRODUCER ENVÍA EL EVENTO',
      fetch:`CONSUMER LEE P${flight.part} / OFFSET ${flight.offset}`,
      apply:`CONSUMER APLICA ${flight.order.materialOp}`,
      commit:`CONFIRMANDO OFFSET ${flight.offset + 1}`
    }[phase];
    if(demo.updateRejected) text(demo.current ? 'UPDATE PERDIDO / DENSIDAD SIN CORREGIR'
      : 'UPDATE RECHAZADO / EL MATERIAL NO EXISTE', x + 10, y + 131, '#ff827a');
    else if(statusLine) text(statusLine, x + 10, y + 131, PAL.cyan);
    else if(last) text(`SIGUIENTE OFFSET: ${S.comandas[last.part].committed}`, x + 10, y + 131, KAFKA.label);
  }

  function drawMaterialTraffic(){
    const {flight, phase, elapsed} = S.materialDemo;
    if(!flight) return;
    const {part, order, offset} = flight;
    const k = smooth(elapsed / MATERIAL_PHASES[phase]);
    const row = rowOf(S, part), cook = S.cooks.find(c => c.partitions.includes(part));
    const consumer = consumerSpot(cook.id);
    if(phase === 'send'){
      const start = {x:PRODUCER_BOX.x + 16, y:PRODUCER_BOX.y + 55};
      const at = alongPath([start, ...flightPath(flight)], k);
      drawMiniRecord(at.x - 5, at.y - 6, order);
    } else if(phase === 'fetch'){
      const x = slotX(part, view.ends[part], offset), y = ticketTop(row) + 6;
      drawMiniRecord(lerp(x, consumer.x + 62, k) - 5, lerp(y, consumer.y + 25, k) - 6, order);
    } else if(phase === 'apply'){
      const x = MATERIAL_BOX.x + MATERIAL_BOX.w - 14, y = MATERIAL_BOX.y + 117;
      drawMiniRecord(lerp(consumer.x + 62, x, k) - 5, lerp(consumer.y + 25, y, k) - 6, order);
    } else if(phase === 'commit'){
      const x = slotX(part, view.ends[part], offset + 1), y = wireY(row) - 9;
      drawPointer(lerp(consumer.x + CONSUMER_W / 2, x, k), lerp(consumer.y, y, k), KAFKA.ink);
    }
  }

  // The broker's ack is a message too: it goes back along the arrow to the producer, which only then
  // counts the order as sent. While the waiter is still a waiter, it goes back to him.
  function drawAck(){
    const b = S.boss, k = (S.time - b.saidAt) / ACK_S;
    if(!b.lastAck || k < 0 || k >= 1) return;
    const part = b.lastAck.partition, row = rowOf(S, part), lane = logLaneY(part) + 6, out = batchLaneY(part) + 6, waiter = S.barWaiters[0];
    const points = mixOf(STAGE.partitioner) < 0.5 ? [{x:barStart(row) - 4, y:lane}, {x:waiter.x, y:waiter.y - 44}]
      : [{x:barStart(row) - 4, y:lane}, {x:ROUTE_X, y:lane}, {x:ROUTE_X, y:out}, {x:BATCH_X + 48, y:out}];
    const at = alongPath(points, k);
    kafkaTab(Math.round(at.x - 11), Math.round(at.y - 5), 'ACK', KAFKA.ink);
  }

  // ---- Kinds of actor, each in its current look ----
  // Back to front. The tutorial draws these again to light one of them up.

  function drawProducers(){
    morphDraw(mixOf(STAGE.producers), () => {
      drawDiners();
      drawTables();
      drawTableFood();
    }, drawProducerBox);
  }

  // The hourglasses tied under the orders hang in front of the counter, so they go after it.
  // Each blinks as its last grains fall.
  function drawHangingHourglasses(){
    if(S.features.retain) return;
    morphDraw(mixOf(STAGE.topic), () => S.comandas.forEach((p, part) => {
      const row = rowOf(S, part), dy = Math.round(moveDy(part));
      p.log.forEach(entry => {
        if(entry.lockFrom === undefined || entry.taken) return;
        const x = orderX(part, entry), left = entry.lockUntil - S.time;
        if(x < barStart(row) + 10 || (left < 1.5 && Math.floor(S.time * 8) % 2 === 1)) return;
        drawHourglass(x, ticketTop(row) + 27 + dy, (S.time - entry.lockFrom) / (entry.lockUntil - entry.lockFrom), 4, COOK_APRONS[entry.lockedBy]);
      });
      // One being tied: it comes up from the cook's hands, in front of the cook and so behind it
      // from here, peeks out over its head, and is tied to the bottom of the paper with a wiggle.
      S.cooks.forEach(c => {
        if(!c.job || c.job.phase !== 'hang' || c.job.part !== part) return;
        const k = clamp01(c.job.timer / HANG_S), rise = clamp01(k / 0.55), ease = rise * rise * (3 - 2 * rise);
        const tie = clamp01((k - 0.55) / 0.45), hangY = ticketTop(row) + 27 + dy;
        const x = orderX(part, c.job.entry), handsY = barTop(c.pos) + COOK_FEET - 30;
        const wiggle = tie > 0 && tie < 1 ? (Math.floor(c.job.timer * 16) % 2 ? 1 : -1) : 0;
        drawHourglass(x + wiggle, lerp(handsY, hangY, ease), 0, Math.round(4 * tie), COOK_APRONS[c.id]);
      });
    }), () => {});
  }

  function drawTopic(){

  // Not Kafka: in the Kafka view the counter and the waiter with the tray are simply gone.

  function drawBin(){
    const bin = S.bin;
    if(!bin) return;

    g.drawImage(furniture.barrel, x - 12, top - 4, 24, 26);
    // Scraps of orders sticking out, more the fuller it gets.
    const colors = Object.values(COLORS.customers);
    for(let i = 0; i < Math.min(4, bin.thrown || 0); i++) R(x - 6 + i * 3, top - 4 - (i % 2) * 2, 4, 4, colors[i % colors.length]);

  // An order that slipped off the wire on its way: it tumbles to the floor and is gone.
  function drawFallen(kafka){
    S.fallen.forEach(f => {
      const k = f.t / FALL_S, row = rowOf(S, f.part);
      const y0 = kafka ? logLaneY(f.part) + 6 : ticketTop(row) + 10;
      const y = lerp(y0, barTop(row) + 34, k * k), x = f.x - k * 10;
      const before = g.globalAlpha;
      g.globalAlpha = before * (k < 0.75 ? 1 : (1 - k) / 0.25);
      if(kafka) drawMiniRecord(x - 5, y - 6, f.order);
      else {
        // The peg stays open on the wire while the paper tumbles away.
        const pegX = f.x - 7, pegY = wireY(row);

        R(pegX - 2, pegY - 2, 4, 3, '#c98a3c');
        R(pegX - 4, pegY + 1, 2, 6, '#c98a3c');
        R(pegX + 2, pegY + 1, 2, 6, '#c98a3c');

          R(pegX - 8, pegY - 4, 3, 1, PAL.white);
          R(pegX + 5, pegY - 4, 3, 1, PAL.white);
        }
        const w = Math.floor(f.t * 12) % 2 ? 6 : 16;
        drawLooseSlip(f.order, x, y, w, 16);

  // The tutorial darkens the scene and draws the actors of the step again on top, so exactly
