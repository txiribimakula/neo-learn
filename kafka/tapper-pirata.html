<title>The Secret of Queue Systems</title>
<style>
  :root{--ink:#ffffff;--muted:#c3cbff;--amber:#6dffff;--red:#ff6d4a}
  *{box-sizing:border-box}
  body{font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  button{font:inherit;color:inherit;cursor:pointer}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink)}
  .scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  /* Opening slides for the talk: same paper and ink as the phrase that follows them. */
  /* Push transition: the next slide comes in from the right and shoves the current one out to
     the left. The phrase after the last slide is pushed in the same way. */
  .slides{position:absolute;inset:0;z-index:2;overflow:hidden;background:#f7f6f2;color:#232329;font-family:system-ui,sans-serif;cursor:pointer;transition:transform .6s cubic-bezier(.65,0,.35,1)}
  .slides.leaving{transform:translateX(-100%)}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,30px);padding:16px;visibility:hidden;transform:translateX(100%);transition:transform .6s cubic-bezier(.65,0,.35,1),visibility .6s}
  .slide.current{visibility:visible;transform:none}
  .slide.past{transform:translateX(-100%)}
  .title-slide h1{display:flex;flex-direction:column;align-items:center;gap:.12em;margin:0;font:650 clamp(34px,7.4vw,112px)/1.02 system-ui,sans-serif;letter-spacing:-.02em;text-align:center}
  .title-slide h1 span{white-space:nowrap}
  .title-slide .tech{display:flex;align-items:center;gap:.4em;color:#6b6470;font:400 .36em/1.3 system-ui,sans-serif;letter-spacing:0;white-space:nowrap}
  .title-slide .tech svg{width:1.5em;height:1.5em;flex:none}
  .title-slide .tech + span{margin-top:.55em}
  .slide svg{display:block;width:min(100%,1100px);height:auto;max-height:72vh;overflow:visible}
  .slide .track{stroke:#c9c2b8;stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round}
  .slide .device{fill:#fff;stroke:#232329;stroke-width:3}
  .slide .device-base{fill:#232329}
  .slide .code{fill:#8e808a}
  .slide .unit{fill:none;stroke:#cfc8bf;stroke-width:2}
  .slide .led{fill:#e3ded6}
  .slide .slots line{stroke:#e3ded6;stroke-width:2}
  .slide .spinner{fill:#fff;stroke:#d9a514;stroke-width:5;stroke-dasharray:88 38;stroke-linecap:round}
  .slide .pill rect{fill:#512b51}
  .slide .pill.reply rect{fill:#fff;stroke:#512b51;stroke-width:3}
  .slide .envelope rect{fill:#512b51}
  .slide .envelope path{fill:none;stroke:#fff;stroke-width:2.5;stroke-linejoin:round}
  /* A machine's state is the colour of its outline: yellow while blocked, green when it got what
     it wanted, red (and faded) while it is down. The inside stays white. */
  .slide .machine .device,.slide .machine .device-base,.slide .machine .unit{transition:fill .25s,stroke .25s}
  .slide .machine.wait .device{stroke:#d9a514}
  .slide .machine.wait .device-base{fill:#d9a514}
  .slide .machine.ok .device{stroke:#3d8a58}
  .slide .machine.ok .device-base{fill:#3d8a58}
  .slide .machine.ok .unit{stroke:#9cc8aa}
  .slide .machine.down .device{stroke:#c8372d}
  .slide .machine.down .unit{stroke:#e6a39c}
  .slide-dots{position:absolute;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px}
  .slide-dots span{width:8px;height:8px;border-radius:50%;background:#dcd6cd}
  .slide-dots span.on{background:#512b51}
  .prologue{transition:transform .6s cubic-bezier(.65,0,.35,1)}
  .prologue.waiting{transform:translateX(100%)}
  @media(prefers-reduced-motion:reduce){.slides,.slide,.prologue{transition:none}}
  .prologue,.cover{position:absolute;inset:0;width:100%;height:100%;margin:0;border:0;padding:0;overflow:hidden}
  .prologue{z-index:1;background:#f7f6f2;color:#232329}
  .opening-type{display:grid;place-items:center;position:absolute;inset:0;margin:auto;width:min(94%,1400px);height:clamp(76px,15vw,190px)}
  #opening-line{font:500 clamp(20px,5vw,80px)/1.2 system-ui,sans-serif;white-space:nowrap}
  #opening-pixels{position:absolute;inset:0;width:100%;height:100%;visibility:hidden;image-rendering:pixelated}
  .prologue.pixel #opening-line{visibility:hidden}
  .prologue.pixel #opening-pixels{visibility:visible}
  .prologue:focus-visible,.cover:focus-visible{outline:0}
  .cover{background:#010314;opacity:0;color:#f2b9f5;text-align:center}
  /* The island fades in over the phrase, which stays behind it until the island is opaque. */
  .cover.revealed{z-index:3;animation:island-reveal 2.35s ease-in-out both}
  @keyframes island-reveal{from{opacity:0}to{opacity:1}}
  .cover img,.cover canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  .cover img{object-fit:cover}
  @media(prefers-reduced-motion:reduce){
    .cover.revealed{animation-duration:.32s;animation-delay:0s}
  }
  .cover.revealed.instant{animation:none;opacity:1}
  /* The scene and what sits on its back wall share one box, so they scale together. */
  .stage{position:relative;width:min(100vw,calc(100vh * 730 / 476));width:min(100vw,calc(100dvh * 730 / 476));aspect-ratio:730/476;container-type:inline-size}

  /* The conclusions, on the opening slides' paper and ink: one line per click, and the last one
     turns into the game's lettering, as the phrase before the island did. */
  .ending{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,5vh,56px);padding:16px;background:#f7f6f2;color:#232329;font-family:system-ui,sans-serif;text-align:center;outline:0}
  .ending[hidden]{display:none}
  .ending h1{margin:0;font:650 clamp(30px,5.6vw,84px)/1.05 system-ui,sans-serif;letter-spacing:-.02em}
  .ending ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.6vh,28px)}
  .ending li{font:500 clamp(20px,3.4vw,48px)/1.2 system-ui,sans-serif;opacity:0;transform:translateY(.4em);transition:opacity .45s,transform .45s cubic-bezier(.65,0,.35,1)}
  .ending li.shown{opacity:1;transform:none}
  .ending cite{font-style:normal}
  .ending .monkey{position:relative;white-space:nowrap}
  .ending .monkey canvas{position:absolute;inset:-.7em -1.5em;width:calc(100% + 3em);height:calc(100% + 1.4em);visibility:hidden;image-rendering:pixelated}
  .ending .monkey.pixel .line{visibility:hidden}
  .ending .monkey.pixel canvas{visibility:visible}
  @media(prefers-reduced-motion:reduce){.ending li{transition:none}}
  #scene{image-rendering:pixelated}
  #scene{display:block;width:100%;height:auto;aspect-ratio:730/420}
  .commands{height:11.76%;display:flex;align-items:stretch;border-top:2px solid #593669;background:#0b0814;font-family:MonkeyDialogue,monospace}
  .step .next{color:#ffcf75}
  .commands button:hover,.commands button:focus-visible{color:#f3bfff}
  .commands button:focus-visible{outline:2px dotted #e4aaf0;outline-offset:-2px}
  .step{flex:1;min-width:0;text-align:left;padding:.2em 1.1em;font-size:1.35cqw;line-height:1.38;background:transparent;border:0;color:#c17ce4}
  .step span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* What is going on now reads first: larger than the line about the next click. */
  .step .now{color:#ddc6e2;font-size:1.45em;line-height:1.25}
  .step[aria-pressed=true] .next{color:#ff9cec}
  /* What a queued click is waiting for: always first on its line, in a colour of its own. */
  .step .wait{font-style:normal;color:#7ee8dc}
  /* While the real Kafka view is up, the bar under it is on the slides' paper too. */
  .scene.paper{background:#f7f6f2}
  .scene.paper .commands{background:#f7f6f2;border-top:1px solid #ddd7ce;font-family:system-ui,sans-serif}
  .scene.paper .step{color:#6b6470;font-size:1.25cqw}
  .scene.paper .step .now{color:#232329;font-weight:600}
  .scene.paper .step .next{color:#512b51}
  .scene.paper .step[aria-pressed=true] .next{color:#8a4fa8}
  .scene.paper .step .wait{color:#2b8a83}
  .scene.paper .commands button:hover,.scene.paper .commands button:focus-visible{color:#512b51}
  .scene.paper .commands button:focus-visible{outline-color:#512b51}
</style>

  // The three trial givers greet the first tables, then the striped duellist and Carla.

    A:{keyName:'Azul', color:'#568fe8', voice:'#a8ccff', sleeve:'#304c99', skin:'#d49871'},

  const ITEMS = {
    gazpacho:{name:'Gazpacho', course:'primero', cook:0.5}, paella:{name:'Paella', course:'primero', cook:2.2},
    croquetas:{name:'Croquetas', course:'primero', cook:1.0}, jamon:{name:'Jamón', course:'primero', cook:0.4},
    tortilla:{name:'Tortilla de patatas', course:'segundo', cook:1.6}, merluza:{name:'Merluza', course:'segundo', cook:1.8},

    platano:{name:'Plátano', course:'postre', cook:0.3}, arroz:{name:'Arroz con leche', course:'postre', cook:0.4},

  const ITEM_NAMES = Object.keys(ITEMS);

  // Rows top to bottom: orders partition 0, plates counter, orders partition 1. Only the orders are Kafka.

  const rowOf = (S, part) => S.rows[part];
  const barTop = row => {

  const barStart = () => 198;
  const barEnd = () => 660;
  const COUNTER_START = 220, COUNTER_END = 638;
  // The stove stands against the right wall, so a cook out of the group waits beside the cook's spot.

  const COOK_AISLE_SPEED = 132;

  const COOK_FEET = 52;
  const PEEL_X = COOK_X - 19, PEEL_CONTACT_X = 12; // half the skin plus the reach of a shoe
  const lerp = (a, b, k) => a + (b - a) * k;
  const clamp01 = k => Math.min(1, Math.max(0, k));

  const stoveX = row => barEnd(row) + 42;
  const floorY = row => barTop(row) + 12;
  const tableTop = table => 124 + table * 118;
  const TABLE_AISLE_X = TABLE_X + 80;

  const lagOf = p => p.end - p.committed;

  // Keep the Mulberry32 seed in the model so a restored scene continues the same random sequence.
  function random(state){
    state.seed = (state.seed + 0x6D2B79F5) >>> 0;
    let t = state.seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

  }

  function makePartition(){
    return {log:[], end:0, earliest:0, committed:0, position:0, busy:false, owner:null};
  }

  // Each cook works at the stove of its own row; arriving is set while it brings that stove in.
  const makeCook = (id, row = id === 0 ? 0 : 2) => ({building:false, id, name:`C${id + 1}`, row, active:true, x:COOK_X, pos:row, partitions:[], cursor:0, walking:false, faceLeft:true, job:null, idleFor:0, beerIn:null, beer:null, arriving:null});

  //

  //  - keys: each color goes to its own wire with a single cook, instead of everyone sharing one;

  const KAFKA_FEATURES = {menus:true, keys:true, retain:true, commit:true, peekLock:true};

  const pickBeerIn = (S, [min, max]) => min + random(S.random) * (max - min);

  function pickDiner(S, free){

      if(c.state !== 'leave') seated[c.partition]++;

  // Courses only come in sequence: just a starter, no dessert, dessert, or dessert and coffee.

  }

  // A letter is one diner, so it can only be in the dining room once; each dish is one message.

  function addCustomer(S, letter, count, setMenu = null){
    const table = freeTable(S);
    if(table === undefined) return null;
    const free = freeLetters(S);
    if(!free.length) return null;
    const who = letter || S.debuts[0] || pickDiner(S, free);
    if(!who || !free.includes(who)) return null;

  // Range assignor: sorted partitions split over sorted members, first members get the remainder.
  function assignPartitions(S){
    const active = S.cooks.filter(c => c.active);
    S.cooks.forEach(c => { c.partitions = []; c.cursor = 0; });
    S.comandas.forEach(p => { p.owner = null; });
    if(!S.features.keys){
      // A plain queue: every cook takes from it, whoever is free first.
      active.forEach(c => { c.partitions = S.comandas.map((_, part) => part); });
      if(active.length) S.comandas.forEach(p => { p.owner = active[0].id; });
      return;
    }
    if(active.length){
      const count = S.comandas.length, base = Math.floor(count / active.length), extra = count % active.length;
      let next = 0;
      active.forEach((c, i) => {
        for(let n = base + (i < extra ? 1 : 0); n > 0; n--){
          c.partitions.push(next);
          S.comandas[next].owner = c.id;
          next++;
        }
      });
    }
    // A new owner always resumes from the group's committed offset.
    S.comandas.forEach(p => { p.position = p.committed; });

  // A plain queue has no group to rebalance: its receivers just compete for the next message,
  // so whoever arrives or leaves simply starts or stops receiving.
  function triggerRebalance(S, why){
    if(!S.features.keys){
      assignPartitions(S);
      return;
    }
    S.stats.rebalances++;
    S.rebalance = {elapsed:0, why};
    logEvent(S, `Rebalance: ${why}. Nadie coge comandas nuevas.`, 'warn');

  const rebalanceReady = S => !!S.rebalance && S.rebalance.elapsed >= REBALANCE_MIN_S
    && S.cooks.every(c => !c.active || !c.job);

  function stepRebalance(S, dt){
    if(!S.rebalance) return;
    S.rebalance.elapsed += dt;
    // In the story the head of the dining room, as the group's coordinator, says when it is over.
    if(S.rebalance.held || !rebalanceReady(S)) return;
    completeRebalance(S);
  }

  function completeRebalance(S){
    S.rebalance = null;
    S.generation++;
    assignPartitions(S);
    const summary = S.cooks.filter(c => c.active).map(c => `${c.name}→${c.partitions.join(',') || '—'}`).join('  ');
    logEvent(S, `Generación ${S.generation}: ${summary || 'sin cocineros'}`, 'key');
    const idle = S.cooks.filter(c => c.active && !c.partitions.length);
    if(idle.length) logEvent(S, `${idle.map(c => c.name).join(' y ')} se queda sin hilo: hay más cocineros que hilos.`, 'warn');
  }

  function setCookActive(S, id, active){
    const c = S.cooks[id];
    if(!c || c.arriving || c.building || c.active === active) return;
    c.active = active;
    if(!active) dropJob(S, c);
    if(!active) { c.partitions = []; c.walking = false; }
    triggerRebalance(S, active ? `vuelve ${c.name}` : `se va ${c.name}`);
  }

  // A cook stops halfway through its order: what happens to it depends on how it was read.
  function dropJob(S, c){
    if(c.job){
      const p = S.comandas[c.job.part];
      p.busy = false;
      if(!S.features.retain){
        const onWire = p.log.includes(c.job.entry);

          c.job.entry.lockAbandonedByFaint = c.faint?.phase === 'fainted';

          Object.assign(c.job.entry, {lockedBy:null, taken:false});

          c.job.order.lost = true;
          S.stats.lost++;
          logEvent(S, `${c.name} deja a medias ${messageTag(c.job.order)}, que ya no está en el hilo: se ha perdido.`, 'warn');
        }
      } else {
        // Nothing was committed, so the next owner re-reads this offset, even if the plate already left.
        p.position = p.committed;
        logEvent(S, `${c.name} deja a medias el offset ${c.job.offset} del hilo ${c.job.part}, sin confirmar.`, 'warn');
      }
      c.job = null;
    }
  }

  // Simplification: retention only drops what the group has already committed, so no diner starves.
  function appendToLog(S, p, order){
    const offset = p.end++;
    p.log.push({offset, order, at:S.time});
    while(p.log.length > RETENTION && p.log[0].offset < p.committed) p.earliest = p.log.shift().offset + 1;
    return offset;
  }

  function pickPartition(S, c){
    for(let i = 0; i < c.partitions.length; i++){
      const index = (c.cursor + i) % c.partitions.length;
      const part = c.partitions[index];
      const p = S.comandas[part];
      if(!S.features.retain ? p.log.some(unlocked) && (!S.features.keys || !p.busy)
        : !p.busy && p.position < p.end) return {part, index};
    }
    return null;
  }

  const locked = entry => entry.lockedBy !== null && entry.lockedBy !== undefined;
  const unlocked = entry => !locked(entry);
  // When the lease expires the lock lapses: the order is free again on the wire. If its cook is
  // still on it, the cook has lost the order and may not take it off any more.
  function expireLocks(S){
    S.lockDrops = S.lockDrops.filter(drop => S.time - drop.at < LOCK_DROP_S);
    S.comandas.forEach((p, part) => p.log.forEach(entry => {
      if(entry.lockUntil === undefined || S.time < entry.lockUntil) return;
      S.lockDrops.push({part, x:entry.vx ?? entryX(S, part, entry.offset), at:S.time});
      const owner = S.cooks.find(k => k.job && k.job.entry === entry);
      Object.assign(entry, {lockedBy:null, lockUntil:undefined, lockFrom:undefined, lockAbandonedByFaint:false});
      S.stats.lapsed++;
      if(owner){
        owner.job.lockLost = true;
        logEvent(S, `Se suelta el candado de ${messageTag(entry.order)} y ${owner.name} aún no ha terminado: pierde el bloqueo.`, 'warn');
      } else {
        logEvent(S, `Se suelta el candado de ${messageTag(entry.order)}: vuelve a estar libre en el hilo ${part}.`, 'key');
      }
    }));
  }
  function startFetch(S, c, pick){
    const p = S.comandas[pick.part];
    c.cursor = pick.index + 1;
    // Sharing one wire, each cook cooks at its own stove; with a wire each, at the stove of that wire.
    const cookRow = S.features.keys ? rowOf(S, pick.part) : c.row;
    if(!S.features.retain){
      // A queue hands out the oldest order nobody holds, and locks it for this cook.
      const entry = p.log.find(unlocked);
      entry.lockedBy = c.id;
      p.busy = true;
      c.job = {part:pick.part, offset:entry.offset, entry, order:entry.order, stale:false, phase:'toTicket', timer:0, dur:0, cookRow};
      return;
    }
    const offset = p.position;
    const entry = p.log[offset - p.earliest];
    p.position++;
    p.busy = true;
    c.job = {part:pick.part, offset, order:entry.order, stale:false, phase:'toTicket', timer:0, dur:0, cookRow};
  }

  // The commit, in the bar: the cook stands under its wire's rubber chicken, gathers itself, jumps
  // and pushes it; the chicken rolls on along the wire to the next offset and stops there.
  const COMMIT_TAKEOFF = 0.22, COMMIT_HIT = 0.42, COMMIT_LAND = 0.66, COMMIT_JUMP_H = 21;
  // Where the chicken stands on the wire for an offset (the next one to read).
  function markX(S, part, offset){
    return Math.max(barStart(rowOf(S, part)) + 10, entryX(S, part, offset));
  }
  // The cook stands left of the chicken, its right hand under the tail, to push it to the right.
  // On crutches it cannot jump: it stands a little further on, so the near shoulder is under the
  // tail, leans on the far crutch and pushes the chicken along with the tip of the other one.
  const MARK_STAND_DX = -16, CRUTCH_STAND_DX = 5;
  // Crutch commit: up goes the crutch, its tip meets the chicken's tail, drags it along the rope
  // one offset on (it never leaves the rope, so it rolls), and the crutch goes back under the arm.
  const CRUTCH_RAISE = 0.5, CRUTCH_TOUCH = 0.62, CRUTCH_PUSHED = 1.5, CRUTCH_LOWER = 1.62, CRUTCH_COMMIT_S = 2.06;
  const commitDuration = c => c.crutches ? CRUTCH_COMMIT_S : COMMIT_S;
  // The model's own smoothstep: the drawing's `smooth` is not defined for it.
  const easeInOut = k => { const t = clamp01(k); return t * t * (3 - 2 * t); };
  const standDx = c => c.crutches ? CRUTCH_STAND_DX : MARK_STAND_DX;
  const commitStandX = (S, c, offset) => markX(S, c.job.part, offset) + standDx(c);
  const commitPusher = (S, part) => S.cooks.find(c => c.job && c.job.part === part && c.job.phase === 'commit' && !c.job.stale);
  // Where the chicken is, as a fractional offset: moving while a cook pushes it, otherwise at the commit.
  function chickenAt(S, part){
    const p = S.comandas[part], pusher = commitPusher(S, part);
    if(!pusher) return p.committed;
    const job = pusher.job, to = Math.max(p.committed, job.offset + 1);
    if(pusher.crutches) return job.from + (to - job.from) * easeInOut((job.timer - CRUTCH_TOUCH) / (CRUTCH_PUSHED - CRUTCH_TOUCH));
    const k = clamp01((job.timer - COMMIT_HIT) / (COMMIT_S - COMMIT_HIT));
    // A push, then it rolls on by itself and slows down to a stop.
    return job.from + (to - job.from) * (1 - (1 - k) * (1 - k));
  }
  // Where an order hangs. In the log it is its offset that says; in a queue, where it is in line.
  function entryX(S, part, offset){
    const p = S.comandas[part];
    if(S.features.retain) return slotX(part, p.end, offset);
    const waiting = p.log.filter(e => !e.taken);
    const index = waiting.findIndex(e => e.offset === offset);
    return barEnd() - 34 - (waiting.length - 1 - Math.max(0, index)) * SLOT_W;
  }

  // Right under the order, head in line with it, to read it from behind.
  // New orders push the log along the wire, so this spot moves too.
  function ticketStandX(S, job){
    const row = rowOf(S, job.part);
    return Math.max(barStart(row) + 10, entryX(S, job.part, job.offset)) + 1;
  }

  function finishJob(S, c){
    S.comandas[c.job.part].busy = false;
    c.job = null;
  }

  // Completing a queue message deletes it: the order goes in the bin.
  function completeInQueue(S, c){
    const p = S.comandas[c.job.part], entry = c.job.entry;
    p.log = p.log.filter(e => e !== entry);
    if(S.bin) S.bin.thrown = (S.bin.thrown || 0) + 1;
    logEvent(S, `${c.name} tira la comanda ${messageTag(c.job.order)} a la papelera.`);
    finishJob(S, c);
  }

  // Into the bin from right where the cook is: its back to the bin, one heel flick.
  function startBinToss(S, c, job){
    job.phase = 'bin';
    job.timer = 0;
    if(S.bin) c.faceLeft = S.bin.x > c.x;
    // A nod to basketball: once there is a wire per colour, every third one rattles on the rim.
    if(S.features.keys){
      S.tossCount = (S.tossCount || 0) + 1;
      job.rimShot = S.tossCount % 3 === 0;
    }
  }

  // Walk to the order, read it, walk back and cook, send the plate out, then walk to the order
  // again to commit: the offset only advances after the work is done (at-least-once).
  function stepCookJob(S, c, dt){
    const job = c.job;
    const p = S.comandas[job.part];
    switch(job.phase){
      case 'toTicket':
        if(walkTo(c, ticketStandX(S, job), COOK_WALK_SPEED, dt)){ job.phase = 'read'; job.timer = 0; }
        break;
      case 'read':
        job.timer += dt;
        walkTo(c, ticketStandX(S, job), COOK_WALK_SPEED, dt);
        if(job.timer >= READ_S){
          // Receive and delete: reading it is deleting it, so the slip comes off the wire into the
          // cook's pocket, and goes in the bin once the dish is out.
          // With peek-lock it stays on the wire, locked for this cook, until it is cooked.
          // With peek-lock it first ties its padlock under the order.
          job.phase = S.features.retain ? 'toStove' : S.features.peekLock ? 'hang' : 'take';
          job.timer = 0;
        }
        break;
      case 'hang':
        job.timer += dt;
        walkTo(c, ticketStandX(S, job), COOK_WALK_SPEED, dt);
        if(job.timer >= HANG_S){
          Object.assign(job.entry, {lockFrom:S.time, lockUntil:S.time + LOCK_S});
          job.phase = 'toStove';
        }
        break;
      case 'toStove':
        if(job.cookRow !== undefined && c.pos !== job.cookRow){
          walkToRow(c, job.cookRow, dt);
          break;
        }
        if(walkTo(c, COOK_X, COOK_WALK_SPEED, dt)){
          job.phase = 'cook';
          job.timer = 0;
          job.dur = job.order.items.reduce((sum, item) => sum + ITEMS[item].cook, 0) * (job.order.scripted && job.order.seq === 1 ? SET_MENU_SLOW : 1);
          c.faceLeft = false;
        }
        break;
      case 'cook':
        job.timer += dt;
        if(job.timer >= job.dur){ job.phase = 'plate'; job.timer = 0; }
        break;
      case 'plate':
        job.timer += dt;
        if(job.timer >= PLATE_TOSS_S){
          // Received and deleted, the slip is in its pocket: with the plate in its hands it lets
          // the slip drop and heels it into the bin from the stove, then takes the plate out.
          if(job.pocketed && !job.binned){ startBinToss(S, c, job); break; }
          job.phase = 'toCounter';
          c.faceLeft = true;
        }
        break;
      case 'toCounter':
        // Carry the plate along the aisle to the right of the counter, then turn in.
        if(c.pos !== PLATES_ROW){ walkCookAisle(c, PLATES_ROW, dt); break; }
        if(walkTo(c, COUNTER_DROP_X, COOK_WALK_SPEED, dt)){
          c.faceLeft = true;
          job.phase = 'drop';
          job.timer = 0;
        }
        break;
      case 'drop':
        job.timer += dt;
        if(job.timer >= PLATE_DROP_S){
          S.plates.push({order:job.order, x:COUNTER_END - 8});
          c.leavingCounter = true;
          if(S.features.retain){
            logEvent(S, `${c.name} deja el plato del offset ${job.offset}, aún sin confirmar.`);
            // Then back to its wire, to move the rubber chicken past the work it has finished.
            if(job.stale || !S.features.commit) finishJob(S, c);
            else { job.phase = 'toCommit'; job.timer = 0; }
          } else {
            // With peek-lock the order is still on the wire: it goes to take it off before the bin.
            // Received and deleted, its slip went in the bin at the stove: nothing left to do.
            job.cooked = true;
            if(job.lockLost || job.pocketed) finishJob(S, c);
            else { job.phase = 'toTake'; job.timer = 0; }
          }
          if(c.job) c.faceLeft = ['toTake', 'bin', 'toCommit'].includes(job.phase) ? c.faceLeft : false;
          else c.faceLeft = true;
        }
        break;
      case 'toTake': {
        // Its lease expired on the way: the order is not its own any more.
        if(job.lockLost){ finishJob(S, c); break; }
        const row = rowOf(S, job.part);
        if(!walkToRow(c, row, dt)) break;
        if(walkTo(c, ticketStandX(S, job), COOK_WALK_SPEED, dt)){ job.phase = 'take'; job.timer = 0; }
        break;
      }
      case 'take':
        if(job.lockLost){ finishJob(S, c); break; }
        job.timer += dt;
        if(job.timer < TAKE_S) break;
        // Off the wire with its padlock: nothing left to time.
        Object.assign(job.entry, {taken:true, lockUntil:undefined, lockFrom:undefined});
        if(job.cooked){ startBinToss(S, c, job); break; }
        // Received and deleted: the queue forgets it the moment it comes off the wire. The slip
        // goes in the cook's pocket until the dish is cooked; if the cook faints, it is lost.
        p.log = p.log.filter(e => e !== job.entry);
        job.pocketed = true;
        logEvent(S, `${c.name} quita ${messageTag(job.order)} del hilo y se la guarda: el hilo ya no la tiene.`);
        job.phase = 'toStove';
        job.timer = 0;
        break;
      case 'bin':
        // The order goes in, and the queue forgets it (received and deleted, it already had).
        // Received and deleted, this happens at the stove with the plate in its hands.
        job.timer += dt;
        if(job.timer < binDuration(job)) break;
        if(job.pocketed && !job.binned){
          // From the stove, plate in hand: now it takes the plate out.
          job.binned = true;
          if(S.bin) S.bin.thrown = (S.bin.thrown || 0) + 1;
          logEvent(S, `${c.name} tira a la papelera la comanda ${messageTag(job.order)} que llevaba en el bolsillo.`);
          job.phase = 'toCounter';
          c.faceLeft = true;
          break;
        }
        // Done right there: from the bin it goes straight for the next order, not via its stove.
        completeInQueue(S, c);
        break;
      case 'toCommit': {
        if(job.stale){ finishJob(S, c); break; }
        const row = rowOf(S, job.part);
        if(!walkToRow(c, row, dt)) break;
        if(walkTo(c, commitStandX(S, c, p.committed), COOK_WALK_SPEED, dt)){
          Object.assign(job, {phase:'commit', timer:0, from:p.committed});
          c.faceLeft = false;
        }
        break;
      }
      case 'commit':
        job.timer += dt;
        if(job.stale){ finishJob(S, c); break; }
        // Stays under the chicken while new orders slide the log along.
        if(job.timer < (c.crutches ? CRUTCH_RAISE : COMMIT_TAKEOFF)) walkTo(c, commitStandX(S, c, job.from), COOK_WALK_SPEED, dt);
        // On crutches it hobbles along on the far one while it pushes the chicken, so the raised
        // crutch keeps to the same side of its face all the way.
        else if(c.crutches) c.x = commitStandX(S, c, chickenAt(S, job.part));
        if(job.timer >= commitDuration(c)){
          p.committed = Math.max(p.committed, job.offset + 1, p.earliest);
          logEvent(S, `${c.name} confirma el siguiente offset del hilo ${job.part}: ${p.committed}.`);
          finishJob(S, c);
        }
        break;
    }
  }

  // Walk at a constant speed on the floor even though the rows are spaced differently.
  function walkCookAisle(c, row, dt){
    const y = barTop(c.pos), gap = barTop(row) - y, step = COOK_AISLE_SPEED * dt;
    if(Math.abs(gap) <= step){ c.pos = row; return; }
    const nextY = y + Math.sign(gap) * step;
    const lowerRow = nextY < ROW_TOPS[PLATES_ROW] ? 0 : PLATES_ROW;
    c.pos = lowerRow + (nextY - ROW_TOPS[lowerRow]) / (ROW_TOPS[lowerRow + 1] - ROW_TOPS[lowerRow]);
  }

  // Walk around the right-hand posts before crossing to another row.
  function walkToRow(c, row, dt){
    if(c.pos !== row){
      if(c.x !== COOK_X) walkTo(c, COOK_X, COOK_WALK_SPEED, dt);
      else walkCookAisle(c, row, dt);
      return false;
    }
    c.leavingCounter = false;
    return true;
  }

  // Only seconds in a row count: going back to work starts the wait again. Never two cooks at
  // once, nor one straight after the other: the joke only works on its own.
  function stepBeer(S, c, dt){
    const finish = done => {
      S.lastBeerEnd = S.time;
      if(done) c.beerIn = pickBeerIn(S, BEER_AGAIN);
    };
    if(c.beer !== null){
      if(c.idleFor === 0){
        c.beer = null;
        finish(false);
      } else if((c.beer += dt) >= BEER_SIP_S){
        c.beer = null;
        finish(true);
      }
    }
    if(c.beer !== null) return;
    if(c.idleFor === 0){
      c.beerIn = null;
      return;
    }
    if(c.idleFor < BEER_WAIT_S) return;
    if(c.beerIn === null) c.beerIn = pickBeerIn(S, BEER_FIRST);
    c.beerIn -= dt;
    if(c.beerIn > 0) return;
    const someoneBusy = S.cooks.some(other => other.beer !== null);
    if(someoneBusy || S.time - S.lastBeerEnd < BEER_GAP_S) c.beerIn = BEER_RETRY_S;
    else {
      // Left from an oven gag that is gone: the draw still happens, so every seed keeps its night.
      if(c.active && c.x === COOK_X) random(S.random);
      c.beer = 0;
    }
  }

  const atStove = c => c.x === COOK_X && Number.isInteger(c.pos) && (!c.job || c.job.phase === 'cook' || c.job.phase === 'plate');

  function stepFaint(S, c, dt){
    const f = c.faint;
    f.t += dt;
    if(f.phase === 'slip'){
      if(f.t >= SLIP_FALL_S){
        // Flat on its back: out cold.
        Object.assign(f, {phase:'fainted', t:0, flat:true});
        S.stats.faints++;
        logEvent(S, `${c.name} pisa la peladura, resbala y se da un trompazo.`, 'warn');
        if(f.stay) forget(S, c);
        else setCookActive(S, c.id, false);
      }
      return;
    }
    if(f.phase === 'blast'){
      if(!f.boomed && f.t >= BLAST_BOOM_S){
        // The bang: the slip in its pocket burns, so the order is gone for good, and the cook is
        // left charred for the rest of the night.
        f.boomed = true;
        c.charred = true;
        S.blast = {at:S.time, row:c.row, order:c.job?.order ?? null};
        logEvent(S, `¡Explota la cocina de ${c.name}! La comanda que llevaba en el bolsillo arde con ella.`, 'warn');
        setCookActive(S, c.id, false);
      }
      if(f.t >= BLAST_S){
        // Landed on its back, a little way from the stove: it walks back once it is up.
        Object.assign(f, {phase:'fainted', t:0, flat:true});
        c.x = COOK_X - BLAST_KNOCK;
        S.stats.faints++;
      }
      return;
    }
    if(f.phase === 'fumes' && f.t >= FUMES_S){
      f.phase = 'fainted';
      f.t = 0;
      logEvent(S, `${c.name} se desmaya por los humos.`, 'warn');
      // Already charred by the blast, the first fumes leave their mark too, for good: green eyes,
      // a green dribble from its mouth, like grog, and green splashes on its apron.
      if(c.charred && !c.grog) c.grog = true;
      S.stats.faints++;
      if(f.stay) forget(S, c);
      else setCookActive(S, c.id, false);
    } else if(f.phase === 'fainted' && f.t >= FAINTED_S){
      f.phase = 'waking';
      f.t = 0;
      logEvent(S, `${c.name} vuelve en sí.`);
    } else if(f.phase === 'waking' && f.t >= WAKING_S){
      if(f.crutches){
        Object.assign(f, {phase:'crutches', t:0, fromX:c.x, up:0});
        logEvent(S, `${c.name} sube a por las muletas que había apoyadas en la pared del fondo.`);
        return;
      }
      if(c.crutches){
        // Its crutches fell against the stove: it takes them up from there.
        Object.assign(f, {phase:'crutches', t:0, lean:true});
        return;
      }
      c.faint = null;
      if(!f.stay) setCookActive(S, c.id, true);
    } else if(f.phase === 'crutches' && f.lean){
      if(f.t >= CRUTCH_REACH_S){
        c.faint = null;
        if(!f.stay) setCookActive(S, c.id, true);
      }
    } else if(f.phase === 'crutches'){
      // Over to its spot beside the stove, straight up the floor to the wall, the reach, and
      // straight back down on them. `up` is how far its feet are from its row's floor line.
      const down = f.t - CRUTCH_STEP_S - CRUTCH_REACH_S;
      c.x = lerp(f.fromX, COOK_X, clamp01(f.t / CRUTCH_SIDE_S));
      f.up = CRUTCH_UP * (down < 0 ? clamp01((f.t - CRUTCH_SIDE_S) / CRUTCH_UP_S) : 1 - clamp01(down / CRUTCH_UP_S));
      c.walking = f.t < CRUTCH_STEP_S || down > 0;
      if(f.t >= CRUTCH_S){
        c.x = COOK_X;
        c.walking = false;
        c.crutches = true;
        c.faint = null;
        if(!f.stay) setCookActive(S, c.id, true);
      }
    }
  }

  // Out cold but still in the group: what it was doing, and how far it had read, are gone with
  // its memory. Only a committed mark, if there is one, says where to pick up.
  function forget(S, c){
    dropJob(S, c);
    c.partitions.forEach(part => { S.comandas[part].position = S.comandas[part].committed; });
  }

  // A rest: the cook takes out a beer once seated, checks the empty glass and leaves it on the table.
  const REST_WALK_SPEED = 110, REST_SIT_S = SIT_S, REST_FIRST_SIP_S = 1.5, REST_SIPS = 3;
  const REST_CHECK_S = 2.4, PIRATE_AFTER_S = 0.8, PIRATE_SAY_S = 3.4, DOZE_AFTER_S = 2.5;
  const PIRATE_LINES = ['I want to be', 'a pirate!'];
  // On the diners' stool. Behind the table it walks where the diners do; sitting, its feet go up
  // to the stool's rung, as it is shorter than the pirates.
  const REST_SEAT_X = STOOL_X + 4;
  const restWalkFeet = table => tableTop(table) + 29;
  const restSeatFeet = table => tableTop(table) + 22;
  // Between sips, 3 to 7 seconds, varied without touching the simulation's random sequence.
  const restSipWait = sips => 3 + (sips * 0.618 % 1) * 4;
  function restPath(table){
    return [{x:TABLE_AISLE_X, y:restWalkFeet(table)}, {x:REST_SEAT_X, y:restWalkFeet(table)}];
  }

  function stepRest(c, dt){
    const r = c.rest;
    r.t += dt;
    c.walking = false;
    if(r.phase === 'walk'){
      const at = {x:c.x, y:r.feet, faceLeft:c.faceLeft}, to = r.path[0];
      const arrived = walkToPoint(at, to.x, to.y, REST_WALK_SPEED, dt);
      Object.assign(c, {x:at.x, faceLeft:at.faceLeft, walking:!arrived});
      r.feet = at.y;
      if(arrived && r.path.shift() && !r.path.length){
        // It turns to face the table and sits down.
        c.faceLeft = false;
        Object.assign(r, {phase:'sitdown', t:0});
      }
    } else if(r.phase === 'sitdown'){
      if(r.t >= REST_SIT_S) Object.assign(r, {phase:'sit', t:0, feet:restSeatFeet(r.table)});
    } else if(r.phase === 'check'){
      if(r.t >= REST_CHECK_S) Object.assign(r, {phase:'wait', t:0});
    } else if(r.phase === 'wait'){
      if(r.t >= PIRATE_AFTER_S && !r.said){
        r.said = true;
        say(c, PIRATE_LINES, {hold:PIRATE_SAY_S});
      }
      if(r.t >= PIRATE_AFTER_S + PIRATE_SAY_S + DOZE_AFTER_S) Object.assign(r, {phase:'doze', t:0});
    } else if(r.phase === 'doze'){
      // Asleep on the table for the rest of the night.
    } else if(r.sip !== null){
      r.sip += dt;
      if(r.sip >= BEER_SIP_S){
        r.sip = null;
        r.sips++;
        r.wait = restSipWait(r.sips);
        if(r.sips >= REST_SIPS) Object.assign(r, {phase:'check', t:0});
      }
    } else if((r.wait -= dt) <= 0) r.sip = 0;
  }

  function stepCook(S, c, dt){
    if(c.arriving){ stepArrival(S, c, dt); return; }
    if(c.rest){
      stepRest(c, dt);
      c.idleFor = 0;
      return;
    }
    // Building its wire it is still in the group, just with nothing assigned yet.
    if(c.building) return;
    if(c.faint && c.faint.phase === 'waiting' && atStove(c)) c.faint.phase = 'fumes';
    if(c.faint && c.faint.phase !== 'waiting'){
      // Out cold: nothing moves, nothing gets done, and certainly no beer.
      stepFaint(S, c, dt);
      c.walking = false;
      c.idleFor = 0;
      c.beer = null;
      return;
    }
    const startX = c.x, startPos = c.pos;
    if(!c.active){
      // Out of the group but still in the kitchen, standing by its own stove.
      if(walkToRow(c, c.row, dt)) walkTo(c, COOK_BREAK_X, COOK_WALK_SPEED, dt);
    } else if(c.job){
      stepCookJob(S, c, dt);
    } else if(!holding(S)){
      // About to leave, it takes nothing new: it only finishes and confirms what it has.
      const pick = !S.rebalance && !c.leaving && c.partitions.length ? pickPartition(S, c) : null;
      const goal = pick ? rowOf(S, pick.part) : c.row;
      if(pick && c.pos === goal){
        c.leavingCounter = false;
        startFetch(S, c, pick);
      } else if(walkToRow(c, goal, dt)){
        // With no order to read, wait at its own stove.
        walkTo(c, COOK_X, COOK_WALK_SPEED, dt);
      }
    } else {
      // Held while something is set up: back to its own stove to wait.
      if(walkToRow(c, c.row, dt)) walkTo(c, COOK_X, COOK_WALK_SPEED, dt);
    }
    c.walking = c.x !== startX || c.pos !== startPos;
    const listening = S.build?.phase === 'peekBoss' || S.build?.phase === 'peekSay'
      || (REST_TALK.has(S.build?.phase) && !c.job && !c.walking);
    if(listening) c.faceLeft = false;
    // A nap is not standing about: no beer while it dozes.
    c.idleFor = c.job || c.walking || listening ? 0 : c.idleFor + dt;
    stepBeer(S, c, dt);
  }

  function walkTo(e, target, speed, dt){
    const gap = target - e.x;
    if(gap !== 0) e.faceLeft = gap < 0;
    e.x = Math.abs(gap) <= speed * dt ? target : e.x + Math.sign(gap) * speed * dt;
    return e.x === target;
  }

  function walkToPoint(e, tx, ty, speed, dt){
    const dx = tx - e.x, dy = ty - e.y, dist = Math.hypot(dx, dy), step = speed * dt;
    if(dx !== 0) e.faceLeft = dx < 0;
    if(dist <= step){
      e.x = tx; e.y = ty;
      return true;
    }
    e.x += dx / dist * step;
    e.y += dy / dist * step;
    return false;
  }

  // Change rows in the aisle to the right of the tables; the last stretch runs along the edge.
  function approachTable(w, table, dt, feetOffset = 0){
    const y = serviceFeet(table) - feetOffset;
    const x = w.y === y ? TABLE_X : TABLE_AISLE_X;
    return walkToPoint(w, x, y, WAITER_SPEED, dt) && x === TABLE_X;
  }

  function leaveTable(w, x, y, dt){
    if(w.x < TABLE_AISLE_X){
      walkToPoint(w, TABLE_AISLE_X, w.y, WAITER_SPEED, dt);
      return false;
    }
    return walkToPoint(w, x, y, WAITER_SPEED, dt);
  }

  function serve(S, message){
    const customer = S.customers.find(c => c.visit === message.visit);
    if(customer && !message.served){
      message.served = true;
      customer.plates.push(message);
      S.stats.served++;
      const missing = customer.messages.find(m => m.seq < message.seq && !m.served);
      if(customer.menu && missing){
        const course = ITEMS[message.items[0]].course;
        const dessertBeforeStarter = course === 'postre' && ITEMS[missing.items[0]].course === 'primero';
        customer.puzzled = dessertBeforeStarter ? 0 : PUZZLED_S;
        customer.brokeOrder = true;
        customer.say = {lines:OUT_OF_ORDER_LINES[course], t:0, hold:OUT_OF_ORDER_SAY_S};
        S.stats.outOfOrder++;
        logEvent(S, `A ${DINERS[customer.letter].keyName} le llega ${ITEMS[message.items[0]].name.toLowerCase()} antes que ${ITEMS[missing.items[0]].name.toLowerCase()}: el orden se ha roto.`, 'warn');
      }
    } else {
      S.stats.duplicates++;
      logEvent(S, `Sobra un plato: ${messageTag(message)} ya se había servido.`, 'warn');
      // It lands on the table anyway: whoever sits there now says what they make of it.
      S.strays.push({order:message, table:message.table, t:0});
      const sitting = S.customers.find(c => c.table === message.table && ['waitingWaiter','asking','seated','complain'].includes(c.state));
      if(sitting){
        // A different line each time, in turn, so the joke does not wear thin.
        const lines = sitting.visit === message.visit ? STRAY_LINES.eaten : STRAY_LINES.notMine;
        S.strayLine = (S.strayLine || 0) + 1;
        const first = S.strayLine === 1;
        sitting.say = {lines:first ? STRAY_INSULT : lines[S.strayLine % lines.length], t:0, stray:true};
        // The cook of that wire thinks the comeback, a moment later, to itself.
        const cook = first && S.cooks.find(k => k.partitions.includes(message.partition));
        if(cook) cook.think = {lines:STRAY_COMEBACK, t:-COMEBACK_DELAY_S};
      }
    }
  }

  // Not Kafka: the waiter walks to the oldest plate on the counter, gets the tray right under it
  // and carries it off, one at a time.
  function stepTrayWaiters(S, dt){
    S.trayWaiters.forEach(w => {
      switch(w.state){
        case 'idle':
          if(S.counter.length) w.state = 'toPlate';
          break;
        case 'toPlate':
          if(walkToPoint(w, S.counter[0].x - TRAY_REACH, w.home.y, WAITER_SPEED, dt)){
            w.plate = S.counter.shift().order;
            w.state = 'take';
            w.timer = 0;
            w.faceLeft = false;
          }
          break;
        case 'take':
          w.timer += dt;
          if(w.timer >= WAITER_TAKE_S) w.state = 'deliver';
          break;
        case 'deliver':
          if(approachTable(w, w.plate.table, dt, TRAY_FEET_OFFSET)){
            serve(S, w.plate);
            w.plate = null;
            w.state = 'return';
          }
          break;
        case 'return':
          if(leaveTable(w, w.home.x, w.home.y, dt)){
            w.state = 'idle';
            w.faceLeft = false;
          }
          break;
      }
    });
  }

  // Each ticket gets its own acknowledgement as it reaches its partition.
  function acknowledgeMessage(S, message){
    message.ackAt = S.time;
    S.boss.saidAt = S.time;
    S.boss.lastAck = message;
    logEvent(S, `«¡Oído cocina!»: la comanda ${messageTag(message)} ya está en el hilo ${message.partition}.`);
  }

  // Producers of the orders topic: a free waiter takes the oldest diner still waiting,
  // writes the order at the table and sends it from the left end of the bar of that key.
  function stepBarWaiters(S, dt){
    S.barWaiters.forEach(w => {
      switch(w.state){
        case 'idle': {
          // Not while the wire is about to be moved: it is needed for that. Before the board changes
          // it still serves the tapas diners already in: the board waits for the room to empty.
          if(S.wire || holding(S) && S.build.phase === 'wait') break;
          const customer = S.customers.find(c => c.state === 'waitingWaiter' && !c.attended);
          if(customer){
            customer.attended = true;
            w.customer = customer;
            w.letter = customer.letter;
            w.row = rowOf(S, customer.partition);
            w.toSend = [...customer.messages];
            w.state = 'toTable';
          }
          break;
        }
        case 'toTable':
          if(approachTable(w, w.customer.table, dt)){
            w.customer.state = 'asking';
            w.customer.timer = ORDER_S;
            w.state = 'atTable';
          }
          break;
        case 'atTable':
          if(w.customer.state === 'seated') w.state = 'toBar';
          break;
        case 'toBar':
          if(leaveTable(w, standX(w.row), floorY(w.row), dt)){
            w.state = 'order';
            w.timer = ORDER_S;
            w.faceLeft = false;
          }
          break;
        case 'order':
          w.timer -= dt;
          if(w.timer <= 0){
            const message = w.toSend.shift();
            const start = barStart(w.row) + 4;
            // The cat intercepts only the dish left for it, the last order of its pirate, leaving the
            // earlier ones in the log. It lies above the top wire, so it only reaches orders going there.
            const snatch = S.loseNext > 0 && message.bait && !w.toSend.length && !message.resent
              && rowOf(S, message.partition) === Math.min(...S.rows);
            if(snatch) S.loseNext--;
            if(S.boss.present) message.ackAt = null;
            const dur = snatch ? CAT_POUNCE_S / CAT_GRAB_PROGRESS : (barEnd(w.row) - 34 - start) / SLIDE_SPEED;
            S.tickets.push({order:message, part:message.partition, x0:start, t:0, dur, snatch});
            // Leave a short gap between visible calls at the pass.
            if(w.toSend.length) w.timer = S.boss.present ? OIDO_SHOW_S + 0.2 : ORDER_ITEM_S;
            // Without anyone to acknowledge it, the waiter just hangs the order and goes.
            else { w.state = S.boss.present ? 'awaitAck' : 'back'; w.timer = 0; }
          }
          break;
        case 'awaitAck': {
          if(S.tickets.some(ticket => ticket.order.visit === w.customer.visit)) break;
          // A null ack is outstanding. Earlier tickets sent before the boss arrived never expected one.
          const missing = w.customer.messages.filter(m => m.ackAt === null);
          if(missing.length){
            w.timer += dt;
            if(w.timer < ACK_WAIT_S) break;
            missing.forEach(m => { m.lost = false; m.resent = true; });
            S.stats.resent += missing.length;
            logEvent(S, `Sin «¡oído!» para ${missing.map(messageTag).join(', ')}: el camarero reenvía la comanda pendiente.`, 'key');
            w.toSend = missing;
            w.state = 'order';
            w.timer = ORDER_S;
          } else if(w.customer.messages.every(m => m.ackAt === undefined || S.time - m.ackAt >= ACK_S)){
            w.state = 'back';
          }
          break;
        }
        case 'back':
          if(walkToPoint(w, w.home.x, w.home.y, WAITER_SPEED, dt)){
            w.state = 'idle';
            w.customer = null;
            w.letter = null;
            w.row = null;
            w.faceLeft = false;
          }
          break;
      }
    });
  }

  // Angry only when something went wrong with its order: a dish lost for good (fits, then it
  // complains and goes) or one held up by a cook that dropped it (fits while waiting). A merely busy kitchen does not upset anyone.
  function isImpatient(c){
    if(c.state === 'complain') return true;
    // A lost dish: it waits quietly, then gets angry once, says so and goes (the 'complain' state).
    // A held-up dish only upsets it after a while: at first it is just one more dish on its way.
    const angryFor = c.waitingDelayed ? c.upset - DELAY_ANGRY_S : -1;
    return angryFor >= 0 && angryFor % LOST_FIT_CYCLE_S < FIT_S;
  }

  function stepUpset(S, c, dt){
    const waiting = c.state === 'seated' && !c.eating && !c.plates.length;
    const delayed = waiting && S.comandas[c.partition].log.find(entry => entry.lockAbandonedByFaint
      && !entry.taken && entry.lockFrom !== undefined && S.time < entry.lockUntil
      && entry.order.visit === c.visit && !entry.order.served && !entry.order.lost)?.order;
    c.waitingDelayed = !!delayed;
    c.upset = c.waitingLost || c.waitingDelayed ? (c.upset || 0) + dt : 0;
    if(delayed && !c.protestedDelay && c.upset >= DELAY_ANGRY_S){
      c.protestedDelay = true;
      c.say = {lines:LOST_DISH_LINES[delayed.items[0]], t:0, dishComplaint:true};
      S.stats.protested++;
      logEvent(S, `${DINERS[c.letter].keyName} protesta porque tarda ${ITEMS[delayed.items[0]].name.toLowerCase()}.`, 'warn');
    }
  }

  function stepCustomers(S, dt){
    S.customers = S.customers.filter(c => {
      if(c.puzzled > 0) c.puzzled = Math.max(0, c.puzzled - dt);
      if(c.say && (c.say.t += dt) >= (c.say.hold ?? (c.say.dishComplaint ? KURWA_S + COMPLAIN_S : SAY_S))) c.say = null;
      stepUpset(S, c, dt);
      switch(c.state){
        case 'enter':
          if(walkTo(c, DINER_FEET_X, SEAT_SPEED, dt)){
            c.state = 'sit';
            c.timer = SIT_S;
          }
          break;
        case 'sit':
        case 'rise':
          c.timer -= dt;
          if(c.timer <= 0) c.state = c.state === 'sit' ? 'waitingWaiter' : 'leave';
          break;
        case 'asking':
          c.timer -= dt;
          if(c.timer <= 0) c.state = 'seated';
          break;
        case 'seated':
          if(c.eating){
            c.timer -= dt;
            if(c.timer > 0) break;
            c.eating.finished = true;
            c.eating = null;
            c.eaten++;
            if(c.eaten >= c.total){
              S.payments++;
              c.state = 'rise';
              c.timer = SIT_S;
              break;
            }
          }
          // An order lost on its way never comes: after a while the diner gives up on it and goes.
          const waitingForLost = !c.eating && !c.plates.length && c.messages.some(m => m.lost && !m.served)
            && c.messages.every(m => m.finished || (m.lost && !m.served));
          c.waitingLost = waitingForLost;
          if(waitingForLost && (c.giveUp = (c.giveUp || 0) + dt) >= GIVE_UP_S){
            c.state = 'complain';
            c.timer = KURWA_S + COMPLAIN_S;
            c.waitingLost = false;
            const lost = c.messages.find(m => m.lost && !m.served);
            c.complaintLines = LOST_DISH_LINES[lost.items[0]];
            S.stats.gaveUp++;
            logEvent(S, `${DINERS[c.letter].keyName} se va sin ${ITEMS[lost.items[0]].name.toLowerCase()}: su comanda se perdió y nadie se enteró.`, 'warn');
            break;
          }
          // Tapas are eaten as they come. A menu goes course by course: a course that turns up before
          // the one it follows waits on the table, and the diner does not like it.
          if(c.plates.length){
            const next = c.menu ? c.plates.find(m => m.seq === c.eaten + 1) : c.plates[0];
            if(next){
              c.plates = c.plates.filter(m => m !== next);
              c.eating = next;
              c.timer = EAT_S;
            }
          }
          break;
        case 'complain':
          c.timer -= dt;
          if(c.timer <= 0){ c.state = 'rise'; c.timer = SIT_S; }
          break;
        case 'leave':
          c.x -= SEAT_SPEED * dt;
          return c.x > -20;
      }
      return true;
    });
  }

  function stepFlights(S, dt){
    S.stolen = S.stolen.filter(ticket => {
      ticket.t += dt;
      if(ticket.t < CAT_RETURN_S) return true;
      S.catStash.push(ticket.order);
      return false;
    });
    S.strays = S.strays.filter(p => (p.t += dt) < STRAY_S);
    S.tickets = S.tickets.filter(ticket => {
      ticket.t += dt / ticket.dur;
      if(ticket.snatch && ticket.t >= CAT_GRAB_PROGRESS){
        ticket.order.lost = true;
        S.stolen.push({order:ticket.order, part:ticket.part, x0:ticket.x0, t:0});
        S.stats.lost++;
        const theft = `El gato se lleva la comanda ${messageTag(ticket.order)} antes de que llegue al hilo.`;
        logEvent(S, S.boss.present ? theft : `${theft} Nadie avisa al camarero.`, 'warn');
        return false;
      }
      if(ticket.t < 1) return true;
      const offset = appendToLog(S, S.comandas[ticket.part], ticket.order);
      logEvent(S, `${messageTag(ticket.order)} → hilo ${ticket.part}, offset ${offset}`);
      if(S.boss.present) acknowledgeMessage(S, ticket.order);
      return false;
    });
    S.plates = S.plates.filter(plate => {
      plate.x -= SLIDE_SPEED * dt;
      const tail = counterSlotX(S.counter.length);
      if(plate.x > tail) return true;
      S.counter.push({order:plate.order, x:Math.max(plate.x, tail)});
      return false;
    });
    // The queue moves up as plates are taken.
    S.counter.forEach((entry, i) => {
      entry.x = Math.max(counterSlotX(i), entry.x - SLIDE_SPEED * dt);
    });
  }

  // What a cook is doing, in the words of a real Kafka consumer. A commit stores the next
  // offset to read, so after processing offset 3 the group commits 4.
  function consumerAction(S, c){
    if(c.faint && c.faint.phase !== 'waiting') return {fumes:'FAILING', blast:c.faint.boomed ? 'CRASHED' : 'FAILING', slip:'FAILING', fainted:'CRASHED', waking:'RESTART', crutches:'RESTART'}[c.faint.phase];
    if(c.arriving) return 'JOINING';
    if(!c.active) return 'LEFT GROUP';
    if(!c.job) return S.rebalance ? 'REBALANCE' : c.partitions.length ? 'POLL' : 'IDLE';
    const {phase, offset} = c.job;
    if(!S.features.retain){
      if(phase === 'toTicket' || phase === 'read' || phase === 'hang') return S.features.peekLock ? 'PEEK-LOCK' : 'RECV+DELETE';
      if(['toTake', 'take', 'bin'].includes(phase)) return c.job.cooked && !c.job.pocketed ? 'COMPLETE' : 'RECV+DELETE';
    }
    if(phase === 'toTicket' || phase === 'read') return `FETCH ${offset}`;
    if(phase === 'toCommit' || phase === 'commit') return `COMMIT ${offset + 1}`;
    if(phase === 'toCounter' || phase === 'drop') return 'OUTPUT';
    return 'PROCESS';
  }

  // ---- Upgrades: the restaurant grows one step at a time, built by its own people ----

  // From a plain queue to Kafka, each step either brings a problem or the feature that solves it.
  // Each one says what kind of step it is, what it is about, and what is going on while it runs;
  // short, to fit on the wall.
  const UPGRADES = [
    {kind:'New', name:'competing consumers on one queue', doing:'a second cook joins the same queue', start:startSecondCook},
    {kind:'Problem', name:'receive-and-delete loses orders on a crash', doing:'a stove blows up with the order', start:startBurnt},
    {kind:'Fix', name:'peek-lock locks it, deletes it when done', doing:'orders stay, under a timed padlock', start:startPeekLock},
    {kind:'Demo', name:'with peek-lock, the lock just runs out', doing:'stove fumes: the order waits out its lock', start:startPeekFumes},
    {kind:'Problem', name:'competing consumers break the order', doing:'set menus: courses must come in order', start:startMenus},
    {kind:'Fix', name:'each key always goes to the same wire', doing:'a second wire: one per partition', start:startKeyedWires},
    {kind:'Problem and fix', name:'keep orders after reading, like a log', doing:'the boss wants to count the orders', start:startCashCount},
    {kind:'Problem', name:'without a saved offset, work is repeated', doing:'a slip: back to earliest (latest would skip)', start:startBreak},
    {kind:'Fix', name:'commit saves each wire\'s offset', doing:'rubber chickens mark each cook\'s place', start:startCommits},
    {kind:'Demo', name:'another consumer group, its own offset', doing:'the boss recounts from his own mark', start:startRecount},
    {kind:'New', name:'a consumer leaves, the group rebalances', doing:'a table empties, a cook takes a break', start:startRest},
    {kind:'Problem', name:'a message lost on its way to the broker', doing:'the cat steals an order mid-flight', start:startLoss},
    {kind:'Fix', name:'the broker acks every message', doing:'the boss confirms every order he gets', start:startAcks},
    {kind:'Demo', name:'no ack, so the producer resends', doing:'an order is lost and sent again', start:startLoss}
  ];
  const SEARCH_S = 0.75;
  // Wait for a cook that has already read enough orders to make the replay visible.
  const REREAD_MIN = 3;
  // Dragging comes in heaves: a pull, a pause to get a grip again.
  const HEAVE_SPEED = 230, HEAVES_PER_S = 1.6, INSTALL_S = 0.5;
  const MOVE_S = 1.4;
  const RAISE_S = 0.8, RAISE2_S = 0.6, PLANT_S = 0.35, CARRY_SPEED = 220, CARRY_LIFT = 4;
  // The posts of the new wire, and where the new cook stands: it holds a post just to its right.
  const NEW_ROW = 2, RIGHT_POST_X = barEnd() - 4, LEFT_POST_X = barStart() + 4, HOLD_AT = 14;
  const BUILD_SPOTS = {right:RIGHT_POST_X - 2 - HOLD_AT - 4, left:LEFT_POST_X - 2 - HOLD_AT};
  // The head of the dining room's visits: where he looks at the wires, and how long he talks.
  // He walks in front of the counter, so he is seen whole.
  const SIGN_X = 462, SIGN_TOP = 49, SIGN_HALF = 57, SIGN_H = 88;
  const SIGN_TEXT_Y = SIGN_TOP + 27, SIGN_LINE_GAP = 19, TAPAS_TEXT_Y = SIGN_TEXT_Y + 5;
  const SIGN_FEET = 145, SIGN_REACH = 20;
  const SIGN_WIPE_S = 2.4, SIGN_WRITE_S = 5.2;
  // Pen strokes on a four-by-six grid, as "x,y" points; a slash lifts the chalk. Rounded where
  // a hand would round them, and the accents are short flicks above the letter.
  const CHALK_LETTERS = {
    A:'0,6 1.7,0.3 2.3,0.3 4,6/0.9,3.9 3.1,3.9',
    D:'0,0 0,6/0,0 2.2,0 3.4,0.7 4,2.2 4,3.8 3.4,5.3 2.2,6 0,6',
    E:'4,0 0,0 0,6 4,6/0,3 3,3',
    Í:'1,0 1,6/1.4,-1.2 2.4,-2.4',
    L:'0,0 0,6 3.6,6',
    M:'0,6 0,0 2,3.6 4,0 4,6',
    N:'0,6 0,0 4,6 4,0',
    P:'0,6 0,0 2.8,0 3.8,0.7 4,1.6 3.8,2.5 2.8,3.2 0,3.2',
    S:'3.8,0.9 3,0.1 1,0.1 0.2,0.9 0.2,2.1 1,2.8 3,3.2 3.8,3.9 3.8,5.1 3,5.9 1,5.9 0.2,5.1',
    T:'0,0 4,0/2,0 2,6',
    Ú:'0,0 0,4.4 0.6,5.5 2,6 3.4,5.5 4,4.4 4,0/2.2,-1.2 3.2,-2.4'
  };
  // Between strokes of a letter the hand hops through the air faster than it writes; a long move,
  // like back to the start of the next line, goes slower, so the boss steps back along the board
  // ahead of his hand instead of reaching across himself.
  const CHALK_AIR = 0.35, CHALK_HOP = 15, CHALK_RETURN = 2.4, CHALK_SLANT = 0.15;
  function chalkLine(lines, scaleX, scaleY, top){
    const segments = [];
    let last, length = 0, time = 0, widest = 0;
    const advance = ch => (ch === ' ' ? 3 : ch === 'Í' ? 3.2 : 5.6);
    lines.forEach((label, row) => {
      const width = ([...label].reduce((sum, ch) => sum + advance(ch), 0) - 1.6) * scaleX;
      widest = Math.max(widest, width);
      let cursor = SIGN_X - width / 2;
      const baseline = top + row * SIGN_LINE_GAP;
      for(const ch of label){
        for(const stroke of (CHALK_LETTERS[ch] || '').split('/').filter(Boolean)){
          stroke.split(' ').forEach((point, j) => {
            const [px, py] = point.split(',').map(Number);
            const x = cursor + px * scaleX + (6 - py) * CHALK_SLANT * scaleX, y = baseline + py * scaleY;
            if(last){

              const pace = ink ? 1 : span > CHALK_HOP ? CHALK_RETURN : CHALK_AIR;
              segments.push({from:last, x, y, start:length, end:length + span, t0:time, t1:time + span * pace, ink});
              length += span;
              time += span * pace;
            }
            last = {x, y};
          });

      }
    });

  }
  const tapasLine = chalkLine(['TAPAS'], 2.5, 2.2, TAPAS_TEXT_Y);
  const menuLine = chalkLine(['MENÚ', 'DEL DÍA'], 2.3, 2, SIGN_TEXT_Y);
  const SIGN_ERASER_W = 12, SIGN_ERASER_H = 12;
  const signEraserBox = tip => ({
    x:Math.round(tip.x) - SIGN_ERASER_W / 2, y:Math.round(tip.y) - SIGN_ERASER_H / 2
  });
  function chalkTip(segment, distance){
    const k = Math.max(0, Math.min(1, (distance - segment.start) / Math.max(1e-6, segment.end - segment.start)));
    return {x:segment.from.x + (segment.x - segment.from.x) * k, y:segment.from.y + (segment.y - segment.from.y) * k};
  }
  // How far along the strokes the chalk has gone after this fraction of the writing time.
  function chalkReach(line, fraction){

    const segment = line.segments.find(s => s.t1 >= time) ?? line.segments[line.segments.length - 1];
    const k = Math.max(0, Math.min(1, (time - segment.t0) / Math.max(1e-6, segment.t1 - segment.t0)));

  const signStand = build => ({x:signHand(build).x - SIGN_REACH, y:SIGN_FEET});

  const SET_MENU = ['paella', 'platano'], SET_MENU_SLOW = 3;

  // The boss throws one rubber chicken per wire, the top one first: a wind-up, a flight that

  // Where the boss's throw for a wire is: null before it starts or once it has landed.

  }

  // Its demonstration: this time the stove gives off fumes, the lock just lapses, and the other cook

  function startPeekFumes(S){

  // 2. Menus: now the order of the courses matters, and two cooks on one queue can swap them.

  // 4. The head of the dining room comes to cash up from the orders of the day, and there are none:
  // they are all in the bin. He kicks it out and tells the cooks that from now on orders are kept.

  function startCashCount(S){
    if(S.build || S.features.retain || !S.features.keys) return false;

  }

  // Cashing up reads the retained orders with its own cursor, separate from the kitchen.

  function startBreak(S){

  }

  // 7. Commits: each cook marks on the wire how far it has got, so after a slip it picks up there.
  // The head of the dining room comes in to tell them so.
  function startCommits(S){

        if(w.state !== 'idle' || S.tickets.length || S.cooks.some(k => k.job || k.faint || k.beer !== null)) break;
        // And each one back at its own stove, where the setting up starts from.
        if(S.cooks.some(k => k.pos !== k.row || k.x !== COOK_X)) break;
        c.building = c2.building = true;
        c.idleFor = c2.idleFor = 0;
        c.beerIn = c2.beerIn = null;
        w.state = 'moving';
        build.hold = false;
        next('toPosts');
        break;
      case 'toPosts': {
        w.walking = !walkToPoint(w, LEFT_POST_X - 2 - HOLD_AT, floorY(PLATES_ROW), WAITER_SPEED, dt);
        // Its stove is up already, so it may have to come down to the wire first.
        const step = 2 * dt;
        c.pos = Math.abs(PLATES_ROW - c.pos) <= step ? PLATES_ROW : c.pos + Math.sign(PLATES_ROW - c.pos) * step;
        c.walking = !walkTo(c, RIGHT_POST_X - 2 - HOLD_AT, COOK_WALK_SPEED, dt) || c.pos !== PLATES_ROW;

          next('lift');
        }
        break;
      }
      case 'lift': {
        const k = Math.min(1, build.t / MOVE_S);
        S.move = {part:0, from:PLATES_ROW, to:0, k};
        w.y = floorY(PLATES_ROW) + (floorY(0) - floorY(PLATES_ROW)) * k;
        c.pos = PLATES_ROW - k;
        w.walking = c.walking = k < 1;
        if(k < 1) break;
        S.move = null;
        S.rows[0] = 0;
        w.state = 'back';
        c.building = false;
        c.faceLeft = true;
        next('done');
        S.wire = {phase:'toRight', t:0, rightPost:0, secondX:null, second:0, lift:0};
