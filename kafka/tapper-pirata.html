  function drawCatPose(pose, x, y, faceLeft = true, extra = null){
    g.save();
    g.translate(Math.round(x), Math.round(y));
    g.scale(faceLeft ? 2 : -2, 2);
    const left = -pose.mouth.x, top = -pose.mouth.y;
    drawCatCel(pose.pixels, left, top, isBlinking(7) ? {e:'#'} : {});
    if(extra) drawCatCel(extra.pixels, left + extra.x, top + extra.y);
    g.restore();
  }

  // Stolen slips stay on the board, under its front paws.
  function drawCatStash(){
    S.catStash.forEach((order, i) => drawLooseSlip(order, CAT_BOARD.left + 7 + i * 8, CAT_BOARD.top + 5, 10, 10));
  }

  function drawCatPerch(){
    g.save();
    g.globalAlpha *= 1 - mixOf(STAGE.topic);
    drawCatStash();
    g.restore();
    if(S.stolen.length || S.tickets.some(ticket => ticket.snatch)) return;
    const swing = Math.floor(S.time / 0.45) % 9, tail = CAT_TAILS[swing === 3 ? 1 : swing === 6 ? 2 : 0];
    drawCatPose(CAT_LOAF, CAT_HOME.x, CAT_HOME.y, true, {...tail, y:5});
  }

  function drawCats(kafka){
    for(const ticket of S.tickets){
      if(!ticket.snatch) continue;
      const progress = ticket.t / CAT_GRAB_PROGRESS;
      // A wiggle of the hindquarters, then the pounce.
      if(progress < CAT_WINDUP){
        const wiggle = Math.floor(progress * CAT_POUNCE_S / 0.07) % 2;
        drawCatPose(CAT_CROUCH, CAT_CROUCHED.x + wiggle, CAT_CROUCHED.y);
        continue;
      }
      const k = (progress - CAT_WINDUP) / (1 - CAT_WINDUP), target = catTarget(ticket, kafka);
      const x = lerp(CAT_CROUCHED.x, target.x, k);
      const y = lerp(CAT_CROUCHED.y, target.y, k * k) - Math.sin(Math.PI * k) * 14;
      drawCatPose(CAT_LEAP, x, y);
    }
    for(const ticket of S.stolen){
      const progress = ticket.t / CAT_RETURN_S, target = catTarget(ticket, kafka);
      // It lands crouched on the wire with the slip in its jaws, turns round and jumps back up.
      const onWire = {x:target.x, y:target.y - 11}, turned = {x:onWire.x + 16, y:onWire.y};
      let x, y, pose = CAT_CROUCH, faceLeft = false;
      if(progress < CAT_BITE){
        const k = smooth(progress / CAT_BITE);
        x = target.x;
        y = lerp(target.y, onWire.y, k);
        faceLeft = true;
      } else if(progress < CAT_LANDING){
        const k = (progress - CAT_BITE) / (CAT_LANDING - CAT_BITE);
        x = lerp(turned.x, CAT_LANDED.x, smooth(k));
        y = lerp(turned.y, CAT_LANDED.y - 4, k) - Math.sin(Math.PI * k) * 22;
        pose = CAT_LEAP;
      } else ({x, y} = CAT_LANDED);
      if(kafka) drawMiniRecord(x - 5, y + 1, ticket.order);
      else {
        // The slip dangles from its jaws, swinging less as the jump settles.
        const sway = Math.sin(ticket.t * 20) * (1 - progress);
        const height = lerp(22, 10, progress);
        drawLooseSlip(ticket.order, x + sway * 3, y + height / 2, lerp(20, 10, progress), height);
      }
      drawCatPose(pose, x, y, faceLeft);
    }
  }

  // In-flight orders and the cat move above the furniture. Kafka also draws the returning ack.
  function drawMessagesInFlight(){
    morphDraw(mixOf(STAGE.topic), () => {
      for(let part = 0; part < S.comandas.length; part++) drawFlights(part);
      drawCats(false);
    }, () => {
      S.tickets.forEach(ticket => {
        const at = alongPath(flightPath(ticket), ticket.t);
        drawMiniRecord(at.x - 5, at.y - 6, ticket.order);
      });
      drawAck();
      drawCats(true);
    });
  }

  // The tutorial darkens the scene and draws the actors of the step again on top, so exactly
  // their pixels stay lit, in whichever look they have.
  function drawTutorial(){
    if(!tutorialStep) return;
    g.fillStyle = 'rgba(0,0,0,0.75)';
    g.fillRect(0, 0, W, H);
    frameTick = 0;
    [() => { drawProducers(); morphDraw(mixOf(STAGE.producers), drawDinerMenus, () => {}); },
      () => { drawOrderWaiters(); drawTrayWaiters(); morphDraw(mixOf(STAGE.partitioner), drawWaiterOrders, () => {}); },
      () => { drawTopic(); drawMessagesInFlight(); }, drawKitchen, () => { drawCounterRow(); drawBin(); }][tutorialStep - 1]();
    frameTick = 0.016;
  }

  // Stamp the same pixel trail at rest and during the stroke. The lighter grains sit inside the
  // chalk line; the softer edge is what the eraser picks up as it passes.
  // A stick of chalk two pixels wide: a soft dusty edge, a pale body, and grain where the chalk
  // skipped over the slate.
  function paintChalk(ctx, line, fraction){
    const points = [], {distance} = chalkReach(line, fraction);
    for(const segment of line.segments){
      if(segment.start >= distance) break;
      if(!segment.ink) continue;
      const end = Math.min(segment.end, distance);
      for(let at = segment.start; at < end; at += .4) points.push(chalkTip(segment, at));
      points.push(chalkTip(segment, end));
    }
    const pixels = new Map();
    for(const {x, y} of points){
      const px = Math.round(x), py = Math.round(y);
      for(const [dx, dy] of [[0, 0], [1, 0], [0, 1], [1, 1]]) pixels.set(`${px + dx},${py + dy}`, [px + dx, py + dy]);
    }
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = '#c9c4b1';
    for(const [x, y] of pixels.values()) ctx.fillRect(x - 1, y + 1, 1, 1);
    ctx.restore();
    for(const [x, y] of pixels.values()){
      const grain = (x * 17 + y * 11 + x * y) % 13;
      ctx.fillStyle = grain < 2 ? '#8f8d82' : grain < 5 ? '#c4beab' : grain < 11 ? '#ddd6c1' : '#f2ecd9';
      ctx.fillRect(x, y, 1, 1);
    }
  }

  const boardLeft = SIGN_X - SIGN_HALF, boardWidth = SIGN_HALF * 2;
  const signPadding = 14;
  function buildSignPanel(day){
    const panel = document.createElement('canvas');
    panel.width = boardWidth + 2 * signPadding;
    panel.height = SIGN_H + 2 * signPadding;
    const ctx = panel.getContext('2d');
    ctx.translate(signPadding, signPadding);
    const paint = (x, y, w, h, color) => { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); };
    const w = boardWidth, h = SIGN_H;
    const timber = day ? ['#3a292a', '#55362b', '#73503a', '#966443', '#b6855c']
      : ['#302437', '#482c33', '#624036', '#83523d', '#a37153'];
    const slate = day ? ['#2b3639', '#303b3c', '#353f40', '#394444']
      : ['#242e3a', '#28343d', '#2d383f', '#323d45'];
    // A narrow shadow and small iron straps fasten the frame to the wall.
    paint(3, 4, w, h, 'rgba(23,15,28,.56)');
    paint(w - 1, 6, 4, h - 1, 'rgba(28,19,31,.3)');
    for(const x of [14, w - 17]){
      paint(x, -9, 4, 13, '#302635');
      paint(x + 1, -8, 2, 10, '#63545a');
      paint(x + 1, -7, 1, 1, '#aa8971');
    }
    paint(1, 0, w - 2, h, timber[0]);
    paint(0, 2, w, h - 4, timber[0]);
    paint(2, 1, w - 4, h - 3, timber[1]);
    paint(3, 2, w - 6, 5, timber[2]);
    paint(3, h - 8, w - 6, 6, timber[2]);
    paint(2, 4, 5, h - 9, timber[2]);
    paint(w - 7, 4, 4, h - 9, timber[1]);
    paint(6, 6, w - 12, h - 13, timber[0]);
    paint(8, 8, w - 16, h - 17, slate[1]);
    paint(8, 8, w - 16, 2, slate[0]);
    paint(8, h - 12, w - 16, 3, slate[2]);

    // Broken highlights follow the grain of each rail, with darker flecks at the joins.
    for(let i = 0; i < 25; i++){
      const x = 5 + (i * 29) % (w - 22), len = 2 + i * 7 % 13;
      paint(x, 2 + i % 4, len, 1, timber[i % 5 ? 3 : 4]);
      paint(x, h - 7 + (i * 3) % 4, len, 1, timber[i % 3 ? 1 : 3]);
    }
    for(let i = 0; i < 11; i++){
      const y = 7 + i * 17 % (h - 15);
      paint(3 + i % 2, y, 1, 2 + i % 4, timber[i % 3 ? 3 : 4]);
      paint(w - 5 + i % 2, y, 1, 1 + i % 3, timber[i % 3 ? 2 : 0]);
    }
    for(const x of [4, w - 6]){
      paint(x - 1, 3, 3, 3, timber[0]);
      paint(x, 3, 1, 1, '#ac9575');
      paint(x - 1, h - 6, 3, 3, timber[0]);
      paint(x, h - 6, 1, 1, '#967b66');
    }
    // The dusty areas of the slate are broad, broken horizontal smears.
    for(const [cx, cy, width] of [[25,20,22], [83,28,32], [53,41,41], [85,62,28], [29,66,29]]){
      for(let i = 0; i < 26; i++){
        const x = cx - width / 2 + (i * 23 % width);
        const y = cy + (i * 5 % 7) - 3;
        paint(x, y, 2 + (i * 7 % 5), 1, slate[i % 4 === 0 ? 3 : 2]);
      }
    }
    // The title is painted on an inset wooden board and the chalk sits on a narrow ledge.
    const title = (w - 70) / 2;
    paint(title - 2, 1, 74, 16, timber[0]);
    paint(title, 0, 70, 14, timber[2]);
    paint(title + 2, 1, 66, 1, timber[3]);
    paint(title + 2, 11, 66, 2, timber[1]);
    paint(title + 3, 5, 2, 2, '#41303a');
    paint(title + 65, 5, 2, 2, '#41303a');
    paint(0, h - 5, w, 2, timber[3]);
    paint(2, h - 3, w - 4, 2, timber[1]);
    paint(w - 25, h - 7, 9, 2, '#b4aa95');
    paint(w - 24, h - 7, 6, 1, '#dbceb4');
    return panel;
  }
  const signPanels = [buildSignPanel(false), buildSignPanel(true)];

  // Only the lettering goes on this layer so the cloth reveals the slate underneath it.
  function signLetteringLayer(){
    const c = document.createElement('canvas');
    c.width = boardWidth; c.height = SIGN_H;
    const ctx = c.getContext('2d');
    ctx.translate(-boardLeft, -SIGN_TOP);
    return {c, ctx};
  }
  const boardLettering = signLetteringLayer();
  const fixedLettering = [tapasLine, menuLine].map(line => {
    const {c, ctx} = signLetteringLayer();
    paintChalk(ctx, line, 1);
    return c;
  });

  function drawSign(){
    const build = S.build, phase = build?.phase, light = S.daylight || 0;
    const x = boardLeft, y = SIGN_TOP, w = boardWidth, h = SIGN_H;
    g.drawImage(signPanels[0], x - signPadding, y - signPadding);
    g.save();
    g.globalAlpha *= light;
    if(light) g.drawImage(signPanels[1], x - signPadding, y - signPadding);
    g.restore();

    g.save();
    g.font = '11px MonkeyDialogue, monospace';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = '#c8aa82';
    g.fillText('Lapatza', SIGN_X, y + 6);
    g.font = '7px MonkeyDialogue, monospace';
    g.fillStyle = '#d0c1a7';
    g.fillText('Special offer on Barixaku', SIGN_X, y + h - 17, w - 23);
    g.restore();

    if(phase === 'signStep') return;
    if(phase !== 'signWipe' && phase !== 'signWrite'){
      g.drawImage(fixedLettering[S.features.menus ? 1 : 0], x, y);
      return;
    }
    const {c, ctx} = boardLettering;
    ctx.clearRect(x, y, w, h);
    if(phase === 'signWrite') paintChalk(ctx, menuLine, Math.min(1, build.t / SIGN_WRITE_S));
    else {
      ctx.drawImage(fixedLettering[0], x, y);
      const fraction = Math.min(1, build.t / SIGN_WIPE_S), passes = Math.ceil(fraction * 160);
      for(let i = 0; i <= passes; i++){
        const tip = signHand({phase, t:Math.min(fraction, i / 160) * SIGN_WIPE_S});
        const box = signEraserBox(tip);
        ctx.clearRect(box.x, box.y, SIGN_ERASER_W, SIGN_ERASER_H);
      }
    }
    g.drawImage(c, x, y);
  }

  // Experiment: during a step, what the step is about stays fully lit and the rest of the scene
  // fades into the dark with a soft gradient, to draw the eye there. Render-only state.
  const focus = {x:W / 2, y:H / 2, r:60, sy:1, a:0}, FOCUS_FALL_S = 1.2;
  // Moments of the story that are only lit the first time they happen: the first padlock tied
  // under an order, the first one whose cook dropped it running out, and that order taken up again.
  const story = {S:null, seen:new Set(), hang:null, lapse:null, retake:null};
  function storyTarget(){
    if(story.S !== S) Object.assign(story, {S, seen:new Set(), hang:null, lapse:null, retake:null, firstStray:null});
    if(S.features.retain || !S.features.peekLock) return null;
    const around = (part, entry, cook, r) => ({x:cook ? (cook.x + orderX(part, entry)) / 2 : orderX(part, entry), y:ticketTop(rowOf(S, part)) + 24, r});
    if(!story.seen.has('hang')){
      if(!story.hang){
        const c = S.cooks.find(k => k.job && k.job.phase === 'hang');
        if(c) story.hang = {part:c.job.part, entry:c.job.entry, cook:c};
      }
      if(story.hang){
        const {part, entry, cook} = story.hang;
        if(entry.lockFrom === undefined || S.time < entry.lockFrom + 1.6) return around(part, entry, cook, 58);
        story.seen.add('hang');
      }
    }
    if(!story.seen.has('lapse')){
      if(!story.lapse) S.comandas.forEach((p, part) => p.log.forEach(entry => {
        const orphan = entry.lockUntil !== undefined && !S.cooks.some(k => k.job && k.job.entry === entry);
        if(!story.lapse && orphan && entry.lockUntil - S.time < 2.5) story.lapse = {part, entry, at:entry.lockUntil};
      }));
      if(story.lapse){
        if(S.time < story.lapse.at + 1) return around(story.lapse.part, story.lapse.entry, null, 46);
        story.seen.add('lapse');
        story.retake = story.lapse;
      }
    }
    if(story.retake && !story.seen.has('retake')){
      const {part, entry} = story.retake, c = S.cooks.find(k => k.job && k.job.entry === entry);
      if(c && entry.lockFrom !== undefined && S.time >= entry.lockFrom + 1.2) story.seen.add('retake');
      else if(c) return around(part, entry, c, 60);
    }
    return null;
  }

  function focusTarget(){
    const told = storyTarget();
    if(!S.build) return told;
    const phase = S.build.phase;
    const theft = S.tickets.find(ticket => ticket.snatch) || S.stolen.find(ticket => ticket.t < 0.35);
    if(theft){
      const at = catTarget(theft, false);
      return {x:(at.x + CAT_HOME.x) / 2, y:(at.y + CAT_HOME.y) / 2, r:100};
    }
    const cookFeet = c => barTop(c.pos) + COOK_FEET;
    // Telling the cooks: the whole band on the right, so him and both cooks are lit.
    if(phase === 'tell' || phase === 'heard' || phase === 'markSay' || phase === 'peekSay'
      || (REST_TALK.has(phase) && !S.boss.walking)) return {x:BOSS_SPOT.x - 18, y:(barTop(0) + barTop(2)) / 2 + 28, r:70, sy:3.9};
    if(phase === 'search') return null;
    // The throws: from the boss to where each chicken lands on its wire.
    if(phase === 'markThrow') return {x:BOSS_SPOT.x - 46, y:(barTop(0) + barTop(2)) / 2 + 28, r:84, sy:3.3};
    if(phase === 'waiterReplies') return {x:S.barWaiters[0].x, y:S.barWaiters[0].y - 38, r:60};
    if((phase === 'ackShown' || phase === 'firstAcks') && bossTalking()) return {x:S.boss.x, y:S.boss.y - 26, r:58};
    // The table left empty, once its last diner has gone.
    if(phase === 'restSeen') return {x:TABLE_X, y:tableTop(S.closedTable) - 6, r:64};
    if(['look', 'stare', 'windup', 'kicked', 'markBoss', 'peekBoss', 'restBoss'].includes(phase)) return {x:S.boss.x, y:S.boss.y - 26, r:58};
    // Each event only until it has been seen: then the light moves on to the next one, or goes out.
    if(phase === 'monkeyRide' || phase === 'peelWait') return null;
    const arriving = S.cooks.find(c => c.arriving);
    if(arriving) return {x:arriving.x + 16, y:cookFeet(arriving) - 22, r:62};
    // The fumes and the fall; once it is on the floor, that is all there was to see.
    const blowing = S.cooks.find(c => c.faint?.phase === 'blast');
    if(blowing) return {x:COOK_X - 12, y:cookFeet(blowing) - 30, r:100};
    const slipping = S.cooks.find(c => c.faint?.phase === 'slip');
    if(slipping) return {x:slipping.x + 14, y:cookFeet(slipping) - 18, r:84};
    const fetching = S.cooks.find(c => c.faint?.phase === 'crutches');
    if(fetching) return {x:COOK_X + 12, y:cookFeet(fetching) - 58, r:84};
    const out = S.cooks.find(c => c.faint && (c.faint.phase === 'fumes' || (c.faint.phase === 'fainted' && c.faint.t < FOCUS_FALL_S)));
    if(out) return {x:out.x + (out.faint.phase === 'fainted' ? 12 : 0), y:cookFeet(out) - 24, r:52};
    // Taking over a wire: the first order it reads there is the one after its owner's last stamp.
    if(phase === 'restCover' || phase === 'restAway'){
      const job = S.cooks.find(k => k.active && k.job && S.build.parts.includes(k.job.part)
        && k.job.offset === S.build.mark[k.job.part])?.job;
      if(job && (job.phase === 'toTicket' || job.phase === 'read')) return {x:orderX(job.part, {offset:job.offset}), y:ticketTop(rowOf(S, job.part)) + 24, r:56};
    }
    const delayedComplaint = S.customers.find(c => c.say?.dishComplaint);
    if(delayedComplaint) return {x:TABLE_X + 25, y:tableTop(delayedComplaint.table) - 43, r:84};
    if(told) return told;
    if(['signWipe', 'signStep', 'signWrite'].includes(phase)) return {x:SIGN_X, y:SIGN_TOP + 34, r:105};
    // Plates nobody asked for: only the first one is pointed at, the rest are the same joke.
    const strayLit = say => !say.stray || (story.firstStray ??= say) === say;
    const upset = S.customers.find(c => c.state === 'complain' || c.puzzled > 0 || (c.say && strayLit(c.say)));
    if(upset) return {x:TABLE_X, y:tableTop(upset.table) - 22, r:56};
    const talking = S.cooks.find(c => c.say && !c.rest);
    if(talking) return {x:talking.x, y:cookFeet(talking) - 30, r:56};
    // His parting line after the cash count is not lit: there is nothing more to point at.
    if(S.boss.say && !phase.startsWith('recount')) return {x:S.boss.x, y:S.boss.y - 26, r:58};
    return null;
  }
  function drawFocus(){
    const target = focusTarget(), tick = frameTick;
    if(target){
      // Fades in slowly where it is wanted; once lit, it glides gently from one subject to the next.
      const k = focus.a < 0.05 ? 1 : Math.min(1, tick * 1.6);
      focus.x += (target.x - focus.x) * k;
      focus.y += (target.y - focus.y) * k;
      focus.r += (target.r - focus.r) * k;
      focus.sy += ((target.sy || 1) - focus.sy) * k;
      focus.a = Math.min(1, focus.a + tick * 1.1);
    } else {
      focus.a = Math.max(0, focus.a - tick * 0.7);
    }
    if(focus.a <= 0) return;
    // Stretched vertically when it has to take in a whole band.
    g.save();
    g.translate(focus.x, focus.y);
    g.scale(1, focus.sy);
    const glow = g.createRadialGradient(0, 0, focus.r * 0.55, 0, 0, focus.r * 2.6);
    glow.addColorStop(0, 'rgba(0,0,12,0)');
    glow.addColorStop(0.35, `rgba(0,0,12,${(0.3 * focus.a).toFixed(3)})`);
    glow.addColorStop(1, `rgba(0,0,12,${(0.68 * focus.a).toFixed(3)})`);
    g.fillStyle = glow;
    g.fillRect(-focus.x, -focus.y / focus.sy, W, H / focus.sy);
    g.restore();
  }

  // Keep dialogue above the actors and the lighting, and hide it with its actor in Kafka view.
  // Menus are not dialogue: they go with the scene (drawSceneMenus).
  function drawSceneBubbles(){
    const hide = () => {};
    morphDraw(mixOf(STAGE.producers), drawDinerBubbles, hide);
    morphDraw(mixOf(STAGE.partitioner), () => {
      S.barWaiters.forEach(w => {
        if(w.say) drawSpeech(w.say.lines, w.x, w.y - 68, '#abd4e9');
      });
    }, hide);
    morphDraw(mixOf(STAGE.consumers), () => {
      S.cooks.forEach(drawWakeBubble);
      // What a cook says when it comes back: whether it knows which order it was on.
      S.cooks.forEach(c => { if(c.say) drawSpeech(c.say.lines, c.x, (c.rest ? c.rest.feet : barTop(c.pos) + COOK_FEET) - 66, '#f4d8ca', c.rest ? undefined : c.x + 8, c.say.felt, !!c.rest); });
      // What a cook only thinks: a cloud with little puffs down to its head.
      S.cooks.forEach(c => { if(c.think && c.think.t >= 0) drawThought(c.think.lines, c.x - 6, barTop(c.pos) + COOK_FEET - 56); });
    }, hide);
  }

  const NESTING_LONG = '#ffd23f', NESTING_SHORT = '#74dae5';
  const NESTING_TIME = value => `${Number(value.toFixed(2)).toString()} S`;

  function drawNestingJob(job, x, y, dim = false){
    const color = job.kind === 'long' ? NESTING_LONG : NESTING_SHORT;
    const before = g.globalAlpha;
    if(dim) g.globalAlpha = before * 0.45;
    kafkaBox(x, y, 32, 29, color, KAFKA.log);
    text(`J${job.id}`, x + 16, y + 5, color, 'center');
    text(NESTING_TIME(job.duration).replace(' S', ''), x + 16, y + 17, PAL.white, 'center');
    g.globalAlpha = before;
  }

  function drawNestingDemo(demo){
    const producer = PRODUCER_BOX, group = GROUP_BOX;
    const laneX = barStart() - 2, laneH = 54;
    const bus = demo.mode === 'bus';
    const merge = bus ? smooth(demo.introElapsed / 0.8) : 0;
    const merged = merge >= 1;
    const broker = merged ? NESTING_SHORT : KAFKA.topic;
    // Make room for the receivers before the two lanes reach their row.
    const fit = smooth(Math.min(1, merge * 5));
    const laneRight = Math.round(lerp(barEnd() + 4, group.x - 16, fit));
    const laneW = laneRight - laneX, centerY = group.y + group.h / 2;
    const laneY = part => Math.round(lerp(recordTop(rowOf(S, part)) - 20, centerY - laneH / 2, merge));

    diagramPanel(producer, merged ? 'SENDER' : 'PRODUCER', PAL.white);
    text('8 JOBS', producer.x + 8, producer.y + 25, PAL.white);
    text('4 LONG', producer.x + 8, producer.y + 55, NESTING_LONG);
    text(NESTING_TIME(NESTING_DURATIONS.long), producer.x + producer.w - 8, producer.y + 55, NESTING_LONG, 'right');
    text('4 SHORT', producer.x + 8, producer.y + 75, NESTING_SHORT);

    if(merged){

    text('ID=NESTING', group.x + group.w / 2, group.y + group.h / 2 - 3, COLORS.cook, 'center');
    for(const worker of demo.workers){

      diagramPanel({x, y, w:CONSUMER_W, h:CONSUMER_H}, `${merged ? 'RECEIVER' : 'CONSUMER'} C${worker.id + 1}`, color);
      const secondsIdle = Math.max(0, demo.elapsed - worker.busy);

      const status = job ? `RUNNING J${job.id}`

      if(job){

  // ---- The step panel and keyboard controls ----

  const $ = id => document.getElementById(id);
  const barLabel = $('scene').getAttribute('aria-label');

  function describeScene(label){

  // The same button advances the tutorial, the story, and then the technical view.
  const STORY_STEP_COUNT = UPGRADES.length + 1;

  // After the technical view, each example is a numbered step too.
  const MATERIAL_STEP = TECHNICAL_STEP_COUNT + 1, SPLIT_STEP = MATERIAL_STEP + 1;

  const STEP_COUNT = NESTING_STEP + 2;
  // Two short lines: ▶ what is going on, or ✓ what was just seen; › what the next click brings.

  // A queued click says what it is waiting for: the running step's phase, read off its build.
  function waitingFor(S){
    const build = S.build;
    if(!build) return 'a chance to start';

    switch(build.phase){
      case 'arrive': return 'his stove to be set up';

      case 'peekBoss': case 'peekSay': case 'markBoss': case 'markSay':

      case 'signBack': return 'the boss to come back';

      case 'restEmpty': return 'a table to empty';
      case 'restSeen': return 'the boss';
      case 'restFinish': return S.cooks[build.who]?.job ? 'him to commit his order' : 'him to leave the group';
      case 'restBoss': case 'restHeard': return 'the boss to speak';
      case 'restShare': return 'the rebalance';
      case 'restAway': return 'the boss to leave';
      case 'restCover': return 'the other cook to take his wire';
      case 'wait': return 'everyone to finish';
      case 'toPosts': case 'lift': return 'the wire to go up';
      case 'done': return 'the new wire';
      case 'incident': return 'a few dishes served';
      case 'monkeyRide': return 'the monkey to pass';
      case 'peelWait': return 'him to step on the peel';
      case 'offDuty': return 'him to get up';
      case 'reread': return 'the repeated dishes';
      case 'markHold': return 'them to finish their dishes';
      case 'markCatch': return 'a chicken on each wire';
      case 'search': case 'look': case 'windup': case 'kicked': return 'the boss to count';
      case 'recountWalk': case 'recountToTicket': case 'recountRead':
      case 'recountAside': case 'recountPause': return 'the boss to save his place';
      case 'tell': return 'the cooks back at their stoves';
      case 'heard': return 'the boss to leave';
      case 'lossWatch': return 'the pirate to give up';
      case 'firstAcks': return 'the last «¡Oído cocina!»';
      case 'retryWatch': return 'the resend';
      case 'ackShown': return 'the «¡Oído cocina!»';
    }
    return 'the step to end';
  }
  function refreshUpgrade(){
    const button = $('upgrade');
    document.querySelector('.scene').classList.toggle('paper', kafkaStep > 0 || !!S.materialDemo || !!nestingDemo);
    let now, next = null, waiting = null;
    button.setAttribute('aria-pressed', String(pendingStep));
    if(!tutorialDone){
      button.disabled = false;
      button.setAttribute('aria-pressed', String(tutorialStep > 0));
      if(!tutorialStep){
        now = 'The tavern opens with a plain queue';
        next = `1/${STEP_COUNT} Tutorial: who is who`;
      } else {
        now = `▶ Tutorial ${tutorialStep}/${TUTORIAL_STEPS.length}: ${TUTORIAL_STEPS[tutorialStep - 1]}`;
        next = tutorialStep < TUTORIAL_STEPS.length ? TUTORIAL_STEPS[tutorialStep] : 'the whole scene';
      }
    } else if(nestingDemo){
      const bus = nestingDemo.mode === 'bus', done = nestingDemo.phase === 'done', spread = nestingDemo.phase === 'spread';
      describeScene(bus
        ? 'Azure Service Bus, demo de anidado. Dos receivers compiten por ocho trabajos independientes en una queue común.'
        : 'Kafka, demo de anidado. P0 contiene los cuatro trabajos largos y P1 los cuatro cortos. Un consumer por partition.');
      button.disabled = !done && !spread;
      now = spread ? `✓ ${bus ? NESTING_STEP + 1 : NESTING_STEP}/${STEP_COUNT} ${bus ? 'Service Bus: 8 jobs in one queue' : 'Kafka: long jobs in P0, short in P1'}`
        : bus ? (done ? `✓ ${NESTING_STEP + 1}/${STEP_COUNT} Service Bus: ${NESTING_TIME(nestingDemo.elapsed)} / Kafka: ${NESTING_TIME(nestingDemo.kafkaResult)}` : `▶ ${NESTING_STEP + 1}/${STEP_COUNT} Service Bus: free receivers take any job`)
        : done ? `✓ ${NESTING_STEP}/${STEP_COUNT} Kafka: ${NESTING_TIME(nestingDemo.elapsed)} · C2 idle for ${NESTING_TIME(nestingDemo.elapsed - nestingDemo.workers[1].busy)}` : `▶ ${NESTING_STEP}/${STEP_COUNT} Kafka: each consumer only its partition`;
      if(spread) next = `${bus ? NESTING_STEP + 1 : NESTING_STEP}/${STEP_COUNT} Start computing`;
      if(done) next = bus ? `${STEP_COUNT}/${STEP_COUNT} What we've learned` : `${NESTING_STEP + 1}/${STEP_COUNT} The same jobs in a Service Bus queue`;
    } else if(S.materialDemo){
      const demo = S.materialDemo, event = MATERIAL_EVENTS[demo.index], ready = demo.phase === 'ready';
      const routing = demo.split ? 'Sin key: cada evento del mismo material puede ir a cualquier partition.' : 'Topic materiales.';
      describeScene(`${routing} Dos consumer groups leen el mismo log y guardan sus propios offsets. Material ${MATERIAL_KEY}: ${materialState(demo).label.toLowerCase()}.`);
      button.disabled = !ready;
      if(demo.split){
        now = ready ? `✓ ${SPLIT_STEP}/${STEP_COUNT} C1 lost the UPDATE; C2 got lucky` : `▶ ${SPLIT_STEP}/${STEP_COUNT} No key: each event to any partition`;
        if(ready) next = `${NESTING_STEP}/${STEP_COUNT} Long and short jobs in Kafka`;
      } else if(!event){
        now = `✓ ${MATERIAL_STEP}/${STEP_COUNT} ${MATERIAL_KEY}: 4 events, all still in the log`;
        next = `${SPLIT_STEP}/${STEP_COUNT} Without a key, the order breaks`;
      } else {
        now = ready ? `✓ ${MATERIAL_STEP}/${STEP_COUNT} ${MATERIAL_KEY}: ${demo.index}/${MATERIAL_EVENTS.length} events applied`
          : `▶ ${MATERIAL_STEP}/${STEP_COUNT} ${MATERIAL_KEY} · ${event.op} ${demo.index + 1}/${MATERIAL_EVENTS.length}`;
        if(ready) next = `${MATERIAL_STEP}/${STEP_COUNT} Send ${event.op} ${demo.index + 1}/${MATERIAL_EVENTS.length}`;
      }
    } else if(!S.build && S.upgrades === UPGRADES.length){
      // The story is over: the same button turns each kind of actor into its Kafka piece.
      if(kafkaStep) describeScene(`Transformación del bar a Kafka: ${KAFKA_STAGES.slice(0, kafkaStep).join(', ')}.`);
      else describeScene(barLabel);

      now = kafkaStep ? `✓ ${STORY_STEP_COUNT + kafkaStep}/${STEP_COUNT} Real Kafka: ${KAFKA_STAGES[kafkaStep - 1]}`
        : `✓ ${STORY_STEP_COUNT}/${STEP_COUNT} Order resent · the tavern is Kafka now`;
      next = stage ? `${STORY_STEP_COUNT + kafkaStep + 1}/${STEP_COUNT} Real Kafka: ${stage}` : `${MATERIAL_STEP}/${STEP_COUNT} Example: one material's events in a log`;
    } else {
      // The story: what is happening, or what was just seen, and the step a click asks for. A
      // click during an animation queues it.
      const running = S.build ? S.upgrades : null, done = S.upgrades - 1;
      const ask = S.build ? S.upgrades + 1 : S.upgrades;
      button.disabled = false;
      now = running !== null ? `▶ ${running + 2}/${STEP_COUNT} ${capital(UPGRADES[running].doing)}…`
        : done >= 0 ? `✓ ${done + 2}/${STEP_COUNT} ${capital(UPGRADES[done].name)}`
        : `✓ 1/${STEP_COUNT} Tutorial`;

      next = pendingStep
        ? `${ask + 2}/${STEP_COUNT} ${UPGRADES[ask] ? capital(UPGRADES[ask].name) : KAFKA_STAGES[0]}`
        : UPGRADES[ask] ? stepLabel(ask) : `${STORY_STEP_COUNT + 1}/${STEP_COUNT} Real Kafka: ${KAFKA_STAGES[0]}`;
    }
    const title = [now, waiting, next && `› ${next}`, 'Space: next · ← / →: jump between steps · 1–9: speed · 0: 10×'].filter(Boolean).join('\n');
    if(button.title === title) return;
    button.replaceChildren();
    const line = (cls, text) => { const span = document.createElement('span'); span.className = cls; span.textContent = text; button.append(span); return span; };
    line('now', now);
    if(next){
      const span = line('next', `› ${next}`);
      if(waiting){

  function refreshPanel(){

  // Escape leaves the tutorial.
  document.addEventListener('keydown', e => {

  function nextStep(){
    // In the conclusions each click shows one more line, and after the last nothing happens.
    if(!$('ending').hidden){
      if(endingLines >= ENDING_LINES) return;
      rememberStep();
      return showEndingLines(endingLines + 1);
    }
    if(!tutorialDone) return setTutorialStep((tutorialStep + 1) % (TUTORIAL_STEPS.length + 1));
    if(nestingDemo){
      if(nestingDemo.phase === 'spread'){
        rememberStep();
        startNestingRun(nestingDemo);
        refreshPanel();
        return;
      }
      if(nestingDemo.phase !== 'done') return;
      if(nestingDemo.mode === 'kafka'){
        rememberStep();
        nestingDemo = createNestingDemo('bus', nestingDemo.elapsed);
        refreshPanel();
      } else if($('ending').hidden){
        rememberStep();
        setEnding(true);
        showEndingLines(0);
      }
      return;
    }
    if(S.materialDemo){
      const demo = S.materialDemo;
      if(demo.phase === 'ready'){
        rememberStep();
        if(demo.split){
          beginExampleTransition();
          nestingDemo = createNestingDemo('kafka');
        } else if(demo.index < MATERIAL_EVENTS.length) sendMaterialEvent(S);
        else {
          beginExampleTransition();
          S = createMaterialDemo(true);
          view.ends.fill(0);
        }
      }
      refreshPanel();
      return;
    }
    if(kafkaStep === KAFKA_STAGES.length){
      if(kafkaMix.every(mix => mix === 1)) openMaterialDemo();
      return;
    }
    if(pendingStep) return;
    pendingStep = true;
    startPendingStep();
    refreshPanel();
  }

  function startPendingStep(){
    if(!pendingStep || S.build) return;
    const before = captureStep();
    const next = UPGRADES[S.upgrades];
    if(next && !next.start(S)) return;
    rememberStep(before);
    if(!next){
      kafkaStep++;
      syncSceneMusic();
    }
    pendingStep = false;
    refreshPanel();
  }
  $('upgrade').addEventListener('click', nextStep);
  // Space uses the animated route. The arrows cut directly between scene checkpoints.
  document.addEventListener('keydown', e => {
    const onCover = !$('cover').hidden;
    const direction = onCover ? 0 : e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    const advance = e.key === ' ' || (onCover && (e.key === 'Enter' || (islandShown && e.key === 'ArrowRight')));
    const multiplier = !onCover && $('ending').hidden && /^[0-9]$/.test(e.key) ? Number(e.key) || 10 : 0;
    if((!direction && !advance && !multiplier) || e.ctrlKey || e.metaKey || e.altKey) return;
    if(e.target.closest('input:not([type=range]), textarea, select, [contenteditable]')) return;
    e.preventDefault();
    if(e.repeat) return;
    if(multiplier) speed = multiplier;
    else if(direction) jumpStep(direction);
    else if(!onCover) nextStep();
    // The title and HTTP slides respond to Space. The queue and phrase follow the music.
    else if(!slides.hidden) moveSlide(1);
    else if(islandShown) enterBar();
  });

  // Each click lights the next kind of actor; after the last one, back to the whole scene.
  // Leaving the tutorial, by its last click or by Escape, counts as having done the first step.
  function setTutorialStep(step){
    if(step === tutorialStep) return;
    rememberStep();
    if(tutorialStep && !step) tutorialDone = true;
    tutorialStep = step;
    refreshUpgrade();
  }

  const pastSteps = [], futureSteps = [];

  function captureStep(){
    return structuredClone({S, tutorialStep, tutorialDone, kafkaStep, nestingDemo, ending:!$('ending').hidden, endingLines});
  }

  function rememberStep(before = captureStep()){
    pastSteps.push(before);
    futureSteps.length = 0;
  }

  function setEnding(visible){
    if($('ending').hidden === !visible) return;
    $('ending').hidden = !visible;
    document.querySelector('.stage').hidden = visible;
    (visible ? $('ending') : $('upgrade')).focus();
    syncSceneMusic();
  }

  function restoreStep(checkpoint){
    ({S, tutorialStep, tutorialDone, kafkaStep, nestingDemo} = checkpoint);
    setEnding(checkpoint.ending);
    showEndingLines(checkpoint.endingLines ?? 0);
    syncSceneMusic();
  }

  // The conclusions come one line per click. The last, the game's, comes straight in its pixel
  // lettering, drawn by the same morph as the phrase before the island, at its end.
  const ENDING_LINES = 3;
  let endingLines = 0;
  function showEndingLines(count){
    endingLines = count;
    document.querySelectorAll('#ending li').forEach((li, i) => li.classList.toggle('shown', i < count));
    const monkey = document.querySelector('#ending .monkey');
    if(count < ENDING_LINES) return monkey.classList.remove('pixel');
    monkey.classList.add('pixel');
    // Once the line is laid out, so the lettering is drawn at its size.
    requestAnimationFrame(() => morphEndingLine(1));
  }

  function sceneIsRunning(){
    if(nestingDemo) return nestingDemo.phase !== 'done' && nestingDemo.phase !== 'spread';
    if(S.materialDemo) return S.materialDemo.phase !== 'ready';
    return Boolean(S.build);
  }

  function jumpStep(direction){
    const running = sceneIsRunning() || kafkaMix.some((mix, i) => i < kafkaStep && mix < 1) || exampleTransition;
    if(direction < 0){
      if(!pastSteps.length) return;
      if(!running) futureSteps.push(captureStep());
      restoreStep(pastSteps.pop());
      pendingStep = false;
    } else {
      pendingStep = false;
      // In the conclusions, → shows the next line, as Space does.
      if(!$('ending').hidden){
        if(futureSteps.length){
          pastSteps.push(captureStep());
          restoreStep(futureSteps.pop());
        } else nextStep();
        return;
      }
      if(!running && futureSteps.length){
        pastSteps.push(captureStep());
        restoreStep(futureSteps.pop());
      } else {
        if(!running) nextStep();
        // Run only the model up to its normal completion condition. A queued click from
        // before the jump has been cleared, so it cannot launch an extra scene.
        const before = S.time;
        for(let tick = 0; tick < 300 / STEP && (sceneIsRunning() || pendingStep); tick++){
          stepScene();
          startPendingStep();
        }
        if(S.time !== before){
          // These positions normally catch up one painted frame at a time.
          for(const p of S.comandas) for(const entry of p.log) delete entry.vx;
          for(const cook of S.cooks) delete cook.lift;
        }
      }
    }

  }

  // Three messages leave the producer in quick succession and wait in the queue; the consumer
  // takes them one at a time, oldest first, while the producer never stops typing. After the
  // second one the consumer switches off for a moment: the third simply waits in the queue.
  function drawQueueSlide(t){
    const sends = [0.3, 0.75, 1.2], takes = [1.9, 3.3, 6.6], slot = k => 595 - 56 * k;
    const offAt = 4.8, onAt = 6.4;
    let working = false, done = false;
    sends.forEach((send, i) => {
      const queued = send + 0.45, take = takes[i], delivered = take + 0.5, finished = delivered + 0.9;
      let x = 275;
      if(t >= send && t < queued) x = slideMix(275, 345, slideEase((t - send) / 0.45));
      else if(t >= queued && t < take){
        let k = i;
        for(let j = 0; j < i; j++) k -= slideEase((t - takes[j]) / 0.45);
        x = slideMix(345, slot(k), slideEase((t - queued) / 0.45));
      }
      else if(t >= take) x = slideMix(595, 745, slideEase((t - take) / 0.5));
      placeSlidePart('q-msg-' + i, x, 212, t >= send && t < delivered);
      if(t >= delivered && t < finished) working = true;
      if(t >= finished && t < finished + 0.8) done = true;
    });
    slideScreen('q-line-', t, true);
    slideLeds('q-led-', t, working);
    $('q-consumer').style.opacity = 1 - 0.35 * clamp01(Math.min((t - offAt) / 0.3, (onAt - t) / 0.3));
    const down = t >= offAt && t < onAt;
    machineState('q-producer', sends.some(send => t >= send && t < send + 0.35) ? 'ok' : '');
    machineState('q-consumer', down ? 'down' : done ? 'ok' : '');
  }

  function animateSlides(now){
    if(slides.hidden) return;
    const still = reducedMotion?.matches, t = (now - slideStart) / 1000;
    const draw = slideEls[slideIndex].dataset.draw;
    if(draw === 'http') drawHttpSlide(still ? 2.6 : t % HTTP_LOOP_S);
    else if(draw === 'queue') drawQueueSlide(still ? 2.6 : t / QUEUE_PACE % QUEUE_LOOP_S);
    requestAnimationFrame(animateSlides);
  }

  function showSlide(index){
    slideIndex = index;
    slideStart = performance.now();
    slideEls.forEach((slide, k) => {
      slide.classList.toggle('current', k === index);
      slide.classList.toggle('past', k < index);
    });
    slideDots.forEach((dot, k) => dot.classList.toggle('on', k === index));
  }
  // Seconds of intro.mp3, which starts with the queue slide: the push to the phrase, the phrase.
  // The phrase takes PHRASE_MS to hand over to the island, so the island comes in at second 20.
  const SLIDE_PUSH_S = 0.6; // the .6s transition in the stylesheet
  const INTRO_AT = {phrase: INTRO_ISLAND_S - PHRASE_MS / 1000};
  INTRO_AT.leave = INTRO_AT.phrase - SLIDE_PUSH_S;
  // The queue animation is slowed down to fill the queue slide (16 s against its 10 s script).
  const QUEUE_PACE = 1.6;
  let introFollow = 0;
  function moveSlide(step){
    if(slides.hidden) return;
    if(step < 0){
      if(slideIndex === 0) return;
      if(slideIndex === 2){
        cancelAnimationFrame(introFollow);
        rewindIntroMusic();
        // If the push to the phrase had begun, pull the slides back in front of it.
        slides.classList.remove('leaving');
        prologue.classList.add('waiting');
        prologue.blur();
      }
      return showSlide(slideIndex - 1);
    }
    if(slideIndex === 0) return showSlide(1);
    if(slideIndex !== 1) return;
    playIntroMusic();
    showSlide(2);
    cancelAnimationFrame(introFollow);
    introFollow = requestAnimationFrame(followIntro);
  }
  function followIntro(){
    if(islandShown || $('cover').hidden || slideIndex !== 2) return;
    const t = introClock();
    if(t >= INTRO_AT.leave && !slides.classList.contains('leaving')){
      slides.classList.add('leaving');
      prologue.classList.remove('waiting');
      prologue.focus({preventScroll:true});
    }
    if(t < INTRO_AT.phrase){ introFollow = requestAnimationFrame(followIntro); return; }
    // The phrase underneath takes over, on the same clock.
    slides.hidden = true;
    fontsReady.then(startOpening);
  }
  function skipToIsland(){
    slides.hidden = true;
    if(introMusic.currentTime < INTRO_ISLAND_S) introMusic.currentTime = INTRO_ISLAND_S;
    introLast = Math.max(introLast, INTRO_ISLAND_S);
    introMusic.volume = 1;
    revealIsland({instant:true});
  }
  slides.addEventListener('click', () => moveSlide(1));
  document.addEventListener('keydown', e => {
    if($('cover').hidden || islandShown || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    const step = {ArrowRight: 1, PageDown: 1, ArrowLeft: -1, PageUp: -1}[e.key];
    if(!step) return;
    e.preventDefault();
    if(step > 0 && slideIndex === 2) skipToIsland();
    else moveSlide(step);
  });
  requestAnimationFrame(animateSlides);

  function startOpening(){
    if(prologue.hidden) return;
    morphLine(0);
    playPrologue(() => (introClock() - INTRO_AT.phrase) * 1000);
  }
  // Both faces of the phrase are turned into fields while the slides are up.
  const fontsReady = document.fonts.load('16px MonkeyDialogue').catch(() => {});
  fontsReady.then(() => { if(!prologue.hidden) morphLine(0); });
})();
</script>
</body>
</html>
