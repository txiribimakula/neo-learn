<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Kafka en el bar</title>
<style>
  :root{--ink:#ffffff;--muted:#c3cbff;--amber:#6dffff;--red:#ff6d4a}
  *{box-sizing:border-box}
  body{font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  button{font:inherit;color:inherit;cursor:pointer}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink)}
  .scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  /* The scene and what sits on its back wall share one box, so they scale together. */
  .stage{position:relative;width:min(100vw,calc(100vh * 730 / 420));width:min(100vw,calc(100dvh * 730 / 420));aspect-ratio:730/420;container-type:inline-size}
  #scene{display:block;width:100%;height:100%}
  /* On the wall, left of the chalkboard. */
  .speed{position:absolute;left:calc(64 / 730 * 100%);top:calc(16 / 420 * 100%);display:flex;font-size:1.35cqw}
  .speed button{padding:.2em .6em;background:rgba(0,0,40,.55);border:.15em solid var(--amber);color:var(--muted);font-weight:700}
  .speed button+button{border-left:0}
  .speed button[aria-pressed=true]{background:var(--amber);color:#00006d}
  .speed button:focus-visible{outline:.15em solid #fff;outline-offset:.1em}
  /* On the wall, right of the chalkboard: the step button, which walks through everything. */
  .step{position:absolute;left:calc(528 / 730 * 100%);right:calc(14 / 730 * 100%);top:calc(10 / 420 * 100%);padding:.35em .6em;background:rgba(0,36,182,.88);border:.15em solid var(--amber);font-size:1.15cqw;font-weight:700;line-height:1.3;text-align:left}
  .step[aria-pressed=true]{background:var(--amber);color:#00006d}
  .step:disabled{opacity:.55;cursor:default}
  .step:focus-visible{outline:.15em solid #fff;outline-offset:.1em}
</style>
</head>
<body>
<main class="scene">
  <div class="stage">
    <canvas id="scene" width="2190" height="1260" role="img"
            aria-label="Bar arcade en perspectiva: a la izquierda, un comedor con mesas donde los comensales esperan con su menú sobre la cabeza; a la derecha, los cocineros leen las comandas colgadas con pinzas de los hilos, que empiezan siendo uno con un solo cocinero; por un mostrador central vuelven los platos; un camarero con bloc manda las comandas y otro con bandeja lleva los platos a las mesas."></canvas>
    <div class="speed" role="group" aria-label="Velocidad">
      <button type="button" data-speed="1" aria-pressed="true">x1</button>
      <button type="button" data-speed="2" aria-pressed="false">x2</button>
      <button type="button" data-speed="10" aria-pressed="false">x10</button>
    </div>
    <button type="button" id="upgrade" class="step" aria-live="polite">Paso 1: tutorial</button>
  </div>
</main>
<script>
(function(){
  'use strict';

  // ---- Kafka model: no DOM here, so the tests can drive it directly ----

  const W = 730, H = 420;
  const PARTITIONS = 2, PLATES_ROW = 1;
  const RETENTION = 20;
  // Rows, top to bottom: top stove and wire, the counter, bottom stove and wire. Not evenly spaced:
  // a stove stands lower in its row than the counter does, so the gaps differ to leave both stoves
  // the same distance from the counter. barTop takes fractional rows for the dashes in between.
  const ROW_TOPS = [90, 238, 352], FLOOR_TOP = 58, SLOT_W = 22;
  // The counter is as tall as the tray: its top is at the waiter's feet minus TRAY_HEIGHT.
  const COUNTER_HEIGHT = 30, TRAY_HEIGHT = 30, TRAY_REACH = 14;
  const ORDER_WAITER_HOMES = [{x:150, y:190}], TRAY_WAITER_HOMES = [{x:196, y:ROW_TOPS[1] + TRAY_HEIGHT}];
  // The head of the dining room stands at the pass: as far right as he fits in the middle row, by the
  // kitchen, where the orders reach the end of their wire. Not quite against the wall: the Explicación
  // tab sits over the middle of the right edge.
  // A little in from the right edge, to leave room for the oil drum (and what rides on it) to roll in.
  const BOSS_SPOT = {x:672, y:ROW_TOPS[1] + COUNTER_HEIGHT};
  const TABLES = 3, TABLE_X = 70, PUZZLED_S = 2.5;
  // While orders are thrown away, they go in a bin at the far right of the counter's row, where
  // the first stove used to be. Cooks flick them in from wherever they take them off the wire.
  const BIN_X = 700;
  // A flick that bounces on the rim takes a little longer to drop in.
  const RIM_S = 0.8;
  const binDuration = job => BIN_S + (job.rimShot ? RIM_S : 0);
  const SEAT_SPEED = 170, EAT_S = 1.8;
  const WAITER_SPEED = 240;
  const SLIDE_SPEED = 800, COOK_ROWS_PER_S = 12, DASH_WINDUP_S = 0.25, WALK_SPEED = 90;
  const SLOW_FACTOR = 5;
  // Fumes from the stove knock a cook out: it leaves the group (rebalance), lies on the floor,
  // gets up wondering where it is, and rejoins the group straight away (another rebalance).
  const FUMES_S = 1.6, FAINTED_S = 7, WAKING_S = 3.5, GET_UP_S = 0.35;
  // A nod to the arcade's fed-up customers: the cost of lag, seen from the table.
  // After that long without food, short fits of anger with calm spells in between.
  const POUND_S = 0.4, FIT_S = 1.8;
  // Peek-lock: the cook ties an hourglass under the order, and the lock lasts as long as its sand
  // (Service Bus's LockDuration, scaled down). Long enough for any order at a normal pace.
  const LOCK_S = 20, HANG_S = 0.6;
  // A dish lost for good: fits that come round sooner, and on its feet complaining before it goes.
  const LOST_FIT_CYCLE_S = 2.6, COMPLAIN_S = 2.4, KURWA_S = 0.7;
  const LOST_DISH_LINES = {
    gazpacho:['¿Mi gazpacho?', 'By now it\'s', 'sopa caliente.'],
    paella:['¿Mi paella? Did you go', 'al Delta a por el arroz?'],
    croquetas:['¿Mis croquetas?', 'I saved room para todas.'],
    jamon:['¿Mi jamón?', 'Still curándose?'],
    tortilla:['¿Mi tortilla?', 'Twenty vueltas', 'and counting.'],
    merluza:['¿Mi merluza?', 'Still pescándola?'],
    pollo:['¿Mi pollo asado?', 'It flew the corral.'],
    flan:['¿Mi flan?', 'Not even a tembleque.'],
    arroz:['¿Mi arroz con leche?', 'It grew up waiting.'],
    churros:['¿Mis churros?', 'All this chocolate', 'y nothing que mojar.'],
    cafe:['Where is my cafelito?']
  };
  // A plate nobody asked for sits on the table this long before it is taken away.
  const STRAY_S = 2.6;
  // What a diner says to it: one it has already had, or one that is not even its own. A few are
  // nods to the insult sword fighting of Monkey Island, turned to the kitchen; they come first so
  // they get seen.
  const STRAY_LINES = {
    eaten:[['¡ESTO YA ME', 'LO HE COMIDO!'], ['¡HE VISTO MONOS', 'QUE SIRVEN MEJOR!'], ['¿OTRA VEZ', 'LO MISMO?'], ['¡QUE YA ME LO', 'HABÉIS TRAÍDO!'], ['¡ESTE PLATO', 'YA LO CONOZCO!'], ['¡NO PUEDO', 'NI UNO MÁS!']],
    notMine:[['¿Y ESTO?', '¡NO LO HE PEDIDO!'], ['¡HE VISTO MONOS', 'QUE SIRVEN MEJOR!'], ['¡YO NO HE', 'PEDIDO ESTO!'], ['¿DE QUIÉN', 'ES ESTO?'], ['¡AQUÍ NADIE', 'HA PEDIDO ESO!'], ['¿ME HABÉIS', 'CONFUNDIDO?']]
  };
  // The first one of all gets the insult and its comeback: the diner says it, the cook thinks it.
  const STRAY_INSULT = ['YOU COOK LIKE A', 'DAIRY FARMER!'], STRAY_COMEBACK = ['HOW APPROPRIATE.', 'YOU EAT', 'LIKE A COW.'];
  const COMEBACK_DELAY_S = 1.4;
  // A dish held up by a dropped order: after this long it starts banging the table.
  const DELAY_ANGRY_S = 4;
  // A treat for a cook left standing a while: first one after a few idle seconds, then less often.
  const BEER_WAIT_S = 1.5, BEER_SIP_S = 2.2, BEER_RETRY_S = 1;
  const BEER_FIRST = [1.5, 14], BEER_AGAIN = [18, 40];
  // Seconds between one cook finishing a beer and the other starting one.
  const BEER_GAP_S = 5;
  // Instead of a beer, sometimes something stirs inside the oven.
  const OVEN_CHANCE = 0.25, CAT_CHANCE = 0.4;
  // Timeline of the gag, in seconds. What comes out stays out for three swipes of the paw,
  // each one a single stroke: up, down, and up again.
  const PAW_SWIPE_S = 0.19, PAW_SWIPES = 3;
  const OVEN_OPEN_AT = 0.64, OVEN_OUT_AT = 0.99, OVEN_IN_AT = OVEN_OUT_AT + PAW_SWIPES * PAW_SWIPE_S;
  const OVEN_DOOR_S = 0.19, OVEN_STEP_S = 0.16;
  const OVEN_SHUT_AT = OVEN_IN_AT + 0.16 + OVEN_STEP_S + OVEN_DOOR_S, OVEN_GAG_S = OVEN_SHUT_AT + 0.4;
  // The boss occasionally kicks an oil drum back out of the restaurant.
  const OIL_RADIUS = 11, OIL_HIT_AT = 1.8, OIL_RETURN_S = 0.65, OIL_GAG_S = 2.65, MONKEY_AFTER_S = 6;
  const MONKEY_IN_S = 4.2, MONKEY_HOLD_S = 2.2, MONKEY_OUT_S = 0.45, MONKEY_GAP = 14;
  const REBALANCE_MIN_S = 1.6;
  const ORDER_S = 0.55, ORDER_ITEM_S = 0.6, WAITER_TAKE_S = 0.25, READ_S = 0.7, COMMIT_S = 1.0, ACK_S = 0.5, BIN_S = 1.2, TAKE_S = 0.4, ACK_WAIT_S = 1.6, FALL_S = 0.9, GIVE_UP_S = 4, PLATE_TOSS_S = 0.22, PLATE_DROP_S = 0.35;
  const LETTERS = 'ABCDEF';
  const COURSES = ['primero', 'segundo', 'postre', 'cafe'];
  const ITEMS = {
    gazpacho:{name:'Gazpacho', course:'primero', cook:0.5}, paella:{name:'Paella', course:'primero', cook:2.2},
    croquetas:{name:'Croquetas', course:'primero', cook:1.0}, jamon:{name:'Jamón', course:'primero', cook:0.4},
    tortilla:{name:'Tortilla de patatas', course:'segundo', cook:1.6}, merluza:{name:'Merluza', course:'segundo', cook:1.8},
    pollo:{name:'Pollo asado', course:'segundo', cook:1.4},
    flan:{name:'Flan', course:'postre', cook:0.3}, arroz:{name:'Arroz con leche', course:'postre', cook:0.4},
    churros:{name:'Churros', course:'postre', cook:0.8},
    cafe:{name:'Café', course:'cafe', cook:0.3}
  };
  const ITEM_NAMES = Object.keys(ITEMS);

  // Rows top to bottom: orders partition 0, plates counter, orders partition 1. Only the orders are Kafka.
  // The row each partition hangs in: it can change, as when the first wire moves up to make room.
  const rowOf = (S, part) => S.rows[part];
  const barTop = row => {
    const i = Math.min(1, Math.max(0, Math.floor(row)));
    return ROW_TOPS[i] + (ROW_TOPS[i + 1] - ROW_TOPS[i]) * (row - i);
  };
  // Every wire spans the same stretch, whatever row it hangs in; the counter is a little shorter.
  const barStart = () => 198;
  const barEnd = () => 660;
  const COUNTER_START = 220, COUNTER_END = 638;
  // The stove stands against the right wall, so a cook out of the group waits beside the cook's spot.
  const COOK_X = 670, COOK_BREAK_X = 636, COOK_WALK_SPEED = 300, COUNTER_DROP_X = 656;
  // Waiters send from the left end of a wire, at the height of the hanging orders.
  const standX = row => barStart(row) - 22;
  const COOK_FEET = 52;
  const floorY = row => barTop(row) + 12;
  const tableTop = table => 124 + table * 118;
  const slotX = (part, end, offset) => barEnd() - 34 - (end - 1 - offset) * SLOT_W;
  // Plates travel the other way and queue up from the left end of the counter.
  const counterSlotX = index => COUNTER_START + 20 + index * SLOT_W;
  const lagOf = p => p.end - p.committed;

  function mulberry32(seed){
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makePartition(){
    return {log:[], end:0, earliest:0, committed:0, position:0, busy:false, owner:null};
  }

  // Each cook works at the stove of its own row; arriving is set while it brings that stove in.
  const makeCook = (id, row = id === 0 ? 0 : 2) => ({building:false, id, name:`C${id + 1}`, row, active:true, slow:false, x:COOK_X, pos:row, partitions:[], cursor:0, walking:false, faceLeft:true, job:null, idleFor:0, beerIn:null, beer:null, oven:null, ovenKind:null, windup:0, arriving:null});

  // The page starts small, with one wire and one cook; the upgrades add the rest. The model's
  // default is the full kitchen, which is what most tests exercise.
  // The first scene has its only wire, cook and stove in the middle row, over the counter, and no
  // head of the dining room yet.
  //
  // It also starts as a plain queue, like Azure Service Bus, and turns into Kafka a step at a time:
  //  - menus: diners order menus, whose courses must arrive in order, instead of tapas;
  //  - keys: each color goes to its own wire with a single cook, instead of everyone sharing one;
  //  - retain: orders stay on the wire after being cooked, instead of going in the bin;
  //  - commit: each cook marks how far it has got, so it can pick up from there after a break;
  //  - peekLock: while a queue, a cook first only looks at an order, locked for it on the wire, and
  //    takes it off only once cooked, instead of taking it off as it reads it (receive and delete).
  const KAFKA_FEATURES = {menus:true, keys:true, retain:true, commit:true, peekLock:true};
  const FIRST_SCENE = {partitions:1, cooks:1, rows:[PLATES_ROW], cookRows:[0], boss:false, features:{menus:false, keys:false, retain:false, commit:false, peekLock:false}};
  const TAPAS = ['jamon', 'croquetas', 'tortilla', 'gazpacho'];

  function createSim(seed = 7, {partitions = PARTITIONS, cooks = 2, rows = [0, 2], cookRows = rows, boss = true, features = KAFKA_FEATURES} = {}){
    const S = {
      time:0, random:mulberry32(seed), rate:10, spawnIn:0.4,
      nextMessage:1, nextVisit:1,
      comandas:Array.from({length:partitions}, makePartition),
      rows:rows.slice(0, partitions),
      demandByPartition:Array(partitions).fill(0),
      cooks:[...Array(cooks).keys()].map(id => makeCook(id, cookRows[id])),
      build:null, wire:null, move:null, upgrades:0, features:{...features}, visit:null, bin:features.retain ? null : {x:BIN_X, carried:false},
      trayWaiters:TRAY_WAITER_HOMES.map(spot => ({home:spot, x:spot.x, y:spot.y, state:'idle', timer:0, plate:null, faceLeft:false, walkPhase:0})),
      barWaiters:ORDER_WAITER_HOMES.map(spot => ({home:spot, x:spot.x, y:spot.y, state:'idle', timer:0, customer:null, letter:null, row:null, toSend:[], heardAt:null, faceLeft:false, walkPhase:0})),
      boss:{present:boss, entering:false, say:null, x:boss ? BOSS_SPOT.x : W + 30, y:BOSS_SPOT.y, faceLeft:true, walking:false, walkPhase:0, saidAt:-Infinity, part:null, oil:null, oilIn:14 + seed % 9, oilRandom:mulberry32(seed ^ 0x4f494c)},
      customers:[], tickets:[], fallen:[], strays:[], loseNext:0, plates:[], counter:[],
      rebalance:null, generation:1, lastBeerEnd:-Infinity,
      stats:{ordered:0, served:0, duplicates:0, rebalances:0, outOfOrder:0, lost:0, resent:0, faints:0, lapsed:0, protested:0, rereads:0, gaveUp:0},
      events:[], eventSeq:0
    };
    assignPartitions(S);
    return S;
  }

  const pickBeerIn = (S, [min, max]) => min + S.random() * (max - min);

  function logEvent(S, text, kind = ''){
    S.eventSeq++;
    S.events.unshift({id:S.eventSeq, time:S.time, text, kind});
    if(S.events.length > 30) S.events.pop();
  }

  // Same key, same bar: this is what keeps the orders of a customer in sequence. Like Kafka's
  // hash of the key modulo the partition count, so a new partition moves some keys to it.
  const partitionFor = (S, letter) => LETTERS.indexOf(letter) % S.comandas.length;

  // The letter is only an internal id: to people, each diner is a color.
  const KEY_NAMES = {A:'Rojo', B:'Azul', C:'Verde', D:'Morado', E:'Naranja', F:'Turquesa'};
  const messageTag = m => `${KEY_NAMES[m.letter]} (${ITEMS[m.items[0]].name.toLowerCase()})`;
  const freeLetters = S => [...LETTERS].filter(letter => !S.customers.some(c => c.letter === letter));
  const freeTable = S => [...Array(TABLES).keys()].find(table => !S.customers.some(c => c.table === table && c.state !== 'leave'));

  // Balance who comes into the restaurant, while routing each color to its fixed wire.
  function pickDiner(S, free){
    const seated = S.comandas.map(() => 0);
    S.customers.forEach(c => {
      if(c.state !== 'leave') seated[c.partition]++;
    });
    const parts = free.map(letter => partitionFor(S, letter));
    const leastSeated = Math.min(...parts.map(part => seated[part]));
    const leastDemand = Math.min(...parts.filter(part => seated[part] === leastSeated).map(part => S.demandByPartition[part]));
    const choices = free.filter((_, i) => seated[parts[i]] === leastSeated && S.demandByPartition[parts[i]] === leastDemand);
    return choices[Math.floor(S.random() * choices.length)];
  }

  // Courses only come in sequence: just a starter, no dessert, dessert, or dessert and coffee.
  function menuSize(roll){
    return roll < 0.15 ? 1 : roll < 0.4 ? 2 : roll < 0.8 ? 3 : 4;
  }

  function pickMenu(S, size){
    return COURSES.slice(0, size).map(course => {
      const options = ITEM_NAMES.filter(item => ITEMS[item].course === course);
      return options[Math.floor(S.random() * options.length)];
    });
  }

  // A letter is one diner, so it can only be in the dining room once; each dish is one message.
  // Six people take turns at the tables, so a diner needs a free one to come in.
  function addCustomer(S, letter, count, setMenu = null){
    const table = freeTable(S);
    if(table === undefined) return null;
    const free = freeLetters(S);
    if(!free.length) return null;
    const who = letter || pickDiner(S, free);
    if(!who || !free.includes(who)) return null;
    const total = setMenu ? setMenu.length : count || menuSize(S.random());
    // Tapas come in any order; a menu's courses do not.
    const menu = setMenu || (S.features.menus ? pickMenu(S, total) : Array.from({length:total}, () => TAPAS[Math.floor(S.random() * TAPAS.length)]));
    const partition = partitionFor(S, who);
    const visit = S.nextVisit++;
    const messages = Array.from({length:total}, (_, i) => ({
      id:S.nextMessage++, visit, letter:who, key:who, seq:i + 1, total, partition, table,
      items:[menu[i]], scripted:!!setMenu
    }));
    const customer = {visit, letter:who, partition, table, x:-20, state:'enter', timer:0, messages, plates:[], eating:null, eaten:0, total, upset:0, walkPhase:S.random() * 6, menu:S.features.menus, puzzled:0};
    S.customers.push(customer);
    S.demandByPartition[partition] += total;
    S.stats.ordered += total;
    logEvent(S, `${KEY_NAMES[who]} pide: ${menu.map(item => ITEMS[item].name.toLowerCase()).join(', ')}.`);
    return customer;
  }

  // Range assignor: sorted partitions split over sorted members, first members get the remainder.
  function assignPartitions(S){
    const active = S.cooks.filter(c => c.active);
    S.cooks.forEach(c => { c.partitions = []; c.cursor = 0; });
    S.comandas.forEach(p => { p.owner = null; });
    if(!S.features.keys){
      // A plain queue: every cook takes from it, whoever is free first.
      active.forEach(c => { c.partitions = S.comandas.map((_, part) => part); });
      if(active.length) S.comandas.forEach(p => { p.owner = active[0].id; });
      return;
    }
    if(active.length){
      const count = S.comandas.length, base = Math.floor(count / active.length), extra = count % active.length;
      let next = 0;
      active.forEach((c, i) => {
        for(let n = base + (i < extra ? 1 : 0); n > 0; n--){
          c.partitions.push(next);
          S.comandas[next].owner = c.id;
          next++;
        }
      });
    }
    // A new owner always resumes from the group's committed offset.
    S.comandas.forEach(p => { p.position = p.committed; });
  }

  // A plain queue has no group to rebalance: its receivers just compete for the next message,
  // so whoever arrives or leaves simply starts or stops receiving.
  function triggerRebalance(S, why){
    if(!S.features.keys){
      assignPartitions(S);
      return;
    }
    S.stats.rebalances++;
    S.rebalance = {elapsed:0, why};
    logEvent(S, `Rebalance: ${why}. Nadie coge comandas nuevas.`, 'warn');
  }

  function stepRebalance(S, dt){
    if(!S.rebalance) return;
    S.rebalance.elapsed += dt;
    const allRejoined = S.cooks.every(c => !c.active || !c.job);
    if(S.rebalance.elapsed < REBALANCE_MIN_S || !allRejoined) return;
    S.rebalance = null;
    S.generation++;
    assignPartitions(S);
    const summary = S.cooks.filter(c => c.active).map(c => `${c.name}→${c.partitions.join(',') || '—'}`).join('  ');
    logEvent(S, `Generación ${S.generation}: ${summary || 'sin cocineros'}`, 'key');
    const idle = S.cooks.filter(c => c.active && !c.partitions.length);
    if(idle.length) logEvent(S, `${idle.map(c => c.name).join(' y ')} se queda sin hilo: hay más cocineros que hilos.`, 'warn');
  }

  function setCookActive(S, id, active){
    const c = S.cooks[id];
    if(!c || c.arriving || c.building || c.active === active) return;
    c.active = active;
    if(!active) dropJob(S, c);
    if(!active) { c.partitions = []; c.walking = false; }
    triggerRebalance(S, active ? `vuelve ${c.name}` : `se va ${c.name}`);
  }

  // A cook stops halfway through its order: what happens to it depends on how it was read.
  function dropJob(S, c){
    if(c.job){
      const p = S.comandas[c.job.part];
      p.busy = false;
      if(!S.features.retain){
        const onWire = p.log.includes(c.job.entry);
        if(onWire && c.job.entry.lockUntil !== undefined){
          // The hourglass keeps running: only when its sand is out is the order free for someone else.
          c.job.entry.taken = false;
          c.job.entry.lockAbandonedByFaint = c.faint?.phase === 'fainted';
          logEvent(S, `${c.name} deja una comanda a medias: su reloj de arena sigue corriendo y nadie más la coge hasta que se acabe.`, 'warn');
        } else if(onWire){
          // It had not hung its hourglass yet: the order was never really its own.
          Object.assign(c.job.entry, {lockedBy:null, taken:false});
        } else {
          // Received and deleted: the queue no longer has it, and nobody else ever will.
          c.job.order.lost = true;
          S.stats.lost++;
          logEvent(S, `${c.name} deja a medias ${messageTag(c.job.order)}, que ya no está en el hilo: se ha perdido.`, 'warn');
        }
      } else {
        // Nothing was committed, so the next owner re-reads this offset, even if the plate already left.
        p.position = p.committed;
        logEvent(S, `${c.name} deja a medias el offset ${c.job.offset} del hilo ${c.job.part}, sin confirmar.`, 'warn');
      }
      c.job = null;
    }
  }

  function setCookSlow(S, id, slow){ if(S.cooks[id]) S.cooks[id].slow = slow; }

  function seekToEarliest(S, part){
    const p = S.comandas[part];
    if(!p) return;
    p.committed = p.earliest;
    p.position = p.earliest;
    S.cooks.forEach(c => { if(c.job && c.job.part === part) c.job.stale = true; });
    logEvent(S, `Rebobinado: el hilo ${part} vuelve al offset ${p.earliest}.`, 'key');
  }

  // Simplification: retention only drops what the group has already committed, so no diner starves.
  function appendToLog(S, p, order){
    const offset = p.end++;
    p.log.push({offset, order, at:S.time});
    while(p.log.length > RETENTION && p.log[0].offset < p.committed) p.earliest = p.log.shift().offset + 1;
    return offset;
  }

  function pickPartition(S, c){
    for(let i = 0; i < c.partitions.length; i++){
      const index = (c.cursor + i) % c.partitions.length;
      const part = c.partitions[index];
      const p = S.comandas[part];
      if(!S.features.retain ? p.log.some(entry => takeable(S, p, entry)) && (!S.features.keys || !p.busy)
        : !p.busy && p.position < p.end) return {part, index};
    }
    return null;
  }

  const locked = entry => entry.lockedBy !== null && entry.lockedBy !== undefined;
  // When the sand runs out the lock lapses: the order is free again on the wire. If its cook is
  // still on it, the cook has lost the order and may not take it off any more.
  function expireLocks(S){
    S.comandas.forEach((p, part) => p.log.forEach(entry => {
      if(entry.lockUntil === undefined || S.time < entry.lockUntil) return;
      const owner = S.cooks.find(k => k.job && k.job.entry === entry);
      Object.assign(entry, {lockedBy:null, lockUntil:undefined, lockFrom:undefined, lockAbandonedByFaint:false});
      S.stats.lapsed++;
      if(owner){
        owner.job.lockLost = true;
        logEvent(S, `Se acaba la arena de ${messageTag(entry.order)} y ${owner.name} aún no ha terminado: pierde el bloqueo.`, 'warn');
      } else {
        logEvent(S, `Se acaba la arena de ${messageTag(entry.order)}: vuelve a estar libre en el hilo ${part}.`, 'key');
      }
    }));
  }
  // Menus on a shared queue break their order only once, in the step that shows it: every other
  // diner's course waits while an earlier course of theirs is still in a cook's hands.
  const takeable = (S, p, entry) => !locked(entry) && !(S.features.menus && !S.features.keys && !entry.order.scripted
    && p.log.some(e => locked(e) && e.order.visit === entry.order.visit && e.order.seq < entry.order.seq));

  function startFetch(S, c, pick){
    const p = S.comandas[pick.part];
    c.cursor = pick.index + 1;
    // Sharing one wire, each cook cooks at its own stove; with a wire each, at the stove of that wire.
    const cookRow = S.features.keys ? rowOf(S, pick.part) : c.row;
    if(!S.features.retain){
      // A queue hands out the oldest order nobody holds, and locks it for this cook.
      const entry = p.log.find(e => takeable(S, p, e));
      entry.lockedBy = c.id;
      p.busy = true;
      c.job = {part:pick.part, offset:entry.offset, entry, order:entry.order, stale:false, phase:'toTicket', timer:0, dur:0, cookRow};
      return;
    }
    const offset = p.position;
    const entry = p.log[offset - p.earliest];
    p.position++;
    p.busy = true;
    c.job = {part:pick.part, offset, order:entry.order, stale:false, phase:'toTicket', timer:0, dur:0, cookRow};
  }

  // Where an order hangs. In the log it is its offset that says; in a queue, where it is in line.
  function entryX(S, part, offset){
    const p = S.comandas[part];
    if(S.features.retain) return slotX(part, p.end, offset);
    const waiting = p.log.filter(e => !e.taken);
    const index = waiting.findIndex(e => e.offset === offset);
    return barEnd() - 34 - (waiting.length - 1 - Math.max(0, index)) * SLOT_W;
  }

  // Right under the order, head in line with it, to read and stamp it from behind.
  // New orders push the log along the wire, so this spot moves too.
  function ticketStandX(S, job){
    const row = rowOf(S, job.part);
    return Math.max(barStart(row) + 10, entryX(S, job.part, job.offset)) + 1;
  }

  function finishJob(S, c){
    S.comandas[c.job.part].busy = false;
    c.job = null;
  }

  // Completing a queue message deletes it: the order goes in the bin.
  function completeInQueue(S, c){
    const p = S.comandas[c.job.part], entry = c.job.entry;
    p.log = p.log.filter(e => e !== entry);
    if(S.bin) S.bin.thrown = (S.bin.thrown || 0) + 1;
    logEvent(S, `${c.name} tira la comanda ${messageTag(c.job.order)} a la papelera.`);
    finishJob(S, c);
  }

  // Walk to the order, read it, walk back and cook, send the plate out, then walk to the order
  // again to commit: the offset only advances after the work is done (at-least-once).
  function stepCookJob(S, c, dt){
    const job = c.job;
    const p = S.comandas[job.part];
    switch(job.phase){
      case 'toTicket':
        if(walkTo(c, ticketStandX(S, job), COOK_WALK_SPEED, dt)){ job.phase = 'read'; job.timer = 0; }
        break;
      case 'read':
        job.timer += dt;
        walkTo(c, ticketStandX(S, job), COOK_WALK_SPEED, dt);
        if(job.timer >= READ_S){
          // The cook keeps the order in its head: it never carries the slip to the stove.
          // Receive and delete: reading it is deleting it, so the slip goes straight in the bin.
          // With peek-lock it stays on the wire, locked for this cook, until it is cooked.
          // With peek-lock it first ties its hourglass under the order.
          job.phase = S.features.retain ? 'toStove' : S.features.peekLock ? 'hang' : 'take';
          job.timer = 0;
        }
        break;
      case 'hang':
        job.timer += dt;
        walkTo(c, ticketStandX(S, job), COOK_WALK_SPEED, dt);
        if(job.timer >= HANG_S){
          Object.assign(job.entry, {lockFrom:S.time, lockUntil:S.time + LOCK_S});
          job.phase = 'toStove';
        }
        break;
      case 'toStove':
        if(job.cookRow !== undefined && c.pos !== job.cookRow){
          walkToRow(c, job.cookRow, dt);
          break;
        }
        if(walkTo(c, COOK_X, COOK_WALK_SPEED, dt)){
          job.phase = 'cook';
          job.timer = 0;
          job.dur = job.order.items.reduce((sum, item) => sum + ITEMS[item].cook, 0) * (job.order.scripted && job.order.seq === 1 ? SET_MENU_SLOW : 1);
          c.faceLeft = false;
        }
        break;
      case 'cook':
        job.timer += c.slow ? dt / SLOW_FACTOR : dt;
        if(job.timer >= job.dur){ job.phase = 'plate'; job.timer = 0; }
        break;
      case 'plate':
        job.timer += dt;
        if(job.timer >= PLATE_TOSS_S){
          job.phase = 'toCounter';
          c.faceLeft = true;
        }
        break;
      case 'toCounter':
        // Already in the counter's row, it just walks there; from another row, it dashes.
        if(c.pos === PLATES_ROW && !c.windup ? walkTo(c, COUNTER_DROP_X, COOK_WALK_SPEED, dt)
          : (c.windup >= DASH_WINDUP_S && walkTo(c, COUNTER_DROP_X, COOK_WALK_SPEED, dt), jumpToRow(c, PLATES_ROW, dt))){
          c.x = COUNTER_DROP_X;
          c.faceLeft = true;
          job.phase = 'drop';
          job.timer = 0;
        }
        break;
      case 'drop':
        job.timer += dt;
        if(job.timer >= PLATE_DROP_S){
          S.plates.push({order:job.order, x:COUNTER_END - 8});
          if(S.features.retain){
            logEvent(S, `${c.name} deja el plato del offset ${job.offset}, aún sin confirmar.`);
            // Straight from the counter to the next thing: stamping its offset, or the next order.
            // Without commits, how far it got is only in its head.
            if(job.stale || !S.features.commit) finishJob(S, c);
            else job.phase = 'toCommit';
          } else {
            // With peek-lock the order is still on the wire: it goes to take it off before the bin.
            // Received and deleted, it was binned before cooking: nothing left to do.
            job.cooked = true;
            if(job.entry.taken || job.lockLost) finishJob(S, c);
            else { job.phase = 'toTake'; job.timer = 0; }
          }
          if(c.job) c.faceLeft = job.phase === 'toTake' || job.phase === 'toCommit' ? c.faceLeft : false;
          else c.faceLeft = true;
        }
        break;
      case 'toTake': {
        // Its sand ran out on the way: the order is not its own any more.
        if(job.lockLost){ finishJob(S, c); break; }
        const row = rowOf(S, job.part);
        if(c.pos !== row){ jumpToRow(c, row, dt); break; }
        if(walkTo(c, ticketStandX(S, job), COOK_WALK_SPEED, dt)){ job.phase = 'take'; job.timer = 0; }
        break;
      }
      case 'take':
        if(job.lockLost){ finishJob(S, c); break; }
        job.timer += dt;
        if(job.timer < TAKE_S) break;
        // Off the wire with its hourglass: nothing left to time.
        Object.assign(job.entry, {taken:true, lockUntil:undefined, lockFrom:undefined});
        // Received and deleted: the queue forgets it the moment it comes off the wire.
        if(!job.cooked) p.log = p.log.filter(e => e !== job.entry);
        // Into the bin from right here, wherever that is: its back to the bin, one heel flick.
        job.phase = 'bin';
        job.timer = 0;
        if(S.bin) c.faceLeft = S.bin.x > c.x;
        // A nod to basketball: once there is a wire per colour, every third one rattles on the rim.
        if(S.features.keys){
          S.tossCount = (S.tossCount || 0) + 1;
          job.rimShot = S.tossCount % 3 === 0;
        }
        break;
      case 'bin':
        // Right by the counter: the order goes in, and the queue forgets it.
        job.timer += dt;
        if(job.timer < binDuration(job)) break;
        // Done right there: from the bin it goes straight for the next order, not via its stove.
        if(job.cooked) completeInQueue(S, c);
        else {
          // Received and deleted before cooking: from here on the order is only in the cook's head.
          if(S.bin) S.bin.thrown = (S.bin.thrown || 0) + 1;
          logEvent(S, `${c.name} lee ${messageTag(job.order)} y tira la comanda: ya solo la tiene en la cabeza.`);
          job.phase = 'toStove';
        }
        break;
      case 'toCommit':
        if(job.stale){ finishJob(S, c); break; }
        if(c.pos !== rowOf(S, job.part)){ jumpToRow(c, rowOf(S, job.part), dt); break; }
        if(walkTo(c, ticketStandX(S, job), COOK_WALK_SPEED, dt)){ job.phase = 'commit'; job.timer = 0; }
        break;
      case 'commit':
        job.timer += dt;
        walkTo(c, ticketStandX(S, job), COOK_WALK_SPEED, dt);
        if(job.stale){ finishJob(S, c); break; }
        if(job.timer >= commitDuration(job)){
          p.committed = Math.max(p.committed, job.offset + 1, p.earliest);
          logEvent(S, `${c.name} confirma el offset ${job.offset} del hilo ${job.part}.`);
          finishJob(S, c);
        }
        break;
    }
  }

  // Like the arcade's bartender: a gesture to gather momentum, then a dash to the other row.
  function jumpToRow(c, row, dt){
    if(c.pos === row){
      c.windup = 0;
      return true;
    }
    if(c.windup < DASH_WINDUP_S){
      c.windup += dt;
      return false;
    }
    const delta = COOK_ROWS_PER_S * dt;
    c.pos = Math.abs(row - c.pos) <= delta ? row : c.pos + Math.sign(row - c.pos) * delta;
    if(c.pos !== row) return false;
    c.windup = 0;
    return true;
  }

  // Rows only change next to the stoves: the cook walks back first, then jumps.
  function walkToRow(c, row, dt){
    return walkTo(c, COOK_X, COOK_WALK_SPEED, dt) && jumpToRow(c, row, dt);
  }

  // Only seconds in a row count: going back to work starts the wait again. Never two cooks at
  // once, nor one straight after the other: the joke only works on its own.
  function stepBeer(S, c, dt){
    const finish = done => {
      S.lastBeerEnd = S.time;
      if(done) c.beerIn = pickBeerIn(S, BEER_AGAIN);
    };
    if(c.beer !== null){
      if(c.idleFor === 0){
        c.beer = null;
        finish(false);
      } else if((c.beer += dt) >= BEER_SIP_S){
        c.beer = null;
        finish(true);
      }
    } else if(c.oven !== null){
      if(c.idleFor === 0){
        c.oven = null;
        finish(false);
      } else if((c.oven += dt) >= OVEN_GAG_S){
        c.oven = null;
        finish(true);
      }
    }
    if(c.beer !== null || c.oven !== null) return;
    if(c.idleFor === 0){
      c.beerIn = null;
      return;
    }
    if(c.idleFor < BEER_WAIT_S) return;
    if(c.beerIn === null) c.beerIn = pickBeerIn(S, BEER_FIRST);
    c.beerIn -= dt;
    if(c.beerIn > 0) return;
    const someoneBusy = S.cooks.some(other => other.beer !== null || other.oven !== null);
    if(someoneBusy || S.time - S.lastBeerEnd < BEER_GAP_S) c.beerIn = BEER_RETRY_S;
    else if(c.active && c.x === COOK_X && S.random() < OVEN_CHANCE){
      c.oven = 0;
      c.ovenKind = S.random() < CAT_CHANCE ? 'cat' : 'tentacles';
    } else {
      c.beer = 0;
    }
  }

  // The fumes come from the stove, so they only catch a cook standing at it.
  function poisonCook(S){
    if(!S.features.keys || S.cooks.some(c => c.faint)) return null;
    const candidates = S.cooks.filter(c => c.active && !c.building);
    if(!candidates.length) return null;
    const c = candidates[Math.floor(S.random() * candidates.length)];
    c.faint = {phase:'waiting', t:0};
    logEvent(S, `Empieza a salir humo raro de la cocina de ${c.name}.`, 'warn');
    return c;
  }

  const atStove = c => c.x === COOK_X && Number.isInteger(c.pos) && (!c.job || c.job.phase === 'cook' || c.job.phase === 'plate');

  function stepFaint(S, c, dt){
    const f = c.faint;
    f.t += dt;
    if(f.phase === 'fumes' && f.t >= FUMES_S){
      f.phase = 'fainted';
      f.t = 0;
      logEvent(S, `${c.name} se desmaya por los humos.`, 'warn');
      S.stats.faints++;
      if(f.stay) forget(S, c);
      else setCookActive(S, c.id, false);
    } else if(f.phase === 'fainted' && f.t >= FAINTED_S){
      f.phase = 'waking';
      f.t = 0;
      logEvent(S, `${c.name} vuelve en sí.`);
    } else if(f.phase === 'waking' && f.t >= WAKING_S){
      c.faint = null;
      if(!f.stay) setCookActive(S, c.id, true);
    }
  }

  // Out cold but still in the group: what it was doing, and how far it had read, are gone with
  // its memory. Only a committed mark, if there is one, says where to pick up.
  function forget(S, c){
    dropJob(S, c);
    c.partitions.forEach(part => { S.comandas[part].position = S.comandas[part].committed; });
  }

  function stepCook(S, c, dt){
    if(c.arriving){ stepArrival(S, c, dt); return; }
    // Building its wire it is still in the group, just with nothing assigned yet.
    if(c.building) return;
    if(c.faint && c.faint.phase === 'waiting' && atStove(c)) c.faint.phase = 'fumes';
    if(c.faint && c.faint.phase !== 'waiting'){
      // Out cold: nothing moves, nothing gets done, and certainly no beer.
      stepFaint(S, c, dt);
      c.walking = false;
      c.idleFor = 0;
      c.beer = null;
      c.oven = null;
      return;
    }
    const startX = c.x, startPos = c.pos;
    if(!c.active){
      // Out of the group but still in the kitchen, standing by its own stove.
      if(c.pos === c.row) walkTo(c, COOK_BREAK_X, COOK_WALK_SPEED, dt);
      else walkToRow(c, c.row, dt);
    } else if(c.job){
      stepCookJob(S, c, dt);
    } else if(!holding(S)){
      const pick = !S.rebalance && c.partitions.length ? pickPartition(S, c) : null;
      const goal = pick ? rowOf(S, pick.part) : c.row;
      if(pick && c.pos === goal) startFetch(S, c, pick);
      // With an order to read it dashes to its row from wherever it is; with none (or while the group
      // shares out the wires), it waits at its own stove, not under the wire.
      else if(pick && c.x !== COOK_X) jumpToRow(c, goal, dt);
      else walkToRow(c, goal, dt);
    } else {
      // Held while something is set up: back to its own stove to wait.
      walkToRow(c, c.row, dt);
    }
    c.walking = c.x !== startX || c.pos !== startPos;
    c.idleFor = c.job || c.walking ? 0 : c.idleFor + dt;
    stepBeer(S, c, dt);
  }

  function walkTo(e, target, speed, dt){
    const gap = target - e.x;
    if(gap !== 0) e.faceLeft = gap < 0;
    e.x = Math.abs(gap) <= speed * dt ? target : e.x + Math.sign(gap) * speed * dt;
    return e.x === target;
  }

  function walkToPoint(e, tx, ty, speed, dt){
    const dx = tx - e.x, dy = ty - e.y, dist = Math.hypot(dx, dy), step = speed * dt;
    if(dx !== 0) e.faceLeft = dx < 0;
    if(dist <= step){
      e.x = tx; e.y = ty;
      return true;
    }
    e.x += dx / dist * step;
    e.y += dy / dist * step;
    return false;
  }

  function serve(S, message){
    const customer = S.customers.find(c => c.visit === message.visit);
    if(customer && !message.served){
      message.served = true;
      customer.plates.push(message);
      S.stats.served++;
      const missing = customer.messages.find(m => m.seq < message.seq && !m.served);
      if(customer.menu && missing){
        customer.puzzled = PUZZLED_S;
        customer.brokeOrder = true;
        S.stats.outOfOrder++;
        logEvent(S, `A ${KEY_NAMES[customer.letter]} le llega ${ITEMS[message.items[0]].name.toLowerCase()} antes que ${ITEMS[missing.items[0]].name.toLowerCase()}: el orden se ha roto.`, 'warn');
      }
    } else {
      S.stats.duplicates++;
      logEvent(S, `Sobra un plato: ${messageTag(message)} ya se había servido.`, 'warn');
      // It lands on the table anyway: whoever sits there now says what they make of it.
      S.strays.push({order:message, table:message.table, t:0});
      const sitting = S.customers.find(c => c.table === message.table && c.state !== 'enter' && c.state !== 'leave');
      if(sitting){
        // A different line each time, in turn, so the joke does not wear thin.
        const lines = sitting.visit === message.visit ? STRAY_LINES.eaten : STRAY_LINES.notMine;
        S.strayLine = (S.strayLine || 0) + 1;
        const first = S.strayLine === 1;
        sitting.say = {lines:first ? STRAY_INSULT : lines[S.strayLine % lines.length], t:0, stray:true};
        // The cook of that wire thinks the comeback, a moment later, to itself.
        const cook = first && S.cooks.find(k => k.partitions.includes(message.partition));
        if(cook) cook.think = {lines:STRAY_COMEBACK, t:-COMEBACK_DELAY_S};
      }
    }
  }

  // Not Kafka: the waiter walks to the oldest plate on the counter, gets the tray right under it
  // and carries it off, one at a time.
  function stepTrayWaiters(S, dt){
    S.trayWaiters.forEach(w => {
      switch(w.state){
        case 'idle':
          if(S.counter.length) w.state = 'toPlate';
          break;
        case 'toPlate':
          if(walkToPoint(w, S.counter[0].x - TRAY_REACH, w.home.y, WAITER_SPEED, dt)){
            w.plate = S.counter.shift().order;
            w.state = 'take';
            w.timer = 0;
            w.faceLeft = false;
          }
          break;
        case 'take':
          w.timer += dt;
          if(w.timer >= WAITER_TAKE_S) w.state = 'deliver';
          break;
        case 'deliver':
          if(walkToPoint(w, TABLE_X, tableTop(w.plate.table) + 44, WAITER_SPEED, dt)){
            serve(S, w.plate);
            w.plate = null;
            w.state = 'return';
          }
          break;
        case 'return':
          if(walkToPoint(w, w.home.x, w.home.y, WAITER_SPEED, dt)){
            w.state = 'idle';
            w.faceLeft = false;
          }
          break;
      }
    });
  }

  // The broker's ack: the head of the dining room has seen the whole order hung and says so out loud.
  function callOrderHeard(S, w){
    S.boss.saidAt = S.time;
    S.boss.part = w.customer.partition;
    logEvent(S, `«¡Oído cocina!»: el pedido ${KEY_NAMES[w.letter]} ya está en el hilo ${w.customer.partition}.`);
    return S.time;
  }

  // Producers of the orders topic: a free waiter takes the oldest diner still waiting,
  // writes the order at the table and sends it from the left end of the bar of that key.
  function stepBarWaiters(S, dt){
    S.barWaiters.forEach(w => {
      switch(w.state){
        case 'idle': {
          // Not while the wire is about to be moved: it is needed for that.
          if(S.wire || holding(S) && S.build.phase === 'wait' || S.build && S.build.phase === 'signWait') break;
          const customer = S.customers.find(c => c.state === 'waitingWaiter' && !c.attended);
          if(customer){
            customer.attended = true;
            w.customer = customer;
            w.letter = customer.letter;
            w.row = rowOf(S, customer.partition);
            w.toSend = [...customer.messages];
            w.state = 'toTable';
          }
          break;
        }
        case 'toTable':
          if(walkToPoint(w, TABLE_X, tableTop(w.customer.table) + 44, WAITER_SPEED, dt)){
            w.customer.state = 'asking';
            w.customer.timer = ORDER_S;
            w.state = 'atTable';
          }
          break;
        case 'atTable':
          if(w.customer.state === 'seated') w.state = 'toBar';
          break;
        case 'toBar':
          if(walkToPoint(w, standX(w.row), floorY(w.row), WAITER_SPEED, dt)){
            w.state = 'order';
            w.timer = ORDER_S;
            w.faceLeft = false;
          }
          break;
        case 'order':
          w.timer -= dt;
          if(w.timer <= 0){
            const message = w.toSend.shift();
            const start = barStart(w.row) + 4;
            // When a step asks for it, the last order starts down the wire with a loose peg.
            const lost = S.loseNext > 0 && !w.toSend.length && !message.resent;
            if(lost) S.loseNext--;
            S.tickets.push({order:message, part:message.partition, x0:start, t:0, dur:(barEnd(w.row) - 34 - start) / SLIDE_SPEED, lost});
            if(w.toSend.length) w.timer = ORDER_ITEM_S;
            // Without anyone to acknowledge it, the waiter just hangs the order and goes.
            else { w.state = S.boss.present ? 'awaitAck' : 'back'; w.timer = 0; }
          }
          break;
        // A producer only counts the order as sent once the broker confirms it: when the whole order
        // is on the wire, the head of the dining room calls it out, and the waiter waits to hear it.
        case 'awaitAck':
          if(w.heardAt === null){
            if(S.tickets.some(ticket => ticket.order.visit === w.customer.visit)) break;
            const missing = w.customer.messages.filter(m => !m.appended);
            if(!missing.length){ w.heardAt = callOrderHeard(S, w); break; }
            // No «¡oído!» for the whole order: after a while, the orders that never got there go again.
            w.timer += dt;
            if(w.timer < ACK_WAIT_S) break;
            missing.forEach(m => { m.lost = false; m.resent = true; });
            S.stats.resent += missing.length;
            logEvent(S, `Sin «¡oído!» para el pedido ${KEY_NAMES[w.letter]}: el camarero vuelve a mandar ${missing.map(m => ITEMS[m.items[0]].name.toLowerCase()).join(', ')}.`, 'key');
            w.toSend = missing;
            w.state = 'order';
            w.timer = ORDER_S;
          } else if(S.time - w.heardAt >= ACK_S){
            w.heardAt = null;
            w.state = 'back';
          }
          break;
        case 'back':
          if(walkToPoint(w, w.home.x, w.home.y, WAITER_SPEED, dt)){
            w.state = 'idle';
            w.customer = null;
            w.letter = null;
            w.row = null;
            w.faceLeft = false;
          }
          break;
      }
    });
  }

  // Angry only when something went wrong with its order: a dish lost for good (fits, then it
  // complains and goes) or one held up by a cook that dropped it (fits while waiting). A merely busy kitchen does not upset anyone.
  function isImpatient(c){
    if(c.state === 'complain') return true;
    // A lost dish: it waits quietly, then gets angry once, says so and goes (the 'complain' state).
    // A held-up dish only upsets it after a while: at first it is just one more dish on its way.
    const angryFor = c.waitingDelayed ? c.upset - DELAY_ANGRY_S : -1;
    return angryFor >= 0 && angryFor % LOST_FIT_CYCLE_S < FIT_S;
  }

  function stepUpset(S, c, dt){
    const waiting = c.state === 'seated' && !c.eating && !c.plates.length;
    const delayed = waiting && S.comandas[c.partition].log.find(entry => entry.lockAbandonedByFaint
      && !entry.taken && entry.lockFrom !== undefined && S.time < entry.lockUntil
      && entry.order.visit === c.visit && !entry.order.served && !entry.order.lost)?.order;
    c.waitingDelayed = !!delayed;
    c.upset = c.waitingLost || c.waitingDelayed ? (c.upset || 0) + dt : 0;
    if(delayed && !c.protestedDelay && c.upset >= DELAY_ANGRY_S){
      c.protestedDelay = true;
      c.say = {lines:LOST_DISH_LINES[delayed.items[0]], t:0, dishComplaint:true};
      S.stats.protested++;
      logEvent(S, `${KEY_NAMES[c.letter]} protesta porque tarda ${ITEMS[delayed.items[0]].name.toLowerCase()}.`, 'warn');
    }
  }

  function stepCustomers(S, dt){
    S.customers = S.customers.filter(c => {
      if(c.puzzled > 0) c.puzzled = Math.max(0, c.puzzled - dt);
      if(c.say && (c.say.t += dt) >= (c.say.dishComplaint ? KURWA_S + COMPLAIN_S : SAY_S)) c.say = null;
      stepUpset(S, c, dt);
      switch(c.state){
        case 'enter':
          if(walkTo(c, TABLE_X, SEAT_SPEED, dt)) c.state = 'waitingWaiter';
          break;
        case 'asking':
          c.timer -= dt;
          if(c.timer <= 0) c.state = 'seated';
          break;
        case 'seated':
          if(c.eating){
            c.timer -= dt;
            if(c.timer > 0) break;
            c.eating.finished = true;
            c.eating = null;
            c.eaten++;
            if(c.eaten >= c.total){
              c.state = 'leave';
              break;
            }
          }
          // An order lost on its way never comes: after a while the diner gives up on it and goes.
          const waitingForLost = !c.eating && !c.plates.length && c.messages.some(m => m.lost && !m.served)
            && c.messages.every(m => m.finished || (m.lost && !m.served));
          c.waitingLost = waitingForLost;
          if(waitingForLost && (c.giveUp = (c.giveUp || 0) + dt) >= GIVE_UP_S){
            c.state = 'complain';
            c.timer = KURWA_S + COMPLAIN_S;
            c.waitingLost = false;
            const lost = c.messages.find(m => m.lost && !m.served);
            c.complaintLines = LOST_DISH_LINES[lost.items[0]];
            S.stats.gaveUp++;
            logEvent(S, `${KEY_NAMES[c.letter]} se va sin ${ITEMS[lost.items[0]].name.toLowerCase()}: su comanda se perdió y nadie se enteró.`, 'warn');
            break;
          }
          // Tapas are eaten as they come. A menu goes course by course: a course that turns up before
          // the one it follows waits on the table, and the diner does not like it.
          if(c.plates.length){
            const next = c.menu ? c.plates.find(m => m.seq === c.eaten + 1) : c.plates[0];
            if(next){
              c.plates = c.plates.filter(m => m !== next);
              c.eating = next;
              c.timer = EAT_S;
            }
          }
          break;
        case 'complain':
          c.timer -= dt;
          if(c.timer <= 0) c.state = 'leave';
          break;
        case 'leave':
          c.x -= SEAT_SPEED * dt;
          return c.x > -20;
      }
      return true;
    });
  }

  function stepFlights(S, dt){
    S.fallen = S.fallen.filter(f => (f.t += dt) < FALL_S);
    S.strays = S.strays.filter(p => (p.t += dt) < STRAY_S);
    S.tickets = S.tickets.filter(ticket => {
      ticket.t += dt / ticket.dur;
      if(ticket.lost && ticket.t >= 0.5){
        // The waiter released it, but the peg opens before the ticket can reach the log.
        ticket.order.lost = true;
        S.fallen.push({order:ticket.order, part:ticket.part, x:ticket.x0 + (barEnd() - 34 - ticket.x0) * 0.5, t:0});
        S.stats.lost++;
        const fall = `La pinza se abre y la comanda ${messageTag(ticket.order)} cae antes de llegar.`;
        logEvent(S, S.boss.present ? fall : `${fall} Nadie se entera.`, 'warn');
        return false;
      }
      if(ticket.t < 1) return true;
      ticket.order.appended = true;
      const offset = appendToLog(S, S.comandas[ticket.part], ticket.order);
      logEvent(S, `${messageTag(ticket.order)} → hilo ${ticket.part}, offset ${offset}`);
      return false;
    });
    S.plates = S.plates.filter(plate => {
      plate.x -= SLIDE_SPEED * dt;
      const tail = counterSlotX(S.counter.length);
      if(plate.x > tail) return true;
      S.counter.push({order:plate.order, x:Math.max(plate.x, tail)});
      return false;
    });
    // The queue moves up as plates are taken.
    S.counter.forEach((entry, i) => {
      entry.x = Math.max(counterSlotX(i), entry.x - SLIDE_SPEED * dt);
    });
  }

  // What a cook is doing, in the words of a real Kafka consumer. A commit stores the next
  // offset to read, so after processing offset 3 the group commits 4.
  function consumerAction(S, c){
    if(c.faint && c.faint.phase !== 'waiting') return {fumes:'FAILING', fainted:'CRASHED', waking:'RESTART'}[c.faint.phase];
    if(c.arriving) return 'JOINING';
    if(!c.active) return 'LEFT GROUP';
    if(!c.job) return S.rebalance ? 'REBALANCE' : c.partitions.length ? 'POLL' : 'IDLE';
    const {phase, offset} = c.job;
    if(!S.features.retain){
      if(phase === 'toTicket' || phase === 'read' || phase === 'hang') return S.features.peekLock ? 'PEEK-LOCK' : 'RECV+DELETE';
      if(['toTake', 'take', 'bin'].includes(phase)) return c.job.cooked ? 'COMPLETE' : 'RECV+DELETE';
    }
    if(phase === 'toTicket' || phase === 'read') return `FETCH ${offset}`;
    if(phase === 'toCommit' || phase === 'commit') return `COMMIT ${offset + 1}`;
    if(phase === 'toCounter' || phase === 'drop') return 'OUTPUT';
    return 'PROCESS';
  }

  // Separate randomness keeps this purely visual gag from changing menus or Kafka timings.
  function stepBossOil(S, dt){
    const b = S.boss;
    if(!b.present) return;
    if(b.oil !== null){
      b.oil += dt;
      if(b.oil >= oilTimes(b).end){
        b.oil = null;
        b.monkey = false;
        b.oilIn = 30 + b.oilRandom() * 25;
      }
      return;
    }
    // Never in the middle of a step: the gags wait for the story to be told.
    if(S.build) return;
    b.oilIn -= dt;
    if(b.oilIn > 0 || S.time - b.saidAt < 1.5) return;
    if(S.barWaiters.some(w => ['toBar', 'order', 'awaitAck'].includes(w.state))) return;
    b.oil = 0;
    // The first drum of all brings a three-headed monkey balancing on top: once, but for sure.
    b.monkey = !b.monkeyShown;
    b.monkeyShown = true;
  }

  // The drum with the monkey takes its time: in slowly, a still moment by him until he notices,
  // then the kick, and out faster than usual.
  function oilTimes(b){
    const t = b.monkey ? {hitAt:MONKEY_IN_S, hold:MONKEY_HOLD_S, ret:MONKEY_OUT_S} : {hitAt:OIL_HIT_AT, hold:0, ret:OIL_RETURN_S};
    t.kickAt = t.hitAt + t.hold;
    t.end = t.kickAt + t.ret + (OIL_GAG_S - OIL_HIT_AT - OIL_RETURN_S);
    return t;
  }

  // Position and rotation come from the same distance: rolling left, then rolling right.
  // Drawing this twice for the tutorial cannot advance the animation.
  function bossOilPose(b){
    if(b.oil === null) return null;
    const {hitAt, kickAt, ret} = oilTimes(b);
    const hitX = b.x + 25, startX = W + OIL_RADIUS + 2;
    // With the monkey it waits a little further off, clear of him, and rolls the last bit to his
    // foot as he winds up.
    const waitX = b.monkey ? hitX + MONKEY_GAP : hitX, closing = Math.min(1, Math.max(0, (b.oil - (kickAt - 0.35)) / 0.35));
    const returning = b.oil >= kickAt;
    const progress = returning ? (b.oil - kickAt) / ret : Math.min(1, b.oil / hitAt);
    const x = returning ? hitX + (startX - hitX) * progress
      : progress < 1 ? startX + (waitX - startX) * progress : waitX + (hitX - waitX) * closing;
    const leg = b.oil < kickAt - 0.3 || b.oil > kickAt + 0.42 ? 'stand'
      : b.oil < kickAt ? 'windup' : b.oil < kickAt + 0.22 ? 'kick' : 'windup';
    // He only turns to it once he notices; with the monkey that is a moment after it stops.
    const facing = !b.monkey || b.oil >= kickAt - 0.7;
    return {x, angle:(x - hitX) / OIL_RADIUS, leg, facing, visible:b.oil < kickAt + ret,
      impact:returning && b.oil < kickAt + 0.12};
  }

  // ---- Upgrades: the restaurant grows one step at a time, built by its own people ----

  // From a plain queue to Kafka, each step either brings a problem or the feature that solves it.
  const UPGRADES = [
    {name:'otro cocinero', doing:'Llega otro cocinero…', start:startSecondCook},
    {name:'una comanda se olvida', doing:'Algo va a salir mal…', start:startBurnt},
    {name:'mirar sin quitar', doing:'Ahora solo se mira la comanda…', start:startPeekLock},
    {name:'menús', doing:'Cambiando la pizarra…', start:startMenus},
    {name:'un hilo por color', doing:'Montando un hilo por color…', start:startKeyedWires},
    {name:'hacer caja', doing:'El jefe de sala quiere hacer caja…', start:startCashCount},
    {name:'no se acuerda de por dónde iba', doing:'Otra vez los humos…', start:startBreak},
    {name:'marcar por dónde va', doing:'Cada uno marca por dónde va…', start:startCommits},
    {name:'una comanda se pierde', doing:'Se va a perder una comanda…', start:startLoss},
    {name:'¡oído cocina!', doing:'Llega el jefe de sala al pase…', start:startAcks}
  ];
  const SEARCH_S = 0.75;
  // Catching up on the orders done before commits existed: a quick stamp each.
  const commitDuration = job => (job.fast ? COMMIT_S * 0.3 : COMMIT_S);
  // Wait for a cook that has already read enough orders to make the replay visible.
  const REREAD_MIN = 3;
  // Dragging comes in heaves: a pull, a pause to get a grip again.
  const HEAVE_SPEED = 230, HEAVES_PER_S = 1.6, INSTALL_S = 0.5;
  const MOVE_S = 1.4;
  const RAISE_S = 0.8, RAISE2_S = 0.6, PLANT_S = 0.35, CARRY_SPEED = 220, CARRY_LIFT = 4;
  // The posts of the new wire, and where the new cook stands: it holds a post just to its right.
  const NEW_ROW = 2, RIGHT_POST_X = barEnd() - 4, LEFT_POST_X = barStart() + 4, HOLD_AT = 14;
  const BUILD_SPOTS = {right:RIGHT_POST_X - 2 - HOLD_AT - 4, left:LEFT_POST_X - 2 - HOLD_AT};
  // The head of the dining room's visits: where he looks at the wires, and how long he talks.
  // He walks in front of the counter, so he is seen whole.
  // The floor sign by the door, where the waiter stands to rewrite it, and how long that takes.
  // The chalkboard on the back wall, under the restaurant's name. The waiter stands in front of it,
  // feet on the floor, and reaches the writing with its arm: the hand is SIGN_REACH ahead of it.
  const SIGN_X = 360, SIGN_TOP = 11, SIGN_H = 40, SIGN_HALF = 92, SIGN_TEXT_Y = SIGN_TOP + 13, SIGN_SCALE = 2;
  const SIGN_FEET = 70, SIGN_REACH = 13, SIGN_WIPE_S = 2.4, SIGN_WRITE_S = 3.6;
  const SIGN_TAPAS = 'TAPAS', SIGN_MENU = 'MENÚ DEL DÍA';
  const signTextLeft = str => SIGN_X - ((str.length * 6 - 1) * SIGN_SCALE) / 2;
  const signTextRight = str => SIGN_X + ((str.length * 6 - 1) * SIGN_SCALE) / 2;
  // Where the hand is: the cloth scrubbing over TAPAS from left to right, or the chalk on the letter
  // being written. The waiter's body follows it along the wall.
  function signHand(build){
    const midY = SIGN_TEXT_Y + 7, part = dur => Math.min(1, Math.max(0, build.t / dur));
    if(build.phase === 'signWipe'){
      const k = part(SIGN_WIPE_S), from = signTextLeft(SIGN_TAPAS) - 4, to = signTextRight(SIGN_TAPAS) + 4;
      return {x:from + (to - from) * k, y:midY + 6 * Math.sin(k * Math.PI * 12)};
    }
    const at = part(SIGN_WRITE_S) * SIGN_MENU.length;
    return {x:signTextLeft(SIGN_MENU) + at * 6 * SIGN_SCALE + 4, y:midY + 3 * Math.sin(build.t * 30)};
  }
  const signStand = build => ({x:signHand(build).x - SIGN_REACH, y:SIGN_FEET});
  // The first set menu: a paella that takes its time, then a quick chicken that overtakes it.
  const SET_MENU = ['paella', 'pollo'], SET_MENU_SLOW = 3;
  const VISIT_Y = BOSS_SPOT.y + 32, SAY_S = 2.6, BOSS_PACE = WAITER_SPEED / 2, BIN_FLY_S = 0.7;

  const holding = S => !!(S.build && S.build.hold);

  // 1. More hands on the same queue: a second cook drags its stove in at the bottom and takes from
  // the same wire. The first one's stove is in the top row from the start.
  function startSecondCook(S){
    if(S.build || S.cooks.length > 1) return false;
    startNewCook(S);
    S.build = {phase:'arrive', t:0};
    return true;
  }

  // 2. Receive and delete: a cook takes the order off the wire as it reads it. When its stove blows
  // up with the order in hand, the order burns with it: the other cook cannot cook it, it is lost.
  function startBurnt(S){
    if(S.build || S.cooks.length < 2 || S.features.peekLock) return false;
    S.build = {phase:'burnWait', t:0};
    return true;
  }

  // 3. Peek-lock: the cook only looks at the order, which stays on the wire locked for it, and takes
  // it off once cooked. The same fumes now just let the lock lapse, and the other cook does it.
  function startPeekLock(S){
    if(S.build || S.features.peekLock) return false;
    S.features.peekLock = true;
    logEvent(S, 'Ahora el cocinero solo mira la comanda: se queda en el hilo, bloqueada para él (peek-lock), y la quita y la tira cuando el plato está hecho.', 'key');
    S.build = {phase:'burnShow', t:0};
    return true;
  }

  // 2. Menus: now the order of the courses matters, and two cooks on one queue can swap them.
  // The waiter rewrites the floor sign, and the first diner on the new menu gets the second course
  // before the first: a slow paella in one cook's hands, a quick chicken in the other's.
  function startMenus(S){
    if(S.build || S.features.menus) return false;
    // No new diners until the set menu has the queue to itself, so the overtaking is sure to happen.
    S.build = {phase:'signWait', t:0, quiet:true};
    return true;
  }

  // 3. One wire per color, with one cook each: the first wire moves up, carried by the waiter and the
  // first cook, to its stove, and the second cook builds a wire at the bottom.
  function startKeyedWires(S){
    if(S.build || S.cooks.length < 2 || S.comandas.length > 1) return false;
    S.build = {phase:'wait', t:0, hold:true};
    logEvent(S, 'Un hilo por color, y un cocinero por hilo: así cada menú sale en orden.', 'key');
    return true;
  }

  // 4. The head of the dining room comes to cash up from the orders of the day, and there are none:
  // they are all in the bin. He kicks it out and tells the cooks that from now on orders are kept.
  // Nobody takes new orders meanwhile, so the cooks are back at their stoves to hear it.
  function startCashCount(S){
    if(S.build || S.features.retain || !S.features.keys) return false;
    Object.assign(S.boss, {entering:true, x:W + 30, y:VISIT_Y, faceLeft:true});
    S.build = {phase:'search', t:0, hold:true, searchPart:0};
    return true;
  }

  // 6. The fumes again, now that orders are kept: the cook comes round with no idea which order it
  // was on, nothing marked says so, and it reads its wire again from the start, sending out plates
  // nobody asked for any more.
  function startBreak(S){
    if(S.build || !S.features.retain || S.features.commit || !S.cooks[1]) return false;
    S.build = {phase:'incident', t:0};
    return true;
  }

  // 7. Commits: each cook marks on the wire how far it has got, so after the same fumes it picks up there.
  // The head of the dining room comes in to tell them so.
  function startCommits(S){
    if(S.build || !S.features.retain || S.features.commit) return false;
    Object.assign(S.boss, {entering:true, x:W + 30, y:VISIT_Y, faceLeft:true});
    S.build = {phase:'markBoss', t:0, hold:true};
    return true;
  }

  // 8. An order falls off the wire on its way, and with nobody confirming anything, nobody notices.
  function startLoss(S){
    if(S.build || S.boss.present || !S.features.commit) return false;
    S.loseNext = 1;
    S.build = {phase:'lossWatch', t:0, lostBefore:S.stats.lost};
    return true;
  }

  // 9. The head of the dining room stays at the pass to call out each order once it is all hung:
  // when one goes missing there is no call, and the waiter sends it again.
  function startAcks(S){
    if(S.build || S.boss.present) return false;
    Object.assign(S.boss, {entering:true, x:W + 30, y:VISIT_Y, faceLeft:true});
    S.build = {phase:'bossIn', t:0};
    return true;
  }

  function startNewCook(S){
    const c = Object.assign(makeCook(1, NEW_ROW), {active:false, x:W + 30, arriving:{phase:'walk', t:0}});
    S.cooks.push(c);
    logEvent(S, `Llega ${c.name} arrastrando su cocina.`, 'key');
  }

  // It walks in backwards, dragging its stove, sets it up and lights it, and joins the group.
  function stepArrival(S, c, dt){
    const a = c.arriving;
    a.t += dt;
    if(a.phase === 'walk'){
      const heave = Math.max(0, Math.sin(a.t * HEAVES_PER_S * Math.PI * 2));
      c.walking = heave > 0.2;
      if(walkTo(c, COOK_X, HEAVE_SPEED * heave, dt) && c.x === COOK_X){
        a.phase = 'install';
        a.t = 0;
        c.walking = false;
      }
      c.faceLeft = false;
      return;
    }
    if(a.t < INSTALL_S) return;
    c.arriving = null;
    c.faceLeft = true;
    c.active = true;
    triggerRebalance(S, `entra ${c.name}`);
  }

  function addPartition(S){
    S.comandas.push(makePartition());
    const part = S.comandas.length - 1;
    S.rows.push(NEW_ROW);
    S.features.keys = true;
    S.demandByPartition = S.comandas.map(() => 0);
    // The waiter has paused publishing during installation. Only unpublished visits use the new rule.
    S.customers.forEach(c => {
      if(c.attended) return;
      c.partition = partitionFor(S, c.letter);
      c.messages.forEach(m => { m.partition = c.partition; });
      S.demandByPartition[c.partition] += c.messages.length;
    });
    const moved = [...LETTERS].filter(letter => partitionFor(S, letter) === part).map(letter => KEY_NAMES[letter].toLowerCase());
    logEvent(S, `Hilo nuevo: ahora cada color tiene su hilo, y ${moved.join(', ')} van al hilo ${part}.`, 'key');
    triggerRebalance(S, 'hay un hilo nuevo');
  }

  // Orders stay from now on: the queue becomes a log, read up to an offset each cook commits.
  function keepOrders(S){
    S.features.retain = true;
    S.comandas.forEach(p => {
      p.log.forEach(entry => Object.assign(entry, {lockedBy:null, lockUntil:undefined, lockFrom:undefined, taken:false}));
      p.earliest = p.log.length ? p.log[0].offset : p.end;
      p.committed = p.position = p.earliest;
      p.busy = false;
    });
    logEvent(S, 'Ya no se tira nada: las comandas se quedan en el hilo. Cada cocinero se acuerda de por cuál va, pero no lo apunta.', 'key');
  }

  function say(b, lines){ b.say = {lines, t:0}; }

  function stepBuild(S, dt){
    const build = S.build;
    if(S.boss.say && (S.boss.say.t += dt) >= SAY_S) S.boss.say = null;
    S.cooks.forEach(k => {
      if(k.say && (k.say.t += dt) >= SAY_S) k.say = null;
      if(k.think && (k.think.t += dt) >= SAY_S + 0.6) k.think = null;
    });
    if(!build) return;
    const c = S.cooks[0], c2 = S.cooks[1], w = S.barWaiters[0], b = S.boss;
    const next = phase => { build.phase = phase; build.t = 0; };
    const pace = (spot, speed = BOSS_PACE) => {
      b.walking = true;
      b.walkPhase += dt * speed / BOSS_PACE;
      const there = walkToPoint(b, spot.x, spot.y, speed, dt);
      if(there) b.walking = false;
      return there;
    };
    const done = () => { S.build = null; S.upgrades++; };
    build.t += dt;
    switch(build.phase){
      // ---- another cook
      case 'arrive':
        if(c2 && !c2.arriving) done();
        break;
      // ---- fumes with an order in its head, without and with peek-lock
      case 'burnShow':
        if(build.t >= 8) next('burnWait');
        break;
      case 'burnWait':
        // Just as the second cook starts cooking an order, its stove gives off odd fumes: it faints,
        // and comes round asking where it is, with no idea of the order it had in its head.
        if(!c2 || !c2.job || c2.job.phase !== 'cook' || c2.job.timer > 0.1 || !c2.active || c2.faint || c2.building) break;
        build.order = c2.job.order;
        c2.faint = {phase:'fumes', t:0};
        c2.beer = c2.oven = null;
        logEvent(S, `Empieza a salir humo raro de la cocina de ${c2.name}.`, 'warn');
        next('burnAfter');
        break;
      case 'burnAfter':
        // Until it is over for that order: cooked by the other cook, or given up on by its diner.
        if(c2.faint || !c2.active) break;
        if(!S.customers.some(k => k.messages.includes(build.order))) done();
        else if(build.order.served){
          // Served late: the step lasts while its diner says what it thinks of that.
          build.servedAt ??= build.t;
          if(build.t - build.servedAt >= SAY_S) done();
        }
        break;
      // ---- from tapas to the set menu
      case 'signWait':
        if(w.state !== 'idle') break;
        w.state = 'moving';
        next('signGo');
        break;
      case 'signGo': {
        // To the wall, just left of where the cloth starts.
        const spot = signStand({phase:'signWipe', t:0});
        w.walking = !walkToPoint(w, spot.x, spot.y, WAITER_SPEED, dt);
        if(!w.walking){ w.faceLeft = false; next('signWipe'); }
        break;
      }
      case 'signWipe':
        // Scrubbing along the board, its body following the cloth.
        Object.assign(w, signStand(build));
        w.walking = false;
        if(build.t >= SIGN_WIPE_S) next('signStep');
        break;
      case 'signStep': {
        // Back along the wall to where the first letter goes.
        const spot = signStand({phase:'signWrite', t:0});
        w.faceLeft = spot.x < w.x;
        w.walking = !walkToPoint(w, spot.x, spot.y, WAITER_SPEED / 2, dt);
        if(!w.walking){ w.faceLeft = false; next('signWrite'); }
        break;
      }
      case 'signWrite':
        Object.assign(w, signStand(build));
        w.walking = false;
        if(build.t < SIGN_WRITE_S) break;
        S.features.menus = true;
        logEvent(S, 'Ahora se piden menús: primero, segundo y postre tienen que llegar en orden.', 'key');
        next('signBack');
        break;
      case 'signBack':
        w.walking = !walkToPoint(w, w.home.x, w.home.y, WAITER_SPEED, dt);
        if(!w.walking){ w.state = 'idle'; w.faceLeft = false; next('menuWatch'); }
        break;
      case 'menuWatch':
        // The next diner in orders the set menu, as soon as there is a table for it.
        if(!build.customer){
          const busy = w.state !== 'idle' || S.tickets.length || S.comandas.some(p => p.log.some(e => !locked(e)));
          if(!busy) build.customer = addCustomer(S, null, 0, SET_MENU);
          if(build.customer) build.quiet = false;
          break;
        }
        if(build.customer.brokeOrder || !S.customers.includes(build.customer)) done();
        break;
      // ---- one wire per color
      case 'wait':
        // Everyone finishes what they are doing, with nothing on its way to the wire.
        if(w.state !== 'idle' || S.tickets.length || S.cooks.some(k => k.job || k.faint || k.beer !== null || k.oven !== null)) break;
        // And each one back at its own stove, where the setting up starts from.
        if(S.cooks.some(k => k.pos !== k.row || k.x !== COOK_X)) break;
        c.building = c2.building = true;
        c.idleFor = c2.idleFor = 0;
        c.beerIn = c2.beerIn = null;
        w.state = 'moving';
        build.hold = false;
        next('toPosts');
        break;
      case 'toPosts': {
        w.walking = !walkToPoint(w, LEFT_POST_X - 2 - HOLD_AT, floorY(PLATES_ROW), WAITER_SPEED, dt);
        // Its stove is up already, so it may have to come down to the wire first.
        const step = 2 * dt;
        c.pos = Math.abs(PLATES_ROW - c.pos) <= step ? PLATES_ROW : c.pos + Math.sign(PLATES_ROW - c.pos) * step;
        c.walking = !walkTo(c, RIGHT_POST_X - 2 - HOLD_AT, COOK_WALK_SPEED, dt) || c.pos !== PLATES_ROW;
        if(!w.walking && !c.walking){
          w.faceLeft = c.faceLeft = false;
          next('lift');
        }
        break;
      }
      case 'lift': {
        const k = Math.min(1, build.t / MOVE_S);
        S.move = {part:0, from:PLATES_ROW, to:0, k};
        w.y = floorY(PLATES_ROW) + (floorY(0) - floorY(PLATES_ROW)) * k;
        c.pos = PLATES_ROW - k;
        w.walking = c.walking = k < 1;
        if(k < 1) break;
        S.move = null;
        S.rows[0] = 0;
        w.state = 'back';
        c.building = false;
        c.faceLeft = true;
        next('done');
        S.wire = {phase:'toRight', t:0, rightPost:0, secondX:null, second:0, lift:0};
        break;
      }
      case 'done':
        if(!S.wire && S.comandas.length > 1) done();
        break;
      // ---- fumes and rereading before commits
      case 'incident': {
        // Just as a cook starts cooking, the fumes: one that has already served a few orders from
        // its wire, so that reading it again from the start repeats something. It stays in the
        // group: it only loses what it had in its head, which order it was on included.
        const ready = k => k.job && k.job.phase === 'cook' && k.job.timer <= 0.1 && k.active && !k.faint && !k.building
          && k.partitions.some(part => S.comandas[part].position - S.comandas[part].earliest >= REREAD_MIN);
        const victim = S.cooks.find(ready);
        if(!victim) break;
        build.who = victim.id;
        victim.faint = {phase:'fumes', t:0, stay:true, waking:['IS THIS', 'REAL LIFE?']};
        victim.beer = victim.oven = null;
        logEvent(S, `Otra vez sale humo raro de la cocina de ${victim.name}.`, 'warn');
        next('offDuty');
        break;
      }
      case 'offDuty': {
        const who = S.cooks[build.who];
        if(who.faint || !who.active) break;
        logEvent(S, `${who.name} vuelve y nadie sabe por cuál iba: el hilo se vuelve a leer desde la primera comanda.`, 'warn');
        S.stats.rereads++;
        build.until = S.comandas.map(p => p.end);
        build.replayedOrders = new Set(who.partitions.flatMap(part => S.comandas[part].log.map(entry => entry.order)));
        next('reread');
        break;
      }
      case 'reread': {
        // Let the replay reach the tables. Once the last plate lands, its reaction can
        // stay on screen during the boss's entrance.
        const who = S.cooks[build.who];
        if(who.partitions.some(part => S.comandas[part].position < build.until[part])) break;
        const fromReplay = order => build.replayedOrders.has(order);
        if(who.job && fromReplay(who.job.order)) break;
        if(S.plates.some(p => fromReplay(p.order)) || S.counter.some(p => fromReplay(p.order))
          || S.trayWaiters.some(w => fromReplay(w.plate))) break;
        done();
        break;
      }
      case 'markBoss':
        // Give the instruction on arrival. The cooks can finish their current plates while listening.
        if(!pace({x:690, y:VISIT_Y})) break;
        b.faceLeft = true;
        say(b, ['¡CHAVALES!', 'MARK WHERE', 'YOU ARE!']);
        next('markSay');
        break;
      case 'markSay':
        if(build.t < SAY_S) break;
        next('markHold');
        break;
      case 'markHold':
        if(S.cooks.some(k => k.job)) break;
        S.features.commit = true;
        logEvent(S, 'Cada cocinero marca en el hilo por dónde va (commit). Primero sella deprisa las que ya había hecho, y si vuelve a perder el conocimiento, sigue desde ahí.', 'key');
        next('markCatch');
        break;
      case 'markCatch': {
        // Catching up: each cook stamps, quickly, every order it had already done, one after another.
        S.cooks.forEach(k => {
          if(k.job || k.faint || !k.active) return;
          const part = k.partitions.find(n => S.comandas[n].committed < S.comandas[n].position);
          if(part === undefined) return;
          const p = S.comandas[part], entry = p.log[p.committed - p.earliest];
          if(!entry) return;
          p.busy = true;
          k.job = {part, offset:p.committed, order:entry.order, stale:false, phase:'toCommit', timer:0, dur:0, cookRow:rowOf(S, part), fast:true};
        });
        const pending = S.comandas.some(p => p.committed < p.position);
        // Meanwhile he goes back where he came from.
        if(b.entering){
          b.faceLeft = false;
          if(pace({x:W + 30, y:VISIT_Y})) b.entering = false;
        }
        if(pending || S.cooks.some(k => k.job) || b.entering) break;
        done();
        break;
      }
      // ---- cashing up, the first time
      case 'search': {
        const part = build.searchPart, row = rowOf(S, part);
        if(!build.there){
          if(!build.searchRoute){
            // Look where the latest missing order would still hang if the wire retained it.
            const p = S.comandas[part];
            const hanging = new Set(p.log.filter(e => !e.taken).map(e => e.offset));
            let offset = p.end - 1;
            while(offset >= 0 && hanging.has(offset)) offset--;
            const x = Math.max(barStart() + 10, slotX(part, p.end, Math.max(0, offset)));
            const y = barTop(row) + COOK_FEET;
            // Enter past the right end, then cross between wires past the left end.
            const aisleX = part === 0 ? COUNTER_END + 26 : COUNTER_START - 26;
            build.searchRoute = [{x:aisleX, y:b.y}, {x:aisleX, y}, {x, y}];
          }
          if(pace(build.searchRoute[0], BOSS_PACE * 3)){
            build.searchRoute.shift();
            if(!build.searchRoute.length){
              build.there = true;
              build.t = 0;
            }
          }
          break;
        }
        b.nervous = true;
        b.faceLeft = build.t < SEARCH_S / 2;
        if(build.t < SEARCH_S) break;
        b.nervous = false;
        if(part + 1 < S.comandas.length){
          build.searchPart++;
          build.searchRoute = null;
          build.there = false;
          break;
        }
        b.faceLeft = true;
        say(b, ['DISAPPOINTED!']);
        logEvent(S, 'El jefe de sala quiere hacer caja con las comandas servidas, pero no puede: la cola las borra al completarlas.', 'warn');
        next('look');
        break;
      }
      case 'look':
        // Reach the bin via the aisle at the right end of the counter.
        if(build.t < SAY_S * 0.8) break;
        if(!build.atBinAisle){
          build.atBinAisle = pace({x:COUNTER_END + 26, y:b.y}, BOSS_PACE * 3);
          break;
        }
        if(pace({x:S.bin.x - 34, y:VISIT_Y}, BOSS_PACE * 3)){ b.faceLeft = false; next('windup'); }
        break;
      case 'windup':
        b.leg = build.t > 0.15 ? 'windup' : null;
        if(build.t < 0.45) break;
        // A kick that sends it flying out of the restaurant.
        b.leg = 'kick';
        S.bin.kicked = 0;
        next('kicked');
        break;
      case 'kicked':
        S.bin.kicked = build.t;
        if(build.t > 0.25) b.leg = null;
        if(build.t < BIN_FLY_S) break;
        S.bin = null;
        next('tell');
        break;
      case 'tell':
        // Everyone at their stove, with nothing in hand, to hear it.
        if(build.t < 0.6 || S.cooks.some(k => k.job || k.pos !== k.row || k.x !== COOK_X)) break;
        b.faceLeft = true;
        keepOrders(S);
        say(b, ['¡AQUÍ NO SE', 'TIRA NADA!']);
        next('heard');
        break;
      case 'heard':
        if(build.t > 1.6 && !S.cooks[0].say) S.cooks.forEach(k => say(k, ['¡SÍ, JEFE!']));
        if(build.t < SAY_S + 0.6) break;
        build.hold = false;
        b.faceLeft = false;
        if(pace({x:W + 30, y:VISIT_Y})){ b.entering = false; done(); }
        break;
      // ---- an order lost on its way, first without and then with the call
      case 'lossWatch':
        // Until the lost order is over: the diner gave up on it, or the waiter sent it again.
        if(S.stats.lost > build.lostBefore && !S.loseNext && !S.customers.some(k => k.messages.some(m => m.lost && !m.served))) done();
        break;
      case 'bossIn':
        if(pace(BOSS_SPOT)){
          b.faceLeft = true;
          say(b, ['¡UN POCO DE ORDEN,', 'CHAVALES!']);
          next('bossGreets');
        }
        break;
      case 'bossGreets':
        if(b.say) break;
        // The first drum, with its monkey, comes a few seconds after the last step is over.
        Object.assign(b, {entering:false, present:true, oilIn:MONKEY_AFTER_S});
        logEvent(S, 'El jefe de sala se queda en el pase: cuando un pedido entero está colgado, lo confirma con «¡Oído cocina!» (ack).', 'key');
        S.loseNext = 1;
        build.lostBefore = S.stats.lost;
        next('lossWatch');
        break;
    }
  }

  // The new cook builds its wire: it pulls one post up out of the floor, then a second one from the
  // same spot with the wire tied to both, and walks it backwards along its row to plant it at the
  // other end. Only then is there a partition to send to.
  function stepWire(S, dt){
    const wire = S.wire, c = S.cooks[1];
    if(!wire) return;
    const next = phase => { wire.phase = phase; wire.t = 0; };
    wire.t += dt;
    switch(wire.phase){
      case 'toRight':
        c.walking = !walkTo(c, BUILD_SPOTS.right, CARRY_SPEED, dt);
        if(!c.walking){ c.faceLeft = false; next('raise'); }
        break;
      case 'raise':
        wire.rightPost = Math.min(1, wire.t / RAISE_S);
