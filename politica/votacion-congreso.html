<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1011">
  <meta name="description" content="Marcador gráfico de una votación nominal del Congreso de los Diputados, con los escaños ocupados por sus diputados.">
  <title>Votación en el Congreso</title>
  <!-- Votos nominales: Lo Público (350 escaños), cruzados con las posiciones del plano del hemiciclo y los datos de diputados/formación del Congreso; coordenadas basadas en el plano oficial, Hola Política, CC BY 4.0. Recuento: RDL 26/2026, 172 sí y 178 no; RDL 27/2026, 166 sí y 184 no. Fuentes: https://decretomaricarmen.lopublico.es/ ; https://www.congreso.es/webpublica/opendata/ ; https://api.holapolitica.org/legislatures/1/hemicycle ; https://www.holapolitica.org/about/data ; https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-20526 ; https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-20527 -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; height: 100svh; margin: 0; overflow: hidden; background: #0a1011; }
    body { overscroll-behavior: none; }
    main, svg { display: block; width: 100vw; height: 100vh; height: 100svh; }
    svg { background: radial-gradient(ellipse at 38% 45%, #1b2928 0%, #111a1b 46%, #090e10 100%); }
    .seat { cursor: pointer; transition: r .12s ease, filter .12s ease, stroke-width .12s ease; filter: drop-shadow(0 0 1px #050909); stroke: none; }
    #seat-highlight-layer { pointer-events:none; }
    .seat-party-halo { opacity:0; transition:opacity .18s ease; }
    .seat-party-halo.visible { opacity:1; }
    .seat:hover, .seat:focus { r: 4.4; filter: drop-shadow(0 0 3px #fff); outline: none; }
    .seat:focus-visible { r: 5; }
    .details { opacity: 0; pointer-events: none; transition: opacity .16s ease; }
    .details.show { opacity: 1; pointer-events: auto; }
    .panel { fill: #111a1b; fill-opacity: .96; stroke: #82928b; stroke-opacity: .28; stroke-width: 1.3; }
    .panel-accent { fill: #dfe6df; opacity: .45; }
    .detail-name { fill: #f4f2e9; font: 650 31px/1.1 system-ui, -apple-system, sans-serif; letter-spacing: -.4px; }
    .detail-small { fill: #94a29a; font: 600 14px/1 system-ui, -apple-system, sans-serif; letter-spacing: 1.8px; }
    .detail-value { fill: #e3e8df; font: 500 21px/1.15 system-ui, -apple-system, sans-serif; }
    .detail-vote { fill: #f4f2e9; font: 700 24px/1 system-ui, -apple-system, sans-serif; }
    .close-hit { cursor: pointer; }
    .close-ring { fill: #dfe6df; fill-opacity: .07; stroke: #dfe6df; stroke-opacity: .28; }
    .close-mark { fill: none; stroke: #dfe6df; stroke-width: 1.7; stroke-linecap: round; opacity: .68; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }

    main { display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;padding:24px; }
    #scene {width:100%;height:100%;min-height:0;background:none;}
    body {background:radial-gradient(ellipse at 35% 45%,#1b2928,#090e10);font:14px system-ui;color:#e6eee8;}
    .seat {transition:opacity .7s ease, r .12s ease,filter .12s ease;}
    .controls-panel {display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:0;}
    .composition-block {display:flex;flex-direction:column;gap:18px;width:100%;margin-block:auto;}
    button {font:inherit;cursor:pointer;color:inherit;}
    .decree-picker {max-height:clamp(104px,18vh,140px);overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;scrollbar-width:thin;scrollbar-color:#62776d #111a1b;}
    .decree-picker::-webkit-scrollbar {width:5px;}.decree-picker::-webkit-scrollbar-thumb {background:#53645c;border-radius:99px;}
    .decree-row {display:grid;grid-template-columns:minmax(0,1fr) 38px;gap:8px;min-height:42px;margin-bottom:7px;scroll-snap-align:start;scroll-margin-block:2px;}
    .decree-choice {display:flex;align-items:center;gap:10px;min-width:0;min-height:42px;width:100%;padding:8px 10px;border:1px solid #91a69b55;border-radius:9px;background:transparent;color:inherit;text-align:left;cursor:pointer;transition:background .16s,border-color .16s;}
    .decree-choice[aria-pressed=true] {background:#d9e8dd20;border-color:#c3d5c8;}
    .decree-choice[data-outcome="yes"] {border-color:#39d69566;background:#39d6950b;box-shadow:inset 2px 0 #39d69577;}
    .decree-choice[data-outcome="no"] {border-color:#fb667266;background:#fb66720b;box-shadow:inset 2px 0 #fb667277;}
    .decree-choice[data-outcome="yes"][aria-pressed=true] {border-color:#39d695c9;background:#39d69520;box-shadow:inset 3px 0 #39d695;}
    .decree-choice[data-outcome="no"][aria-pressed=true] {border-color:#fb6672c9;background:#fb66721c;box-shadow:inset 3px 0 #fb6672;}
    .decree-choice:hover,.decree-choice:focus-visible {border-color:#dbe7dc;outline:none;}
    .decree-choice[data-outcome="yes"]:hover,.decree-choice[data-outcome="yes"]:focus-visible {border-color:#39d695;}
    .decree-choice[data-outcome="no"]:hover,.decree-choice[data-outcome="no"]:focus-visible {border-color:#fb6672;}
    .decree-ref {color:#a7bab0;font-size:10px;font-variant-numeric:tabular-nums;white-space:nowrap;}
    .decree-title {min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;}
    .decree-info {width:38px;height:42px;border:1px solid #91a69b55;border-radius:9px;background:#ffffff08;color:#d3dfd7;font:600 15px system-ui;cursor:pointer;}
    .decree-info:hover,.decree-info:focus-visible {background:#ffffff14;border-color:#dbe7dc;outline:none;}
    .detail-origin {fill:#94a29a;font:500 11px system-ui,-apple-system,sans-serif;}
    .summary-dialog {position:fixed;inset:0;width:min(520px,calc(100vw - 32px));max-height:min(84svh,760px);overflow:auto;margin:auto;padding:24px;border:1px solid #82928b66;border-radius:18px;background:#111a1b;color:#e6eee8;box-shadow:0 24px 90px #0009;}
    .summary-dialog::backdrop {background:#030607c9;backdrop-filter:blur(4px);}
    .summary-top {display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
    .summary-reference {margin-bottom:8px;color:#a7bab0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;}
    .summary-dialog h2 {margin:0 0 14px;font-size:22px;line-height:1.2;letter-spacing:-.02em;}
    .summary-dialog p {color:#c7d3cc;font-size:14px;line-height:1.65;}
    .summary-content {margin:0 0 18px;}
    .summary-content p {margin:0 0 12px;}
    .summary-content ul {display:grid;gap:9px;margin:0;padding-left:19px;color:#c7d3cc;font-size:13px;line-height:1.55;}
    .summary-content li::marker {color:#a7dec3;}
    .summary-status {display:flex;flex-wrap:wrap;align-items:baseline;gap:5px 9px;margin:17px 0 0;padding:11px 13px;border-left:2px solid #a7dec3;border-radius:0 8px 8px 0;background:#ffffff08;color:#c7d3cc;font-size:13px;line-height:1.5;}
    .summary-status strong {color:#b6efd9;font-size:12px;letter-spacing:.025em;}
    .summary-status.outcome-no {border-left-color:#ff6877;background:#ff68770b;}
    .summary-status.outcome-no strong {color:#ff9aa4;}
    .summary-dialog .summary-note {margin:18px 0;color:#94a29a;font-size:12px;}
    .summary-close {width:34px;height:34px;flex:none;border:1px solid #91a69b55;border-radius:50%;background:transparent;color:inherit;font-size:20px;cursor:pointer;}
    .summary-links {display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:22px;}
    .summary-links a {color:#a7dec3;font-size:13px;text-underline-offset:3px;}
    .dp-switch {display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;cursor:pointer;}
    .dp-switch input {appearance:none;width:42px;height:24px;background:#5d6e6755;border:1px solid #90a39870;border-radius:20px;position:relative;cursor:pointer;flex:none;margin:0;}
    .dp-switch input:before {content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#b5c4bc;transition:transform .25s;}
    .dp-switch input:checked {background:#426555;}
    .dp-switch input:checked:before {transform:translateX(18px);background:#f1f7ee;}
    button:focus-visible,input:focus-visible {outline:2px solid #deeadf;outline-offset:3px;}
    .result-title {font-size:11px;color:#a7bab0;min-height:16px;}
    .tally {display:flex;gap:22px;margin-top:8px;}
    .tally span {display:flex;gap:6px;align-items:center;font-size:25px;font-variant-numeric:tabular-nums;}
    .tally i {width:8px;height:8px;border-radius:50%;background:var(--vote);}
    .group-head,.group-button {display:grid;grid-template-columns:1fr 40px 16px 32px;align-items:center;text-align:right;}
    .group-head {font-size:10px;color:#a7bab0;margin:0 8px 9px;}
    .group-head span:first-child {text-align:left;}
    .group-button {position:relative;width:100%;border:0;background:none;border-radius:7px;padding:10px 8px;isolation:isolate;}
    .group-button:before {content:'';position:absolute;left:0;top:0;bottom:0;width:var(--weight);background:var(--color);opacity:.12;z-index:-1;border-radius:7px;transition:width .7s;}
    .group-button[aria-pressed=true],.group-button:hover {background:#ffffff0c;}
    .group-name {display:flex;align-items:center;gap:9px;text-align:left;font-size:12px;}
    .group-name i {width:9px;height:9px;border:2px solid var(--color);border-radius:50%;}
    .group-count {font-size:17px;font-variant-numeric:tabular-nums;}
    .group-count.inactive {color:#8c9c93;}
    .group-arrow {font-size:10px;color:#8c9c93;}
    .sr-only {position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
    @media(max-width:700px) {main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;padding:14px;gap:6px}.controls-panel{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}.composition-block{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:10px 16px;margin:0}.groups{grid-column:1/-1}.group-head{display:none}#group-list{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px}.group-button{padding:6px 3px;grid-template-columns:1fr 26px 10px 20px}.group-name{font-size:10px;gap:4px}.group-count{font-size:13px}.group-name i{width:6px;height:6px;flex:none}.decree-picker{grid-column:1/-1;max-height:112px}.decree-choice{font-size:10px}.decree-title{font-size:10px}.dp-switch{grid-column:1/-1;font-size:11px}.results{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}.tally{margin:0;gap:15px}.tally span{font-size:20px}.group-head+.group-button{margin:0}}
    @media(max-height:690px) and (min-width:701px){main{padding:16px}.controls-panel{gap:10px}.group-button{padding:6px 8px}.tally span{font-size:21px}}

    @media(max-width:700px){.group-button{grid-template-columns:1fr 15px 1fr;row-gap:2px}.group-name{grid-column:1/-1}.full-count{text-align:left}}
    @media(prefers-reduced-motion:reduce){.seat,.dp-switch input:before,.group-button:before{transition:none!important}}

    .bar-heading{font-size:11px;color:#a7bab0;margin-bottom:30px;}
    #group-list{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:7px;padding:0 3px;}
    .group-button{display:flex;flex-direction:column;align-items:stretch;position:relative;min-width:0;padding:0;border:0;border-radius:0;background:transparent;text-align:center;transition:opacity .2s;}
    .group-button:before{display:none;}
    .group-button:hover,.group-button[aria-pressed=true]{background:transparent;}
    .group-button.muted{opacity:.25;}
    .group-button:hover .bar-stack,.group-button[aria-pressed=true] .bar-stack{filter:brightness(1.2);}
    .group-button[aria-pressed=true] .bar-label{color:#fff;font-weight:700;}
    .bar-plot{height:clamp(140px,30vh,270px);width:100%;display:block;position:relative;}
    .bar-stack{position:absolute;inset:0;display:flex;flex-direction:column-reverse;justify-content:flex-start;}
    .bar-segment{width:100%;flex-shrink:0;display:block;transition:height .7s ease;}
    .bar-yes{background:#39d695;}.bar-no{background:#fb6672;}.bar-abstain{background:#f4c65f;}.bar-other{background:#879198;}
    .bar-total{position:absolute;bottom:calc(var(--total-height,0%) + 6px);left:50%;transform:translateX(-50%);font:500 11px system-ui;font-variant-numeric:tabular-nums;transition:bottom .7s ease;}
    .bar-label{display:block;height:58px;padding-top:10px;font-size:11px;color:#bdcdc4;writing-mode:vertical-rl;transform:rotate(180deg);align-self:center;text-align:right;}
    @media(max-width:700px){#group-list{grid-template-columns:repeat(9,minmax(0,1fr));gap:7px}.group-button{display:flex;padding:0}.bar-plot{height:105px}.bar-label{font-size:10px;height:48px;padding-top:7px}.bar-heading{margin-bottom:22px;font-size:10px}.bar-total{font-size:10px}}
    @media(max-height:690px) and (min-width:701px){.group-button{padding:0}.bar-plot{height:160px}}
    @media(prefers-reduced-motion:reduce){.bar-segment,.bar-total,.group-button{transition:none!important}}

    #group-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;height:clamp(240px,40vh,360px);padding-top:26px;padding-bottom:24px;}
    .vote-column{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;min-height:0;}
    .column-total{font-size:18px;text-align:center;margin-bottom:8px;font-variant-numeric:tabular-nums;}
    .party-stack{display:flex;flex-direction:column-reverse;flex-shrink:0;max-height:100%;}
    .party-segment{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;min-height:24px;border:0;padding:3px 1px;border-radius:0;font-size:11px;font-weight:600;transition:opacity .2s,flex-grow .6s;}
    .party-segment[hidden]{display:none;}.party-segment small{font-size:10px;font-weight:400;}.party-segment.muted{opacity:.22;}
    .party-segment:hover,.party-segment[aria-pressed=true]{filter:brightness(1.2);text-decoration:underline;}
    .party-segment:focus-visible{outline:2px solid white;outline-offset:-3px;}
    .column-label{position:absolute;top:calc(100% + 8px);left:0;right:0;text-align:center;font-size:11px;color:#bdcdc4;}
    .bar-scale-note{font-size:9px;color:#a7bab0;margin-top:14px;}.bar-heading{margin-bottom:8px;}
    @media(max-width:700px){#group-list{grid-template-columns:repeat(4,minmax(0,1fr));height:220px;gap:14px}.party-segment{min-height:22px;font-size:10px}.bar-scale-note{margin-top:10px}}
    @media(max-height:690px) and (min-width:701px){#group-list{height:245px;}}
    @media(prefers-reduced-motion:reduce){.party-stack,.party-segment{transition:none!important}}

    #group-list{height:clamp(240px,43vh,390px);gap:12px;padding:28px 6px 32px;}
    .vote-column{display:block;position:relative;}
    .party-stack{position:absolute;bottom:0;left:0;right:0;width:100%;height:100%;max-height:none;z-index:1;}
    .vote-column:hover,.vote-column:focus-within{z-index:5;}
    .column-total{position:absolute;bottom:calc(var(--vote-height,0%) + 10px);left:0;right:0;margin:0;font-size:23px;font-weight:400;letter-spacing:-.5px;transition:bottom .65s cubic-bezier(.22,1,.36,1);}
    .party-segment{position:relative;min-height:0;padding:0;flex:0 0 auto;overflow:visible;font-size:10px;font-weight:500;line-height:1;gap:2px;transition:height var(--state-change-duration) var(--state-change-easing),opacity var(--state-change-duration) var(--state-change-easing);}
    .party-segment small{font-size:9px;opacity:.85;}
    .party-segment.compact>span,.party-segment.compact>small{visibility:hidden;}
    .party-segment:hover,.party-segment[aria-pressed=true]{text-decoration:none;filter:brightness(1.12);z-index:20;}
    .party-segment.compact:hover:after,.party-segment.compact:focus-visible:after{content:attr(data-detail);position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);z-index:30;background:#111a1b;color:#f4f2e9;border:1px solid var(--party-color);border-left:3px solid var(--party-color);min-width:88px;padding:7px 9px;text-align:left;font-size:10px;font-weight:600;white-space:nowrap;border-radius:5px;box-shadow:0 3px 15px #0008;pointer-events:none;}
    #group-list>.vote-column:nth-child(4) .party-segment.compact:hover:after,#group-list>.vote-column:nth-child(4) .party-segment.compact:focus-visible:after{left:auto;right:calc(100% + 8px);}
    .column-label{top:calc(100% + 12px);font-size:12px;color:#b7c8be;}
    .vote-column:before{content:'';position:absolute;inset:0 0 0;background:linear-gradient(to bottom,transparent calc(50% - .5px),#ffffff12 50%,transparent calc(50% + .5px));pointer-events:none;z-index:0}.vote-column:after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:#ffffff20;pointer-events:none;z-index:2}
    .bar-heading{color:#a7bab0;font-size:11px;margin-bottom:3px;}
    @media(max-width:700px){#group-list{height:205px;gap:30px;padding:25px 14px 29px}.party-segment{min-height:0;padding:0;font-size:10px}.column-total{font-size:19px}.column-label{font-size:11px}}
    @media(max-height:690px) and (min-width:701px){#group-list{height:255px;}}
    @media(prefers-reduced-motion:reduce){.column-total,.party-stack,.party-segment{transition:none!important}}

    :root{--vote-column-gap:12px;--vote-column-inset:6px}
    .results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:var(--vote-column-gap);padding-inline:var(--vote-column-inset)}
    .tally{display:contents}
    .tally span{justify-content:center;gap:6px;white-space:nowrap}
    .column-total{display:none}
    #group-list{column-gap:var(--vote-column-gap);padding-inline:var(--vote-column-inset)}
    @media(max-width:700px){:root{--vote-column-gap:14px;--vote-column-inset:14px}.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding-inline:var(--vote-column-inset);gap:0}.tally{display:contents}.tally span{justify-content:center;gap:4px;font-size:19px}}

    :root{--state-change-duration:700ms;--state-change-easing:cubic-bezier(.42,0,.58,1)}
    .seat{transition:opacity var(--state-change-duration) var(--state-change-easing),r .12s ease,filter .12s ease}
    @media(prefers-reduced-motion:reduce){.seat,.party-stack,.party-segment{transition:none!important}}

    .column-label{display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:#e6eee8;}
    .column-dot{width:9px;height:9px;flex:none;border-radius:50%;background:var(--vote-color);}
    .column-count{font:inherit;font-variant-numeric:tabular-nums;}
    @media(max-width:700px){.column-label{font-size:18px;gap:6px}.column-dot{width:8px;height:8px}}
  </style>
</head>
<body>
  <main aria-label="Representación visual de una votación del Congreso">
    <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="group" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="scene-title">Votación nominal en el Congreso de los Diputados</title>
      <desc id="scene-desc">Hemiciclo con 350 escaños. El interruptor de Diputación Permanente atenúa los no titulares y calcula una simulación con los votos de los 69 titulares. Los grupos se pueden destacar sin cambiar el recuento total. Cada punto muestra el voto nominal en el Real Decreto-ley seleccionado. El relleno indica el voto. Seleccione un escaño para consultar la persona, su grupo parlamentario, circunscripción y voto.</desc>
      <g id="map-root" transform="translate(70 100) scale(1.75)">
        <defs>
          <filter id="party-highlight-filter" x="-24" y="-24" width="580" height="438" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
            <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="expanded"/>
            <feGaussianBlur in="expanded" stdDeviation="2.2" result="softened"/>
            <feComponentTransfer in="softened" result="mask"><feFuncA type="linear" slope="15" intercept="-6.2"/></feComponentTransfer>
            <feFlood id="party-highlight-flood" flood-color="#2676c9" result="party-color"/>
            <feComposite in="party-color" in2="mask" operator="in"/>
          </filter>
        </defs>
        <g id="seat-highlight-layer" aria-hidden="true"></g>
        <g id="seat-layer" aria-label="Escaños del hemiciclo">
        <circle class="seat no" data-seat="0" cx="260" cy="6" r="3.25" fill="#fb6672" stroke="none" tabindex="0" role="button" aria-pressed="false" aria-label="Julia Parra Aparicio; partido o formación: PP; GP Popular; Alicante/Alacant; voto: No"/>
        <circle class="seat no" data-seat="1" cx="273" cy="6" r="3.25" fill="#fb6672" stroke="none" tabindex="0" role="button" aria-pressed="false" aria-label="Esther Llamazares Domingo; partido o formación: PP; GP Popular; Asturias; voto: No"/>
        <circle class="seat no" data-seat="2" cx="286" cy="6" r="3.25" fill="#fb6672" stroke="none" tabindex="0" role="button" aria-pressed="false" aria-label="María Lourdes Ramírez Martín; partido o formación: PP; GP Popular; Granada; voto: No"/>
        <circle class="seat no" data-seat="3" cx="301" cy="7" r="3.25" fill="#fb6672" stroke="none" tabindex="0" role="button" aria-pressed="false" aria-label="Alfonso Carlos Macías Gata; partido o formación: PP; GP Popular; Badajoz; voto: No"/>

    const countAnimations = new WeakMap();
    const reduceCountMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    function animateCount(node,target) {
      const running=countAnimations.get(node);
      if(running?.target===target)return;
      if(!running&&Number(node.textContent)===target){countAnimations.set(node,{target,frame:null});return;}
      if(running)cancelAnimationFrame(running.frame);
      const from=Number(node.textContent)||0;
      if(reduceCountMotion.matches){node.textContent=String(target);countAnimations.set(node,{target,frame:null});return;}
      const duration=700,start=performance.now(),state={target,frame:null};
      const tick=now=>{
        const t=Math.min(1,(now-start)/duration),eased=t*t*(3-2*t);
        node.textContent=String(Math.round(from+(target-from)*eased));
        if(t<1)state.frame=requestAnimationFrame(tick);
        else{node.textContent=String(target);state.frame=null;}
      };
      countAnimations.set(node,state);state.frame=requestAnimationFrame(tick);
    }
    function updateComposition() {
      const included=records.filter(d=>!permanentMode||titularNames.has(d.name));
      const count=vote=>included.filter(d=>currentVote(d)===vote).length;
      document.getElementById('dp-toggle').checked=permanentMode;
      decreeChoices.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.decree===selectedDecree)));
      const scaleTotal=Math.max(1,records.length);
      voteColumns.forEach(column=>{
        const columnCount=count(column.vote);
        animateCount(column.countNode,columnCount);
        column.label.setAttribute('aria-label',`${column.vote}: ${columnCount} votos`);
        column.segments.forEach(({g,button})=>{
          const n=included.filter(d=>d.group===g.key&&currentVote(d)===column.vote).length;
          button.disabled=n===0;
          button.setAttribute('aria-hidden',String(n===0));
          button.style.height=100*n/scaleTotal+'%';
          button.style.opacity=n===0?'0':'1';
          button.querySelector('small').textContent=n;
          button.classList.toggle('muted',!!highlightedGroup&&highlightedGroup!==g.key);
          button.setAttribute('aria-pressed',String(highlightedGroup===g.key));
          button.setAttribute('aria-label',`${g.label}: ${n} votos ${column.vote}. Pulsa para destacar.`);
          button.removeAttribute('title');
          button.dataset.detail=`${g.label} · ${n} · ${column.vote}`;
          button.classList.toggle('compact',n<25);
        });
      });
      const g=groupSpecs.find(g=>g.key===highlightedGroup);
      document.getElementById('state-announcement').textContent=`${permanentMode?'Simulación de Diputación Permanente':'Votación real'}, decreto ${selectedDecree}: ${count('Sí')} sí, ${count('No')} no, ${count('Abstención')} abstenciones y ${count('No vota')} sin voto.${g?' Destacado: '+g.label:''}`;
    }
    function updatePartyHalo() {
      const layer=document.getElementById('seat-highlight-layer');
      layer.replaceChildren();
      const selected=groupSpecs.find(g=>g.key===highlightedGroup);
      if(!selected)return;
      document.getElementById('party-highlight-flood').setAttribute('flood-color',selected.color);
      const halo=document.createElementNS('http://www.w3.org/2000/svg','g');
      halo.setAttribute('class','seat-party-halo');
      halo.setAttribute('filter','url(#party-highlight-filter)');
      records.forEach((item,index)=>{
        if(item.group!==selected.key)return;
        const seat=document.querySelector(`[data-seat="${index}"]`);
        if(!seat)return;
        const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
        dot.setAttribute('cx',seat.getAttribute('cx'));
        dot.setAttribute('cy',seat.getAttribute('cy'));
        dot.setAttribute('r',seat.getAttribute('r'));
        dot.setAttribute('fill','#fff');
        halo.appendChild(dot);
      });
      layer.appendChild(halo);
      requestAnimationFrame(()=>halo.classList.add('visible'));
    }
    document.getElementById('dp-toggle').addEventListener('change',event=>{permanentMode=event.target.checked;updateSeats();});
    function setLayout() {
      scene.setAttribute('viewBox','0 0 1050 820');
      mapRoot.setAttribute('transform','translate(42 42) scale(1.8)');
      details.setAttribute('transform','translate(565 210) scale(1)');
    }
    function currentVote(item) {
      return item['vote' + selectedDecree];
    }
    function updateSeats() {
      document.querySelectorAll('[data-seat]').forEach(seat => {
        const item = records[Number(seat.dataset.seat)];
        if (!item) return;
        const vote = currentVote(item);
        const voteClass = vote === 'Sí' ? 'yes' : vote === 'No' ? 'no' : vote === 'Abstención' ? 'abstain' : 'no-vote';
        const fill = {'Sí':'#39d695','No':'#fb6672','Abstención':'#f4c65f','No vota':'#879198'}[vote] || '#879198';
        const isTitular = titularNames.has(item.name);
        seat.style.opacity = permanentMode && !isTitular ? .07 : 1;
        seat.setAttribute('fill', fill);
        seat.setAttribute('stroke', 'none');
        seat.classList.remove('yes', 'no', 'abstain', 'no-vote');
        seat.classList.add(voteClass);
        seat.setAttribute('aria-label', `${item.name}; partido o formación: ${item.formation}; ${item.group}; ${item.province}; voto: ${vote}`);
      });
      updatePartyHalo();
      updateComposition();
      if (active) show(active);
    }
    function selectDecree(decree) {
      if (!decreeInfo[decree]) return;
      selectedDecree = decree;
      decreeChoices.forEach(choice=>choice.setAttribute('aria-pressed',String(choice.dataset.decree===selectedDecree)));
      updateSeats();
    }
    function show(seat) {
      const item = records[Number(seat.dataset.seat)];
      if (!item) return;
      active = seat;
      nameNode.textContent = item.name;
      nameNode.style.fontSize = '31px';
      requestAnimationFrame(() => {
        const width = nameNode.getComputedTextLength();
        if (width > 355) nameNode.style.fontSize = String(31 * 355 / width) + 'px';
      });
      partyNode.textContent = item.formation;
      groupNode.textContent = item.group;
      provinceNode.textContent = item.province;
      const vote = currentVote(item);
      voteLabel.textContent = permanentMode ? (titularNames.has(item.name) ? vote + ' · simulado' : 'Fuera del cupo titular') : vote;
      const recordedVoter=item['vote'+selectedDecree+'Source'];
      voteOrigin.textContent=recordedVoter?'Votó entonces: '+recordedVoter:'';
      voteOrigin.setAttribute('visibility',recordedVoter?'visible':'hidden');
      const colors = { 'Sí':'#39d695', 'No':'#fb6672', 'Abstención':'#f4c65f', 'No vota':'#879198' };
      voteDot.setAttribute('fill', colors[vote] || '#879198');
      panelAccent.setAttribute('fill', item.partyColor);
      closeButton.setAttribute('tabindex', '0');
      details.classList.add('show');
      details.setAttribute('aria-hidden', 'false');
    }
    function hide() {
      if (pinned) return;
      active = null;
      closeButton.setAttribute('tabindex', '-1');
      details.classList.remove('show');
      details.setAttribute('aria-hidden', 'true');
    }
    document.querySelectorAll('[data-seat]').forEach(seat => {
      seat.addEventListener('pointerenter', () => { if (!pinned) show(seat); });
      seat.addEventListener('pointerleave', () => { if (!pinned && active === seat) hide(); });
      seat.addEventListener('focus', () => show(seat));
      seat.addEventListener('blur', () => { if (pinned !== seat) hide(); });
      seat.addEventListener('click', () => {
        if (pinned === seat) {
          pinned = null;
          seat.setAttribute('aria-pressed', 'false');
          hide();
        } else {
          if (pinned) pinned.setAttribute('aria-pressed', 'false');
          pinned = seat;
          pinned.setAttribute('aria-pressed', 'true');
          show(seat);
        }
      });
      seat.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          seat.click();
        }
        if (event.key === 'Escape') {
          pinned = null;
          seat.setAttribute('aria-pressed', 'false');
          hide();
        }
      });
    });
    decreeChoices.forEach((choice,index) => {
      choice.addEventListener('click',()=>selectDecree(choice.dataset.decree));
      choice.addEventListener('keydown',event=>{
        if(!['ArrowUp','ArrowDown','Home','End'].includes(event.key))return;
        event.preventDefault();
        const nextIndex=event.key==='Home'?0:event.key==='End'?decreeChoices.length-1:Math.max(0,Math.min(decreeChoices.length-1,index+(event.key==='ArrowDown'?1:-1)));
        const next=decreeChoices[nextIndex];
        selectDecree(next.dataset.decree);
        next.scrollIntoView({block:'nearest',behavior:'smooth'});
        next.focus();
      });
    });
    document.querySelectorAll('[data-summary]').forEach(button=>button.addEventListener('click',()=>{
      const info=decreeInfo[button.dataset.summary];if(!info)return;
      summaryReference.textContent=info.reference;summaryTitle.textContent=info.title;
      const intro=document.createElement('p');intro.textContent=info.intro;
      const points=document.createElement('ul');info.points.forEach(point=>{const item=document.createElement('li');item.textContent=point;points.append(item);});
      const status=document.createElement('p');status.className=`summary-status outcome-${info.outcome}`;
      const outcome=document.createElement('strong');outcome.textContent=`Ganó el ${info.outcome==='yes'?'Sí':'No'}`;
      const result=document.createElement('span');result.textContent=info.status;
      status.append(outcome,result);
      summaryBody.replaceChildren(intro,points,status);
      summaryLawLink.href=info.law;summaryLawLink.textContent='Texto oficial en el BOE';summaryVoteLink.href=info.votes;
      summaryDialog.showModal();
    }));
    summaryClose.addEventListener('click',()=>summaryDialog.close());
    summaryDialog.addEventListener('click',event=>{if(event.target===summaryDialog)summaryDialog.close();});
    closeButton.addEventListener('click', () => {
      if (pinned) pinned.setAttribute('aria-pressed', 'false');
      pinned = null;
      hide();
    });
    closeButton.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        closeButton.dispatchEvent(new MouseEvent('click', {bubbles:true}));
      }
      if (event.key === 'Escape') hide();
    });
    window.addEventListener('resize', () => {setLayout();updateComposition();}, {passive:true});
    setLayout();
    updateSeats();
    decreeChoices.find(choice=>choice.dataset.decree===selectedDecree)?.scrollIntoView({block:'nearest'});
  </script>
</body>
</html>
